.urow .bar .blk span{font-family:\"IBM Plex Mono\",monospace; font-size:9.5px; font-weight:500; color:#fff; white-space:nowrap;\n  padding:0 3px; text-shadow:0 0 2px rgba(0,0,0,.35)}\n.urow .bar .cap{position:absolute; top:0; bottom:0; border-left:1.5px dashed var(--ink-3); pointer-events:none}\n.urow .bar .tick{position:absolute; top:0; bottom:0; width:1px; background:var(--line); pointer-events:none}\n.urow .ur{display:flex; flex-direction:column; align-items:flex-end; gap:1px; min-width:0}\n.urow .ur .f{font-family:\"IBM Plex Mono\",monospace; font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums}\n.urow .ur .why{font-family:\"Archivo\",sans-serif; font-stretch:82%; font-size:10px; font-weight:700; letter-spacing:.12em;\n  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}\n.urow .ur .why.dev{color:var(--warn)}\n.urow .ur .why.over{color:var(--crit)}\n.umap .grp-h{display:flex; align-items:center; gap:8px; margin:10px 0 3px; flex-wrap:wrap}\n.umap .grp-h:first-child{margin-top:0}\n.umap .grp-h .pos{font-family:\"Archivo\",sans-serif; font-stretch:95%; font-weight:700; font-size:13px}\n.umap .grp-h hr{flex:1; border:0; border-top:1px solid var(--line); margin:0; min-width:20px}\n@media (max-width:640px){\n  .umap .axis, .urow{grid-template-columns:64px minmax(0,1fr) 78px}\n  .urow .ur .f{font-size:11px}\n}\n\n.legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:12px; font-size:11.5px; color:var(--ink-2)}\n.legend .it{display:flex; align-items:center; gap:6px}\n\n.tag{font-family:\"Archivo\",sans-serif; font-stretch:82%; font-weight:700; font-size:11px; letter-spacing:.13em;\n  text-transform:uppercase; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line);\n  border-radius:2px; padding:2px 7px; white-space:nowrap}\n.tag.warn{color:var(--warn); border-color:var(--warn); background:var(--warn-soft)}\n.tag.crit{color:var(--crit); border-color:var(--crit); background:var(--crit-soft)}\n.tag.ok{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}\n\n.note{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.45; border-radius:3px;\n  padding:8px 10px; border:1px solid transparent}\n.note.warn{background:var(--warn-soft); border-color:var(--warn)}\n.note.crit{background:var(--crit-soft); border-color:var(--crit)}\n.note.ok{background:var(--accent-soft); border-color:var(--accent)}\n.note .m{font-family:\"Archivo\",sans-serif; font-stretch:85%; font-weight:700; text-transform:uppercase;\n  font-size:11px; letter-spacing:.12em; padding-top:2px; white-space:nowrap}\n.notes{display:flex; flex-direction:column; gap:7px}\n.notes:empty{display:none}\n\n.rows{display:flex; flex-direction:column}\n.rows .r{display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px dotted var(--line)}\n.rows .r:last-child{border-bottom:0}\n.rows .r .k{color:var(--ink-2); font-size:12.5px}\n.rows .r .v{margin-left:auto; font-family:\"IBM Plex Mono\",monospace; font-weight:600; font-variant-numeric:tabular-nums; text-align:right}\n\n/* ---------- patch sheet ---------- */\n.sheet .uh{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:16px 0 6px}\n.sheet .uh:first-child{margin-top:2px}\n.sheet .uh .u{font-family:\"Archivo\",sans-serif; font-stretch:105%; font-weight:800; font-size:15px}\n.sheet .uh .addr{font-family:\"IBM Plex Mono\",monospace; font-size:11.5px; color:var(--ink-3)}\n.sheet .uh hr{flex:1; border:0; border-top:1px solid var(--line); margin:0; min-width:20px}\n.sheet table{font-size:12.5px}\n.sheet td{padding:3px 8px}\n.sheet .a{font-family:\"IBM Plex Mono\",monospace; font-weight:600; font-variant-numeric:tabular-nums}\n.sheet .rng{font-family:\"IBM Plex Mono\",monospace; color:var(--ink-3); font-variant-numeric:tabular-nums}\n\n/* ---------- data riser ---------- */\n.riser{margin:0; display:flex; flex-direction:column; gap:9px}\n.riser svg{width:100%; max-width:960px; height:auto; color:var(--ink); display:block}\n.riser figcaption{font-size:11.5px; color:var(--ink-3); line-height:1.5; max-width:92ch}\n.riser .bx{fill:var(--surface-2); stroke:var(--line-strong)}\n.riser .ttl{font-family:\"Archivo\",sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.14em; fill:var(--ink-3)}\n.riser .nm{font-family:\"IBM Plex Sans\",sans-serif; font-size:12.5px; font-weight:500; fill:var(--ink)}\n.riser .dt{font-family:\"IBM Plex Mono\",monospace; font-size:11px; fill:var(--ink-2)}\n.riser .sm{font-family:\"IBM Plex Mono\",monospace; font-size:10px; fill:var(--ink-3)}\n.riser .big{font-family:\"IBM Plex Mono\",monospace; font-size:19px; font-weight:600; fill:var(--ink)}\n.riser .ln{stroke:var(--ink-2); fill:none}\n\n.saved{display:flex; flex-wrap:wrap; gap:6px}\n.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong);\n  background:var(--surface-2); border-radius:14px; padding:3px 5px 3px 11px; font-size:12.5px}\n.chip button{border:0; background:transparent; padding:1px 4px; min-height:0; color:var(--ink-3); font-size:13px; line-height:1}\n.chip button:hover{color:var(--crit)}\n.chip .load-b{cursor:pointer}\n\nfooter.fine{font-size:11.5px; color:var(--ink-3); line-height:1.6; max-width:100ch;\n  border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:7px}\nfooter.fine b{color:var(--ink-2); font-weight:600}\nfooter.fine a{color:var(--ink-2)}\n.hide{display:none !important}\n@media (prefers-reduced-motion:no-preference){ .urow .bar .blk{transition:left .28s ease, width .28s ease} }\n\n@media print{\n  body{background:#fff; color:#000; font-size:10pt}\n  .wrap{max-width:none; padding:0; gap:12px}\n  .noprint{display:none !important}\n  .panel{box-shadow:none; border:1px solid #999; break-inside:avoid}\n  .tiles{border-color:#999; background:#999}\n  .tile{background:#fff}\n  .urow, .sheet .uh{break-inside:avoid}\n  header.top{border-bottom:2px solid #000}\n  .urow .bar .blk span{text-shadow:none}\n}\n</style>\n\n<div class=\"wrap\">\n\n  <header class=\"top\">\n    <div class=\"brand\">\n      <div class=\"eyebrow\">DMX universe packing &amp; data distribution</div>\n      <h1>Patch Plot</h1>\n      <div class=\"sub\">Build the rig by position, pick each fixture's mode. It packs the universes, writes the addresses,\n        counts the node ports, and tells you which constraint actually closed each universe.</div>\n    </div>\n    <div class=\"spacer\"></div>\n    <div class=\"setbar noprint\">\n      <div class=\"field\"><label for=\"proto\">Protocol</label>\n        <select id=\"proto\"><option value=\"sacn\">sACN (E1.31)</option><option value=\"artnet\">Art-Net 4</option></select></div>\n      <div class=\"field\"><label for=\"ustart\">First universe</label>\n        <input type=\"number\" id=\"ustart\" min=\"1\" max=\"63000\" value=\"1\"></div>\n      <div class=\"field\"><label for=\"fill\">Universe fill</label>\n        <select id=\"fill\"><option value=\"1\">Full · 512 ch</option><option value=\"0.85\">Headroom · 85 %</option></select></div>\n      <div class=\"field\"><label for=\"lcap\">Per DMX line</label>\n        <select id=\"lcap\"><option value=\"32\">32 · E1.11 max</option><option value=\"30\">30 · Pathway</option>\n          <option value=\"24\" selected>24 · touring RDM</option><option value=\"16\">16</option><option value=\"12\">12</option></select></div>\n      <div class=\"field\"><label for=\"step\">Address step</label>\n        <select id=\"step\"><option value=\"0\">Packed</option><option value=\"10\">Round to 10</option><option value=\"20\">Round to 20</option>\n          <option value=\"50\">Round to 50</option><option value=\"100\">Round to 100</option></select></div>\n    </div>\n  </header>\n\n  <section class=\"tiles\" id=\"tiles\"></section>\n  <div class=\"notes\" id=\"notes\"></div>\n\n  <!-- ===================== RIG ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Rig</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"rigcount\"></span>\n    </div>\n    <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end\">\n        <div class=\"field\" style=\"flex:1 1 200px;min-width:170px\"><label for=\"pick\">Add fixture</label>\n          <select id=\"pick\"></select></div>\n        <div class=\"field\"><label for=\"pickqty\">Qty</label>\n          <input type=\"number\" id=\"pickqty\" class=\"qty\" min=\"1\" max=\"999\" value=\"12\"></div>\n        <div class=\"field\"><label for=\"pickmode\">Mode</label><select id=\"pickmode\"></select></div>\n        <div class=\"field\"><label for=\"pickpos\">Position</label><select id=\"pickpos\"></select></div>\n        <button class=\"primary\" id=\"addbtn\">Add</button>\n      </div>\n\n      <div class=\"scroll\">\n        <table>\n          <thead><tr>\n            <th>Fixture</th><th class=\"num\">Qty</th><th>Position</th><th>Mode</th>\n            <th class=\"num\">Ch ea</th><th class=\"num\">Total ch</th><th>Data</th><th class=\"noprint\"></th>\n          </tr></thead>\n          <tbody id=\"rigbody\"></tbody>\n        </table>\n      </div>\n\n      <details class=\"noprint\">\n        <summary style=\"cursor:pointer;font-size:12.5px;color:var(--ink-2)\">Add something not in the library</summary>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:9px\">\n          <div class=\"field\" style=\"flex:1 1 160px\"><label for=\"cname\">Name</label>\n            <input type=\"text\" id=\"cname\" placeholder=\"LED tape controller\"></div>\n          <div class=\"field\"><label for=\"cch\">Channels</label><input type=\"number\" id=\"cch\" min=\"1\" max=\"512\" value=\"16\"></div>\n          <div class=\"field\"><label for=\"cqty\">Qty</label><input type=\"number\" id=\"cqty\" class=\"qty\" min=\"1\" max=\"999\" value=\"4\"></div>\n          <button id=\"addcustom\">Add</button>\n        </div>\n      </details>\n    </div>\n  </section>\n\n  <div class=\"cols\">\n    <!-- ===================== UNIVERSE MAP ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\">\n        <h2>Universe map</h2><span class=\"spacer\"></span>\n        <div class=\"seg noprint\" role=\"group\" aria-label=\"Packing order\">\n          <button id=\"mOrder\" aria-pressed=\"true\">In rig order</button>\n          <button id=\"mTight\" aria-pressed=\"false\">Pack tight</button>\n        </div>\n      </div>\n      <div class=\"body\">\n        <div class=\"umap\" id=\"umap\"></div>\n        <div class=\"legend\" id=\"legend\"></div>\n      </div>\n    </section>\n\n    <!-- ===================== POSITIONS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\">\n        <h2>Positions</h2><span class=\"spacer\"></span>\n        <button id=\"addpos\" class=\"noprint\">Add position</button>\n      </div>\n      <div class=\"body\">\n        <div class=\"scroll\">\n          <table>\n            <thead><tr>\n              <th>Position</th><th class=\"num\">Run ft</th><th class=\"num\">Fixt</th>\n              <th class=\"num\">Ch</th><th class=\"num\">Univ</th><th>Node</th><th>Line</th><th class=\"noprint\"></th>\n            </tr></thead>\n            <tbody id=\"posbody\"></tbody>\n          </table>\n        </div>\n        <p style=\"font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5\" id=\"poshint\"></p>\n      </div>\n    </section>\n  </div>\n\n  <!-- ===================== RISER ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\"><h2>Data riser</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"risersum\"></span></div>\n    <div class=\"body\"><figure class=\"riser\" id=\"riser\"></figure></div>\n  </section>\n\n  <!-- ===================== PATCH SHEET ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Patch sheet</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"sheetsum\"></span>\n      <button id=\"csv\" class=\"noprint\">Export CSV</button>\n      <button id=\"printbtn\" class=\"noprint\">Print</button>\n    </div>\n    <div class=\"body sheet\" id=\"sheet\"></div>\n  </section>\n\n  <div class=\"duo\">\n    <!-- ===================== NETWORK ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Nodes &amp; network</h2></div>\n      <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end\">\n          <div class=\"field\"><label for=\"topo\">Topology</label>\n            <select id=\"topo\"><option value=\"node\">Node at each position</option><option value=\"home\">Home-run DMX from the rack</option></select></div>\n          <div class=\"field\"><label for=\"node\">Node model</label><select id=\"node\"></select></div>\n          <div class=\"field\"><label for=\"jump\">Jumper (ft)</label><input type=\"number\" id=\"jump\" min=\"1\" max=\"200\" value=\"10\"></div>\n        </div>\n        <div class=\"rows\" id=\"netrows\"></div>\n      </div>\n    </section>\n\n    <!-- ===================== SAVE ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Console &amp; saved rigs</h2></div>\n      <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div class=\"rows\" id=\"conrows\"></div>\n        <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:11px\">\n          <div class=\"field\" style=\"flex:1 1 150px\"><label for=\"signame\">Save this rig as</label>\n            <input type=\"text\" id=\"signame\" placeholder=\"Arena A — main truss\"></div>\n          <button id=\"savebtn\">Save</button>\n        </div>\n        <div class=\"saved noprint\" id=\"saved\"></div>\n      </div>\n    </section>\n  </div>\n\n  <div class=\"duo\">\n    <!-- ===================== CHAIN LIMITS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>How many per universe</h2><span class=\"spacer\"></span>\n        <span class=\"eyebrow mono\" id=\"chainrule\"></span></div>\n      <div class=\"body\">\n        <div class=\"scroll\"><table>\n          <thead><tr><th>Fixture · mode</th><th class=\"num\">Ch</th>\n            <th class=\"num\">By channels</th><th class=\"num\">By line</th><th>Governs</th></tr></thead>\n          <tbody id=\"chainbody\"></tbody>\n        </table></div>\n      </div>\n    </section>\n\n    <!-- ===================== PACK LIST ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Pack list</h2><span class=\"spacer\"></span>\n        <span class=\"eyebrow mono\" id=\"packweight\"></span></div>\n      <div class=\"body\"><div class=\"rows\" id=\"packrows\"></div></div>\n    </section>\n  </div>\n\n  <footer class=\"fine\">\n    <div><b>Read this before you patch.</b> Patch Plot is a planning aid, not the show file. Footprints are the\n    manufacturer's published channel counts for each mode and change with firmware — the Encore Performance went\n    from 33 to 38 channels, the Scenius Unico from 39 to 40. Confirm the fixture's own menu before you address it.</div>\n    <div><b>What the numbers assume.</b> One universe is one DMX line is one node port, and a universe never\n    spans two positions. Every fixture is counted as one unit load; ANSI E1.11 §5.10 allows 32 per line, Pathway\n    plans on 30, and the 24 default is touring practice for RDM discovery speed, not a standard. Fixtures never\n    straddle a universe boundary, so a full universe is rarely 512 used channels. Run limits: ESTA's recommended\n    practice keeps a DMX line under 300 m (1000 ft) and RDM gets flaky well before that; Cat5e/6 is 100 m (328 ft)\n    by TIA-568, past which you are on fiber. Termination (120 Ω) is assumed on every line and is mandatory for RDM.</div>\n    <div><b>Addressing.</b> sACN (E1.31) universes are 1–63999 on UDP 5568, multicast 239.255.hi.lo, default\n    priority 100. Art-Net 4 port addresses are 15-bit and zero-based — Net 0–127, Sub-Net 0–15, Universe 0–15 —\n    so sACN universe 1 is Art-Net 0.0.0. Wireless receivers (CRMX, W-DMX, Multiverse) start a fresh line with the\n    same 32-load budget; they are noted per fixture but not planned here.</div>\n  </footer>\n</div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* ============================ REFERENCE DATA ============================ */\n/* Modes are manufacturer-published channel counts. The first entry is the touring default.\n   data: \"5\" 5-pin XLR · \"3+5\" both · \"+net\" etherCON/RJ45 Art-Net/sACN · \"+crmx\" LumenRadio built in ·\n   \"+wdmx\" Wireless Solution · \"+mv\" City Theatrical Multiverse. rdm:false when the manual is silent. */\nconst LIB = [\n  {c:\"Moving light\", b:\"Robe\",     n:\"BMFL Blade\",        m:[[\"Mode 1\",49],[\"Mode 2\",42]], d:\"3+5+net\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"MegaPointe\",        m:[[\"Mode 1\",39],[\"Mode 2\",34]], d:\"3+5+net\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Pointe\",            m:[[\"Mode 1\",24],[\"Mode 2\",16],[\"Mode 3\",30]], d:\"3+5+net\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Spiider\",           m:[[\"Mode 1 · zones\",49],[\"Mode 2\",27],[\"Mode 3\",33],[\"Mode 4 · pixel RGB\",90],[\"Mode 7 · pixel RGB\",91],[\"Mode 8 · pixel RGBW\",110],[\"Mode 10 · pattern+RGBW\",123]], d:\"3+5+net\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"T1 Profile\",        m:[[\"Mode 1 · CMY\",49],[\"Mode 2 · reduced\",33],[\"Mode 3 · five colour\",53]], d:\"3+5+net\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Aura XB\",       m:[[\"Extended\",25],[\"Standard\",14]], d:\"5\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Aura PXL\",      m:[[\"Extended\",89],[\"Basic\",32],[\"Compact\",17],[\"Ludicrous\",512]], d:\"5+net\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Viper Profile\", m:[[\"Extended 16-bit\",34],[\"Basic 16-bit\",26]], d:\"5\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Ultra Performance\", m:[[\"Basic\",48],[\"Extended\",58]], d:\"5+net\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Encore Performance\", m:[[\"Standard · fw ≥1.6\",38],[\"Legacy fw\",33]], d:\"5\"},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Sharpy\",            m:[[\"Standard\",16],[\"Vector\",20]], d:\"3+5\"},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Mythos 2\",          m:[[\"Standard\",30],[\"Vector\",34]], d:\"5+net\"},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Scenius Unico\",     m:[[\"Standard\",40],[\"Vector\",44]], d:\"5+net\"},\n  {c:\"Moving light\", b:\"Ayrton\",   n:\"Khamsin-S\",         m:[[\"Standard\",42],[\"Basic\",40],[\"Extended\",64]], d:\"5+net+crmx\"},\n  {c:\"Moving light\", b:\"Ayrton\",   n:\"Diablo-S\",          m:[[\"Standard\",36],[\"Basic\",34],[\"Extended\",56]], d:\"5+crmx\"},\n  {c:\"Moving light\", b:\"Elation\",  n:\"Proteus Maximus\",   m:[[\"Extended\",61],[\"Standard\",37]], d:\"5+net\"},\n  {c:\"Moving light\", b:\"Chauvet\",  n:\"Rogue R2 Wash\",     m:[[\"22 ch\",22],[\"15 ch\",15],[\"17 ch\",17],[\"33 ch\",33],[\"54 ch\",54],[\"56 ch · pixel\",56]], d:\"3+5\", rdm:false},\n  {c:\"Moving light\", b:\"Chauvet\",  n:\"Maverick Force S Profile\", m:[[\"47 ch\",47],[\"31 ch\",31]], d:\"3+5+net+wdmx\"},\n  {c:\"Wash / bar / strobe\", b:\"GLP\", n:\"impression X4 Bar 20\", m:[[\"Single Pixel\",88],[\"Normal\",34],[\"Compressed\",20],[\"HiRes\",35],[\"Dual Pixel\",48],[\"Single Pixel HiRes\",89]], d:\"5\"},\n  {c:\"Wash / bar / strobe\", b:\"GLP\", n:\"JDC1\",            m:[[\"SPix Pro\",62],[\"Normal\",23],[\"Compressed Pro\",14],[\"SPix\",68],[\"1Pix Pro\",17],[\"Easy\",11]], d:\"5\"},\n  {c:\"Wash / bar / strobe\", b:\"SGM\", n:\"Q-7\",             m:[[\"6 ch · CTC\",6],[\"3 ch\",3],[\"4 ch RAW\",4],[\"6 ch RAW\",6],[\"8 ch · XC-5\",8]], d:\"5+crmx\"},\n  {c:\"Conventional\", b:\"ETC\", n:\"Source Four LED S3 Lustr\", m:[[\"Direct\",12],[\"Expanded\",11],[\"Studio\",7],[\"RGB\",3],[\"1 ch\",1]], d:\"5+mv\"},\n  {c:\"Conventional\", b:\"ETC\", n:\"ColorSource PAR\",        m:[[\"5 ch\",5],[\"Direct\",6],[\"RGB\",3],[\"1 ch\",1]], d:\"5\"},\n  {c:\"Conventional\", b:\"ETC\", n:\"Source Four 750 W\",      m:[[\"Dimmer\",1]], d:\"dim\", rdm:false},\n  {c:\"Atmospherics\", b:\"MDG\",    n:\"theONE hazer\",        m:[[\"Standard\",5]], d:\"5+net\"},\n  {c:\"Atmospherics\", b:\"Look\",   n:\"Viper NT fogger\",     m:[[\"Output\",1]], d:\"5\", rdm:false},\n  {c:\"Atmospherics\", b:\"Martin\", n:\"JEM ZR45 fogger\",     m:[[\"1C\",1],[\"2C\",2]], d:\"5\"}\n];\nLIB.forEach(function(f,i){ f.id = \"L\"+i; if(f.rdm===undefined) f.rdm = true; });\n\nconst NODES = [\n  {id:\"ln4\",  n:\"Luminex LumiNode 4\",       ports:4,  proto:\"Art-Net · sACN\", poe:true},\n  {id:\"ln2\",  n:\"Luminex LumiNode 2\",       ports:2,  proto:\"Art-Net · sACN\", poe:true},\n  {id:\"ln1\",  n:\"Luminex LumiNode 1\",       ports:1,  proto:\"Art-Net · sACN\", poe:true},\n  {id:\"ln12\", n:\"Luminex LumiNode 12\",      ports:12, proto:\"Art-Net · sACN\", poe:true},\n  {id:\"mk2-2\",n:\"ETC Response Mk2 2-port\",  ports:2,  proto:\"sACN only\",      poe:true},\n  {id:\"mk2-4\",n:\"ETC Response Mk2 4-port\",  ports:4,  proto:\"sACN only\",      poe:true},\n  {id:\"mk2-8\",n:\"ETC Response Mk2 8-port\",  ports:8,  proto:\"sACN only\",      poe:true},\n  {id:\"pp4\",  n:\"Pathway Pathport 4-port\",  ports:4,  proto:\"Art-Net · sACN\", poe:true},\n  {id:\"pp8\",  n:\"Pathway Pathport Octo\",    ports:8,  proto:\"Art-Net · sACN\", poe:true},\n  {id:\"xnd4\", n:\"Swisson XND-4\",            ports:4,  proto:\"Art-Net · sACN\", poe:false},\n  {id:\"xnd8\", n:\"Swisson XND-8\",            ports:8,  proto:\"Art-Net · sACN\", poe:false},\n  {id:\"ode\",  n:\"ENTTEC ODE Mk3\",           ports:2,  proto:\"Art-Net · sACN\", poe:true}\n];\nconst DMX_STOCK = [150,100,50,25,10,5];\nconst CAT_STOCK = [300,200,150,100,50,25,10];\nconst DMX_LBFT = 0.05, CAT_LBFT = 0.03, XLR_LB = 0.12;\nconst DMX_LIMIT_FT = 1000, CAT_LIMIT_FT = 328, RDM_SOFT_FT = 500;\nconst NODE_TAIL_FT = 25;      /* node port to first fixture when the node lives on the truss */\nconst SWITCHES = [5,8,16,24,48];\nconst PAL = [\"s1\",\"s2\",\"s3\",\"s4\",\"s5\",\"s6\",\"s7\",\"s8\"];\n\n/* ============================== STATE ============================== */\nconst DEFAULT_POS = [\n  {id:\"p1\", name:\"Downstage truss\", dist:90},\n  {id:\"p2\", name:\"Mid truss\",       dist:110},\n  {id:\"p3\", name:\"Upstage truss\",   dist:135},\n  {id:\"p4\", name:\"Floor package\",   dist:60},\n  {id:\"p5\", name:\"FOH truss\",       dist:200}\n];\nconst DEFAULT_ROWS = [\n  {fid:\"L6\",  qty:12, mode:0, pos:\"p1\"},   // Aura PXL Extended\n  {fid:\"L0\",  qty:8,  mode:0, pos:\"p1\"},   // BMFL Blade\n  {fid:\"L1\",  qty:12, mode:0, pos:\"p2\"},   // MegaPointe\n  {fid:\"L6\",  qty:12, mode:0, pos:\"p2\"},   // Aura PXL\n  {fid:\"L18\", qty:16, mode:0, pos:\"p3\"},   // X4 Bar 20 Single Pixel\n  {fid:\"L19\", qty:8,  mode:0, pos:\"p3\"},   // JDC1 SPix Pro\n  {fid:\"L24\", qty:2,  mode:0, pos:\"p4\"},   // theONE\n  {fid:\"L20\", qty:10, mode:0, pos:\"p4\"},   // Q-7\n  {fid:\"L21\", qty:30, mode:0, pos:\"p5\"}    // S4 LED S3 Direct\n];\nlet S = {\n  proto:\"sacn\", ustart:1, fill:1, lcap:24, step:0, tight:false,\n  topo:\"node\", node:\"ln4\", jump:10,\n  positions: DEFAULT_POS.map(function(p){ return Object.assign({}, p); }),\n  rows: DEFAULT_ROWS.map(function(r){ return Object.assign({uid:uid()}, r); })\n};\nlet DB = null, DOWNLOADS = null, savedRigs = [];\n\nfunction uid(){ return \"r\" + Math.random().toString(36).slice(2,9); }\nfunction fx(id){ return LIB.find(function(f){ return f.id===id; }); }\nfunction pos(id){ return S.positions.find(function(p){ return p.id===id; }); }\nfunction nodeModel(){ return NODES.find(function(n){ return n.id===S.node; }) || NODES[0]; }\nfunction esc(s){ return String(s).replace(/[&<>\"]/g,function(c){\n  return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction rowInfo(r){\n  if(r.custom) return {name:r.custom.name, brand:\"Custom\", ch:r.custom.ch, mode:\"Custom\", data:\"5\", rdm:true,\n    key:\"custom:\"+r.custom.name};\n  const f = fx(r.fid);\n  if(!f) return {name:\"(missing)\", brand:\"\", ch:0, mode:\"\", data:\"\", rdm:true, key:\"x\"};\n  const m = f.m[Math.min(r.mode||0, f.m.length-1)];\n  return {name:f.n, brand:f.b, ch:m[1], mode:m[0], data:f.d, rdm:f.rdm, key:f.id};\n}\nfunction dataLabel(d){\n  if(d===\"dim\") return \"Dimmer\";\n  const parts = [];\n  if(d.indexOf(\"3+5\")===0) parts.push(\"3+5 pin\"); else parts.push(\"5 pin\");\n  if(d.indexOf(\"net\")>=0) parts.push(\"etherCON\");\n  if(d.indexOf(\"crmx\")>=0) parts.push(\"CRMX\");\n  if(d.indexOf(\"wdmx\")>=0) parts.push(\"W-DMX\");\n  if(d.indexOf(\"mv\")>=0) parts.push(\"Multiverse\");\n  return parts.join(\" · \");\n}\nfunction alignAddr(next){ const s = S.step; if(!s || next<=1) return next; return Math.ceil((next-1)/s)*s + 1; }\nfunction cutLengths(dist, stock){\n  const out = []; let left = dist, guard = 0;\n  while(left > 0 && guard++ < 12){\n    const fit = stock.find(function(L){ return L <= left; });\n    if(!fit){ out.push(stock[stock.length-1]); break; }\n    out.push(fit); left -= fit;\n  }\n  const total = out.reduce(function(t,x){ return t+x; }, 0);\n  if(total < dist) out.push(stock[stock.length-1]);\n  return out;\n}\nfunction cutLabel(arr){\n  const c = {}; arr.forEach(function(L){ c[L]=(c[L]||0)+1; });\n  return Object.keys(c).sort(function(a,b){ return b-a; })\n    .map(function(L){ return (c[L]>1 ? c[L]+\"×\" : \"\") + L + \"′\"; }).join(\" + \");\n}\nfunction uniAddr(u){\n  if(S.proto===\"sacn\") return {main:\"sACN \"+u, sub:\"239.255.\"+(u>>8)+\".\"+(u&255)};\n  const a = u-1; return {main:\"Art-Net \"+(a>>8)+\".\"+((a>>4)&15)+\".\"+(a&15), sub:\"port address \"+a};\n}\n\n/* ============================== THE MATH ============================== */\nfunction compute(){\n  const cap = Math.floor(512 * S.fill);\n  const lcap = S.lcap;\n  const node = nodeModel();\n\n  /* stable colour per fixture type — order of first appearance in the rig, never re-cycled */\n  const typeOrder = []; S.rows.forEach(function(r){ const k = rowInfo(r).key; if(typeOrder.indexOf(k)<0) typeOrder.push(k); });\n  const slotOf = function(key){ const i = typeOrder.indexOf(key); return i < PAL.length ? PAL[i] : \"s0\"; };\n\n  const posOrder = {}; S.rows.forEach(function(r,i){ posOrder[r.uid] = i; });\n  const positions = [], universes = [];\n  let uNum = S.ustart, unitTotal = 0, chTotal = 0, noRdm = 0, unitSerial = {};\n\n  S.positions.forEach(function(p){\n    /* expand this position's rows into units, in rig order (fixture types stay contiguous) */\n    let units = [];\n    S.rows.filter(function(r){ return r.pos===p.id; })\n      .sort(function(a,b){ return posOrder[a.uid]-posOrder[b.uid]; })\n      .forEach(function(r){\n        const info = rowInfo(r);\n        for(let i=0;i<r.qty;i++){\n          unitSerial[info.key] = (unitSerial[info.key]||0) + 1;\n          units.push({row:r, name:info.name, brand:info.brand, mode:info.mode, ch:info.ch, key:info.key,\n            slot:slotOf(info.key), data:info.data, rdm:info.rdm, serial:unitSerial[info.key]});\n        }\n      });\n    units.forEach(function(u){ unitTotal++; chTotal += u.ch; if(!u.rdm) noRdm++; });\n\n    const bins = [];\n    const place = function(u){\n      /* first-fit when packing tight, next-fit (last bin only) in rig order */\n      const candidates = S.tight ? bins : bins.slice(-1);\n      let bin = null;\n      for(let i=0;i<candidates.length;i++){\n        const b = candidates[i], start = alignAddr(b.next);\n        if(b.units.length < lcap && start + u.ch - 1 <= cap){ bin = b; break; }\n      }\n      if(!bin){ bin = {units:[], next:1, used:0, pid:p.id, posName:p.name}; bins.push(bin); }\n      const start = alignAddr(bin.next);\n      u.addr = start; u.end = start + u.ch - 1;\n      bin.units.push(u); bin.next = u.end + 1; bin.used += u.ch;\n      if(u.end > 512) bin.over = true;\n    };\n    const order = S.tight ? units.slice().sort(function(a,b){ return b.ch-a.ch || a.serial-b.serial; }) : units;\n    order.forEach(place);\n\n    const minCh = units.length ? Math.min.apply(null, units.map(function(u){ return u.ch; })) : 0;\n    bins.forEach(function(b, i){\n      b.num = uNum++;\n      b.high = b.units.reduce(function(m,u){ return Math.max(m,u.end); }, 0);\n      b.fillPct = b.used/512*100;\n      /* what closed this universe: overflow, the line cap, no room for even the smallest fixture here,\n         or simply that the next fixture in rig order was too big (the straddle waste) */\n      const roomLeft = cap - alignAddr(b.next) + 1;\n      b.why = b.over ? \"over\" : b.units.length >= lcap ? \"dev\" : roomLeft < minCh ? \"ch\" :\n              i === bins.length-1 ? \"open\" : \"order\";\n      b.addr = uniAddr(b.num);\n      universes.push(b);\n    });\n\n    const nUni = bins.length;\n    const nodes = S.topo===\"node\" ? Math.ceil(nUni / node.ports) : 0;\n    /* run lengths: node-per-position = Cat5 to the truss, then short DMX; home-run = DMX from the rack */\n    const longestChain = bins.reduce(function(m,b){ return Math.max(m, (b.units.length-1)*S.jump); }, 0);\n    const lineFt = (S.topo===\"node\" ? NODE_TAIL_FT : p.dist) + longestChain;\n    let runFlag = \"\", runText = \"\";\n    if(S.topo===\"node\"){\n      if(nUni){ runText = p.dist > CAT_LIMIT_FT ? \"fiber\" : \"Cat5e\"; if(p.dist > CAT_LIMIT_FT) runFlag = \"warn\"; }\n      if(lineFt > DMX_LIMIT_FT) runFlag = \"crit\";\n    } else if(nUni){\n      runText = \"DMX\";\n      if(lineFt > DMX_LIMIT_FT) runFlag = \"crit\"; else if(lineFt > RDM_SOFT_FT) runFlag = \"warn\";\n    }\n    positions.push({p:p, bins:bins, units:units, nUni:nUni, nodes:nodes, lineFt:lineFt, runFlag:runFlag, runText:runText,\n      ch:units.reduce(function(t,u){ return t+u.ch; },0)});\n  });\n\n  const nUni = universes.length;\n  const capacity = nUni * 512;\n  const fillPct = capacity ? chTotal/capacity*100 : 0;\n  const devBound = universes.filter(function(b){ return b.why===\"dev\"; });\n  const over = universes.filter(function(b){ return b.over; });\n  const chIdeal = Math.ceil(chTotal / cap);                       /* if fixtures could straddle */\n  const nodesTotal = S.topo===\"node\"\n    ? positions.reduce(function(t,P){ return t+P.nodes; },0)\n    : Math.ceil(nUni / node.ports);\n  const portsTotal = nodesTotal * node.ports;\n  const switchPorts = nodesTotal + 1;                              /* + console */\n  const switchPick = SWITCHES.find(function(x){ return x >= switchPorts; }) || null;\n  const fiberDrops = S.topo===\"node\" ? positions.filter(function(P){ return P.nodes && P.p.dist > CAT_LIMIT_FT; }).length : 0;\n  const longest = positions.reduce(function(m,P){ return P.nUni && P.lineFt > m.ft ? {ft:P.lineFt, name:P.p.name} : m; }, {ft:0, name:\"—\"});\n\n  /* ---- pack list ---- */\n  let dmxFeet = 0, catFeet = 0, jumpers = 0, tails = 0;\n  const dmxCuts = [], catCuts = [];\n  positions.forEach(function(P){\n    if(!P.nUni) return;\n    const chainJ = P.bins.reduce(function(t,b){ return t + Math.max(0, b.units.length-1); }, 0);\n    jumpers += chainJ; dmxFeet += chainJ * S.jump;\n    if(S.topo===\"node\"){\n      tails += P.nUni; dmxFeet += P.nUni * NODE_TAIL_FT;\n      const cut = cutLengths(P.p.dist, CAT_STOCK), feet = cut.reduce(function(t,x){ return t+x; },0);\n      catFeet += feet * P.nodes;\n      catCuts.push({name:P.p.name, n:P.nodes, label:cutLabel(cut), feet:feet, fiber:P.p.dist > CAT_LIMIT_FT});\n    } else {\n      const cut = cutLengths(P.p.dist, DMX_STOCK), feet = cut.reduce(function(t,x){ return t+x; },0);\n      dmxFeet += feet * P.nUni;\n      dmxCuts.push({name:P.p.name, n:P.nUni, label:cutLabel(cut), feet:feet});\n    }\n  });\n  const weight = dmxFeet*DMX_LBFT + catFeet*CAT_LBFT + (jumpers+tails+dmxCuts.reduce(function(t,x){return t+x.n;},0))*XLR_LB;\n\n  return {positions:positions, universes:universes, nUni:nUni, units:unitTotal, ch:chTotal, cap:cap, capacity:capacity,\n    fillPct:fillPct, devBound:devBound, over:over, chIdeal:chIdeal, node:node, nodesTotal:nodesTotal,\n    portsTotal:portsTotal, switchPorts:switchPorts, switchPick:switchPick, fiberDrops:fiberDrops, longest:longest,\n    noRdm:noRdm, typeOrder:typeOrder, slotOf:slotOf, dmxFeet:dmxFeet, catFeet:catFeet, jumpers:jumpers, tails:tails,\n    dmxCuts:dmxCuts, catCuts:catCuts, weight:weight};\n}\n\n/* ============================== RENDER ============================== */\nconst $ = function(id){ return document.getElementById(id); };\nconst n0 = function(v){ return Math.round(v).toLocaleString(); };\nconst n1 = function(v){ return v.toFixed(1); };\nconst plural = function(n, s){ return n+\" \"+s+(n===1?\"\":\"s\"); };\nconst WHY = {ch:\"Channels\", dev:\"Line cap\", open:\"Open\", over:\"Overflow\", order:\"Rig order\"};\n\nfunction render(){\n  const R = compute();\n\n  /* ---------- tiles ---------- */\n  const fillFlag = R.fillPct < 60 ? \"flag-warn\" : \"\";\n  const runFlag = R.longest.ft > DMX_LIMIT_FT ? \"flag-crit\" : R.longest.ft > RDM_SOFT_FT ? \"flag-warn\" : \"flag-ok\";\n  $(\"tiles\").innerHTML = [\n    tile(\"Channels\", n0(R.ch), \"\", plural(R.units,\"fixture\")+\" · \"+S.positions.length+\" positions\"),\n    tile(\"Universes\", String(R.nUni), \"\", n0(R.capacity)+\" ch of capacity\"),\n    tile(\"Fill\", n1(R.fillPct), \" %\", R.nUni>R.chIdeal ? (R.nUni-R.chIdeal)+\" more than the channel count alone\" : \"no straddle waste\", fillFlag),\n    tile(\"Line-capped\", String(R.devBound.length), \"\", \"universes closed by \"+S.lcap+\" fixtures, not channels\", R.devBound.length?\"flag-warn\ mily:\"IBM Plex Mono\",monospace; font-size:11px; fill:var(--ink-2)}\n.riser .sm{font-family:\"IBM Plex Mono\",monospace; font-size:10px; fill:var(--ink-3)}\n.riser .big{font-family:\"IBM Plex Mono\",monospace; font-size:19px; font-weight:600; fill:var(--ink)}\n.riser .ln{stroke:var(--ink-2); fill:none}\n\n.saved{display:flex; flex-wrap:wrap; gap:6px}\n.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong);\n  background:var(--surface-2); border-radius:14px; padding:3px 5px 3px 11px; font-size:12.5px}\n.chip button{border:0; background:transparent; padding:1px 4px; min-height:0; color:var(--ink-3); font-size:13px; line-height:1}\n.chip button:hover{color:var(--crit)}\n.chip .load-b{cursor:pointer}\n\nfooter.fine{font-size:11.5px; color:var(--ink-3); line-height:1.6; max-width:100ch;\n  border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:7px}\nfooter.fine b{color:var(--ink-2); font-weight:600}\nfooter.fine a{color:var(--ink-2)}\n.hide{display:none !important}\n\n\n@media print{\n  body{background:#fff; color:#000; font-size:10pt}\n  .wrap{max-width:none; padding:0; gap:12px}\n  .noprint{display:none !important}\n  .panel{box-shadow:none; border:1px solid #999; break-inside:avoid}\n  .tiles{border-color:#999; background:#999}\n  .tile{background:#fff}\n  .elev{break-inside:avoid}\n  header.top{border-bottom:2px solid #000}\n}\n</style>\\n<style>\n/* ---------- elevations ---------- */\n.elevs{display:flex; flex-direction:column; gap:6px}\n.elev{display:flex; flex-direction:column; gap:6px; padding:10px 0 12px; border-top:1px dotted var(--line)}\n.elev:first-child{border-top:0; padding-top:2px}\n.elev .eh{display:flex; align-items:center; gap:8px; flex-wrap:wrap}\n.elev .eh .pos{font-family:\"Archivo\",sans-serif; font-stretch:95%; font-weight:700; font-size:13px}\n.elev .eh hr{flex:1; border:0; border-top:1px solid var(--line); margin:0; min-width:20px}\n.elev svg{width:100%; height:auto; display:block; color:var(--ink)}\n.elev .grid{stroke:var(--ink-3); stroke-width:3}\n.elev .chain{stroke:var(--ink-2); stroke-width:1.5; stroke-dasharray:3 2}\n.elev .hoist{fill:var(--surface-2); stroke:var(--ink-2); stroke-width:1}\n.elev .truss{fill:var(--surface-2); stroke:var(--ink); stroke-width:1.25}\n.elev .lace{stroke:var(--line-strong); stroke-width:.75; fill:none}\n.elev .fx{stroke:var(--surface); stroke-width:.5}\n.elev .lbl{font-family:\"IBM Plex Mono\",monospace; font-size:10px; fill:var(--ink-2)}\n.elev .lbl.b{font-weight:600; fill:var(--ink)}\n.elev .sm{font-family:\"IBM Plex Mono\",monospace; font-size:9px; fill:var(--ink-3)}\n.elev .ttl{font-family:\"Archivo\",sans-serif; font-size:9px; font-weight:700; letter-spacing:.13em; fill:var(--ink-3)}\n.elev .util{fill:var(--accent); opacity:.55}\n.elev .util.warn{fill:var(--warn)} .elev .util.crit{fill:var(--crit)}\n.elev .cap{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:2 2}\n.elev .cg{fill:var(--ink)}\n</style>\n\n<div class=\"wrap\">\n\n  <header class=\"top\">\n    <div class=\"brand\">\n      <div class=\"eyebrow\">Truss loading &amp; rigging point schedule</div>\n      <h1>Truss Plot</h1>\n      <div class=\"sub\">Hang the rig by truss. It weighs every stick, splits the load between the hoists,\n        checks the span against the manufacturer's table, and writes the point loads the venue asks for.</div>\n    </div>\n    <div class=\"spacer\"></div>\n    <div class=\"setbar noprint\">\n      <div class=\"field\"><label for=\"hoist\">Hoist</label><select id=\"hoist\"></select></div>\n      <div class=\"field\"><label for=\"chain\">Chain lift (ft)</label><input type=\"number\" id=\"chain\" min=\"10\" max=\"200\" value=\"60\"></div>\n      <div class=\"field\"><label for=\"rep\">Repetitive use</label>\n        <select id=\"rep\"><option value=\"1\">×0.85 · E1.2 touring</option><option value=\"0\">Table as published</option></select></div>\n      <div class=\"field\"><label for=\"dyn\">Hoist dynamic</label>\n        <select id=\"dyn\"><option value=\"1\">×1.0 static</option><option value=\"1.2\">×1.2</option><option value=\"1.5\">×1.5</option></select></div>\n      <div class=\"field\"><label for=\"cab\">Cable (lb/ft)</label><input type=\"number\" id=\"cab\" min=\"0\" max=\"20\" step=\"0.5\" value=\"2.5\"></div>\n    </div>\n  </header>\n\n  <section class=\"tiles\" id=\"tiles\"></section>\n  <div class=\"notes\" id=\"notes\"></div>\n\n  <!-- ===================== RIG ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Rig</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"rigcount\"></span>\n    </div>\n    <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end\">\n        <div class=\"field\" style=\"flex:1 1 200px;min-width:170px\"><label for=\"pick\">Add fixture</label>\n          <select id=\"pick\"></select></div>\n        <div class=\"field\"><label for=\"pickqty\">Qty</label>\n          <input type=\"number\" id=\"pickqty\" class=\"qty\" min=\"1\" max=\"999\" value=\"12\"></div>\n        <div class=\"field\"><label for=\"pickpos\">Truss</label><select id=\"pickpos\"></select></div>\n        <button class=\"primary\" id=\"addbtn\">Add</button>\n      </div>\n\n      <div class=\"scroll\">\n        <table>\n          <thead><tr>\n            <th>Fixture</th><th class=\"num\">Qty</th><th>Truss</th><th class=\"num\">From ft</th><th class=\"num\">To ft</th>\n            <th class=\"num\">lb ea</th><th class=\"num\">+ hardware</th><th class=\"num\">Total lb</th><th class=\"noprint\"></th>\n          </tr></thead>\n          <tbody id=\"rigbody\"></tbody>\n        </table>\n      </div>\n      <p style=\"font-size:11.5px;color:var(--ink-3);margin:0;line-height:1.5\">Fixtures spread evenly between From and To, measured from the stage-left\n        end of the truss. Hardware is two half-couplers and a safety for anything on omegas, one clamp for conventionals.</p>\n\n      <details class=\"noprint\">\n        <summary style=\"cursor:pointer;font-size:12.5px;color:var(--ink-2)\">Add something not in the library</summary>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:9px\">\n          <div class=\"field\" style=\"flex:1 1 160px\"><label for=\"cname\">Name</label>\n            <input type=\"text\" id=\"cname\" placeholder=\"Scenic header\"></div>\n          <div class=\"field\"><label for=\"clb\">lb each</label><input type=\"number\" id=\"clb\" min=\"1\" max=\"5000\" value=\"40\"></div>\n          <div class=\"field\"><label for=\"cqty\">Qty</label><input type=\"number\" id=\"cqty\" class=\"qty\" min=\"1\" max=\"999\" value=\"4\"></div>\n          <button id=\"addcustom\">Add</button>\n        </div>\n      </details>\n    </div>\n  </section>\n\n  <!-- ===================== TRUSSES ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Trusses</h2><span class=\"spacer\"></span>\n      <button id=\"addpos\" class=\"noprint\">Add truss</button>\n    </div>\n    <div class=\"body\">\n      <div class=\"scroll\">\n        <table>\n          <thead><tr>\n            <th>Truss</th><th>Type</th><th class=\"num\">Length ft</th><th class=\"num\">Hoists</th><th class=\"num\">Inset ft</th>\n            <th class=\"num\">Hung lb</th><th class=\"num\">Heaviest hook</th><th class=\"num\">Worst span</th><th class=\"noprint\"></th>\n          </tr></thead>\n          <tbody id=\"posbody\"></tbody>\n        </table>\n      </div>\n      <p style=\"font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5\">Hoists sit evenly between the insets; one hoist hangs at centre.\n        Hung weight includes the truss itself and the cable allowance. Heaviest hook is the load on that hoist's hook as a share of its WLL.</p>\n    </div>\n  </section>\n\n  <!-- ===================== ELEVATIONS ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\"><h2>Elevations</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"elevsum\"></span></div>\n    <div class=\"body\"><div class=\"elevs\" id=\"elevs\"></div><div class=\"legend\" id=\"legend\"></div></div>\n  </section>\n\n  <div class=\"cols\">\n    <!-- ===================== POINTS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\">\n        <h2>Rigging points</h2><span class=\"spacer\"></span>\n        <span class=\"eyebrow mono\" id=\"ptsum\"></span>\n        <button id=\"csv\" class=\"noprint\">Export CSV</button>\n        <button id=\"printbtn\" class=\"noprint\">Print</button>\n      </div>\n      <div class=\"body\"><div class=\"scroll\"><table>\n        <thead><tr><th>Pt</th><th>Truss</th><th class=\"num\">At ft</th><th class=\"num\">On hook</th><th class=\"num\">% WLL</th><th class=\"num\">To the grid</th><th>Flag</th></tr></thead>\n        <tbody id=\"ptbody\"></tbody></table></div></div>\n    </section>\n\n    <!-- ===================== SPANS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Truss check</h2><span class=\"spacer\"></span><span class=\"eyebrow mono\" id=\"spansum\"></span></div>\n      <div class=\"body\"><div class=\"scroll\"><table>\n        <thead><tr><th>Truss</th><th>Segment</th><th class=\"num\">ft</th><th class=\"num\">Moment</th><th class=\"num\">Allowed</th><th class=\"num\">Bending</th><th class=\"num\">Shear</th><th class=\"num\">Sag</th></tr></thead>\n        <tbody id=\"spanbody\"></tbody></table></div>\n        <p style=\"font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5\">Moment in lb·ft. Allowed is the lower of the table's UDL and CPL\n          rows converted to a moment at that span, after the repetitive-use factor. Sag is the table's deflection scaled to the actual moment.</p>\n      </div>\n    </section>\n  </div>\n\n  <div class=\"duo\">\n    <!-- ===================== WEIGHTS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Fixture weights</h2><span class=\"spacer\"></span><span class=\"eyebrow mono\" id=\"wtrule\"></span></div>\n      <div class=\"body\"><div class=\"scroll\"><table>\n        <thead><tr><th>Fixture</th><th class=\"num\">lb</th><th class=\"num\">Hung</th><th class=\"num\">Per 10 ft @ 3 ft</th></tr></thead>\n        <tbody id=\"wtbody\"></tbody></table></div></div>\n    </section>\n\n    <!-- ===================== SAVE ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Saved rigs</h2></div>\n      <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div class=\"rows\" id=\"sumrows\"></div>\n        <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:11px\">\n          <div class=\"field\" style=\"flex:1 1 150px\"><label for=\"signame\">Save this rig as</label>\n            <input type=\"text\" id=\"signame\" placeholder=\"Arena A — main truss\"></div>\n          <button id=\"savebtn\">Save</button>\n        </div>\n        <div class=\"saved noprint\" id=\"saved\"></div>\n      </div>\n    </section>\n  </div>\n\n  <!-- ===================== PACK LIST ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\"><h2>Pack list</h2><span class=\"spacer\"></span><span class=\"eyebrow mono\" id=\"packweight\"></span></div>\n    <div class=\"body\"><div class=\"duo\"><div class=\"rows\" id=\"packrows\"></div><div class=\"rows\" id=\"packrows2\"></div></div></div>\n  </section>\n\n  <footer class=\"fine\">\n    <div><b>Read this before you fly anything.</b> Truss Plot is a planning aid for the pre-production conversation with the venue and\n    the rigger. It is not an engineering review, and every manufacturer table it uses says the same thing: point loads at panel\n    points, no bridling from the truss, and cantilevers or anything past the table need the manufacturer or a licensed engineer.\n    Fixture weights are published figures with omega brackets where the maker includes them; check the real thing on a scale.</div>\n    <div><b>What the numbers assume.</b> Two hoists: exact statics, so an overhung end shows uplift on the far hoist when it happens.\n    Three or more: the tributary split riggers use in practice — each hoist takes the load from the midpoint to its neighbours —\n    and each span is checked as a simple beam between its two hoists, which is conservative for midspan and blind to hogging over\n    the middle hoists. Truss capacity is compared by moment: the lower of the table's UDL and CPL rows at that span, interpolated\n    between rows; a cantilever of length a is checked against the table at a span of 2a. Tomcat tables are Aluminum Design\n    Manual figures not yet reduced for repetitive use — the ×0.85 is ANSI E1.2's touring factor and is applied to every table\n    when selected, which is doubly conservative on Thomas tables that already carry 20 % for dynamics and on Prolyte's\n    Eurocode tables. Hoist WLL is checked against the hook load times the dynamic factor; the load to the grid adds the hoist\n    body, chain at the chain-lift length, and a bag.</div>\n    <div><b>Bridles</b> aren't planned here. If a point lands where there's no steel, a two-leg bridle at 90° included puts\n    0.71× the point load in each leg; ASME B30.9 stops you at 120°. That's the venue rigger's call, not this page's.</div>\n  </footer>\n</div>\n\\n<script>\n(function(){\n\"use strict\";\n\n/* ============================ REFERENCE DATA ============================ */\n/* Published fixture weights in lb, omega brackets included where the manufacturer includes them.\n   hw: \"omega\" = two half-couplers + safety (3.1 lb) · \"clamp\" = one C-clamp/half-coupler + safety (1.7 lb) · \"incl\" = clamp already in the figure */\nconst LIB = [\n  {c:\"Moving light\", b:\"Robe\",     n:\"BMFL Blade\",              lb:83.6, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"MegaPointe\",              lb:48.5, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Pointe\",                  lb:33.0, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Spiider\",                 lb:29.2, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Robe\",     n:\"T1 Profile\",              lb:54.0, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Aura XB\",             lb:14.4, hw:\"clamp\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Aura PXL\",            lb:34.4, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Viper Profile\",       lb:82.0, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Ultra Performance\",   lb:97.0, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Encore Performance\",  lb:68.4, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Sharpy\",                  lb:41.8, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Mythos 2\",                lb:70.5, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Scenius Unico\",           lb:92.6, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Ayrton\",   n:\"Khamsin-S\",               lb:87.7, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Ayrton\",   n:\"Diablo-S\",                lb:48.5, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Elation\",  n:\"Proteus Maximus\",         lb:117,  hw:\"omega\"},\n  {c:\"Moving light\", b:\"Chauvet\",  n:\"Rogue R2 Wash\",           lb:20.4, hw:\"omega\"},\n  {c:\"Moving light\", b:\"Chauvet\",  n:\"Maverick Force S Profile\",lb:52.9, hw:\"omega\"},\n  {c:\"Wash / bar / strobe\", b:\"GLP\", n:\"impression X4 Bar 20\",  lb:35.3, hw:\"omega\"},\n  {c:\"Wash / bar / strobe\", b:\"GLP\", n:\"JDC1\",                  lb:25.6, hw:\"omega\"},\n  {c:\"Wash / bar / strobe\", b:\"SGM\", n:\"Q-7\",                   lb:17.9, hw:\"omega\"},\n  {c:\"Conventional\", b:\"ETC\", n:\"Source Four LED S3 Lustr\",     lb:19.6, hw:\"incl\"},\n  {c:\"Conventional\", b:\"ETC\", n:\"ColorSource PAR\",              lb:8.3,  hw:\"clamp\"},\n  {c:\"Conventional\", b:\"ETC\", n:\"Source Four 750 W\",            lb:14.0, hw:\"incl\"},\n  {c:\"Atmospherics\", b:\"MDG\",    n:\"theONE hazer (cradle, dry)\",lb:74.0, hw:\"omega\"},\n  {c:\"Atmospherics\", b:\"Look\",   n:\"Viper NT fogger (full)\",    lb:30.0, hw:\"clamp\"},\n  {c:\"Atmospherics\", b:\"Martin\", n:\"JEM ZR45 fogger (full)\",    lb:50.0, hw:\"clamp\"}\n];\nLIB.forEach(function(f,i){ f.id = \"L\"+i; });\nconst HW = {omega:3.1, clamp:1.7, incl:0.3};\n\n/* Manufacturer load tables. rows: [span ft, allowable UDL total lb, allowable CPL lb, UDL deflection in]\n   basis: \"adm\" = Aluminum Design Manual, not reduced for repetitive use · \"dyn20\" = Thomas, 20 % dynamic included · \"ec\" = Eurocode */\nconst TRUSS = [\n  {id:\"tc12\", n:\"Tomcat LD 12″ plated\", w:6.2, basis:\"adm\", sec:[10,5,2],\n    rows:[[10,5230,2613,.13],[15,3435,1717,.29],[20,2520,1261,.52],[25,1950,981,.81],[30,1590,790,1.17],[35,1295,649,1.61],[40,1080,539,2.12],[45,900,450,2.72],[50,750,376,3.39]]},\n  {id:\"tc20\", n:\"Tomcat MD 20.5″ plated\", w:9.2, basis:\"adm\", sec:[10,5,2],\n    rows:[[10,8690,6814,.08],[20,6680,3343,.48],[30,4320,2158,1.09],[40,3080,1544,1.93],[50,2300,1159,3.02],[60,1800,888,4.34],[70,1330,682,5.91]]},\n  {id:\"tcpr\", n:\"Tomcat pre-rig 26″ single-hung\", w:10.6, basis:\"adm\", sec:[10.25,7.75,5.25],\n    rows:[[7.75,8804,4403,0],[15.5,8153,4077,0],[23.25,5324,2664,0],[31,3875,1941,0],[38.75,2984,1494,0],[46.5,2325,1185,0],[54.25,1899,956,0]]},\n  {id:\"th12\", n:\"Thomas GP 12″\", w:5.5, basis:\"dyn20\", sec:[10,8,5,2.5],\n    rows:[[10,6140,4497,.28],[20,3100,1550,1.10],[30,1726,864,2.21],[40,855,428,2.96]]},\n  {id:\"th15\", n:\"Thomas GP 15″\", w:6.15, basis:\"dyn20\", sec:[10,8,5,2.5],\n    rows:[[10,9200,4600,0],[15,6100,3050,0],[20,4500,2250,0],[  inset:5},\n  {id:\"p3\", name:\"Upstage truss\",   type:\"tc20\", len:60, hoists:3, inset:5},\n  {id:\"p4\", name:\"FOH truss\",       type:\"th12\", len:40, hoists:2, inset:5}\n];\nconst DEFAULT_ROWS = [\n  {fid:\"L6\",  qty:12, pos:\"p1\"},              // Aura PXL\n  {fid:\"L0\",  qty:8,  pos:\"p1\", from:5, to:45}, // BMFL\n  {fid:\"L1\",  qty:12, pos:\"p2\"},              // MegaPointe\n  {fid:\"L6\",  qty:12, pos:\"p2\"},              // Aura PXL\n  {fid:\"L18\", qty:16, pos:\"p3\"},              // X4 Bar 20\n  {fid:\"L19\", qty:8,  pos:\"p3\", from:10, to:50}, // JDC1\n  {fid:\"L21\", qty:30, pos:\"p4\"}               // S4 LED S3\n];\nlet S = {\n  hoist:\"L\", chain:60, rep:true, dyn:1, cab:2.5,\n  positions: DEFAULT_POS.map(function(p){ return Object.assign({}, p); }),\n  rows: DEFAULT_ROWS.map(function(r){ return Object.assign({uid:uid()}, r); })\n};\nlet DB = null, DOWNLOADS = null, savedRigs = [];\n\nfunction uid(){ return \"r\" + Math.random().toString(36).slice(2,9); }\nfunction fx(id){ return LIB.find(function(f){ return f.id===id; }); }\nfunction pos(id){ return S.positions.find(function(p){ return p.id===id; }); }\nfunction trussOf(p){ return TRUSS.find(function(t){ return t.id===p.type; }) || TRUSS[0]; }\nfunction hoistModel(){ return HOISTS.find(function(h){ return h.id===S.hoist; }) || HOISTS[0]; }\nfunction esc(s){ return String(s).replace(/[&<>\"]/g,function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction rowInfo(r){\n  if(r.custom) return {name:r.custom.name, brand:\"Custom\", lb:r.custom.lb, hw:HW.clamp, key:\"custom:\"+r.custom.name};\n  const f = fx(r.fid);\n  return f ? {name:f.n, brand:f.b, lb:f.lb, hw:HW[f.hw], key:f.id} : {name:\"(missing)\", brand:\"\", lb:0, hw:0, key:\"x\"};\n}\nfunction hoistXs(p){\n  const n = Math.max(1, p.hoists|0), L = p.len, ins = Math.min(p.inset, L/2);\n  if(n===1) return [L/2];\n  const out = []; for(let i=0;i<n;i++) out.push(ins + (L-2*ins)*i/(n-1)); return out;\n}\n/* linear interpolation in the table: conservative for a capacity curve that falls off like 1/L² */\nfunction tableAt(t, span){\n  const rows = t.rows;\n  if(span <= rows[0][0]) return {udl:rows[0][1], cpl:rows[0][2], defl:rows[0][3], inTable:true};\n  if(span > rows[rows.length-1][0]) return {udl:0, cpl:0, defl:0, inTable:false};\n  for(let i=1;i<rows.length;i++){\n    if(span <= rows[i][0]){\n      const a = rows[i-1], b = rows[i], f = (span-a[0])/(b[0]-a[0]);\n      return {udl:a[1]+(b[1]-a[1])*f, cpl:a[2]+(b[2]-a[2])*f, defl:a[3]+(b[3]-a[3])*f, inTable:true};\n    }\n  }\n  return {udl:0, cpl:0, defl:0, inTable:false};\n}\nfunction repFactor(){ return S.rep ? 0.85 : 1; }\nfunction cutSections(len, stock){\n  const out = []; let left = len, guard = 0;\n  while(left > 0.01 && guard++ < 40){\n    const fit = stock.find(function(L){ return L <= left + 0.01; });\n    if(!fit){ out.push(stock[stock.length-1]); break; }\n    out.push(fit); left -= fit;\n  }\n  return out;\n}\nfunction cutLabel(arr){\n  const c = {}; arr.forEach(function(L){ c[L]=(c[L]||0)+1; });\n  return Object.keys(c).sort(function(a,b){ return b-a; })\n    .map(function(L){ return (c[L]>1 ? c[L]+\"×\" : \"\") + (+L).toFixed(+L%1?2:0) + \"′\"; }).join(\" + \");\n}\n\n/* ============================== THE MATH ============================== */\n/* Simple beam between two supports at xa < xb: point loads inside, UDL w over the segment.\n   Returns reactions, Mmax and its location, and the moment sampled along the segment. */\nfunction simpleBeam(xa, xb, loads, w){\n  const L = xb - xa;\n  let rb = w*L*L/2;   /* moment about a */\n  loads.forEach(function(p){ rb += p.lb * (p.x - xa); });\n  rb /= L;\n  const ra = w*L + loads.reduce(function(t,p){ return t+p.lb; },0) - rb;\n  const samples = [], N = 60;\n  let mmax = 0, xm = xa;\n  for(let i=0;i<=N;i++){\n    const x = xa + L*i/N;\n    let m = ra*(x-xa) - w*(x-xa)*(x-xa)/2;\n    loads.forEach(function(p){ if(p.x < x) m -= p.lb*(x-p.x); });\n    samples.push([x, m]);\n    if(m > mmax){ mmax = m; xm = x; }\n  }\n  return {ra:ra, rb:rb, mmax:mmax, xm:xm, samples:samples, vmax:Math.max(Math.abs(ra), Math.abs(rb))};\n}\n/* Cantilever beyond a support: loads at distance d past it, UDL w over length a */\nfunction cantilever(a, loads, w){\n  let m = w*a*a/2, v = w*a;\n  loads.forEach(function(p){ m += p.lb*p.d; v += p.lb; });\n  return {m:m, v:v};\n}\n\nfunction compute(){\n  const hoist = hoistModel(), rep = repFactor();\n  const typeOrder = []; S.rows.forEach(function(r){ const k = rowInfo(r).key; if(typeOrder.indexOf(k)<0) typeOrder.push(k); });\n  const slotOf = function(key){ const i = typeOrder.indexOf(key); return i < PAL.length ? PAL[i] : \"s0\"; };\n\n  const positions = [], points = [], segments = [];\n  let hung = 0, fixtures = 0, fixtureLb = 0, trussLb = 0, cableLb = 0, ptNum = 0;\n\n  S.positions.forEach(function(p){\n    const t = trussOf(p), L = p.len;\n    const w = t.w + S.cab;                                  /* lb/ft along the whole stick */\n    const loads = [];\n    S.rows.filter(function(r){ return r.pos===p.id; }).forEach(function(r){\n      const info = rowInfo(r), each = info.lb + info.hw;\n      const from = Math.max(0, Math.min(L, r.from==null ? 0 : r.from));\n      const to   = Math.max(from, Math.min(L, r.to==null ? L : r.to));\n      for(let i=0;i<r.qty;i++){\n        const x = r.qty===1 ? (from+to)/2 : from + (to-from)*(i+0.5)/r.qty;\n        loads.push({x:x, lb:each, name:info.name, slot:slotOf(info.key), key:info.key});\n      }\n    });\n    loads.sort(function(a,b){ return a.x-b.x; });\n    const fixLb = loads.reduce(function(t,l){ return t+l.lb; },0);\n    const total = fixLb + w*L;\n    const xs = hoistXs(p), n = xs.length;\n    const cgx = total>0 ? (loads.reduce(function(t,l){ return t+l.lb*l.x; },0) + w*L*L/2) / total : L/2;\n\n    /* ---- reactions ---- */\n    let R = [];\n    if(n===1){ R = [total]; }\n    else if(n===2){\n      const b = simpleBeam(xs[0], xs[1], loads, 0);            /* point loads via statics about the hoists */\n      const wa = w*L, ra = wa*(xs[1]-cgxUDL(L))/(xs[1]-xs[0]);  /* UDL of the whole stick about the hoists */\n      const r1 = b.ra + ra, r2 = b.rb + (wa - ra);\n      R = [r1, r2];\n    } else {\n      R = xs.map(function(){ return 0; });\n      const bounds = [0]; for(let i=1;i<n;i++) bounds.push((xs[i-1]+xs[i])/2); bounds.push(L);\n      for(let i=0;i<n;i++){\n        R[i] += w*(bounds[i+1]-bounds[i]);\n        loads.forEach(function(l){ if(l.x >= bounds[i] && (l.x < bounds[i+1] || i===n-1)) R[i] += l.lb; });\n      }\n    }\n\n    /* ---- truss segments: overhang left, spans, overhang right ---- */\n    const segs = [];\n    const overL = xs[0], overR = L - xs[n-1];\n    const capAt = function(span){\n      const tb = tableAt(t, span);\n      const mAllow = tb.inTable ? Math.min(tb.udl*span/8, tb.cpl*span/4)*rep : 0;\n      const vAllow = tb.inTable ? tb.udl/2*rep : 0;\n      return {tb:tb, mAllow:mAllow, vAllow:vAllow, inTable:tb.inTable};\n    };\n    if(overL > 0.5){\n      const c = cantilever(overL, loads.filter(function(l){ return l.x < xs[0]; }).map(function(l){ return {lb:l.lb, d:xs[0]-l.x}; }), w);\n      const cap = capAt(Math.max(2*overL, t.rows[0][0]));\n      segs.push({kind:\"overhang\", label:\"SL overhang\", len:overL, m:c.m, v:c.v, mAllow:cap.mAllow, vAllow:cap.vAllow, inTable:true, sag:0, x0:0, x1:xs[0]});\n    }\n    for(let i=1;i<n;i++){\n      const span = xs[i]-xs[i-1];\n      const inside = loads.filter(function(l){ return l.x >= xs[i-1] && l.x <= xs[i]; });\n      const b = simpleBeam(xs[i-1], xs[i], inside, w);\n      const cap = capAt(span);\n      const sag = cap.inTable && cap.mAllow>0 ? cap.tb.defl * (b.mmax/(cap.mAllow/rep)) : 0;\n      segs.push({kind:\"span\", label:n===2?\"Span\":\"Span \"+i, len:span, m:b.mmax, v:b.vmax, mAllow:cap.mAllow, vAllow:cap.vAllow,\n        inTable:cap.inTable, sag:sag, samples:b.samples, x0:xs[i-1], x1:xs[i]});\n    }\n    if(overR > 0.5)  x1=\"'+x+'\" y1=\"'+(hoistY+9)+'\" x2=\"'+x+'\" y2=\"'+trussY+'\" stroke=\"var(--ink-2)\" stroke-width=\"1.5\"></line>';\n    const right = q.x > 0.72*P.L, lx = right ? x-13 : x+13, anc = right ? ' text-anchor=\"end\"' : '';\n    svg += '<text class=\"lbl b\" x=\"'+lx+'\" y=\"'+(hoistY-1)+'\" fill=\"'+s+'\"'+anc+'>'+n0(q.hook)+' lb</text>';\n    svg += '<text class=\"sm\" x=\"'+lx+'\" y=\"'+(hoistY+10)+'\"'+anc+'>pt '+q.num+' · '+Math.round(q.pctWll)+' % · '+n0(Math.max(q.grid,0))+' to grid</text>';\n    svg += '<text class=\"sm\" x=\"'+x+'\" y=\"'+(gridY-8)+'\" text-anchor=\"middle\">'+n1(q.x)+'′</text>';\n  });\n  /* truss */\n  svg += '<rect class=\"truss\" x=\"'+sx(0)+'\" y=\"'+trussY+'\" width=\"'+(sx(P.L)-sx(0))+'\" height=\"'+trussH+'\" rx=\"1\"></rect>';\n  const nSeg = Math.max(2, Math.round(P.L/2.5));\n  for(let i=0;i<nSeg;i++){ const a = sx(P.L*i/nSeg), b = sx(P.L*(i+1)/nSeg);\n    svg += '<line class=\"lace\" x1=\"'+a+'\" y1=\"'+(i%2?trussY:trussY+trussH)+'\" x2=\"'+b+'\" y2=\"'+(i%2?trussY+trussH:trussY)+'\"></line>'; }\n  svg += '<text class=\"sm\" x=\"'+sx(0)+'\" y=\"'+(trussY+trussH+12)+'\">SL 0′</text>';\n  svg += '<text class=\"sm\" x=\"'+sx(P.L)+'\" y=\"'+(trussY+trussH+12)+'\" text-anchor=\"end\">'+P.L+'′ SR</text>';\n  /* fixtures */\n  const occupied = {};\n  P.loads.forEach(function(l){\n    const x = sx(l.x), h = 5 + Math.min(12, l.lb/10), k = Math.round(x*2);\n    const dx = (occupied[k] = (occupied[k]||0) + 1) - 1;          /* coincident fixtures fan out sideways */\n    svg += '<rect class=\"fx\" x=\"'+(x-2.5+dx*4)+'\" y=\"'+(fxY)+'\" width=\"5\" height=\"'+h+'\" fill=\"var(--'+l.slot+')\"><title>'+esc(l.name)+' · '+n1(l.lb)+' lb at '+n1(l.x)+'′</title></rect>';\n  });\n  /* CG */\n  svg += '<path class=\"cg\" d=\"M'+sx(P.cgx)+','+(trussY-2)+' l-4,-6 l8,0 z\"><title>Centre of gravity at '+n1(P.cgx)+'′</title></path>';\n  /* utilization band */\n  svg += '<line class=\"cap\" x1=\"'+sx(0)+'\" y1=\"'+utilY+'\" x2=\"'+sx(P.L)+'\" y2=\"'+utilY+'\"></line>';\n  svg += '<text class=\"sm\" x=\"'+(W-padR+4)+'\" y=\"'+(utilY+3)+'\">100 %</text>';\n  P.segs.forEach(function(sg){\n    const cls = \"util \"+sev(sg.util);\n    if(sg.kind===\"span\" && sg.samples && isFinite(sg.util) && sg.mAllow>0){\n      let d = \"M\"+sx(sg.x0)+\",\"+(utilY+utilH);\n      sg.samples.forEach(function(s){ const u = Math.max(0, Math.min(1.6, s[1]/sg.mAllow)); d += \" L\"+sx(s[0])+\",\"+(utilY+utilH - u*utilH); });\n      d += \" L\"+sx(sg.x1)+\",\"+(utilY+utilH)+\" z\";\n      svg += '<path class=\"'+cls+'\" d=\"'+d+'\"></path>';\n    } else if(isFinite(sg.util)) {\n      const u = Math.max(0.02, Math.min(1.6, sg.util));\n      svg += '<rect class=\"'+cls+'\" x=\"'+sx(sg.x0)+'\" y=\"'+(utilY+utilH-u*utilH)+'\" width=\"'+(sx(sg.x1)-sx(sg.x0))+'\" height=\"'+(u*utilH)+'\"></rect>';\n    } else {\n      svg += '<rect class=\"util crit\" x=\"'+sx(sg.x0)+'\" y=\"'+utilY+'\" width=\"'+(sx(sg.x1)-sx(sg.x0))+'\" height=\"'+utilH+'\"></rect>';\n    }\n    const cx = sx((sg.x0+sg.x1)/2);\n    svg += '<text class=\"sm\" x=\"'+cx+'\" y=\"'+(utilY+utilH+12)+'\" text-anchor=\"middle\">'+esc(sg.label)+' '+n1(sg.len)+'′ · '+pct(sg.util)+'</text>';\n  });\n  svg += '</svg>';\n  return '<div class=\"elev\">'+head+svg+'</div>';\n}\n\nfunction tile(k,v,unit,n,flag){\n  return '<div class=\"tile '+(flag||\"\")+'\"><span class=\"k\">'+k+'</span><span class=\"v\">'+v+\n    (unit?'<small>'+unit+'</small>':'')+'</span><span class=\"n\">'+n+'</span></div>';\n}\nfunction note(kind,m,t){ return '<div class=\"note '+kind+'\"><span class=\"m\">'+m+'</span><span>'+t+'</span></div>'; }\nfunction row(k,v,cls){\n  const col = cls===\"crit\"?\"color:var(--crit)\":cls===\"warn\"?\"color:var(--warn)\":(cls===\"ok\"||cls===\"em\")?\"color:var(--accent)\":\"\";\n  return '<div class=\"r\"><span class=\"k\">'+k+'</span><span class=\"v\" style=\"'+col+'\">'+v+'</span></div>';\n}\n\n/* ============================== CONTROLS ============================== */\nfunction fillPicker(){\n  let html = \"\", cat = null;\n  LIB.forEach(function(f){\n    if(f.c!==cat){ if(cat!==null) html += \"</optgroup>\"; html += '<optgroup label=\"'+f.c+'\">'; cat = f.c; }\n    html += '<option value=\"'+f.id+'\">'+esc(f.b)+\" \"+esc(f.n)+\" — \"+f.lb+\" lb</option>\";\n  });\n  $(\"pick\").innerHTML = html + \"</optgroup>\";\n}\nfunction fillPositions(){\n  const keep = $(\"pickpos\").value;\n  $(\"pickpos\").innerHTML = S.positions.map(function(p){ return '<option value=\"'+p.id+'\">'+esc(p.name)+'</option>'; }).join(\"\");\n  $(\"pickpos\").value = S.positions.some(function(p){ return p.id===keep; }) ? keep : (S.positions[0]||{}).id;\n}\nfunction fillHoists(){\n  $(\"hoist\").innerHTML = HOISTS.map(function(h){ return '<option value=\"'+h.id+'\">'+esc(h.n)+' · '+n0(h.wll)+' lb</option>'; }).join(\"\");\n  $(\"hoist\").value = S.hoist;\n}\nfunction bind(){\n  $(\"hoist\").addEventListener(\"change\", function(e){ S.hoist = e.target.value; render(); });\n  $(\"chain\").addEventListener(\"input\", function(e){ S.chain = Math.max(10, Math.min(200, +e.target.value||10)); render(); });\n  $(\"rep\").addEventListener(\"change\", function(e){ S.rep = e.target.value===\"1\"; render(); });\n  $(\"dyn\").addEventListener(\"change\", function(e){ S.dyn = +e.target.value; render(); });\n  $(\"cab\").addEventListener(\"input\", function(e){ S.cab = Math.max(0, Math.min(20, +e.target.value||0)); render(); });\n  $(\"printbtn\").addEventListener(\"click\", function(){ window.print(); });\n\n  $(\"addbtn\").addEventListener(\"click\", function(){\n    const fid = $(\"pick\").value, qty = Math.max(1, +$(\"pickqty\").value||1), p = $(\"pickpos\").value;\n    const hit = S.rows.find(function(r){ return r.fid===fid && r.pos===p && r.from==null && r.to==null; });\n    if(hit) hit.qty += qty; else S.rows.push({uid:uid(), fid:fid, qty:qty, pos:p});\n    render();\n  });\n  $(\"addcustom\").addEventListener(\"click\", function(){\n    const name = ($(\"cname\").value||\"\").trim() || \"Custom load\";\n    S.rows.push({uid:uid(), custom:{name:name, lb:Math.max(1, +$(\"clb\").value||1)}, qty:Math.max(1,+$(\"cqty\").value||1), pos:$(\"pickpos\").value});\n    $(\"cname\").value = \"\"; render();\n  });\n  $(\"addpos\").addEventListener(\"click\", function(){\n    const id = \"p\"+Math.random().toString(36).slice(2,7);\n    S.positions.push({id:id, name:\"Truss \"+(S.positions.length+1), type:\"tc12\", len:40, hoists:2, inset:5});\n    fillPositions(); render();\n  });\n\n  $(\"rigbody\").addEventListener(\"input\", function(e){\n    const q = e.target.getAttribute(\"data-q\"), f = e.target.getAttribute(\"data-f\"), t = e.target.getAttribute(\"data-t\");\n    const key = q||f||t; if(!key) return;\n    const r = S.rows.find(function(x){ return x.uid===key; }); if(!r) return;\n    if(q) r.qty = Math.max(1, Math.min(999, +e.target.value||1));\n    else if(f) r.from = Math.max(0, +e.target.value||0);\n    else r.to = Math.max(0, +e.target.value||0);\n    softRender(e.target);\n  });\n  $(\"rigbody\").addEventListener(\"change\", function(e){\n    const p = e.target.getAttribute(\"data-p\"); if(!p) return;\n    const r = S.rows.find(function(x){ return x.uid===p; }); if(!r) return;\n    r.pos = e.target.value; r.from = null; r.to = null; render();\n  });\n  $(\"rigbody\").addEventListener(\"click\", function(e){\n    const btn = e.target.closest(\"[data-x]\"); if(!btn) return;\n    S.rows = S.rows.filter(function(x){ return x.uid !== btn.getAttribute(\"data-x\"); }); render();\n  });\n\n  $(\"posbody\").addEventListener(\"input\", function(e){\n    const el = e.target, id = el.getAttribute(\"data-pn\")||el.getAttribute(\"data-pl\")||el.getAttribute(\"data-ph\")||el.getAttribute(\"data-pi\");\n    if(!id) return; const p = pos(id); if(!p) return;\n    if(el.hasAttribute(\"data-pn\")){ p.name = el.value; fillPositions(); softRender(el); return; }\n    if(el.hasAttribute(\"data-pl\")) p.len = Math.max(5, Math.min(200, +el.value||5));\n    else if(el.hasAttribute(\"data-ph\")) p.hoists = Math.max(1, Math.min(12, +el.value||1));\n    else p.inset = Math.max(0, +el.value||0);\n    softRender(el);\n  });\n  $(\"posbody\").addEventListener(\"change\", function(e){\n    const id = e.target.getAttribute(\"data-pt\"); if(!id) return;\n    const p = pos(id); if(p){ p.type = e.target.value; render(); }\n  });\n  $(\"posbody\").addEventListener(\"click\", function(e){\n    const btn = e.target.closest(\"[data-px]\"); if(!btn) return;\n    const id = btn.getAttribute(\"data-px\"); if(S.positions.length<2) return;\n    S.positions = S.positions.filter(function(p){ return p.id!==id; });\n    const fallback = S.positions[0].id;\n    S.rows.forEach(function(r){ if(r.pos===id){ r.pos = fallback; r.from = null; r.to = null; } });\n    fillPositions(); render();\n  });\n\n  $(\"csv\").addEventListener(\"click\", exportCSV);\n  $(\"savebtn\").addEventListener(\"click\", saveRig);\n}\n/* re-render without stealing focus from the input being edited */\nlet softTimer = null;\nfunction softRender(el){\n  clearTimeout(softTimer);\n  softTimer = setTimeout(function(){\n    const attrs = [\"data-pn\",\"data-pl\",\"data-ph\",\"data-pi\",\"data-q\",\"data-f\",\"data-t\"];\n    const a = document.activeElement; let sel = null;\n    attrs.forEach(function(k){ if(a && a.hasAttribute && a.hasAttribute(k)) sel = '['+k+'=\"'+a.getAttribute(k)+'\"]'; });\n    const start = a && a.selectionStart;\n    render();\n    if(sel){ const n = document.querySelector(sel); if(n){ n.focus(); try{ n.setSelectionRange(start,start); }catch(e){} } }\n  }, 350);\n}\n\n/* ============================== EXPORT ============================== */\nfunction exportCSV(){\n  const R = window.__R || compute();\n  const L = [\n    [\"Truss Plot — rigging points\"],\n    [\"Hoist\", R.hoist.n, \"WLL lb\", R.hoist.wll, \"Chain ft\", S.chain, \"Repetitive use\", S.rep?\"0.85\":\"1.0\", \"Dynamic\", S.dyn, \"Cable lb/ft\", S.cab],\n    [\"Hung lb\", n0(R.hung), \"To grid lb\", n0(R.gridTotal), \"Points\", R.points.length],\n    [],\n    [\"Point\",\"Truss\",\"Truss type\",\"Length ft\",\"At ft from SL\",\"On hook lb\",\"% WLL\",\"To grid lb\",\"Flag\"]\n  ];\n  R.points.forEach(function(q){\n    L.push([q.num, q.pos.name, trussOf(q.pos).n, q.pos.len, n1(q.x), Math.round(q.hook), Math.round(q.pctWll), Math.round(q.grid), q.flag||\"ok\"]);\n  });\n  L.push([]); L.push([\"Truss check\"]); L.push([\"Truss\",\"Segment\",\"Length ft\",\"Moment lb-ft\",\"Allowed lb-ft\",\"Bending\",\"Shear\",\"Sag in\"]);\n  R.segments.forEach(function(sg){\n    L.push([sg.pos.name, sg.label, n1(sg.len), Math.round(sg.m), sg.inTable?Math.round(sg.mAllow):\"off table\", pct(sg.bend), pct(sg.shear), sg.sag?n1(sg.sag):\"\"]);\n  });\n  L.push([]); L.push([\"Rig\"]); L.push([\"Truss\",\"Fixture\",\"Qty\",\"From ft\",\"To ft\",\"lb each hung\",\"Total lb\"]);\n  S.rows.forEach(function(r){ const i = rowInfo(r), p = pos(r.pos)||{};\n    L.push([p.name, i.name, r.qty, r.from==null?0:r.from, r.to==null?p.len:r.to, n1(i.lb+i.hw), Math.round((i.lb+i.hw)*r.qty)]); });\n  L.push([]); L.push([\"Pack list\"]);\n  R.positions.forEach(function(P){ L.push([P.t.n+\" — \"+P.p.name, cutLabel(P.sections), Math.round(P.t.w*P.L)+\" lb\"]); });\n  L.push([\"Hoists\", R.points.length, R.hoist.n]); L.push([\"Steel 5 ft\", R.points.length]); L.push([\"Shackles 5/8\", R.points.length*2]);\n  const csv = L.map(function(r){ return r.map(function(x){ x = String(x==null?\"\":x); return /[\",\\n]/.test(x) ? '\"'+x.replace(/\"/g,'\"\"')+'\"' : x; }).join(\",\"); }).join(\"\\n\");\n  if(DOWNLOADS) DOWNLOADS.save({filename:\"truss-plot-points.csv\", data:csv}).catch(function(){ copyFallback(csv); });\n  else copyFallback(csv);\n}\nfunction copyFallback(csv){\n  const b = $(\"csv\"), old = b.textContent;\n  if(navigator.clipboard && navigator.clipboard.writeText)\n    navigator.clipboard.writeText(csv).then(function(){ b.textContent = \"Copied to clipboard\"; setTimeout(function(){ b.textContent
