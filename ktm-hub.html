ll:var(--surface-2); stroke:var(--ink-2); stroke-width:1}\n.truck .cs{stroke:var(--surface); stroke-width:1.2}\n.truck .cs:hover{stroke:var(--ink); stroke-width:1.5}\n.truck .lbl{font-family:\"IBM Plex Mono\",monospace; font-size:8.5px; fill:#fff; pointer-events:none}\n.truck .sm{font-family:\"IBM Plex Mono\",monospace; font-size:9.5px; fill:var(--ink-3)}\n.truck .ttl{font-family:\"Archivo\",sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.13em; fill:var(--ink-3)}\n.truck .door{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3}\n.truck .unused{fill:none; stroke:var(--line-strong); stroke-width:1; stroke-dasharray:2 3}\n.dept{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:6px; border:1px solid rgba(128,128,128,.35)}\n/* ---------- pull sheet ---------- */\n.pull .dh{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:16px 0 6px}\n.pull .dh:first-child{margin-top:2px}\n.pull .dh .d{font-family:\"Archivo\",sans-serif; font-stretch:105%; font-weight:800; font-size:15px}\n.pull .dh hr{flex:1; border:0; border-top:1px solid var(--line); margin:0; min-width:20px}\n.pull table{font-size:12.5px}\n.pull td{padding:3px 8px}\n.pull td.chk{width:22px; color:var(--line-strong); font-size:14px}\n@media print{ .pull td.chk{color:#000} }\n</style>\n\n<div class=\"wrap\">\n\n  <header class=\"top\">\n    <div class=\"brand\">\n      <div class=\"eyebrow\">Pull sheet, cases &amp; truck pack</div>\n      <h1>Pull Plot</h1>\n      <div class=\"sub\">Build the rig by position. It writes the pull sheet by department — fixtures, rigging, power, data,\n        expendables — puts everything in cases, and packs the truck.</div>\n    </div>\n    <div class=\"spacer\"></div>\n    <div class=\"setbar noprint\">\n      <div class=\"field\"><label for=\"truck\">Truck</label><select id=\"truck\"></select></div>\n      <div class=\"field\"><label for=\"feed\">Feeder run (ft)</label><input type=\"number\" id=\"feed\" min=\"10\" max=\"1000\" value=\"100\"></div>\n      <div class=\"field\"><label for=\"hoist\">Hoists</label>\n        <select id=\"hoist\"><option value=\"1t\">Lodestar 1 t</option><option value=\"half\">Lodestar ½ t</option></select></div>\n      <div class=\"field\"><label for=\"stack\">Stack</label>\n        <select id=\"stack\"><option value=\"2\">Two high</option><option value=\"3\">Three high</option><option value=\"1\">Floor only</option></select></div>\n      <div class=\"field\"><label for=\"shows\">Shows</label><input type=\"number\" id=\"shows\" min=\"1\" max=\"300\" value=\"12\"></div>\n    </div>\n  </header>\n\n  <section class=\"tiles\" id=\"tiles\"></section>\n  <div class=\"notes\" id=\"notes\"></div>\n\n  <!-- ===================== RIG ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Rig</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"rigcount\"></span>\n    </div>\n    <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n      <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end\">\n        <div class=\"field\" style=\"flex:1 1 200px;min-width:170px\"><label for=\"pick\">Add fixture</label>\n          <select id=\"pick\"></select></div>\n        <div class=\"field\"><label for=\"pickqty\">Qty</label>\n          <input type=\"number\" id=\"pickqty\" class=\"qty\" min=\"1\" max=\"999\" value=\"12\"></div>\n        <div class=\"field\"><label for=\"pickpos\">Position</label><select id=\"pickpos\"></select></div>\n        <button class=\"primary\" id=\"addbtn\">Add</button>\n      </div>\n      <div class=\"scroll\">\n        <table>\n          <thead><tr>\n            <th>Fixture</th><th class=\"num\">Qty</th><th>Position</th><th>Ships as</th>\n            <th class=\"num\">Cases</th><th class=\"num\">lb ea</th><th class=\"num\">Case lb</th><th class=\"noprint\"></th>\n          </tr></thead>\n          <tbody id=\"rigbody\"></tbody>\n        </table>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===================== POSITIONS ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Positions</h2><span class=\"spacer\"></span>\n      <button id=\"addpos\" class=\"noprint\">Add position</button>\n    </div>\n    <div class=\"body\">\n      <div class=\"scroll\">\n        <table>\n          <thead><tr>\n            <th>Position</th><th class=\"num\">Run ft</th><th>Truss</th><th class=\"num\">Length ft</th><th class=\"num\">Hoists</th>\n            <th class=\"num\">Fixt</th><th class=\"num\">Ckts</th><th class=\"num\">Looms</th><th class=\"num\">Univ</th><th class=\"noprint\"></th>\n          </tr></thead>\n          <tbody id=\"posbody\"></tbody>\n        </table>\n      </div>\n      <p style=\"font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5\">Run is distro/switch to position — it sets the Soca and Cat5e cuts.\n        Circuits are 20 A at 80 % on 208 V line-to-line for movers and 120 V for conventionals and atmospherics; universes hold 512 ch or 24 fixtures.</p>\n    </div>\n  </section>\n\n  <!-- ===================== TRUCK ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\"><h2>Truck pack</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"trucksum\"></span></div>\n    <div class=\"body\"><figure class=\"truck\" id=\"truckfig\"></figure><div class=\"legend\" id=\"legend\"></div></div>\n  </section>\n\n  <div class=\"cols\">\n    <!-- ===================== CASES ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Cases</h2><span class=\"spacer\"></span><span class=\"eyebrow mono\" id=\"casesum\"></span></div>\n      <div class=\"body\"><div class=\"scroll\"><table>\n        <thead><tr><th>Case</th><th class=\"num\">Qty</th><th>L × W × H</th><th class=\"num\">lb ea</th><th class=\"num\">Total</th><th>Dept</th></tr></thead>\n        <tbody id=\"casebody\"></tbody></table></div></div>\n    </section>\n\n    <!-- ===================== WEIGHT / SAVE ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Load &amp; saved rigs</h2></div>\n      <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div class=\"rows\" id=\"loadrows\"></div>\n        <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:11px\">\n          <div class=\"field\" style=\"flex:1 1 150px\"><label for=\"signame\">Save this rig as</label>\n            <input type=\"text\" id=\"signame\" placeholder=\"Arena A — main truss\"></div>\n          <button id=\"savebtn\">Save</button>\n        </div>\n        <div class=\"saved noprint\" id=\"saved\"></div>\n      </div>\n    </section>\n  </div>\n\n  <!-- ===================== PULL SHEET ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Pull sheet</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"pullsum\"></span>\n      <button id=\"csv\" class=\"noprint\">Export CSV</button>\n      <button id=\"printbtn\" class=\"noprint\">Print</button>\n    </div>\n    <div class=\"body pull\" id=\"pull\"></div>\n  </section>\n\n  <footer class=\"fine\">\n    <div><b>Read this before you send it to the shop.</b> Pull Plot writes the first draft of a pull sheet, not the last. Every shop\n    cases gear its own way, so the case library is a rental-house 24″-wide truck-pack family — Standard 48×24×26, Tall\n    Standard 48×24×37¾, half and quarter cases, distro racks, dollies — with fixtures-per-case as a well-known house ships them.\n    Swap the numbers for yours. Fixture, cable and hoist weights are published figures; case weights are that house's\n    published empties plus the contents.</div>\n    <div><b>What the numbers assume.</b> Circuits pack first-fit at 20 A × 80 % — line-to-line 208 V for movers and bars,\n    120 V for conventionals and atmospherics — six to a Soca, cut from 5/10/25/50/75/100/150 ft stock plus one\n    True1 jumper per fixture and a six-way break-out per loom. Universes pack in rig order at 512 channels or 24\n    fixtures per DMX line, one 25 ft node tail per universe and one 10 ft jumper per fixture, a four-port node per\n    four universes on a Cat5e drop. Truss cuts from 10/5/2 ft sections; a dolly carries twelve 12″ sticks or eight 20.5″.\n    Hoists case two to a box with 60 ft of chain. Cable goes in cable cases at about 650 lb apiece. The truck pack is\n    a shelf pack — cases turned 24″ across, four wide in a trailer — stacked to the stack setting and never taller than the\n    door; it's a cube estimate, not a load plan, and it ignores wheel wells, load bars and the fact that your driver\n    has opinions.</div>\n    <div><b>Expendables</b> follow a conventional touring list: one safety per fixture plus ten percent, gaff by fixture\n    count, haze fluid by hazer-shows, spare lamps at ten percent of conventionals. Nothing here is a code.</div>\n  </footer>\n</div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* ============================ REFERENCE DATA ============================ */\n/* va: published nominal draw · ch: touring-default DMX footprint · lb: published weight · ln: 120 V line-to-neutral load\n   cs: case key from CASES · per: fixtures per case (rental-house \"typically ships as\") */\nconst LIB = [\n  {c:\"Moving light\", b:\"Robe\",     n:\"BMFL Blade\",              va:2000, ch:49, lb:83.6, cs:\"tall\", per:2},\n  {c:\"Moving light\", b:\"Robe\",     n:\"MegaPointe\",              va:670,  ch:39, lb:48.5, cs:\"dual\", per:2},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Pointe\",                  va:470,  ch:24, lb:33.0, cs:\"quad\", per:4},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Spiider\",                 va:660,  ch:49, lb:29.2, cs:\"quad\", per:4},\n  {c:\"Moving light\", b:\"Robe\", data:\"Data\", ctl:\"Control\", exp:\"Expendables\"};\nconst DEPT_COL = {fx:\"s1\", rig:\"s2\", pwr:\"s3\", data:\"s4\", ctl:\"s5\", exp:\"s6\"};\n\n/* ============================== STATE ============================== */\nconst DEFAULT_POS = [\n  {id:\"p1\", name:\"Downstage truss\", dist:90,  truss:\"t20\", len:50, hoists:2},\n  {id:\"p2\", name:\"Mid truss\",       dist:110, truss:\"t20\", len:50, hoists:2},\n  {id:\"p3\", name:\"Upstage truss\",   dist:135, truss:\"t20\", len:60, hoists:3},\n  {id:\"p4\", name:\"Floor package\",   dist:60,  truss:\"none\", len:0, hoists:0},\n  {id:\"p5\", name:\"FOH truss\",       dist:200, truss:\"t12\", len:40, hoists:2}\n];\nconst DEFAULT_ROWS = [\n  {fid:\"L6\",  qty:12, pos:\"p1\"}, {fid:\"L0\",  qty:8,  pos:\"p1\"},\n  {fid:\"L1\",  qty:12, pos:\"p2\"}, {fid:\"L6\",  qty:12, pos:\"p2\"},\n  {fid:\"L18\", qty:16, pos:\"p3\"}, {fid:\"L19\", qty:8,  pos:\"p3\"},\n  {fid:\"L24\", qty:2,  pos:\"p4\"}, {fid:\"L20\", qty:10, pos:\"p4\"},\n  {fid:\"L21\", qty:30, pos:\"p5\"}\n];\nlet S = {\n  truck:\"t53\", feed:100, hoist:\"1t\", stack:2, shows:12,\n  positions: DEFAULT_POS.map(function(p){ return Object.assign({}, p); }),\n  rows: DEFAULT_ROWS.map(function(r){ return Object.assign({uid:uid()}, r); })\n};\nlet DB = null, DOWNLOADS = null, savedRigs = [];\n\nfunction uid(){ return \"r\" + Math.random().toString(36).slice(2,9); }\nfunction fx(id){ return LIB.find(function(f){ return f.id===id; }); }\nfunction pos(id){ return S.positions.find(function(p){ return p.id===id; }); }\nfunction truckModel(){ return TRUCKS.find(function(t){ return t.id===S.truck; }) || TRUCKS[0]; }\nfunction esc(s){ return String(s).replace(/[&<>\"]/g,function(c){ return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction rowInfo(r){\n  if(r.custom) return {name:r.custom.name, brand:\"Custom\", va:r.custom.va, ch:r.custom.ch, lb:r.custom.lb, cs:\"std\", per:r.custom.per||2, ln:false, key:\"custom:\"+r.custom.name};\n  const f = fx(r.fid);\n  return f ? {name:f.n, brand:f.b, va:f.va, ch:f.ch, lb:f.lb, cs:f.cs, per:f.per, ln:!!f.ln, haze:!!f.haze, key:f.id} : {name:\"(missing)\", brand:\"\", va:0, ch:0, lb:0, cs:\"std\", per:1, key:\"x\"};\n}\nfunction cutLengths(dist, stock){\n  const out = []; let left = dist, guard = 0;\n  while(left > 0 && guard++ < 20){\n    const fit = stock.find(function(L){ return L <= left; });\n    if(!fit){ out.push(stock[stock.length-1]); break; }\n    out.push(fit); left -= fit;\n  }\n  const total = out.reduce(function(t,x){ return t+x; }, 0);\n  if(total < dist) out.push(stock[stock.length-1]);\n  return out;\n}\nfunction cutLabel(arr){\n  const c = {}; arr.forEach(function(L){ c[L]=(c[L]||0)+1; });\n  return Object.keys(c).sort(function(a,b){ return b-a; }).map(function(L){ return (c[L]>1 ? c[L]+\"×\" : \"\") + L + \"′\"; }).join(\" + \");\n}\nfunction addTo(map, key, n){ map[key] = (map[key]||0) + n; }\n\n/* ============================== THE MATH ============================== */\nfunction compute(){\n  const truck = truckModel(), hoist = HOIST[S.hoist];\n  const cases = [];                           /* {key, dept, n, lbEach, label} */\n  const lines = {fx:[], rig:[], pwr:[], data:[], ctl:[], exp:[]};   /* pull sheet lines: {item, qty, unit, lb} */\n  const socaCuts = {}, catCuts = {};\n  let fixtures = 0, fixtureLb = 0, hoists = 0, hazers = 0, conventionals = 0, universes = 0, circuits = 0, looms = 0, nodes = 0;\n  let cableLb = 0, socaFt = 0;\n\n  /* ---- fixtures → cases ---- */\n  const byType = {};\n  S.rows.forEach(function(r){\n    const i = rowInfo(r);\n    const t = byType[i.key] || (byType[i.key] = {info:i, qty:0});\n    t.qty += r.qty; fixtures += r.qty; fixtureLb += i.lb*r.qty;\n    if(i.haze) hazers += r.qty;\n    if(i.ln && !i.haze) conventionals += r.qty;\n  });\n  Object.keys(byType).forEach(function(k){\n    const t = byType[k], i = t.info, cs = CASES[i.cs] || CASES.std, n = Math.ceil(t.qty/i.per);\n    lines.fx.push({item:i.brand+\" \"+i.name, qty:t.qty, unit:\"ea\", lb:i.lb*t.qty});\n    cases.push({key:i.cs, dept:\"fx\", n:n, lbEach:cs.lb + i.lb*Math.min(i.per, t.qty), label:i.name+\" · \"+i.per+\"-way\"});\n  });\n\n  /* ---- per position: power, data, rigging ---- */\n  const positions = S.positions.map(function(p){\n    const rows = S.rows.filter(function(r){ return r.pos===p.id; });\n    let units = [], ch = 0;\n    rows.forEach(function(r){ const i = rowInfo(r); for(let k=0;k<r.qty;k++){ units.push({a:i.va/(i.ln?VLN:VLL), ln:i.ln, ch:i.ch}); ch += i.ch; } });\n    /* circuits: first-fit decreasing, never mixing 120 V and 208 V on a circuit */\n    const bins = [];\n    units.slice().sort(function(a,b){ return b.a-a.a; }).forEach(function(u){\n      let b = bins.find(function(x){ return x.ln===u.ln && x.a + u.a <= CKT_CAP_A + 1e-9; });\n      if(!b){ b = {ln:u.ln, a:0}; bins.push(b); } b.a += u.a;\n    });\n    const ckts = bins.length, lm = Math.ceil(ckts/6);\n    /* universes: rig order, 512 ch or 24 fixtures */\n    let uni = 0, cur = 0, cnt = 0;\n    units.forEach(function(u){ if(cur===0 && cnt===0){ uni++; } if(cur + u.ch > UNI_CH || cnt >= LINE_CAP){ uni++; cur = 0; cnt = 0; } cur += u.ch; cnt++; });\n    const nd = Math.ceil(uni/NODE_PORTS);\n    circuits += ckts; looms += lm; universes += uni; nodes += nd;\n    if(lm){ const cut = cutLengths(p.dist, SOCA_STOCK); cut.forEach(function(L){ addTo(socaCuts, L, lm); }); socaFt += cut.reduce(function(t,x){return t+x;},0)*lm; }\n    if(nd){ const cut = cutLengths(p.dist, CAT_STOCK); cut.forEach(function(L){ addTo(catCuts, L, nd); }); }\n    /* rigging */\n    const tr = TRUSS[p.truss] || TRUSS.none;\n    let sections = [], dollies = 0;\n    if(tr.w && p.len > 0){ sections = cutLengths(p.len, tr.sec); dollies = Math.ceil(sections.length/tr.per); }\n    hoists += tr.w ? (p.hoists|0) : 0;\n    return {p:p, fixtures:units.length, ckts:ckts, looms:lm, uni:uni, nodes:nd, tr:tr, sections:sections, dollies:dollies, ch:ch};\n  });\n\n  /* ---- power lines ---- */\n  Object.keys(socaCuts).sort(function(a,b){ return b-a; }).forEach(function(L){\n    const n = socaCuts[L], lb = (L*SOCA_LBFT + SOCA_ENDS)*n; cableLb += lb;\n    lines.pwr.push({item:\"Socapex 12/14, \"+L+\"′\", qty:n, unit:\"ea\", lb:lb});\n  });\n  if(looms){ lines.pwr.push({item:\"Soca break-out, 6× True1\", qty:looms, unit:\"ea\", lb:looms*BREAKOUT_LB}); cableLb += looms*BREAKOUT_LB; }\n  if(fixtures){ const lb = fixtures*(JUMPER_FT*TRUE1_LBFT+TRUE1_ENDS); lines.pwr.push({item:\"True1 jumper, \"+JUMPER_FT+\"′\", qty:fixtures, unit:\"ea\", lb:lb}); cableLb += lb; }\n  const camCut = cutLengths(S.feed, CAM_STOCK);\n  camCut.forEach(function(L){ const lb = 5*L*CAM_LBFT; lines.pwr.push({item:\"Cam-Lok 4/0 feeder, \"+L+\"′ × 5\", qty:1, unit:\"set\", lb:lb}); cableLb += lb; });\n  lines.pwr.push({item:\"Distro, 400 A 3ø with Soca outs\", qty:1, unit:\"rack\", lb:400});\n  if(hoists) lines.pwr.push({item:\"Motor distro, 8-way\", qty:Math.ceil(hoists/8), unit:\"ea\", lb:45*Math.ceil(hoists/8)});\n  cases.push({key:\"distro\", dept:\"pwr\", n:1, lbEach:CASES.distro.lb+400, label:\"400 A distro\"});\n\n  /* ---- data lines ---- */\n  if(fixtures){ const lb = fixtures*(DMX_JUMPER_FT*DMX_LBFT+DMX_ENDS); lines.data.push({item:\"DMX 5-pin jumper, \"+DMX_JUMPER_FT+\"′\", qty:fixtures, unit:\"ea\", lb:lb}); cableLb += lb; }\n  if(universes){ const lb = universes*(TAIL_FT*DMX_LBFT+DMX_ENDS); lines.data.push({item:\"DMX 5-pin node tail, \"+TAIL_FT+\"′\", qty:universes, unit:\"ea\", lb:lb}); cableLb += lb;\n    lines.data.push({item:\"Terminator, 120 Ω\", qty:universes, unit:\"ea\", lb:universes*0.1}); }\n  Object.keys(catCuts).sort(function(a,b){ return b-a; }).forEach(function(L){\n    const n = catCuts[L], lb = L*CAT_LBFT*n + 0.2*n; cableLb += lb; lines.data.push({item:\"Cat5e etherCON, \"+L+\"′\", qty:n, unit:\"ea\", lb:lb}); });\n  if(nodes){ lines.data.push({item:\"4-port DMX node\", qty:nodes, unit:\"ea\", lb:nodes*4}); lines.data.push({item:\"Gigabit switch, PoE\", qty:1, unit:\"ea\", lb:12});\n    cases.push({key:\"noderk\", dept:\"data\", n:Math.ceil(nodes/6), lbEach:CASES.noderk.lb+Math.min(nodes,6)*4+12, label:\"nodes & switch\"}); }\n  lines.ctl.push({item:\"Console, grandMA3 full-size\", qty:1, unit:\"ea\", lb:100});\n  lines.ctl.push({item:\"Console monitor & UPS\", qty:1, unit:\"set\", lb:40});\n  cases.push({key:\"console\", dept:\"ctl\", n:1, lbEach:CASES.console.lb+140, label:\"grandMA3\"});\n\n  /* ---- rigging lines ---- */\n  let trussLb = 0;\n  positions.forEach(function(P){\n    if(!P.sections.length) return;\n    const lb = P.p.len*P.tr.w; trussLb += lb;\n    lines.rig.push({item:P.tr.n+\" truss — \"+P.p.name, qty:P.sections.length, unit:cutLabel(P.sections), lb:lb});\n    cases.push({key:P.tr.dolly, dept:\"rig\", n:P.dollies, lbEach:CASES[P.tr.dolly].lb + lb/P.dollies, label:P.p.name});\n  });\n  if(hoists){\n    const hl = hoist.lb + hoist.chain*CHAIN_FT + BAG_LB;\n    lines.rig.push({item:hoist.n+\" with \"+CHAIN_FT+\"′ chain & bag\", qty:hoists, unit:\"ea\", lb:hoists*hl});\n    lines.rig.push({item:\"Motor control cable, 8-way pendant\", qty:Math.ceil(hoists/8), unit:\"set\", lb:20*Math.ceil(hoists/8)});\n    lines.rig.push({item:\"Steel, 5′ GAC-flex\", qty:hoists, unit:\"ea\", lb:hoists*3.75});\n    lines.rig.push({item:\"Shackle, ⅝″\", qty:hoists*2, unit:\"ea\", lb:hoists*2*1.37});\n    cases.push({key:hoist.cs, dept:\"rig\", n:Math.ceil(hoists/2), lbEach:CASES[hoist.cs].lb + 2*hl, label:hoist.n});\n    cases.push({key:\"hw\", dept:\"rig\", n:1, lbEach:CASES.hw.lb + hoists*(3.75+2.74) + 20, label:\"steel & shackles\"});\n  }\n  lines.rig.push({item:\"Half-coupler\", qty:fixtures*2, unit:\"ea\", lb:fixtures*2*1.39});\n  lines.rig.push({item:\"Safety cable, 30″\", qty:Math.ceil(fixtures*1.1), unit:\"ea\", lb:fixtures*1.1*0.3});\n\n  /* ---- expendables ---- */\n  const gaff = 6 + Math.ceil(fixtures/20);\n  lines.exp.push({item:\"Gaff tape, 2″ black\", qty:gaff, unit:\"roll\", lb:gaff*1.2});\n    '<td class=\"num\">'+e.n+'</td><td class=\"mono\" style=\"font-size:12px;white-space:nowrap\">'+cs.L+' × '+cs.W+' × '+cs.H+'</td>'+\n      '<td class=\"num\">'+n0(e.c.lbEach)+'</td><td class=\"num\">'+n0(e.c.lbEach*e.n)+'</td><td style=\"font-size:12px;color:var(--ink-2)\">'+DEPT[e.c.dept]+'</td></tr>';\n  }).join(\"\") || '<tr><td colspan=\"6\" class=\"empty\">Cases appear once there is a rig.</td></tr>';\n\n  /* load rows */\n  const deptLb = {}; R.cases.forEach(function(c){ addTo(deptLb, c.dept, c.n*c.lbEach); });\n  $(\"loadrows\").innerHTML = Object.keys(DEPT).map(function(k){ return row(DEPT[k], n0(deptLb[k]||0)+\" lb\"); }).join(\"\")+\n    row(\"Gross on the truck\", n0(R.gross)+\" lb\", payPct>100?\"crit\":payPct>85?\"warn\":\"ok\")+\n    row(\"Per linear foot\", R.usedFt ? n0(R.gross/R.usedFt)+\" lb/ft\" : \"—\");\n\n  /* pull sheet */\n  const total = Object.keys(R.lines).reduce(function(t,k){ return t + R.lines[k].length; },0);\n  $(\"pullsum\").textContent = plural(total,\"line\")+\" · \"+plural(R.pieces,\"piece\");\n  $(\"pull\").innerHTML = Object.keys(DEPT).map(function(k){\n    const L = R.lines[k]; if(!L.length) return \"\";\n    const lb = L.reduce(function(t,l){ return t+l.lb; },0);\n    return '<div class=\"dh\"><span class=\"d\"><span class=\"dept\" style=\"background:var(--'+DEPT_COL[k]+')\"></span>'+DEPT[k]+'</span><hr>'+\n      '<span class=\"tag\">'+plural(L.length,\"line\")+(lb?' · '+n0(lb)+' lb':'')+'</span></div>'+\n      '<div class=\"scroll\"><table><thead><tr><th></th><th>Item</th><th class=\"num\">Qty</th><th>Unit</th><th class=\"num\">lb</th></tr></thead><tbody>'+\n      L.map(function(l){ return '<tr><td class=\"chk\">☐</td><td>'+esc(l.item)+'</td><td class=\"num\" style=\"font-weight:600\">'+n0(l.qty)+'</td><td style=\"color:var(--ink-2);font-size:12px\">'+esc(l.unit)+'</td><td class=\"num\">'+(l.lb?n0(l.lb):\"—\")+'</td></tr>'; }).join(\"\")+\n      '</tbody></table></div>';\n  }).join(\"\");\n\n  renderSaved();\n  window.__R = R;\n}\n\n/* ---------- the truck, top down, nose left ---------- */\nfunction renderTruck(R){\n  const T = R.truck, W = 920, padL = 44, padR = 16, top = 26, bot = 30;\n  const scale = (W-padL-padR)/T.L, bedH = T.W*scale, H = top + bedH + bot;\n  const sx = function(inches){ return padL + inches*scale; }, sy = function(inches){ return top + inches*scale; };\n  let svg = '<svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"Truck pack: '+R.pieces+' pieces in '+n1(R.usedFt)+' feet of a '+esc(T.n)+'\">';\n  svg += '<rect class=\"cab\" x=\"'+(padL-30)+'\" y=\"'+(top+bedH*0.15)+'\" width=\"24\" height=\"'+(bedH*0.7)+'\" rx=\"3\"></rect>';\n  svg += '<text class=\"ttl\" x=\"'+(padL-18)+'\" y=\"'+(top-8)+'\" text-anchor=\"middle\">NOSE</text>';\n  svg += '<rect class=\"bed\" x=\"'+sx(0)+'\" y=\"'+sy(0)+'\" width=\"'+(T.L*scale)+'\" height=\"'+bedH+'\"></rect>';\n  svg += '<text class=\"ttl\" x=\"'+sx(T.L)+'\" y=\"'+(top-8)+'\" text-anchor=\"end\">DOORS · '+Math.round(T.L/12)+'′ × '+T.W+'″ × '+T.H+'″</text>';\n  R.rows.forEach(function(r){\n    r.items.forEach(function(st){\n      const x0 = sx(r.x), y0 = sy(st.y), w = st.deep*scale, h = st.across*scale;\n      if(r.x >= T.L) return;\n      svg += '<rect class=\"cs\" x=\"'+x0+'\" y=\"'+y0+'\" width=\"'+Math.min(w, sx(T.L)-x0)+'\" height=\"'+h+'\" fill=\"var(--'+DEPT_COL[st.c.dept]+')\" opacity=\"'+(0.55+0.45*Math.min(1,st.m/3)).toFixed(2)+'\">'+\n        '<title>'+esc(st.m+\"× \"+st.cs.n+\" — \"+st.c.label+\" · \"+n0(st.lb)+\" lb\")+'</title></rect>';\n      if(w > 22 && h > 12) svg += '<text class=\"lbl\" x=\"'+(x0+w/2)+'\" y=\"'+(y0+h/2+3)+'\" text-anchor=\"middle\">'+(st.m>1?st.m+\"×\":\"\")+'</text>';\n    });\n  });\n  if(R.usedIn < T.L){\n    svg += '<rect class=\"unused\" x=\"'+sx(R.usedIn)+'\" y=\"'+sy(0)+'\" width=\"'+((T.L-R.usedIn)*scale)+'\" height=\"'+bedH+'\"></rect>';\n    svg += '<text class=\"sm\" x=\"'+((sx(R.usedIn)+sx(T.L))/2)+'\" y=\"'+(top+bedH/2+3)+'\" text-anchor=\"middle\">'+n1((T.L-R.usedIn) e(); }); else localWrite();\n  localWrite(); renderSaved();\n}\nfunction localWrite(){ try{ localStorage.setItem(\"pull-plot-rigs\", JSON.stringify(savedRigs)); }catch(e){} }\nfunction removeRig(key){ savedRigs = savedRigs.filter(function(x){ return x.key!==key; }); if(DB) DB.doc(\"rigs/\"+key).delete().catch(function(){}); localWrite(); renderSaved(); }\nfunction renderSaved(){\n  const el = $(\"saved\");\n  if(!savedRigs.length){ el.innerHTML = '<span style=\"font-size:12px;color:var(--ink-3)\">No saved rigs yet — save one and it comes back next time you open this.</span>'; return; }\n  el.innerHTML = savedRigs.slice().sort(function(a,b){ return b.saved-a.saved; }).map(function(r){\n    return '<span class=\"chip\"><span class=\"load-b\" data-load=\"'+esc(r.key)+'\" role=\"button\" tabindex=\"0\">'+esc(r.name)+'</span><button data-del=\"'+esc(r.key)+'\" aria-label=\"Delete '+esc(r.name)+'\">✕</button></span>'; }).join(\"\");\n}\ndocument.addEventListener(\"click\", function(e){\n  const l = e.target.closest(\"[data-load]\"); if(l){ const r = savedRigs.find(function(x){ return x.key===l.getAttribute(\"data-load\"); }); if(r) applySnapshot(r.data); return; }\n  const d = e.target.closest(\"[data-del]\"); if(d) removeRig(d.getAttribute(\"data-del\"));\n});\ndocument.addEventListener(\"keydown\", function(e){ if(e.key!==\"Enter\" && e.key!==\" \") return; const l = e.target.closest && e.target.closest(\"[data-load]\"); if(!l) return; e.preventDefault(); l.click(); });\n\n/* ============================== BOOT ============================== */\nfillPicker(); fillPositions(); fillTrucks(); bind();\ntry{ const raw = localStorage.getItem(\"pull-plot-rigs\"); if(raw) savedRigs = JSON.parse(raw)||[]; } catch(e){ savedRigs = []; }\nrender();\nif(window.claude && typeof window.claude.use === \"function\"){\n  window.claude.use(\"downloads\").then(function(d){ DOWNLOADS = d; }).catch(function(){});\n  window.claude.use(\"db\").then(function(db){\n    if(!db) return; DB = db;\n ground:var(--surface)}\ntable{border-collapse:collapse;width:100%;font-size:12.5px}\nth{text-align:left;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);\n  font-weight:700;padding:8px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);\n  position:sticky;top:0;white-space:nowrap}\ntd{padding:6px 10px;border-bottom:1px solid var(--line)}\ntbody tr:last-child td{border-bottom:0}\ntbody tr:hover{background:var(--surface-2)}\ntd.num,th.num{text-align:right;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-variant-numeric:tabular-nums}\n.muted{color:var(--ink-3)}\n.chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600}\n.chip.warn{background:var(--warn-soft);color:var(--warn)}\n.qty{width:64px;text-align:right}\n.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}\n.empty .big{font-family:\"Archivo\",sans-serif;font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}\n.trucks{display:flex;flex-direction:column;gap:16px}\n.truck{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px}\n.truckhead{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}\n.truckhead b{font-family:\"Archivo\",sans-serif;font-size:14px}\n.truckhead .m{font-size:11.5px;color:var(--ink-3)}\nsvg{display:block;width:100%;height:auto}\n.legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;font-size:11px;color:var(--ink-3)}\n.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}\n@media print{\n  .bar{display:none} main{overflow:visible;padding:0}\n  .truck{break-inside:avoid;page-break-inside:avoid;box-shadow:none;margin-bottom:12px}\n  body{overflow:visible;background:#fff}\n}\n</style></head><body>\n<script>\n/* ── KTM tool shim ────────────────────────────────────────────────────────\n   Injected into each tool immediately after <body>, ahead of the tool's code.\n\n   Why tools run in frames: the four ported tools were written independently\n   as standalone artifacts and share 22 top-level function names between them\n   — render, compute, save, esc, uid, exportCSV, snapshot, applySnapshot and\n   more. Merged into one global scope they would clobber each other. A\n   same-origin srcdoc frame gives each its own window, so they port unmodified\n   and keep working exactly as they were verified.\n\n   Frames have no capabilities of their own, so the shim hands each tool the\n   Hub's. Same origin, so these are direct calls into the parent realm — no\n   postMessage, no serialization.                                           */\n(function () {\n  var TOOL   = \"truck\";\n  var LEGACY = false;          // ported tool, or written for the Hub\n  var host   = window.parent;\n\n  /* ── Shared data layer ────────────────────────────────────────────────\n     Every tool written for the Hub uses this. It reaches the real\n     collections — fixtures, gear, shows — with no namespacing, because\n     that shared library is the entire point of the suite.                */\n  window.KTM = host && host.KTM ? host.KTM : null;\n\n  /* ── Legacy namespacing ───────────────────────────────────────────────\n     The four ported tools each save rigs at \"rigs/{key}\". In four separate\n     stores that was fine; in one shared store they overwrite each other.\n     So for those tools only, every path gets namespaced under tools/<tool>/.\n\n     The prefix is TWO segments on purpose. Document paths must have an even\n     number of segments and collections an odd number, so a one-segment\n     prefix would flip every path's parity and throw:\n       rigs      (1, collection) -> tools/distro/rigs      (3, collection)\n       rigs/foo  (2, document)   -> tools/distro/rigs/foo  (4, document)\n\n     New tools are NOT namespaced — they read and write the shared schema\n     directly, which is why this is gated on LEGACY rather than applied to\n     everything.                                                           */\n  function ns(p) { return \"tools/\" + TOOL + \"/\" + p; }\n\n  function wrapDb(db) {\n    return {\n      doc:        function (p) { return db.doc(ns(p)); },\n      collection: function (p) { return db.collection(ns(p)); }\n    };\n  }\n\n  window.claude = {\n    use: function (name) {\n      if (!host || !host.claude || !host.claude.use) return Promise.resolve(null);\n      return Promise.resolve(host.claude.use(name)).then(function (api) {\n        if (!api) return null;\n        return (LEGACY && name === \"db\") ? wrapDb(api) : api;\n      }).catch(function () { return null; });\n    }\n  };\n\n  /* The Hub owns the theme; it calls this on every frame when you toggle. */\n  window.__ktmTheme = function (t) {\n    var r = document.documentElement;\n    if (t) r.setAttribute(\"data-theme\", t); else r.removeAttribute(\"data-theme\");\n  };\n})();\n<\/script>\n\n\n<div class=\"bar\">\n  <h1>Truck&nbsp;Plot</h1>\n  <div class=\"seg\" id=\"tabs\"></div>\n  <div class=\"grow\"></div>\n  <label class=\"muted\" style=\"font-size:11.5px\">Payload cap\n    <input type=\"number\" id=\"cap\" class=\"mono\" style=\"width:88px\" step=\"500\"> lb</label>\n  <button class=\"btn ghost sm\" id=\"csvbtn\">CSV</button>\n  <button class=\"btn ghost sm\" id=\"printbtn\">Print</button>\n  <button class=\"btn sm\" id=\"savebtn\">Save plan</button>\n</div>\n<main><div class=\"wrap\" id=\"root\"></div></main>\n\n<script>\n/* ═══════════════════════════════════════════════════════════════════════\n   Truck Plot — the planning half of Truck Packer.\n\n   Geometry and the placer are transplanted from Truck Packer's\n   src/data/constants.js and src/main.jsx, where they ran a real show:\n   a 53 x 8.5 ft flat deck on a 2-inch snap grid, first-fit placement,\n   AABB collision. Those are pure functions with no React or Firestore in\n   them, so they port verbatim.\n\n   What is new here is the half Truck Packer never had: WEIGHT and CUBE.\n   That app tracks neither, while the Christie Lites weights-and-dimensions\n   sheet sat unread in its own repo root. That sheet is now gear/cases, and\n   it is what lets this tool answer the question Truck Packer cannot —\n   how many trucks, and what does each one weigh.\n   ═══════════════════════════════════════════════════════════════════════ */\n\nconst TW_FT   = 53;      // trailer interior length, nose -> doors\nconst TH_FT   = 8.5;     // trailer interior width\nconst SNAP_FT = 1/6;     // 2-inch grid\nconst EPS     = 0.001;\n\n/* Default payload cap. Deliberately an INPUT, not an asserted constant:\n   legal payload varies by tractor, trailer, axle configuration and state,\n   and this project's standard is that an unsourced figure is never\n   presented as fact. Treat the default as a placeholder and set your\n   carrier's number. */\nconst DEFAULT_CAP_LB = 44000;\n\nconst $  = id => document.getElementById(id);\nconst esc = s => String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst n2 = v => Math.round(v*100)/100;\nconst fmt = v => (v==null || isNaN(v)) ? '—' : Number(v).toLocaleString(undefined,{maximumFractionDigits:0});\n\nconst S = {\n  tab: 'list', catalog: [], list: {}, query: '', capLb: DEFAULT_CAP_LB,\n  show: null, packed: null, loaded: false, dirty: false\n};\n\n/* ── catalog ──────────────────────────────────────────────────────────\n   Two sources, deliberately kept distinguishable:\n   - gear/cases       114 types with real weight AND outside dimensions,\n                      so footprint comes straight from W x L inches.\n   - gear/pack-items   41 trailer footprints in feet with NO weight —\n                      truss lengths, carts, straps. Flagged, never guessed. */\nasync function loadCatalog(){\n  const K = window.KTM;\n  if (!K){ S.loaded = true; return; }\n  const gear = await K.list('gear');\n  const out = [];\n\n  /* Selected by KIND, never by document id. Case catalogs are shop-specific —\n     what a \"Quarter Standard\" is and what it weighs is Christie Lites' own\n     convention — so there will be more than one, and a hardcoded id would\n     quietly ignore every shop but the first. */\n  gear.filter(g => g.kind === 'case').forEach(cat => {\n    (cat.items || []).forEach(c => {\n      const w = c.wIn ? c.wIn/12 : null, d = c.lIn ? c.lIn/12 : null;\n      if (!w || !d) return;                     // 2 of 114 carry no dims\n      out.push({ key:cat.id+':'+c.name, name:c.name, group:c.caseType || 'Case',\n                 shop:cat.shopName || null, wFt:n2(w), dFt:n2(d),\n                 lb:c.weightLb ?? null, cubeFt:c.cubeFt ?? null, src:'cases' });\n    });\n  });\n\n  gear.filter(g => g.kind === 'pack-item').forEach(cat => {\n    (cat.items || []).forEach(p => {\n      out.push({ key:cat.id+':'+p.name, name:p.name, group:p.cat || 'Pack item',\n                 shop:cat.shopName || null, wFt:p.wFt, dFt:p.hFt,\n                 lb:null, cubeFt:null, src:'pack' });\n    });\n  });\n\n  S.catalog = out.sort((a,b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name));\n  S.show = K.activeShow ? K.activeShow() : null;\n  S.loaded = true;\n}\n\nasync function loadPlan(){\n  const K = window.KTM;\n  if (!K || !S.show) return;\n  try {\n    const doc = await K.get(K.P.subDoc(S.show, 'trucks', 'plan'));\n    if (doc){\n      S.list = doc.list || {};\n      if (doc.capLb) S.capLb = doc.capLb;\n    }\n  } catch(e){}\n}\n\nasync function savePlan(){\n  const K = window.KTM;\n  if (!K) return alert('No store available.');\n  if (!S.show) return alert('Pick a show in the Hub first — a load plan belongs to a show.');\n  const btn = $('savebtn'); btn.disabled = true; btn.textContent = 'Saving…';\n  try {\n    await K.set(K.P.subDoc(S.show, 'trucks', 'plan'), {\n      list: S.list, capLb: S.capLb,\n      summary: summarise(), packedAt: new Date().toISOString()\n    });\n    S.dirty = false; btn.textContent = 'Saved';\n    setTimeout(()=>{ btn.textContent='Save plan'; btn.disabled=false; }, 1400);\n  } catch(e){\n    btn.textContent = 'Save plan'; btn.disabled = false;\n    alert('Could not save: ' + e.message);\n  }\n}\n\n/* ── placement, from Truck Packer ─────────────────────────────────────\n   overlapsRect and the first-fit scan are that app's own logic. It is a\n   first-fit placer, not an optimiser: it walks x from the nose and y\n   across at snap resolution and takes the first cell the item fits. Good\n   enough to plan against, and it is what actually packed the show. */\nfunction overlapsRect(ax,ay,aw,ad, bx,by,bw,bd){\n  return ax < bx+bw-EPS && ax+aw > bx+EPS && ay < by+bd-EPS && ay+ad > by+EPS;\n}\n\nfunction findPos(w,d, placed){\n  for (let x=0; x+w <= TW_FT+EPS; x += SNAP_FT){\n    for (let y=0; y+d <= TH_FT+EPS; y += SNAP_FT){\n      let clear = true;\n      for (const p of placed){\n        if (overlapsRect(x,y,w,d, p.x,p.y,p.w,p.d)){ clear = false; break; }\n      }\n      if (clear) return {x:n2(x), y:n2(y)};\n    }\n  }\n  return null;\n}\n\n/* Orient so the long side runs nose-to-doors, unless that is wider than\n   the trailer. Truck Packer's apOrientItem, same idea. */\nfunction orient(it){\n  let w = it.wFt, d = it.dFt;\n  if (d > w && d <= TH_FT) { /* already fine */ }\n  if (w > TH_FT && d <= TH_FT) return {w, d};\n  if (d > TH_FT && w <= TH_FT) return {w:d, d:w};\n  return (w >= d) ? {w, d} : {w:d, d:w};\n}\n\nfunction expand(){\n  const rows = [];\n  Object.entries(S.list).forEach(([key, qty]) => {\n    const it = S.catalog.find(c => c.key === key);\n    if (!it) return;\n    for (let i=0;i<qty;i++) rows.push(it);\n  });\n  // Biggest footprint first: first-fit does much better on a descending sort.\n  return rows.sort((a,b) => (b.wFt*b.dFt) - (a.wFt*a.dFt));\n}\n\nfunction pack(){\n  const items = expand();\n  const trucks = [];\n  for (const it of items){\n    const {w,d} = orient(it);\n    let placed = false;\n    for (const t of trucks){\n      if (it.lb != null && t.lb + it.lb > S.capLb) continue;   // weight-capped\n      const pos = findPos(w, d, t.items);\n      if (pos){\n        t.items.push({...pos, w, d, ref:it});\n        t.lb += (it.lb || 0);\n        t.cube += (it.cubeFt || 0);\n        t.unknownLb += (it.lb == null ? 1 : 0);\n        placed = true; break;\n      }\n    }\n    if (!placed){\n      const t = {items:[], lb:0, cube:0, unknownLb:0};\n      const pos = findPos(w, d, t.items);\n      if (!pos){ trucks.push({oversize:it, items:[], lb:0, cube:0, unknownLb:0}); continue; }\n      t.items.push({...pos, w, d, ref:it});\n      t.lb = it.lb || 0; t.cube = it.cubeFt || 0; t.unknownLb = it.lb == null ? 1 : 0;\n      trucks.push(t);\n    }\n  }\n  return trucks;\n}\n\nfunction summarise(){\n  const items = expand();\n  const known = items.filter(i => i.lb != null);\n  const lb    = known.reduce((a,i)=>a+i.lb, 0);\n  const cube  = items.reduce((a,i)=>a+(i.cubeFt||0), 0);\n  const area  = items.reduce((a,i)=>a+(i.wFt*i.dFt), 0);\n  return { pieces: items.length, lb, cube: n2(cube), area: n2(area),\n           unknownLb: items.length - known.length,\n           deckFt: n2(area / TH_FT) };\n}\n\n/* ── colour by group, stable ──────────────────────────────────────────── */\nconst PALETTE = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8','--s0'];\nconst groupColor = g => {\n  let h = 0; for (let i=0;i<g.length;i++) h = (h*31 + g.charCodeAt(i)) >>> 0;\n  return 'var(' + PALETTE[h % PALETTE.length] + ')';\n};\n\n/* ═══════════════════════════════ views ═══════════════════════════════ */\nfunction render(){\n  $('tabs').innerHTML = [['list','Load list'],['pack','Pack'],['summary','Summary']]\n    .map(([k,l]) => '<button data-tab=\"'+k+'\"'+(S.tab===k?' class=\"on\"':'')+'>'+l+'</button>').join('');\n  $('tabs').querySelectorAll('[data-tab]').forEach(b =>\n    b.onclick = () => { S.tab = b.dataset.tab; render(); });\n  $('cap').value = S.capLb;\n\n  const r = $('root');\n  if (!S.loaded){ r.innerHTML = '<div class=\"empty\"><div class=\"big\">Loading catalog…</div></div>'; return; }\n  if (!window.KTM){\n    r.innerHTML = '<div class=\"note crit\"><b>No shared data layer.</b> Truck Plot reads the case '\n      + 'and pack catalogs from the Hub. Open it from inside the KTM Hub rather than on its own.</div>';\n    return;\n  }\n  if (!S.catalog.length){\n    r.innerHTML = '<div class=\"empty\"><div class=\"big\">Gear library is empty</div>'\n      + '<div>Seed the case and pack catalogs in the Hub’s Gear library first.</div></div>';\n    return;\n  }\n  if (S.tab === 'list')    return void (r.innerHTML = viewList(), wireList());\n  if (S.tab === 'pack')    return void (r.innerHTML = viewPack());\n  if (S.tab === 'summary') return void (r.innerHTML = viewSummary());\n}\n\nfunction viewList(){\n  const s = summarise();\n  const rows = S.catalog.filter(c => !S.query ||\n    (c.name + ' ' + c.group + ' ' + (c.shop||'')).toLowerCase().includes(S.query.toLowerCase()));\n\n  let h = '';\n  if (!S.show) h += '<div class=\"note warn\"><b>No show selected.</b> You can plan freely, but '\n    + 'saving a load plan needs a show — pick one at the top of the Hub.</div>';\n\n  h += '<div class=\"stats\">'\n     + st('Pieces', fmt(s.pieces))\n     + st('Weight', fmt(s.lb) + '<small> lb</small>', s.unknownLb ? 'flag' : '')\n     + st('Cube', fmt(s.cube) + '<small> ft³</small>')\n     + st('Deck used', s.deckFt + '<small> ft of 53</small>')\n     + '</div>';\n\n  if (s.unknownLb)\n    h += '<div class=\"note warn\" style=\"margin-top:12px\"><b>' + s.unknownLb + ' piece'\n       + (s.unknownLb===1?'':'s') + ' with no weight on record.</b> Everything from the pack-footprint '\n       + 'catalog (truss lengths, carts, straps) has a trailer footprint but no weight — Truck Packer '\n       + 'never tracked weight, so there is nothing to import. Those pieces are packed by size and '\n       + 'excluded from every weight total rather than being guessed at.</div>';\n\n  h += '<div class=\"bar\" style=\"background:none;border:0;padding:12px 0;gap:9px\">'\n     + '<input type=\"text\" id=\"q\" placeholder=\"Search the catalog…\" value=\"'+esc(S.query)+'\" style=\"width:260px\">'\n     + '<div class=\"grow\"></div>'\n     + '<button class=\"btn ghost sm\" id=\"clearbtn\">Clear list</button></div>';\n\n  h += '<div class=\"tablewrap\"><table><thead><tr>'\n     + '<th>Item</th><th>Group</th><th class=\"num\">W ft</th><th class=\"num\">D ft</th>'\n     + '<th class=\"num\">lb</th><th class=\"num\">ft³</th><th class=\"num\" style=\"width:96px\">Qty</th>'\n     + '</tr></thead><tbody>'\n     + rows.map(c => {\n        const q = S.list[c.key] || 0;\n        return '<tr'+(q?' style=\"background:var(--sel)\"':'')+'>'\n        + '<td>'+esc(c.name)+(c.lb==null?' <span class=\"chip warn\">no weight</span>':'')+'</td>'\n        + '<td class=\"muted\">'+esc(c.group)\n        + (c.shop ? ' <span class=\"muted\" style=\"font-size:10px\">· '+esc(c.shop)+'</span>' : '')+'</td>'\n        + '<td class=\"num\">'+c.wFt+'</td><td class=\"num\">'+c.dFt+'</td>'\n        + '<td class=\"num\">'+(c.lb ?? '—')+'</td><td class=\"num\">'+(c.cubeFt ?? '—')+'</td>'\n        + '<td class=\"num\"><input type=\"number\" class=\"qty mono\" min=\"0\" step=\"1\" value=\"'+q+'\" '\n        + 'data-key=\"'+esc(c.key)+'\"></td></tr>';\n       }).join('')\n     + '</tbody></table></div>';\n  return h;\n}\n\nfunction wireList(){\n  const q = $('q');\n  if (q) q.oninput = () => { S.query = q.value; const r=$('root');\n    r.innerHTML = viewList(); wireList();\n    const nq=$('q'); if(nq){ nq.focus(); nq.setSelectionRange(nq.value.length,nq.value.length); } };\n  document.querySelectorAll('[data-key]').forEach(inp => inp.onchange = () => {\n    const v = Math.max(0, parseInt(inp.value||'0', 10) || 0);\n    if (v) S.list[inp.dataset.key] = v; else delete S.list[inp.dataset.key];\n    S.dirty = true; S.packed = null;\n    const r=$('root'); r.innerHTML = viewList(); wireList();\n  });\n  const c = $('clearbtn');\n  if (c) c.onclick = () => { if (!confirm('Clear the whole load list?')) return;\n    S.list = {}; S.packed = null; S.dirty = true; render(); };\n}\n\nfunction viewPack(){\n  const s = summarise();\n  if (!s.pieces) return '<div class=\"empty\"><div class=\"big\">Nothing on the list</div>'\n    + '<div>Add gear on the Load list tab.</div></div>';\n\n  const trucks = S.packed = pack();\n  const over = trucks.filter(t => t.oversize);\n\n  let h = '<div class=\"stats\">'\n    + st('Trucks', trucks.length)\n    + st('Pieces', fmt(s.pieces))\n    + st('Total weight', fmt(s.lb) + '<small> lb</small>')\n    + st('Payload cap', fmt(S.capLb) + '<small> lb each</small>')\n    + '</div>';\n\n  h += '<div class=\"note\"><b>First-fit, biggest piece first.</b> This is Truck Packer’s own placer '\n     + '— it walks the deck from the nose at 2-inch resolution and takes the first cell a piece fits. '\n     + 'It is not an optimiser, so treat the truck count as a solid estimate to plan and quote '\n     + 'against, not as the final pack. A piece with no weight on record is placed by size and left '\n     + 'out of the weight running total.</div>';\n\n  if (over.length)\n    h += '<div class=\"note crit\"><b>' + over.length + ' piece' + (over.length===1?'':'s')\n       + ' will not fit a 53 × 8.5 ft deck in any orientation:</b> '\n       + over.map(t => esc(t.oversize.name)).join(', ')\n       + '. Check the dimensions on those records.</div>';\n\n  h += '<div class=\"trucks\">' + trucks.filter(t => !t.oversize).map((t, i) => {\n    const groups = [...new Set(t.items.map(p => p.ref.group))];\n    const usedFt = Math.max(0, ...t.items.map(p => p.x + p.w));\n    return '<div class=\"truck\">'\n      + '<div class=\"truckhead\"><b>Truck ' + (i+1) + '</b>'\n      + '<span class=\"m\">' + t.items.length + ' pieces</span>'\n      + '<span class=\"m mono\">' + fmt(t.lb) + ' lb'\n        + (t.unknownLb ? ' + ' + t.unknownLb + ' unweighed' : '') + '</span>'\n      + '<span class=\"m mono\">' + fmt(t.cube) + ' ft³</span>'\n      + '<span class=\"m mono\">' + n2(usedFt) + ' ft of deck used</span>'\n      + (t.lb > S.capLb*0.95 ? '<span class=\"chip warn\">near payload cap</span>' : '')\n      + '</div>'\n      + trailerSVG(t)\n      + '<div class=\"legend\">' + groups.map(g =>\n          '<span><i style=\"background:'+groupColor(g)+'\"></i>'+esc(g)+'</span>').join('')\n      + '</div></div>';\n  }).join('') + '</div>';\n  return h;\n}\n\n/* Deck plan, to scale. Nose at left, doors at right. */\nfunction trailerSVG(t){\n  const PX = 17;                       // px per foot\n  const W = TW_FT*PX, H = TH_FT*PX, PAD = 16;\n  let s = '<svg viewBox=\"0 0 '+(W+PAD*2)+' '+(H+PAD*2+14)+'\" role=\"img\" '\n        + 'aria-label=\"Trailer deck plan, '+t.items.length+' pieces\">';\n  s += '<rect x=\"'+PAD+'\" y=\"'+PAD+'\" width=\"'+W+'\" height=\"'+H+'\" fill=\"var(--sunken)\" '\n     + 'stroke=\"var(--line-strong)\" stroke-width=\"1.5\" rx=\"3\"/>';\n  for (let f=5; f<TW_FT; f+=5){\n    s += '<line x1=\"'+(PAD+f*PX)+'\" y1=\"'+PAD+'\" x2=\"'+(PAD+f*PX)+'\" y2=\"'+(PAD+H)\n       + '\" stroke=\"var(--line)\" stroke-width=\"0.5\"/>'\n       + '<text x=\"'+(PAD+f*PX)+'\" y=\"'+(PAD+H+11)+'\" font-size=\"8\" fill=\"var(--ink-3)\" '\n       + 'text-anchor=\"middle\" font-family=\"IBM Plex Mono,monospace\">'+f+'</text>';\n  }\n  t.items.forEach(p => {\n    const x = PAD+p.x*PX, y = PAD+p.y*PX, w = p.w*PX, d = p.d*PX;\n    const label = p.ref.name.replace(/^Case /,'');\n    s += '<g><rect x=\"'+x+'\" y=\"'+y+'\" width=\"'+w+'\" height=\"'+d+'\" fill=\"'+groupColor(p.ref.group)\n       + '\" fill-opacity=\"0.82\" stroke=\"var(--surface)\" stroke-width=\"1\" rx=\"1.5\"/>';\n    if (w > 26 && d > 13)\n      s += '<text x=\"'+(x+w/2)+'\" y=\"'+(y+d/2+3)+'\" font-size=\"7.5\" fill=\"#fff\" '\n         + 'text-anchor=\"middle\" font-family=\"IBM Plex Sans,sans-serif\">'\n         + esc(label.length>16 ? label.slice(0,15)+'…' : label) + '</text>';\n    s += '<title>'+esc(p.ref.name)+' — '+p.w+' × '+p.d+' ft'\n       + (p.ref.lb!=null ? ', '+p.ref.lb+' lb' : ', weight unknown')+'</title></g>';\n  });\n  s += '<text x=\"'+PAD+'\" y=\"'+(PAD-5)+'\" font-size=\"8\" fill=\"var(--ink-3)\" '\n     + 'font-family=\"IBM Plex Mono,monospace\">NOSE</text>';\n  s += '<text x=\"'+(PAD+W)+'\" y=\"'+(PAD-5)+'\" font-size=\"8\" fill=\"var(--ink-3)\" '\n     + 'text-anchor=\"end\" font-family=\"IBM Plex Mono,monospace\">DOORS</text>';\n  return s + '</svg>';\n}\n\nfunction viewSummary(){\n  const s = summarise();\n  const trucks = S.packed || pack();\n  const real = trucks.filter(t => !t.oversize);\n  if (!s.pieces) return '<div class=\"empty\"><div class=\"big\">Nothing on the list</div></div>';\n\n  const byGroup = {};\n  expand().forEach(i => {\n    const g = byGroup[i.group] = byGroup[i.group] || {n:0, lb:0, cube:0, unknown:0};\n    g.n++; g.lb += (i.lb||0); g.cube += (i.cubeFt||0); if (i.lb==null) g.unknown++;\n  });\n\n  let h = '<div class=\"stats\">'\n    + st('Trucks', real.length)\n    + st('Pieces', fmt(s.pieces))\n    + st('Weight', fmt(s.lb)+'<small> lb</small>')\n    + st('Cube', fmt(s.cube)+'<small> ft³</small>')\n    + st('Deck', s.deckFt+'<small> ft</small>')\n    + '</div>';\n\n  h += '<h3>By group</h3><div class=\"tablewrap\"><table><thead><tr>'\n     + '<th>Group</th><th class=\"num\">Pieces</th><th class=\"num\">Weight lb</th>'\n     + '<th class=\"num\">Cube ft³</th><th class=\"num\">Unweighed</th></tr></thead><tbody>'\n     + Object.entries(byGroup).sort((a,b)=>b[1].lb-a[1].lb).map(([g,v]) =>\n        '<tr><td><i style=\"display:inline-block;width:9px;height:9px;border-radius:2px;'\n        + 'background:'+groupColor(g)+';margin-right:6px\"></i>'+esc(g)+'</td>'\n        + '<td class=\"num\">'+v.n+'</td><td class=\"num\">'+fmt(v.lb)+'</td>'\n        + '<td class=\"num\">'+fmt(n2(v.cube))+'</td>'\n        + '<td class=\"num\">'+(v.unknown||'—')+'</td></tr>').join('')\n     + '</tbody></table></div>';\n\n  h += '<h3>Per truck</h3><div class=\"tablewrap\"><table><thead><tr>'\n     + '<th>Truck</th><th class=\"num\">Pieces</th><th class=\"num\">Weight lb</th>'\n     + '<th class=\"num\">Cube ft³</th><th class=\"num\">Deck ft</th><th class=\"num\">% of cap</th>'\n     + '</tr></thead><tbody>'\n     + real.map((t,i) => {\n        const used = Math.max(0, ...t.items.map(p=>p.x+p.w));\n        const pct  = Math.round(t.lb / S.capLb * 100);\n        return '<tr><td>Truck '+(i+1)+'</td><td class=\"num\">'+t.items.length+'</td>'\n        + '<td class=\"num\">'+fmt(t.lb)+(t.unknownLb?' <span class=\"chip warn\">+'+t.unknownLb+'</span>':'')+'</td>'\n        + '<td class=\"num\">'+fmt(n2(t.cube))+'</td><td class=\"num\">'+n2(used)+'</td>'\n        + '<td class=\"num\">'+pct+'%</td></tr>';\n       }).join('')\n     + '</tbody></table></div>';\n  return h;\n}\n\nconst st = (k,v,cls) => '<div class=\"stat'+(cls?' '+cls:'')+'\"><div class=\"k\">'+esc(k)\n  + '</div><div class=\"v\">'+v+'</div></div>';\n\n/* ── exports ──────────────────────────────────────────────────────────── */\nfunction toCSV(){\n  const trucks = S.packed || pack();\n  const rows = [['Truck','Item','Group','W_ft','D_ft','X_ft','Y_ft','Weight_lb','Cube_ft3']];\n  trucks.filter(t=>!t.oversize).forEach((t,i) => t.items.forEach(p =>\n    rows.push([i+1, p.ref.name, p.ref.group, p.w, p.d, p.x, p.y,\n               p.ref.lb ?? '', p.ref.cubeFt ?? ''])));\n  return rows.map(r => r.map(v => {\n    const s = String(v ?? '');\n    return /[\",\\n]/.test(s) ? '\"'+s.replace(/\"/g,'\"\"')+'\"' : s;\n  }).join(',')).join('\\n');\n}\n\nasync function downloadCSV(){\n  const csv = toCSV();\n  const name = ((S.show || 'load-plan') + '-truck-plot.csv').replace(/[^\\w.-]+/g,'-');\n  try {\n    const dl = await claude.use('downloads');\n    if (dl){ await dl.save({filename:name, data:csv}); return; }\n  } catch(e){}\n  try { await navigator.clipboard.writeText(csv); alert('CSV copied to the clipboard.'); }\n  catch(e){ alert('Could not export: ' + e.message); }\n}\n\n/* ── boot ─────────────────────────────────────────────────────────────── */\n$('cap').onchange = () => { S.capLb = Math.max(1000, parseInt($('cap').value,10) || DEFAULT_CAP_LB);\n  S.packed = null; render(); };\n$('csvbtn').onclick   = downloadCSV;\n$('printbtn').onclick = () => { if (S.tab!=='pack'){ S.tab='pack'; render(); } setTimeout(()=>window.print(), 120); };\n$('savebtn').onclick  = savePlan;\n\n(async () => {\n  render();\n  await loadCatalog();\n  await loadPlan();\n  render();\n})();\n<\/script>\n</body></html>\n", "rack": "<!doctype html><html><head><meta charset=\"utf8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Rack Plot</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n<style>\n:root{\n  --ground:#E3E5E0; --surface:#F8F8F6; --surface-2:#EBEDE8; --sunken:#DDDFD9;\n  --line:#C8CBC3; --line-strong:#A6AAA0;\n  --ink:#15181B; --ink-2:#4C5257; --ink-3:#5C636A;\n  --accent:#1C7566; --accent-soft:#D3E5E0; --on-accent:#FFFFFF;\n  --warn:#A56A12; --warn-soft:#F0E2C6;\n  --crit:#A93A28; --crit-soft:#F2D9D3;\n  --s1:#2A5CA0; --s2:#D0611E; --s3:#1E8F7A; --s4:#A0662A; --s5:#8B4FBF;\n  --s6:#7F8C1E; --s7:#C43A5E; --s8:#2F8FBF; --s0:#71787F;\n  --shadow:0 1px 2px rgba(20,25,30,.10), 0 6px 18px -10px rgba(20,25,30,.22);\n  --sel:#D3E5E0;\n  --rail:#B9BDB5; --rail-2:#A2A79E;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;\n  --line:#2B3136; --line-strong:#404850;\n  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;\n  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;\n  --w
