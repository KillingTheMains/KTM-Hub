<title>KTM Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E3E5E0; --surface:#F8F8F6; --surface-2:#EBEDE8; --sunken:#DDDFD9;
  --line:#C8CBC3; --line-strong:#A6AAA0;
  --ink:#15181B; --ink-2:#4C5257; --ink-3:#5C636A;
  --accent:#1C7566; --accent-soft:#D3E5E0; --on-accent:#FFFFFF;
  --warn:#A56A12; --warn-soft:#F0E2C6;
  --crit:#A93A28; --crit-soft:#F2D9D3;
  --s1:#2A5CA0; --s2:#D0611E; --s3:#1E8F7A; --s4:#A0662A; --s5:#8B4FBF; --s6:#7F8C1E; --s7:#C43A5E; --s8:#2F8FBF; --s0:#71787F;
  --shadow:0 1px 2px rgba(20,25,30,.10), 0 6px 18px -10px rgba(20,25,30,.22);
  --sel:#D3E5E0;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;
  --line:#2B3136; --line-strong:#404850;
  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;
  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;
  --warn:#D9A341; --warn-soft:#382C13;
  --crit:#E2705F; --crit-soft:#3A1E19;
  --s1:#4F86DA; --s2:#D9743C; --s3:#2FA88E; --s4:#B98546; --s5:#A47ADF; --s6:#889A2E; --s7:#D95C7E; --s8:#38A2C8; --s0:#6E777F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);
  --sel:#173630;
}}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;
  --line:#2B3136; --line-strong:#404850;
  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;
  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;
  --warn:#D9A341; --warn-soft:#382C13; --crit:#E2705F; --crit-soft:#3A1E19;
  --s1:#4F86DA; --s2:#D9743C; --s3:#2FA88E; --s4:#B98546; --s5:#A47ADF; --s6:#889A2E; --s7:#D95C7E; --s8:#38A2C8; --s0:#6E777F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);
  --sel:#173630;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--ink)}
option{color:var(--ink);background:var(--surface)}
table,.card,.modal,.note,.stat,.empty{color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

/* ── top bar ───────────────────────────────────────────────────────── */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:"Archivo",sans-serif;font-weight:800;font-stretch:112%;letter-spacing:.13em;
  font-size:13px;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
.showsel{display:flex;align-items:center;gap:8px;min-width:0}
.showsel select{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:5px 9px;max-width:280px;font-size:13px;font-weight:500}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--crit-soft);color:var(--crit)}
.pill.warnp{background:var(--warn-soft);color:var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.iconbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 9px;
  cursor:pointer;color:var(--ink-2);font-size:12px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ── layout ────────────────────────────────────────────────────────── */
.shell{flex:1;display:flex;min-height:0}
.rail{flex:0 0 208px;background:var(--surface);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:18px}
.railgrp>h4{margin:0 0 7px 8px;font-size:10px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;border-radius:7px;padding:7px 9px;cursor:pointer;color:var(--ink-2);font-size:13px}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--sel);color:var(--ink);font-weight:600}
.navitem.soon{opacity:.42;cursor:default}
.navitem.soon:hover{background:none;color:var(--ink-2)}
.navitem .sq{width:9px;height:9px;border-radius:2.5px;flex:0 0 auto}
.tag{margin-left:auto;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
main{flex:1;overflow-y:auto;padding:22px 26px 60px;position:relative}
main.toolmode{padding:0;overflow:hidden}
main.toolmode .wrap{display:none}
#frames{display:none;position:absolute;inset:0}
main.toolmode #frames{display:block}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--ground)}
#frames iframe.on{display:block}
.framewait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:22px;margin:0 0 3px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 20px}
h3{font-family:"Archivo",sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);margin:26px 0 10px}

/* ── surfaces ──────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:15px 17px;box-shadow:var(--shadow)}
.cards{display:grid;gap:11px}
.row{display:flex;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:11px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:"Archivo",sans-serif;font-size:25px;font-weight:700;line-height:1.15;margin-top:2px}
.stat .v small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}

/* ── buttons + inputs ──────────────────────────────────────────────── */
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);filter:none}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}
.btn.danger:hover{background:var(--crit-soft);filter:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}

/* ── table ─────────────────────────────────────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:9px 11px;background:var(--surface-2);border-bottom:1px solid var(--line);
  position:sticky;top:0;white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;
  letter-spacing:.03em;white-space:nowrap}
.chip.verified{background:var(--accent-soft);color:var(--accent)}
.chip.interpreted{background:var(--warn-soft);color:var(--warn)}
.chip.conflicting{background:var(--crit-soft);color:var(--crit)}
.chip.observed{background:var(--sunken);color:var(--ink-3)}
.muted{color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.filters input[type=text]{width:230px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sel);color:var(--ink);font-weight:600}

/* ── notices ───────────────────────────────────────────────────────── */
.note{border-radius:10px;padding:12px 15px;font-size:13px;border:1px solid var(--line);
  background:var(--surface);margin-bottom:16px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.crit{background:var(--crit-soft);border-color:transparent;color:var(--ink)}
.note b{font-weight:700}
.empty{text-align:center;padding:46px 20px;color:var(--ink-3)}
.empty .big{font-family:"Archivo",sans-serif;font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:5px}

/* ── modal ─────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.5);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px 22px}
.modal h2{font-family:"Archivo",sans-serif;font-size:17px;margin:0 0 14px}
.modalfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.stack{display:flex;flex-direction:column;gap:11px}

@media(max-width:820px){
  .rail{flex-basis:64px;padding:12px 6px}
  .railgrp>h4,.navitem span.lbl,.tag{display:none}
  .navitem{justify-content:center;padding:9px 0}
  main{padding:18px 14px 50px}
  .grid2,.grid3{grid-template-columns:1fr}
  .brand{font-size:11px}
}
</style>

<header class="topbar">
  <div class="brand">KTM&nbsp;<span>Hub</span></div>
  <div class="showsel">
    <select id="showsel" title="Active show"></select>
  </div>
  <div class="grow"></div>
  <span class="pill" id="dbpill"><span class="dot"></span><span id="dbtxt">connecting</span></span>
  <button class="iconbtn" id="themebtn" title="Toggle theme">◐</button>
</header>

<div class="shell">
  <nav class="rail" id="rail"></nav>
  <main id="pane">
    <div class="wrap" id="main"></div>
    <div id="frames"></div>
  </main>
</div>

<div id="modalroot"></div>

<script>
const TOOLSRC = {"distro": "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1\"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>\n<script>\n/* ── KTM tool shim ────────────────────────────────────────────────────────\n   Injected into each tool immediately after <body>, ahead of the tool's code.\n\n   Why tools run in frames: the four ported tools were written independently\n   as standalone artifacts and share 22 top-level function names between them\n   — render, compute, save, esc, uid, exportCSV, snapshot, applySnapshot and\n   more. Merged into one global scope they would clobber each other. A\n   same-origin srcdoc frame gives each its own window, so they port unmodified\n   and keep working exactly as they were verified.\n\n   Frames have no capabilities of their own, so the shim hands each tool the\n   Hub's. Same origin, so these are direct calls into the parent realm — no\n   postMessage, no serialization.                                           */\n(function () {\n  var TOOL   = \"distro\";\n  var LEGACY = true;          // ported tool, or written for the Hub\n  var host   = window.parent;\n\n  /* ── Shared data layer ────────────────────────────────────────────────\n     Every tool written for the Hub uses this. It reaches the real\n     collections — fixtures, gear, shows — with no namespacing, because\n     that shared library is the entire point of the suite.                */\n  window.KTM = host && host.KTM ? host.KTM : null;\n\n  /* ── Legacy namespacing ───────────────────────────────────────────────\n     The four ported tools each save rigs at \"rigs/{key}\". In four separate\n     stores that was fine; in one shared store they overwrite each other.\n     So for those tools only, every path gets namespaced under tools/<tool>/.\n\n     The prefix is TWO segments on purpose. Document paths must have an even\n     number of segments and collections an odd number, so a one-segment\n     prefix would flip every path's parity and throw:\n       rigs      (1, collection) -> tools/distro/rigs      (3, collection)\n       rigs/foo  (2, document)   -> tools/distro/rigs/foo  (4, document)\n\n     New tools are NOT namespaced — they read and write the shared schema\n     directly, which is why this is gated on LEGACY rather than applied to\n     everything.                                                           */\n  function ns(p) { return \"tools/\" + TOOL + \"/\" + p; }\n\n  function wrapDb(db) {\n    return {\n      doc:        function (p) { return db.doc(ns(p)); },\n      collection: function (p) { return db.collection(ns(p)); }\n    };\n  }\n\n  window.claude = {\n    use: function (name) {\n      if (!host || !host.claude || !host.claude.use) return Promise.resolve(null);\n      return Promise.resolve(host.claude.use(name)).then(function (api) {\n        if (!api) return null;\n        return (LEGACY && name === \"db\") ? wrapDb(api) : api;\n      }).catch(function () { return null; });\n    }\n  };\n\n  /* The Hub owns the theme; it calls this on every frame when you toggle. */\n  window.__ktmTheme = function (t) {\n    var r = document.documentElement;\n    if (t) r.setAttribute(\"data-theme\", t); else r.removeAttribute(\"data-theme\");\n  };\n})();\n<\/script>\n\n<title>Distro Plot</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n<style>\n:root{\n  --ground:#E3E5E0; --surface:#F8F8F6; --surface-2:#EBEDE8; --sunken:#DDDFD9;\n  --line:#C8CBC3; --line-strong:#A ia-pressed=\"false\">Group by fixture</button>\n        </div>\n      </div>\n      <div class=\"body\">\n        <div class=\"phases\" id=\"phases\"></div>\n        <div class=\"neutral\" id=\"neutral\"></div>\n        <div class=\"legend\" id=\"legend\"></div>\n      </div>\n    </section>\n\n    <!-- ===================== POSITIONS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\">\n        <h2>Positions</h2><span class=\"spacer\"></span>\n        <button id=\"addpos\" class=\"noprint\">Add position</button>\n      </div>\n      <div class=\"body\">\n        <div class=\"scroll\">\n          <table>\n            <thead><tr>\n              <th>Position</th><th class=\"num\">Run ft</th><th class=\"num\">kVA</th>\n              <th class=\"num\">Ckts</th><th class=\"num\">Looms</th><th class=\"num\">Drop @ fixture</th><th class=\"noprint\"></th>\n            </tr></thead>\n            <tbody id=\"posbody\"></tbody>\n          </table>\n        </div>\n        <p style=\"font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5\">\n          Run length is distro to position — the Soca run, not the feeder. Drop at fixture is the feeder\n          drop plus the branch drop on the position's worst circuit.</p>\n      </div>\n    </section>\n  </div>\n\n  <!-- ===================== RISER ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\"><h2>One-line riser</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"risersum\"></span></div>\n    <div class=\"body\"><figure class=\"riser\" id=\"riser\"></figure></div>\n  </section>\n\n  <!-- ===================== CIRCUITS ===================== -->\n  <section class=\"panel\">\n    <div class=\"head\">\n      <h2>Circuit schedule</h2><span class=\"spacer\"></span>\n      <span class=\"eyebrow mono\" id=\"cktsum\"></span>\n      <button id=\"csv\" class=\"noprint\">Export CSV</button>\n      <button id=\"printbtn\" class=\"noprint\">Print</button>\n    </div>\n    <div class=\"body\" id=\"circuits\"></div>\n  </section>\n\n  <div class=\"duo\">\n    <!-- ===================== FEEDER ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Feeder run</h2></div>\n      <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end\">\n          <div class=\"field\"><label for=\"len\">Run length (ft)</label><input type=\"number\" id=\"len\" min=\"1\" max=\"2000\" value=\"100\"></div>\n          <div class=\"field\"><label for=\"awg\">Conductor</label><select id=\"awg\"></select></div>\n          <div class=\"field\"><label for=\"mat\">Material</label>\n            <select id=\"mat\"><option value=\"cu\">Copper</option><option value=\"al\">Aluminum</option></select></div>\n          <div class=\"field\"><label for=\"sets\">Sets</label><input type=\"number\" id=\"sets\" min=\"1\" max=\"6\" value=\"1\"></div>\n        </div>\n        <div class=\"rows\" id=\"feedrows\"></div>\n      </div>\n    </section>\n\n    <!-- ===================== SERVICE ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Service &amp; generator</h2></div>\n      <div class=\"body\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div class=\"rows\" id=\"genrows\"></div>\n        <div class=\"noprint\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:11px\">\n          <div class=\"field\" style=\"flex:1 1 150px\"><label for=\"signame\">Save this rig as</label>\n            <input type=\"text\" id=\"signame\" placeholder=\"Arena A — main truss\"></div>\n          <button id=\"savebtn\">Save</button>\n        </div>\n        <div class=\"saved noprint\" id=\"saved\"></div>\n      </div>\n    </section>\n  </div>\n\n  <div class=\"duo\">\n    <!-- ===================== CHAIN LIMITS ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>How many per circuit</h2><span class=\"spacer\"></span>\n        <span class=\"eyebrow mono\" id=\"chainrule\"></span></div>\n      <div class=\"body\">\n        <div class=\"scroll\"><table>\n          <thead><tr><th>Fixture</th><th class=\"num\">VA</th>\n            <th class=\"num\" id=\"chA\"></th><th class=\"num\" id=\"chB\"></th></tr></thead>\n          <tbody id=\"chainbody\"></tbody>\n        </table></div>\n      </div>\n    </section>\n\n    <!-- ===================== PACK LIST ===================== -->\n    <section class=\"panel\">\n      <div class=\"head\"><h2>Pack list</h2><span class=\"spacer\"></span>\n        <span class=\"eyebrow mono\" id=\"packweight\"></span></div>\n      <div class=\"body\"><div class=\"rows\" id=\"packrows\"></div></div>\n    </section>\n  </div>\n\n  <footer class=\"fine\">\n    <div><b>Read this before you pull cable.</b> Distro Plot is a planning aid, not a design document, and it is not\n    a substitute for a licensed electrician or the AHJ. Fixture draws are published nominal maximums — a fixture in a\n    hot room, at low line voltage, or running a pixel-mapped chase can pull more.</div>\n    <div><b>What the numbers assume.</b> Ampacity follows NEC 310.16 (75 °C column). Voltage drop uses the K-factor\n    approximation — K&nbsp;=&nbsp;12.9&nbsp;Cu / 21.2&nbsp;Al, VD&nbsp;=&nbsp;K·I·L·multiplier&nbsp;÷&nbsp;circular mils,\n    ×2 for a two-wire branch and ×√3 for a three-phase feeder — which ignores conductor temperature, power factor\n    angle and raceway effects. The 3 % branch / 5 % combined drop figures are NEC Informational Notes\n    (210.19(A) IN No. 4, 215.2(A)(1) IN No. 2), non-enforceable under 90.5(C) — but some AHJs adopt them locally, and\n    110.3(B) makes a fixture's own minimum-voltage spec enforceable regardless.</div>\n    <div><b>Neutral current</b> is the fundamental-only unbalance of line-to-neutral loads,\n    Iₙ&nbsp;=&nbsp;√(Iₐ²+I_b²+I_c²−IₐI_b−I_bI_c−I_cIₐ). Line-to-line loads have no neutral connection and are excluded.\n    This ignores triplen harmonics, which on non-linear LED loads add arithmetically in the shared neutral rather than\n    cancelling. Portable cable falls under NEC Article 400, not 310.16. Motor inrush of 3–6× is not modelled.</div>\n  </footer>\n</div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* ============================ REFERENCE DATA ============================ */\n/* Fixture figures are published nominal maximum apparent power (VA) at nominal line voltage. */\nconst LIB = [\n  {c:\"Moving light\", b:\"Robe\",     n:\"BMFL Blade\",               va:2000},\n  {c:\"Moving light\", b:\"Robe\",     n:\"MegaPointe\",               va:670},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Pointe\",                   va:470},\n  {c:\"Moving light\", b:\"Robe\",     n:\"Spiider\",                  va:660},\n  {c:\"Moving light\", b:\"Robe\",     n:\"T1 Profile\",               va:650},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Aura XB\",              va:400},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Aura PXL\",             va:500},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Viper Profile\",        va:1225},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Ultra Performance\",    va:1450},\n  {c:\"Moving light\", b:\"Martin\",   n:\"MAC Encore Performance\",   va:600},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Sharpy\",                   va:440},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Mythos 2\",                 va:700},\n  {c:\"Moving light\", b:\"Claypaky\", n:\"Scenius Unico\",            va:1800},\n  {c:\"Moving light\", b:\"Ayrton\",   n:\"Khamsin-S\",                va:1150},\n  {c:\"Moving light\", b:\"Ayrton\",   n:\"Diablo-S\",                 va:550},\n  {c:\"Moving light\", b:\"Elation\",  n:\"Proteus Maximus\",          va:1400},\n  {c:\"Moving light\", b:\"Chauvet\",  n:\"Rogue R2 Wash\",            va:339},\n  {c:\"Moving light\", b:\"Chauvet\",  n:\"Maverick Force S Profile\", va:563},\n  {c:\"Wash / bar / strobe\", b:\"GLP\", n:\"impression X4 Bar 20\",   va:400},\n  {c:\"Wash / bar / strobe\", b:\"GLP\", n:\"JDC1\",                   va:1200},\n  {c:\"Wash / bar / strobe\", b:\"SGM\", n:\"Q-7\",                    va:465},\n  {c:\"Conventional\", b:\"ETC\", n:\"Source Four LED S3 Lustr\",      va:307},\n  {c:\"Conventional\", b:\"ETC\", n:\"ColorSource PAR\",               va:90},\n  {c:\"Conventional\", b:\"ETC\", n:\"Source Four 750 W\",             va:750},\n  {c:\"Atmospherics\", b:\"MDG\",    n:\"theONE hazer\",               va:1480},\n  {c:\"Atmospherics\", b:\"Look\",   n:\"Viper NT fogger\",            va:1300},\n  {c:\"Atmospherics\", b:\"Martin\", n:\"JEM ZR45 fogger\",            va:1800},\n  {c:\"Control & rigging\", b:\"MA Lighting\", n:\"grandMA3 full-size\", va:300},\n  {c:\"Control & rigging\", b:\"CM\", n:\"Lodestar 1-ton hoist\",      va:1450, motor:true, mode:\"3ph\"}\n];\nLIB.forEach(function(f,i){ f.id = \"L\"+i; });\n\nconst AMPACITY_CU = {\"14\":20,\"12\":25,\"10\":35,\"8\":50,\"6\":65,\"4\":85,\"3\":100,\"2\":115,\"1\":130,\n  \"1/0\":150,\"2/0\":175,\"3/0\":200,\"4/0\":230,\"250\":255,\"350\":310,\"500\":380};\nconst AMPACITY_AL = {\"14\":0,\"12\":20,\"10\":30,\"8\":40,\"6\":50,\"4\":65,\"3\":75,\"2\":90,\"1\":100,\n  \"1/0\":120,\"2/0\":135,\"3/0\":155,\"4/0\":180,\"250\":205,\"350\":250,\"500\":310};\nconst CMIL = {\"14\":4110,\"12\":6530,\"10\":10380,\"8\":16510,\"6\":26240,\"4\":41740,\"3\":52620,\"2\":66360,\"1\":83690,\n  \"1/0\":105600,\"2/0\":133100,\"3/0\":167800,\"4/0\":211600,\"250\":250000,\"350\":350000,\"500\":500000};\n/* Single-conductor Type W / SC portable cable, lb per foot */\nconst LBFT = {\"6\":0.192,\"4\":0.263,\"2\":0.367,\"1\":0.459,\"1/0\":0.536,\"2/0\":0.641,\"3/0\":0.760,\n  \"4/0\":0.934,\"250\":1.073,\"350\":1.513,\"500\":2.083};\nconst SOCA_LBFT = {\"14\":0.40,\"12\":0.55,\"10\":0.75};\nconst GAUGES = [\"6\",\"4\",\"2\",\"1\",\"1/0\",\"2/0\",\"3/0\",\"4/0\",\"250\",\"350\",\"500\"];\nconst SOCA_LEN = [150,100,75,50,25,10,5];\nconst CAM_LEN  = [100,50,25,10,5];\nconst K = {cu:12.9, al:21.2};\nconst SERVICES = [100,200,400,600,800,1200];\nconst GENSETS  = [25,45,60,100,125,150,200,250,300,400,500,600];\nconst BRK_WIRE = {\"15\":\"14\",\"20\":\"12\",\"30\":\"10\"};   /* branch breaker -> Soca conductor */\nconst SQRT3 = Math.sqrt(3);\nconst SYS = {\n  \"208\": {vll:208, vln:120, label:\"208Y/120\", wires:[\"Black\",\"Red\",\"Blue\"]},\n  \"480\": {vll:480, vln:277, label:\"480Y/277\", wires:[\"Brown\",\"Orange\",\"Yellow\"]}\n};\nconst PH = [\"A\",\"B\",\"C\"];\n\n/* ============================== STATE ============================== */\nconst DEFAULT_POS = [\n  {id:\"p1\", name:\"Downstage truss\", dist:90},\n  {id:\"p2\", name:\"Mid truss\",       dist:110},\n  {id:\"p3\", name:\"Upstage truss\",   dist:135},\n  {id:\"p4\", name:\"Floor package\",   dist:60},\n  {id:\"p5\", name:\"FOH\",             dist:200}\n];\nconst DEFAULT_ROWS = [\n  {fid:\"L6\",  qty:12, mode:\"ll\", pos:\"p1\"},   // MAC Aura PXL\n  {fid:\"L0\",  qty:8,  mode:\"ll\", pos:\"p1\"},   // BMFL Blade\n  {fid:\"L1\",  qty:12, mode:\"ll\", pos:\"p2\"},   // MegaPointe\n  {fid:\"L6\",  qty:12, mode:\"ll\", pos:\"p2\"},   // MAC Aura PXL\n  {fid:\"L18\", qty:16, mode:\"ll\", pos:\"p3\"},   // X4 Bar 20\n  {fid:\"L19\", qty:8,  mode:\"ll\", pos:\"p3\"},   // JDC1\n  {fid:\"L24\", qty:2,  mode:\"ln\", pos:\"p4\"},   // theONE hazer\n  {fid:\"L20\", qty:10, mode:\"ln\", pos:\"p4\"},   // SGM Q-7\n  {fid:\"L21\", qty:12, mode:\"ln\", pos:\"p5\"},   // S4 LED S3\n  {fid:\"L27\", qty:1,  mode:\"ln\", pos:\"p5\"}    // grandMA3\n];\nlet S = {\n  sys:\"208\", brk:20, cont:true, group:false,\n  len:100, awg:\"4/0\", mat:\"cu\", sets:1,\n  positions: DEFAULT_POS.map(function(p){ return Object.assign({}, p); }),\n  rows: DEFAULT_ROWS.map(function(r){ return Object.assign({uid:uid()}, r); })\n};\nlet DB = null, DOWNLOADS = null, savedRigs = [];\n\nfunction uid(){ return \"r\" + Math.random().toString(36).slice(2,9); }\nfunction fx(id){ return LIB.find(function(f){ return f.id===id; }); }\nfunction pos(id){ return S.positions.find(function(p){ return p.id===id; }); }\nfunction esc(s){ return String(s).replace(/[&<>\"]/g,function(c){\n  return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]; }); }\nfunction rowInfo(r){\n  if(r.custom) return {name:r.custom.name, brand:\"Custom\", va:r.custom.va, motor:false};\n  const f = fx(r.fid);\n  return f ? {name:f.n, brand:f.b, va:f.va, motor:!!f.motor} : {name:\"(missing)\", brand:\"\", va:0, motor:false};\n}\nfunction modes(){\n  const s = SYS[S.sys];\n  return [{v:\"ln\", t:s.vln+\" V (1 leg)\"},{v:\"ll\", t:s.vll+\" V (2 legs)\"},{v:\"3ph\", t:s.vll+\" V 3ø (3 legs)\"}];\n}\nfunction legAmps(va, mode){\n  const s = SYS[S.sys];\n  if(mode===\"ln\")  return va / s.vln;\n  if(mode===\"3ph\") return va / (SQRT3 * s.vll);\n  return va / s.vll;\n}\nfunction cktCap(){ return S.cont ? S.brk * 0.8 : S.brk; }\nfunction socaAwg(){ return BRK_WIRE[String(S.brk)] || \"12\"; }\n/* greedy fill from stock lengths to cover a run */\nfunction cutLengths(dist, stock){\n  const out = []; let left = dist, guard = 0;\n  while(left > 0 && guard++ < 12){\n    const fit = stock.find(function(L){ return L <= left; });\n    if(!fit){ out.push(stock[stock.length-1]); break; }\n    out.push(fit); left -= fit;\n  }\n  const total = out.reduce(function(t,x){ return t+x; }, 0);\n  if(total < dist) out.push(stock[stock.length-1]);\n  return out;\n}\nfunction cutLabel(arr){\n  const c = {}; arr.forEach(function(L){ c[L]=(c[L]||0)+1; });\n  return Object.keys(c).sort(function(a,b){ return b-a; })\n    .map(function(L){ return (c[L]>1 ? c[L]+\"×\" : \"\") + L + \"′\"; }).join(\" + \");\n}\n\n/* ============================== THE MATH ============================== */\nfunction compute(){\n  const legs   = {A:0,B:0,C:0};      // every conductor\n  const legsLN = {A:0,B:0,C:0};      // line-to-neutral only — this is what returns on the neutral\n  const s = SYS[S.sys];\n  const cap = cktCap();\n  const sAwg = socaAwg();\n\n  // Build units, grouped by position so a position's load stays on its own looms.\n  const byPos = {};\n  S.positions.forEach(function(p){ byPos[p.id] = []; });\n  S.rows.forEach(function(r){\n    const info = rowInfo(r);\n    const a = legAmps(info.va, r.mode);\n    const bucket = byPos[r.pos] || (byPos[r.pos] = []);\n    for(let i=0;i<r.qty;i++) bucket.push({row:r, name:info.name, va:info.va, mode:r.mode, a:a});\n  });\n\n  const posOrder = {}; S.rows.forEach(function(r,i){ if(!(r.uid in posOrder)) posOrder[r.uid]=i; });\n  const positions = [], allCircuits = [], allMotors = [];\n  let cktNum = 0;\n\n  S.positions.forEach(function(p){\n    const units = (byPos[p.id]||[]).slice();\n    if(S.group) units.sort(function(x,y){ return (posOrder[x.row.uid]-posOrder[y.row.uid]) || (y.a-x.a); });\n    else        units.sort(function(x,y){ return y.a - x.a; });\n\n    // Assign each unit to the globally least-loaded leg (or leg pair). Working position by\n    // position keeps each Soca internally balanced as well as the service overall.\n    const assigned = [];\n    units.forEach(function(u){\n      let conn;\n      if(u.mode===\"3ph\") conn = [\"A\",\"B\",\"C\"];\n      else {\n        const sorted = PH.slice().sort(function(a,b){ return legs[a]-legs[b]; });\n        conn = u.mode===\"ln\" ? [sorted[0]] : [sorted[0],sorted[1]].sort();\n      }\n      conn.forEach(function(ph){ legs[ph] += u.a; if(u.mode===\"ln\") legsLN[ph] += u.a; });\n      assigned.push(Object.assign({conn:conn, key:conn.join(\"-\")}, u));\n    });\n\n    // First-fit-decreasing into branch circuits, never mixing leg pairs on one circuit.\n    const byKey = {};\n    assigned.forEach(function(u){\n      if(u.mode===\"3ph\"){ allMotors.push(Object.assign({posName:p.name}, u)); return; }\n      (byKey[u.key] = byKey[u.key] || []).push(u);\n    });\n    const circuits = [];\n    Object.keys(byKey).sort().forEach(function(key){\n      const bins = [];\n      byKey[key].slice().sort(function(x,y){ return y.a-x.a; }).forEach(function(u){\n        let bin = bins.find(function(b){ return b.a + u.a <= cap + 1e-9; });\n        if(!bin){ bin = {conn:u.conn, mode:u.mode, a:0, items:{}, pid:p.id, posName:p.name}; bins.push(bin); }\n        bin.a += u.a; bin.items[u.name] = (bin.items[u.name]||0) + 1;\n      });\n      bins.forEach(function(b){ circuits.push(b); });\n    });\n    circuits.sort(function(x,y){ return x.conn.join(\"\").localeCompare(y.conn.join(\"\")) || y.a-x.a; });\n\n    // Branch voltage drop over the Soca run — two-wire, so the ×2 multiplier either way.\n    circuits.forEach(function(c){\n      c.num = ++cktNum;\n      c.vd  = 2 * K.cu * c.a * p.dist / CMIL[sAwg];\n      c.vdPct = c.vd / (c.mode===\"ln\" ? s.vln : s.vll) * 100;\n      allCircuits.push(c);\n    });\n\n    const kva = units.reduce(function(t,u){ return t + u.va; }, 0) / 1000;\n    const worst = circuits.reduce(function(m,c){ return c.vdPct > m ? c.vdPct : m; }, 0);\n    positions.push({p:p, circuits:circuits, looms:Math.ceil(circuits.length/6), kva:kva,\n      units:units.length, worstBranchPct:worst});\n  });\n\n  const maxLeg = Math.max(legs.A, legs.B, legs.C);\n  const minLeg = Math.min(legs.A, legs.B, legs.C);\n  const avgLeg = (legs.A+legs.B+legs.C)/3;\n  const imbalance = avgLeg > 0 ? (maxLeg-minLeg)/avgLeg*100 : 0;\n  const a1=legsLN.A, b1=legsLN.B, c1=legsLN.C;\n  const neutral = Math.sqrt(Math.max(0, a1*a1 + b1*b1 + c1*c1 - a1*b1 - b1*c1 - c1*a1));\n  const kva = SQRT3 * s.vll * avgLeg / 1000;\n  const totalVA = S.rows.reduce(function(t,r){ return t + rowInfo(r).va*r.qty; }, 0);\n\n  const cm = CMIL[S.awg] * S.sets;\n  const vd = SQRT3 * K[S.mat] * maxLeg * S.len / cm;\n  const vdPct = vd / s.vll * 100;\n  const amp1 = (S.mat===\"cu\" ? AMPACITY_CU : AMPACITY_AL)[S.awg] * S.sets;\n\n  let minAwg = null;\n  for(let i=0;i<GAUGES.length;i++){\n    const g = GAUGES[i];\n    const d = SQRT3 * K[S.mat] * maxLeg * S.len / (CMIL[g]*S.sets) / s.vll * 100;\n    const amp = (S.mat===\"cu\"?AMPACITY_CU:AMPACITY_AL)[g] * S.sets;\n    if(d <= 3 && amp >= maxLeg){ minAwg = g; break; }\n  }\n  positions.forEach(function(P){ P.totalPct = vdPct + P.worstBranchPct; });\n  const worstTotal = positions.reduce(function(m,P){ return P.totalPct > m.pct ?\n    {pct:P.totalPct, name:P.p.name} : m; }, {pct:vdPct, name:\"feeder only\"});\n\n  const contDemand = maxLeg * 1.25;\n  const service = SERVICES.find(function(x){ return x >= contDemand; }) || null;\n  const genPick = GENSETS.find(function(x){ return x >= kva*0.9*1.25; }) || null;\n\n  /* ---- pack list ---- */\n  const socaW = SOCA_LBFT[sAwg] || 0.55;\n  let socaFeet = 0, looms = 0;\n  const socaCuts = [];\n  positions.forEach(function(P){\n    if(!P.looms) return;\n    const cut = cutLengths(P.p.dist, SOCA_LEN);\n    const feet = cut.reduce(function(t,x){ return t+x; }, 0);\n    socaFeet += feet * P.looms; looms += P.looms;\n    socaCuts.push({name:P.p.name, looms:P.looms, label:cutLabel(cut), feet:feet});\n  });\n  const camCut = cutLengths(S.len, CAM_LEN);\n  const camFeet = camCut.reduce(function(t,x){ return t+x; }, 0);\n  const camCond = 5 * S.sets;                                    // 3 hot + neutral + ground\n  const camWeight = camFeet * camCond * (LBFT[S.awg]||0.6);\n  const socaWeight = socaFeet * socaW;\n\n  return {legs:legs, legsLN:legsLN, neutral:neutral, positions:positions, circuits:allCircuits,\n    motors:allMotors, maxLeg:maxLeg, minLeg:minLeg, avgLeg:avgLeg, imbalance:imbalance, kva:kva,\n    totalVA:totalVA, vd:vd, vdPct:vdPct, amp1:amp1, minAwg:minAwg, contDemand:contDemand,\n    service:service, genPick:genPick, looms:looms, socaFeet:socaFeet, socaCuts:socaCuts,\n    socaWeight:socaWeight, camCut:camCut, camFeet:camFeet, camCond:camCond, camWeight:camWeight,\n    sAwg:sAwg, worstTotal:worstTotal,\n    units:S.rows.reduce(function(t,r){ return t+r.qty; },0)};\n}\n\n/* ============================== RENDER ============================== */\nconst $ = function(id){ return document.getElementById(id); };\nconst n1 = function(v){ return v.toFixed(1); };\nconst n0 = function(v){ return Math.round(v).toLocaleString(); };\nfunction phaseVar(p){ return \"var(--p\"+p+\")\"; }\n\nfunction render(){\n  document.documentElement.setAttribute(\"data-system\", S.sys);\n  const R = compute(), s = SYS[S.sys];\n\n  /* ---------- tiles ---------- */\n  const imbFlag = R.imbalance>15 ? \"flag-crit\" : R.imbalance>7 ? \"flag-warn\" : \"flag-ok\";\n  const vdFlag  = R.worstTotal.pct>5 ? \"flag-crit\" : R.worstTotal.pct>3 ? \"flag-warn\" : \"flag-ok\";\n  const nRatio  = R.maxLeg>0 ? R.neutral/R.maxLeg : 0;\n  $(\"tiles\").innerHTML = [\n    tile(\"Connected load\", n1(R.totalVA/1000), \" kVA\", R.units+\" units · \"+S.positions.length+\" positions\"),\n    tile(\"Heaviest leg\", n1(R.maxLeg), \" A\", \"avg \"+n1(R.avgLeg)+\" A per leg\"),\n    tile(\"Imbalance\", n1(R.imbalance), \" %\", n1(R.maxLeg-R.minLeg)+\" A spread\", imbFlag),\n    tile(\"Neutral\", n1(R.neutral), \" A\", n0(nRatio*100)+\" % of heaviest leg\"),\n    tile(\"Service @125 %\", R.service?n0(R.service):\"—\", \" A\",\n      R.service ? n1(R.contDemand)+\" A demand\" : \"exceeds 1200 A\", R.service?\"\":\"flag-crit\"),\n    tile(\"Branch circuits\", String(R.circuits.length), \"\",\n      R.looms+\" loom\"+(R.looms===1?\"\":\"s\")+(R.motors.length?\" + \"+R.motors.length+\" motor\":\"\")),\n    tile(\"Worst drop\", n1(R.worstTotal.pct), \" %\", \"at \"+R.worstTotal.name, vdFlag)\n  ].join(\"\");\n\n  /* ---------- notices ---------- */\n  const notes = [];\n  if(!R.units) notes.push(note(\"ok\",\"Empty\",\"Add fixtures and the panel fills in.\"));\n  if(R.imbalance > 15)\n    notes.push(note(\"crit\",\"Imbalance\", n1(R.imbalance)+\" % between legs. Past about 10 % you are putting real \"+\n      \"current on the neutral and making a genset hunt. Try auto-balance, or split the heavy fixture type across leg pairs.\"));\n  else if(R.imbalance > 7)\n    notes.push(note(\"warn\",\"Imbalance\", n1(R.imbalance)+\" % between the heaviest and lightest leg — workable, but \"+\n      \"there is room to move a circuit.\"));\n  const badPos = R.positions.filter(function(P){ return P.totalPct > 5 && P.circuits.length; });\n  if(badPos.length)\n    notes.push(note(\"crit\",\"Volt drop\", badPos.map(function(P){\n      return P.p.name+\" (\"+n1(P.totalPct)+\" %)\"; }).join(\", \")+\" exceed\"+(badPos.length===1?\"s\":\"\")+\n      \" 5 % at the fixture. The feeder is \"+n1(R.vdPct)+\" % of that — the rest is \"+R.sAwg+\" AWG Soca on a long run. \"+\n      \"Shorten the run, split the position across two looms, or move the distro closer.\"));\n  else {\n    const warnPos = R.positions.filter(function(P){ return P.totalPct > 3 && P.circuits.length; });\n    if(warnPos.length)\n      notes.push(note(\"warn\",\"Volt drop\", warnPos.map(function(P){\n        return P.p.name+\" (\"+n1(P.totalPct)+\" %)\"; }).join(\", \")+\" past 3 % at the fixture. Under the 5 % combined \"+\n        \"recommendation, so this is a watch item, not a problem.\"));\n  }\n  if(R.maxLeg > R.amp1)\n    notes.push(note(\"crit\",\"Ampacity\", n1(R.maxLeg)+\" A on the heaviest leg exceeds the \"+n0(R.amp1)+\" A ampacity of \"+\n      (S.sets>1?S.sets+\" sets of \":\"\")+S.awg+\" \"+(S.mat===\"cu\"?\"copper\":\"aluminum\")+\".\"));\n  if(nRatio > 0.6)\n    notes.push(note(\"warn\",\"Neutral\", \"The neutral is carrying \"+n0(nRatio*100)+\" % of the heaviest leg before any \"+\n      \"harmonic content. LED drivers are non-linear — run a full-size neutral and do not share one.\"));\n  if(R.motors.length)\n    notes.push(note(\"warn\",\"Motors\", R.motors.length+\" three-phase motor load\"+(R.motors.length===1?\"\":\"s\")+\n      \" on their own distro. Running current is counted; starting inrush of 3–6× is not.\"));\n  $(\"notes\").innerHTML = notes.join(\"\");\n\n  /* ---------- rig ---------- */\n  $(\"rigcount\").textContent = R.units+\" units · \"+n0(R.totalVA)+\" VA\";\n  const body = $(\"rigbody\");\n  if(!S.rows.length) body.innerHTML = '<tr><td colspan=\"8\" class=\"empty\">Nothing hung yet.</td></tr>';\n  else body.innerHTML = S.rows.map(function(r){\n    const i = rowInfo(r), a = legAmps(i.va, r.mode);\n    return '<tr>'+\n      '<td><div class=\"rig-name\">'+esc(i.name)+'</div><div class=\"rig-brand\">'+esc(i.brand)+'</div></td>'+\n      '<td class=\"num\"><input type=\"number\" class=\"qty\" min=\"1\" max=\"999\" value=\"'+r.qty+'\" data-q=\"'+r.uid+'\"></td>'+\n      '<td><select data-p=\"'+r.uid+'\">'+ S.positions.map(function(p){\n          return '<option value=\"'+p.id+'\"'+(p.id===r.pos?\" selected\":\"\")+'>'+esc(p.name)+'</option>'; }).join('') +'</select></td>'+\n      '<td><select data-m=\"'+r.uid+'\">'+ modes().map(function(m){\n          return '<option value=\"'+m.v+'\"'+(m.v===r.mode?\" selected\":\"\")+'>'+m.t+'</option>'; }).join('') +'</select></td>'+\n      '<td class=\"num\">'+n0(i.va)+'</td><td class=\"num\">'+a.toFixed(2)+'</td>'+\n      '<td class=\"num\">'+n0(i.va*r.qty)+'</td>'+\n      '<td class=\"noprint\" style=\"text-align:right\"><button class=\"ghost\" data-x=\"'+r.uid+'\" aria-label=\"Remove '+esc(i.name)+'\">✕</button></td></tr>';\n  }).join(\"\") + (S.rows.length>1 ?\n    '<tr><td colspan=\"6\" style=\"text-align:right;color:var(--ink-3);font-size:12px;border-top:1px solid var(--line-strong)\">Connected total</td>'+\n    '<td class=\"num\" style=\"font-weight:600;border-top:1px solid var(--line-strong)\">'+n0(R.totalVA)+'</td>'+\n    '<td class=\"noprint\" style=\"border-top:1px solid var(--line-strong)\"></td></tr>' : \"\");\n\n  /* ---------- phase columns ---------- */\n  const contrib = {A:{},B:{},C:{}};\n  R.positions.forEach(function(P){\n    P.circuits.forEach(function(c){\n      Object.keys(c.items).forEach(function(nm){\n        // split the circuit's amps back out across its legs, by item share\n        const share = c.a * (c.items[nm] / Object.keys(c.items).reduce(function(t,k){ return t+c.items[k]; },0));\n        c.conn.forEach(function(ph){ contrib[ph][nm] = (contrib[ph][nm]||0) + share; });\n      });\n    });\n  });\n  R.motors.forEach(function(m){ PH.forEach(function(ph){ contrib[ph][m.name] = (contrib[ph][m.name]||0) + m.a; }); });\n  const names = []; S.rows.forEach(function(r){ const n = rowInfo(r).name; if(names.indexOf(n)<0) names.push(n); });\n  const scaleTop = Math.max(R.maxLeg*1.10, R.service ? R.service*1.04 : 0, 10);\n  $(\"phases\").innerHTML = PH.map(function(p,idx){\n    const blocks = names.filter(function(nm){ return contrib[p][nm]; }).map(function(nm,j){\n      const amps = contrib[p][nm], h = amps/scaleTop*100;\n      const shade = 0.32 + 0.60*(1 - j/Math.max(names.length,1));\n      return '<div class=\"seg-block\" style=\"height:'+h.toFixed(2)+'%;background:'+phaseVar(p)+';opacity:'+shade.toFixed(2)+'\"'+\n        ' title=\"'+esc(nm)+' — '+n1(amps)+' A\">'+(h>7?'<span>'+n1(amps)+' A</span>':'')+'</div>';\n    }).join(\"\");\n    const capPct = R.service ? Math.min(R.service/scaleTop*100,100) : null;\n    return '<div class=\"ph\" style=\"--ph:'+phaseVar(p)+'\"><div class=\"stackwrap\">'+blocks+\n      (capPct!==null && capPct<100 ? '<div class=\"cap\" style=\"bottom:'+capPct.toFixed(2)+'%\"><b>'+R.service+' A service</b></div>' : '')+\n      '</div><div class=\"foot\"><span class=\"id\">Ø'+p+'</span><span class=\"wire\">'+s.wires[idx]+'</span>'+\n      '<span class=\"amps\">'+n1(R.legs[p])+' A</span></div></div>';\n  }).join(\"\");\n\n  const harmonic = R.neutral > 0\n    ? \"Fundamental only. LED drivers are non-linear loads whose triplen harmonics add in the neutral instead of \"+\n      \"cancelling — typically pushing it to 1.7× a phase, 3× in theory. Full-size neutral, never shared.\"\n    : \"Every load here is line-to-line, so nothing returns on the neutral. Still pull one for the distro.\";\n  $(\"neutral\").innerHTML = '<span class=\"id\">N</span><span class=\"wire\">White</span>'+\n    '<span class=\"amps\">'+n1(R.neutral)+' A</span><span class=\"hint\">'+harmonic+'</span>';\n\n  $(\"legend\").innerHTML = names.map(function(nm,j){\n    const shade = 0.32 + 0.60*(1 - j/Math.max(names.length,1));\n    return '<div class=\"it\"><span class=\"sw\" style=\"background:var(--pC);opacity:'+shade.toFixed(2)+'\"></span>'+esc(nm)+'</div>';\n  }).join(\"\") + '<div class=\"it\" style=\"color:var(--ink-3)\">Shade = fixture · Column = '+s.label+' wire code</div>';\n\n  /* ---------- positions ---------- */\n  $(\"posbody\").innerHTML = R.positions.map(function(P){\n    const cls = P.totalPct>5 ? \"crit\" : P.totalPct>3 ? \"warn\" : \"\";\n    return '<tr>'+\n      '<td><input type=\"text\" data-pn=\"'+P.p.id+'\" value=\"'+esc(P.p.name)+'\" style=\"width:100%;min-width:110px;font-family:inherit\"></td>'+\n      '<td class=\"num\"><input type=\"number\" data-pd=\"'+P.p.id+'\" class=\"qty\" min=\"1\" max=\"1000\" value=\"'+P.p.dist+'\"></td>'+\n      '<td class=\"num\">'+n1(P.kva)+'</td><td class=\"num\">'+P.circuits.length+'</td><td class=\"num\">'+P.looms+'</td>'+\n      '<td class=\"num\" style=\"'+(cls===\"crit\"?\"color:var(--crit);font-weight:600\":cls===\"warn\"?\"color:var(--warn)\":\"\")+'\">'+\n        (P.circuits.length ? n1(P.totalPct)+\" %\" : \"—\")+'</td>'+\n      '<td class=\"noprint\" style=\"text-align:right\">'+(S.positions.length>1 ?\n        '<button class=\"ghost\" data-px=\"'+P.p.id+'\" aria-label=\"Remove '+esc(P.p.name)+'\">✕</button>' : '')+'</td></tr>';\n  }).join(\"\");\n\n  /* ---------- circuits ---------- */\n  $(\"cktsum\").textContent = R.circuits.length+\" × \"+S.brk+\" A on \"+R.sAwg+\" AWG\"+\n    (S.cont?\" @ \"+n1(cktCap())+\" A cont.\":\"\")+\" · \"+R.looms+\" loom\"+(R.looms===1?\"\":\"s\");\n  const c = $(\"circuits\");\n  if(!R.circuits.length && !R.motors.length)\n    c.innerHTML = '<div class=\"empty\">Circuits appear once there is a rig to feed.</div>';\n  else {\n    let html = \"\";\n    R.positions.forEach(function(P){\n      if(!P.circuits.length) return;\n      const cls = P.totalPct>5 ? \"crit\" : P.totalPct>3 ? \"warn\" : \"\";\n      html += '<div class=\"grp\"><div class=\"gh\"><span class=\"pos\">'+esc(P.p.name)+'</span>'+\n        '<span class=\"tag\">'+P.p.dist+'′ run</span>'+\n        '<span class=\"tag '+cls+'\">'+n1(P.totalPct)+' % at fixture</span>'+\n        '<hr><span class=\"tag\">'+P.circuits.length+' ckt · '+P.looms+' loom'+(P.looms===1?\"\":\"s\")+'</span></div>';\n      for(let L=0; L<P.looms; L++){\n        const slice = P.circuits.slice(L*6, L*6+6);\n        html += '<div class=\"loomrow\"><span class=\"lbl\">SOCA '+(L+1)+'</span><hr>'+\n          '<span class=\"lbl\">'+n1(slice.reduce(function(t,x){return t+x.a;},0))+' A</span></div>'+\n          '<div class=\"ckt-grid\">'+ slice.map(function(k){\n            const pct = Math.min(k.a/S.brk*100,100), over = k.a > cktCap()+1e-9;\n            return '<div class=\"ckt\" style=\"--ph:'+phaseVar(k.conn[0])+'\">'+\n              '<div class=\"cid\"><span class=\"n\">Ckt '+k.num+'</span>'+\n                '<span class=\"n\" style=\"color:var(--ph)\">Ø'+k.conn.join(\"\")+'</span>'+\n                '<span class=\"a\"'+(over?' style=\"color:var(--crit)\"':'')+'>'+n1(k.a)+' A</span></div>'+\n              '<div class=\"load\">'+Object.keys(k.items).map(function(nm){\n                  return k.items[nm]+'× '+esc(nm); }).join(\"<br>\")+'</div>'+\n              '<div class=\"vd\">−'+n1(k.vd)+' V on the run</div>'+\n              '<div class=\"bar\"><i style=\"width:'+pct.toFixed(1)+'%\"></i></div></div>';\n          }).join(\"\")+'</div>';\n      }\n      html += '</div>';\n    });\n    if(R.motors.length){\n      const g = {};\n      R.motors.forEach(function(m){ const k = m.posName+\"|\"+m.name; g[k]=(g[k]||{c:0,a:m.a,n:m.name,p:m.posName}); g[k].c++; });\n      html += '<div class=\"grp\"><div class=\"gh\"><span class=\"pos\">Motor distro</span>'+\n        '<span class=\"tag\">3ø · own feed</span><hr>'+\n        '<span class=\"tag\">'+n1(R.motors.reduce(function(t,m){return t+m.a;},0))+' A per leg</span></div><div class=\"ckt-grid\">'+\n        Object.keys(g).map(function(k){ const v = g[k];\n          return '<div class=\"ckt\" style=\"--ph:var(--ink-3)\">'+\n            '<div class=\"cid\"><span class=\"n\">3ø</span><span class=\"a\">'+n1(v.a*v.c)+' A</span></div>'+\n            '<div class=\"load\">'+v.c+'× '+esc(v.n)+'</div>'+\n            '<div class=\"vd\">'+esc(v.p)+' · '+n1(v.a)+' A ea · inrush not modelled</div></div>';\n        }).join(\"\")+'</div></div>';\n    }\n    c.innerHTML = html;\n  }\n\n  /* ---------- feeder ---------- */\n  $(\"feedrows\").innerHTML = [\n    row(\"Conductor ampacity\", n0(R.amp1)+\" A\", R.maxLeg>R.amp1 ? \"crit\":\"\"),\n    row(\"Load on heaviest leg\", n1(R.maxLeg)+\" A\"),\n    row(\"Feeder drop\", n1(R.vd)+\" V  (\"+n1(R.vdPct)+\" %)\", R.vdPct>3 ? (R.vdPct>5?\"crit\":\"warn\") : \"ok\"),\n    row(\"Voltage at the distro\", n1(s.vll-R.vd)+\" V\"),\n    row(\"Smallest conductor ≤3 %\", R.minAwg || \"none in table\"),\n    row(\"Cable in the run\", n0(R.camFeet*R.camCond)+\" ft — \"+R.camCond+\" conductors\")\n  ].join(\"\");\n\n  /* ---------- service ---------- */\n  $(\"genrows\").innerHTML = [\n    row(\"Apparent power\", n1(R.kva)+\" kVA\"),\n    row(\"Real power @ 0.9 PF\", n1(R.kva*0.9)+\" kW\"),\n    row(\"Demand @125 % continuous\", n1(R.contDemand)+\" A\"),\n    row(\"Camlock service\", R.service ? R.service+\" A\" : \"over 1200 A\", R.service?\"em\":\"crit\"),\n    row(\"Genset with 25 % headroom\", R.genPick ? R.genPick+\" kW\" : \"over 600 kW\", R.genPick?\"em\":\"crit\"),\n    row(\"Distro tie-in\", s.label+\" · 4-wire + ground\")\n  ].join(\"\");\n\n  /* ---------- chain limits ---------- */\n  const cap = cktCap();\n  $(\"chainrule\").textContent = S.brk+\" A\"+(S.cont?\" @ 80 %\":\"\")+\" = \"+n1(cap)+\" A per circuit\";\n  $(\"chA\").textContent = \"per \"+s.vln+\" V ckt\";\n  $(\"chB\").textContent = \"per \"+s.vll+\" V ckt\";\n  const seen = {}, chain = [];\n  S.rows.forEach(function(r){ const i = rowInfo(r);\n    if(seen[i.name] || !i.va) return; seen[i.name]=1; chain.push(i); });\n  $(\"chainbody\").innerHTML = chain.length ? chain.sort(function(a,b){ return b.va-a.va; }).map(function(i){\n    const nLn = Math.floor(cap / (i.va/s.vln)), nLl = Math.floor(cap / (i.va/s.vll));\n    const f = function(v){ return v<1 ? '<span style=\"color:var(--crit)\">over</span>' : v; };\n    return '<tr><td><span class=\"rig-name\">'+esc(i.name)+'</span> <span class=\"rig-brand\">'+esc(i.brand)+'</span></td>'+\n      '<td class=\"num\">'+n0(i.va)+'</td><td class=\"num\">'+f(nLn)+'</td><td class=\"num\">'+f(nLl)+'</td></tr>';\n  }).join(\"\") : '<tr><td colspan=\"4\" class=\"empty\">Add fixtures to see chain limits.</td></tr>';\n\n  /* ---------- pack list ---------- */\n  const packRows = R.socaCuts.map(function(x){\n    return row(x.looms+\" × Soca — \"+x.name, x.label+\"  (\"+n0(x.feet*x.looms)+\"′)\"); });\n  packRows.push(row(\"Soca total\", R.looms+\" loom\"+(R.looms===1?\"\":\"s\")+\" · \"+n0(R.socaFeet)+\"′ of \"+R.sAwg+\" AWG\"));\n  packRows.push(row(\"Break-outs / fan-ins\", (R.looms*2)+\" ends\"));\n  packRows.push(row(\"Feeder\", (S.sets>1?S.sets+\" sets · \":\"\")+cutLabel(R.camCut)+\" × \"+R.camCond+\" conductors\"));\n  packRows.push(row(\"Cable weight, approx.\", n0(R.socaWeight+R.camWeight)+\" lb\"));\n  $(\"packrows\").innerHTML = packRows.join(\"\");\n  $(\"packweight\").textContent = n0(R.socaFeet + R.camFeet*R.camCond)+\" ft total\";\n\n  renderRiser(R, s);\n  renderSaved();\n  window.__R = R;\n}\n\n/* ---------- one-line riser: where the power goes and where the volts go ---------- */\nfunction renderRiser(R, s){\n  const rows = R.positions.filter(function(P){ return P.circuits.length; }).map(function(P){\n    const sev = P.totalPct>5 ? \"var(--crit)\" : P.totalPct>3 ? \"var(--warn)\" : \"var(--accent)\";\n    return {name:P.p.name, sev:sev,\n      sub:P.looms+\"× Soca \"+R.sAwg+\" AWG · \"+P.p.dist+\"′\",\n      r1:P.circuits.length+\" ckt · \"+n1(P.kva)+\" kVA\",\n      r2:n1(P.totalPct)+\" % at fixture\"};\n  });\n  if(R.motors.length) rows.push({name:\"Motor distro\", sev:\"var(--ink-3)\", sub:\"3ø direct feed\",\n    r1:R.motors.length+\" hoist\"+(R.motors.length===1?\"\":\"s\"), r2:\"inrush not modelled\"});\n\n  $(\"risersum\").textContent = (R.service ? R.service+\" A · \" : \"\") + R.circuits.length + \" circuits · \" +\n    rows.length + \" drop\" + (rows.length===1?\"\":\"s\");\n\n  if(!rows.length){\n    $(\"riser\").innerHTML = '<div class=\"empty\">The riser draws itself once a position has circuits on it.</div>';\n    return;\n  }\n\n  const W=920, rowH=46, gap=9, top=26, bot=24, disH=128, srcH=92;\n  const contentH = rows.length*rowH + (rows.length-1)*gap;\n  const bandH = Math.max(contentH, disH);\n  const H = top + bandH + bot;\n  const cy = top + bandH/2;\n  const rowTop = cy - contentH/2;\n  const rcy = function(i){ return rowTop + i*(rowH+gap) + rowH/2; };\n  const srcX=8, srcW=152, disX=296, disW=176, busX=516, posX=592, posW=320;\n  const srcY = cy - srcH/2, disY = cy - disH/2;\n\n  const feederTop = S.len+\"′ · \"+S.awg+\" \"+(S.mat===\"cu\"?\"Cu\":\"Al\")+(S.sets>1 ? \" ×\"+S.sets+\" sets\" : \"\");\n  const feederBot = \"−\"+n1(R.vd)+\" V · \"+n1(R.vdPct)+\" %\";\n  const fSev = R.vdPct>3 ? (R.vdPct>5 ? \"var(--crit)\" : \"var(--warn)\") : \"var(--ink-3)\";\n\n  const legRow = function(lbl, amps, fill, y){\n    return '<rect x=\"'+(disX+13)+'\" y=\"'+(y-7)+'\" width=\"8\" height=\"8\" rx=\"1\" fill=\"'+fill+\n      '\" stroke=\"var(--line-strong)\" stroke-width=\"0.75\"></rect>'+\n      '<text class=\"dt\" x=\"'+(disX+27)+'\" y=\"'+y+'\">'+lbl+'</text>'+\n      '<text class=\"dt\" x=\"'+(disX+disW-13)+'\" y=\"'+y+'\" text-anchor=\"end\">'+amps+' A</text>';\n  };\n  const trunc = function(t){ return t.length>26 ? t.slice(0,25)+\"…\" : t; };\n\n  const svg =\n  '<svg viewBox=\"0 0 '+W+' '+H+'\" role=\"img\" aria-label=\"One-line riser: '+\n    (R.service||\"—\")+' amp service through the distro to '+rows.length+' positions, with voltage drop at each\">'+\n  '<defs><marker id=\"rsr-arrow\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\">'+\n    '<path d=\"M0,0 L8,4 L0,8 z\" fill=\"var(--ink-2)\"></path></marker></defs>'+\n\n  /* source */\n  '<rect class=\"bx\" x=\"'+srcX+'\" y=\"'+srcY+'\" width=\"'+srcW+'\" height=\"'+srcH+'\" rx=\"3\"></rect>'+\n  '<text class=\"ttl\" x=\"'+(srcX+13)+'\" y=\"'+(srcY+20)+'\">SERVICE</text>'+\n  '<text class=\"big\" x=\"'+(srcX+13)+'\" y=\"'+(srcY+45)+'\">'+(R.service ? R.service+\" A\" : \"—\")+'</text>'+\n  '<text class=\"sm\" x=\"'+(srcX+13)+'\" y=\"'+(srcY+64)+'\">'+s.label+' · 3ø 4-wire</text>'+\n  '<text class=\"sm\" x=\"'+(srcX+13)+'\" y=\"'+(srcY+79)+'\">or '+(R.genPick ? R.genPick+\" kW genset\" : \"genset over 600 kW\")+'</text>'+\n\n  /* feeder */\n  '<line class=\"ln\" x1=\"'+(srcX+srcW)+'\" y1=\"'+cy+'\" x2=\"'+(disX-4)+'\" y2=\"'+cy+'\" stroke-width=\"2.5\" marker-end=\"url(#rsr-arrow)\"></line>'+\n  '<text class=\"sm\" x=\"'+((srcX+srcW+disX)/2)+'\" y=\"'+(cy-10)+'\" text-anchor=\"middle\">'+feederTop+'</text>'+\n  '<text class=\"sm\" x=\"'+((srcX+srcW+disX)/2)+'\" y=\"'+(cy+19)+'\" text-anchor=\"middle\" fill=\"'+fSev+'\">'+feederBot+'</text>'+\n\n  /* distro */\n  '<rect class=\"bx\" x=\"'+disX+'\" y=\"'+disY+'\" width=\"'+disW+'\" height=\"'+disH+'\" rx=\"3\"></rect>'+\n  '<text class=\"ttl\" x=\"'+(disX+13)+'\" y=\"'+(disY+20)+'\">DISTRO</text>'+\n  legRow(\"ØA\", n1(R.legs.A), \"var(--pA)\", disY+42)+\n  legRow(\"ØB\", n1(R.legs.B), \"var(--pB)\", disY+61)+\n  legRow(\"ØC\", n1(R.legs.C), \"var(--pC)\", disY+80)+\n  '<line class=\"ln\" x1=\"'+(disX+13)+'\" y1=\"'+(disY+89)+'\" x2=\"'+(disX+disW-13)+'\" y2=\"'+(disY+89)+'\" stroke-width=\"1\" stroke-dasharray=\"2 2\"></line>'+\n  legRow(\"N\", n1(R.neutral), \"var(--surface)\", disY+105)+\n  '<text class=\"sm\" x=\"'+(disX+13)+'\" y=\"'+(disY+120)+'\">'+R.circuits.length+' ckt · '+R.looms+' loom'+(R.looms===1?\"\":\"s\")+'</text>'+\n\n  /* bus + taps */\n  '<line class=\"ln\" x1=\"'+(disX+disW)+'\" y1=\"'+cy+'\" x2=\"'+busX+'\" y2=\"'+cy+'\" stroke-width=\"2.5\"></line>'+\n  (rows.length>1 ? '<line class=\"ln\" x1=\"'+busX+'\" y1=\"'+rcy(0)+'\" x2=\"'+busX+'\" y2=\"'+rcy(rows.length-1)+'\" stroke-width=\"2.5\"></line>' : '')+\n  rows.map(function(r,i){\n    return '<line class=\"ln\" x1=\"'+busX+'\" y1=\"'+rcy(i)+'\" x2=\"'+(posX-4)+'\" y2=\"'+rcy(i)+'\" stroke-width=\"1.5\" marker-end=\"url(#rsr-arrow)\"></line>'+\n      '<circle cx=\"'+busX+'\" cy=\"'+rcy(i)+'\" r=\"2.5\" fill=\"var(--ink-2)\"></circle>';\n  }).join(\"\")+\n\n  /* positions */\n  rows.map(function(r,i){\n    const y = rcy(i) - rowH/2;\n    return '<rect class=\"bx\" x=\"'+posX+'\" y=\"'+y+'\" width=\"'+posW+'\" height=\"'+rowH+'\" rx=\"3\"></rect>'+\n      '<rect x=\"'+posX+'\" y=\"'+y+'\" width=\"3.5\" height=\"'+rowH+'\" fill=\"'+r.sev+'\"></rect>'+\n      '<text class=\"nm\" x=\"'+(posX+15)+'\" y=\"'+(y+20)+'\">'+esc(trunc(r.name))+'</text>'+\n      '<text class=\"sm\" x=\"'+(posX+15)+'\" y=\"'+(y+36)+'\">'+esc(r.sub)+'</text>'+\n      '<text class=\"dt\" x=\"'+(posX+posW-13)+'\" y=\"'+(y+20)+'\" text-anchor=\"end\">'+esc(r.r1)+'</text>'+\n      '<text class=\"dt\" x=\"'+(posX+posW-13)+'\" y=\"'+(y+36)+'\" text-anchor=\"end\" fill=\"'+r.sev+'\">'+esc(r.r2)+'</text>';\n  }).join(\"\")+\n  '</svg>';\n\n  $(\"riser\").innerHTML = svg +\n    '<figcaption>Volts leave on the left and are spent on the way to the right: the feeder drop is shared by everything, '+\n    'then each position adds its own branch drop over the Soca run. The stripe on each position is that total at the fixture — '+\n    'green under 3 %, amber to 5 %, red past the NEC combined recommendation.</figcaption>';\n}\n\nfunction tile(k,v,unit,n,flag){\n  return '<div class=\"tile '+(flag||\"\")+'\"><span class=\"k\">'+k+'</span><span class=\"v\">'+v+\n    (unit?'<small>'+unit+'</small>':'')+'</span><span class=\"n\">'+n+'</span></div>';\n}\nfunction note(kind,m,t){ return '<div class=\"note '+kind+'\"><span class=\"m\">'+m+'</span><span>'+t+'</span></div>'; }\nfunction row(k,v,cls){\n  const col = cls===\"crit\"?\"color:var(--crit)\":cls===\"warn\"?\"color:var(--warn)\":\n              (cls===\"ok\"||cls===\"em\")?\"color:var(--accent)\":\"\";\n  return '<div class=\"r\"><span class=\"k\">'+k+'</span><span class=\"v\" style=\"'+col+'\">'+v+'</span></div>';\n}\n\n/* ============================== CONTROLS ============================== */\nfunction fillPicker(){\n  let html = \"\", cat = null;\n  LIB.forEach(function(f){\n    if(f.c!==cat){ if(cat!==null) html += \"</optgroup>\"; html += '<optgroup label=\"'+f.c+'\">'; cat = f.c; }\n    html += '<option value=\"'+f.id+'\">'+esc(f.b)+\" \"+esc(f.n)+\" — \"+f.va+\" VA</option>\";\n  });\n  $(\"pick\").innerHTML = html + \"</optgroup>\";\n}\nfunction fillModes(){\n  const keep = $(\"pickmode\").value;\n  $(\"pickmode\").innerHTML = modes().map(function(m){ return '<option value=\"'+m.v+'\">'+m.t+'</option>'; }).join(\"\");\n  $(\"pickmode\").value = modes().some(function(m){ return m.v===keep; }) ? keep : \"ll\";\n}\nfunction fillPositions(){\n  const keep = $(\"pickpos\").value;\n  $(\"pickpos\").innerHTML = S.positions.map(function(p){\n    return '<option value=\"'+p.id+'\">'+esc(p.name)+'</option>'; }).join(\"\");\n  $(\"pickpos\").value = S.positions.some(function(p){ return p.id===keep; }) ? keep : (S.positions[0]||{}).id;\n}\nfunction fillGauges(){\n  $(\"awg\").innerHTML = GAUGES.map(function(g){\n    return '<option value=\"'+g+'\">'+g+(/^\\d{3}$/.test(g)?\" kcmil\":\" AWG\")+'</option>'; }).join(\"\");\n  $(\"awg\").value = S.awg;\n}\n\nfunction bind(){\n  $(\"sys\").addEventListener(\"change\", function(e){ S.sys = e.target.value; fillModes(); render(); });\n  $(\"brk\").addEventListener(\"change\", function(e){ S.brk = +e.target.value; render(); });\n  $(\"der\").addEventListener(\"change\", function(e){ S.cont = e.target.value===\"1\"; render(); });\n  $(\"len\").addEventListener(\"input\", function(e){ S.len = Math.max(1, +e.target.value||1); render(); });\n  $(\"awg\").addEventListener(\"change\", function(e){ S.awg = e.target.value; render(); });\n  $(\"mat\").addEventListener(\"change\", function(e){ S.mat = e.target.value; render(); });\n  $(\"sets\").addEventListener(\"input\", function(e){ S.sets = Math.max(1, Math.min(6, +e.target.value||1)); render(); });\n  $(\"mAuto\").addEventListener(\"click\", function(){ S.group=false; setSeg(); render(); });\n  $(\"mLock\").addEventListener(\"click\", function(){ S.group=true;  setSeg(); render(); });\n  $(\"printbtn\").addEventListener(\"click\", function(){ window.print(); });\n\n  $(\"addbtn\").addEventListener(\"click\", function(){\n    const fid = $(\"pick\").value, qty = Math.max(1, +$(\"pickqty\").value||1);\n    const f = fx(fid), m = (f && f.mode) ? f.mode : $(\"pickmode\").value, p = $(\"pickpos\").value;\n    const hit = S.rows.find(function(r){ return r.fid===fid && r.mode===m && r.pos===p; });\n    if(hit) hit.qty += qty; else S.rows.push({uid:uid(), fid:fid, qty:qty, mode:m, pos:p});\n    render();\n  });\n  $(\"addcustom\").addEventListener(\"click\", function(){\n    const name = ($(\"cname\").value||\"\").trim() || \"Custom load\";\n    S.rows.push({uid:uid(), custom:{name:name, va:Math.max(1,+$(\"cva\").value||1)},\n      qty:Math.max(1,+$(\"cqty\").value||1), mode:$(\"pickmode\").value, pos:$(\"pickpos\").value});\n    $(\"cname\").value = \"\"; render();\n  });\n  $(\"addpos\").addEventListener(\"click\", function(){\n    const id = \"p\"+Math.random().toString(36).slice(2,7);\n    S.positions.push({id:id, name:\"Position \"+(S.positions.length+1), dist:100});\n    fillPositions(); render();\n  });\n\n  $(\"rigbody\").addEventListener(\"input\", function(e){\n    const q = e.target.getAttribute(\"data-q\"); if(!q) return;\n    const r = S.rows.find(function(x){ return x.uid===q; });\n    if(r){ r.qty = Math.max(1, Math.min(999, +e.target.value||1)); render(); }\n  });\n  $(\"rigbody\").addEventListener(\"change\", function(e){\n    const m = e.target.getAttribute(\"data-m\"), p = e.target.getAttribute(\"data-p\");\n    const key = m || p; if(!key) return;\n    const r = S.rows.find(function(x){ return x.uid===key; });\n    if(!r) return;\n    if(m) r.mode = e.target.value; else r.pos = e.target.value;\n    render();\n  });\n  $(\"rigbody\").addEventListener(\"click\", function(e){\n    const btn = e.target.closest(\"[data-x]\"); if(!btn) return;\n    S.rows = S.rows.filter(function(x){ return x.uid !== btn.getAttribute(\"data-x\"); });\n    render();\n  });\n\n  $(\"posbody\").addEventListener(\"input\", function(e){\n    const nm = e.target.getAttribute(\"data-pn\"), d = e.target.getAttribute(\"data-pd\");\n    if(nm){ const p = pos(nm); if(p){ p.name = e.target.value; fillPositions(); repaintSoft(); } }\n    else if(d){ const p = pos(d); if(p){ p.dist = Math.max(1, Math.min(1000, +e.target.value||1)); render(); } }\n  });\n  $(\"posbody\").addEventListener(\"click\", function(e){\n    const btn = e.target.closest(\"[data-px]\"); if(!btn) return;\n    const id = btn.getAttribute(\"data-px\");\n    if(S.positions.length<2) return;\n    S.positions = S.positions.filter(function(p){ return p.id!==id; });\n    const fallback = S.positions[0].id;\n    S.rows.forEach(function(r){ if(r.pos===id) r.pos = fallback; });\n    fillPositions(); render();\n  });\n\n  $(\"csv\").addEventListener(\"click\", exportCSV);\n  $(\"savebtn\").addEventListener(\"click\", saveRig);\n}\n/* renaming a position shouldn't steal focus from the input being typed in */\nlet softTimer = null;\nfunction repaintSoft(){ clearTimeout(softTimer); softTimer = setTimeout(function(){\n  const a = document.activeElement, id = a && a.getAttribute && a.getAttribute(\"data-pn\");\n  const selStart = id && a.selectionStart;\n  render();\n  if(id){ const el = document.querySelector('[data-pn=\"'+id+'\"]');\n    if(el){ el.focus(); try{ el.setSelectionRange(selStart, selStart); }catch(e){} } }\n}, 450); }\n\nfunction setSeg(){\n  $(\"mAuto\").setAttribute(\"aria-pressed\", String(!S.group));\n  $(\"mLock\").setAttribute(\"aria-pressed\", String(S.group));\n}\n\n/* ============================== EXPORT ============================== */\nfunction exportCSV(){\n  const R = window.__R || compute(), s = SYS[S.sys];\n  const L = [\n    [\"Distro Plot — circuit schedule\"],\n    [\"Service\", s.label, \"Breaker\", S.brk+\" A on \"+R.sAwg+\" AWG\", \"Rule\", S.cont?\"80% continuous\":\"100%\"],\n    [\"Feeder\", S.len+\" ft\", S.awg+\" \"+(S.mat===\"cu\"?\"Cu\":\"Al\"), S.sets+\" set(s)\", \"Feeder drop\", n1(R.vdPct)+\" %\"],\n    [\"Heaviest leg\", n1(R.maxLeg)+\" A\", \"Imbalance\", n1(R.imbalance)+\" %\", \"Neutral\", n1(R.neutral)+\" A\",\n     \"Service\", (R.service||\"—\")+\" A\"],\n    [],\n    [\"Position\",\"Run ft\",\"Loom\",\"Circuit\",\"Phase\",\"Volts\",\"Amps\",\"% breaker\",\"Branch drop V\",\"Total drop %\",\"Load\"]\n  ];\n  R.positions.forEach(function(P){\n    P.circuits.forEach(function(k,i){\n      L.push([P.p.name, P.p.dist, \"Soca \"+(Math.floor(i/6)+1), k.num, \"Ø\"+k.conn.join(\"\"),\n        k.mode===\"ln\"?s.vln:s.vll, n1(k.a), Math.round(k.a/S.brk*100), n1(k.vd),\n        n1(R.vdPct + k.vdPct),\n        Object.keys(k.items).map(function(nm){ return k.items[nm]+\"x \"+nm; }).join(\" + \")]);\n    });\n  });\n  R.motors.forEach(function(m,i){\n    L.push([m.posName, \"\", \"Motor distro\", \"M\"+(i+1), \"Ø3\", s.vll, n1(m.a), \"\", \"\", \"\", \"1x \"+m.name]);\n  });\n  L.push([]); L.push([\"Pack list\"]);\n  R.socaCuts.forEach(function(x){ L.push([x.name, x.looms+\" loom(s)\", x.label, n0(x.feet*x.looms)+\" ft\"]); });\n  L.push([\"Feeder\", S.sets+\" set(s)\", cutLabel(R.camCut), R.camCond+\" conductors\", n0(R.camFeet*R.camCond)+\" ft\"]);\n  L.push([\"Cable weight approx\", n0(R.socaWeight+R.camWeight)+\" lb\"]);\n\n  const csv = L.map(function(r){ return r.map(function(x){\n    x = String(x==null?\"\":x); return /[\",\\n]/.test(x) ? '\"'+x.replace(/\"/g,'\"\"')+'\"' : x; }).join(\",\"); }).join(\"\\n\");\n\n  if(DOWNLOADS) DOWNLOADS.save({filename:\"distro-plot-schedule.csv\", data:csv}).catch(function(){ copyFallback(csv); });\n  else copyFallback(csv);\n}\nfunction copyFallback(csv){\n  const b = $(\"csv\"), old = b.textContent;\n  if(navigator.clipboard && navigator.clipboard.writeText)\n    navigator.clipboard.writeText(csv).then(function(){\n      b.textContent = \"Copied to clipboard\"; setTimeout(function(){ b.textContent = old; },1800);\n    }).catch(function(){ b.textContent = \"Copy blocked\"; setTimeout(function(){ b.textContent = old; },1800); });\n  else { b.textContent = \"Copy blocked\"; setTimeout(function(){ b.textContent = old; },1800); }\n}\n\n/* ============================== SAVED RIGS ============================== */\nfunction snapshot(){\n  return {sys:S.sys, brk:S.brk, cont:S.cont, group:S.group, len:S.len, awg:S.awg, mat:S.mat, sets:S.sets,\n    positions:S.positions.map(function(p){ return {id:p.id, name:p.name, dist:p.dist}; }),\n    rows:S.rows.map(function(r){ return {fid:r.fid, custom:r.custom, qty:r.qty, mode:r.mode, pos:r.pos}; })};\n}\nfunction applySnapshot(d){\n  if(!d || !Array.isArray(d.rows)) return;\n  S.sys = d.sys||\"208\"; S.brk = d.brk||20; S.cont = d.cont!==false; S.group = !!d.group;\n  S.len = d.len||150; S.awg = d.awg||\"2/0\"; S.mat = d.mat||\"cu\"; S.sets = d.sets||1;\n  S.positions = (Array.isArray(d.positions) && d.positions.length)\n    ? d.positions.map(function(p){ return {id:p.id, name:p.name, dist:p.dist}; })\n    : DEFAULT_POS.map(function(p){ return Object.assign({}, p); });\n  const ids = S.positions.map(function(p){ return p.id; });\n  S.rows = d.rows.map(function(r){\n    return {uid:uid(), fid:r.fid, custom:r.custom, qty:r.qty||1, mode:r.mode||\"ll\",\n      pos: ids.indexOf(r.pos)>=0 ? r.pos : ids[0]}; });\n  $(\"sys\").value = S.sys; $(\"brk\").value = String(S.brk); $(\"der\").value = S.cont?\"1\":\"0\";\n  $(\"len\").value = S.len; $(\"mat\").value = S.mat; $(\"sets\").value = S.sets;\n  fillModes(); fillPositions(); fillGauges(); setSeg(); render();\n}\nfunction saveRig(){\n  const name = ($(\"signame\").value||\"\").trim();\n  if(!name){ $(\"signame\").focus(); return; }\n  const key = name.toLowerCase().replace(/[^a-z0-9]+/g,\"-\").replace(/^-|-$/g,\"\").slice(0,60) || (\"rig-\"+Date.now());\n  const rec = {name:name, saved:Date.now(), data:snapshot()};\n  savedRigs = savedRigs.filter(function(x){ return x.key!==key; });\n  savedRigs.push(Object.assign({key:key}, rec));\n  $(\"signame\").value = \"\";\n  if(DB) DB.doc(\"rigs/\"+key).set(rec).catch(function(){ localWrite(); }); else localWrite();\n  localWrite(); renderSaved();\n}\nfunction localWrite(){ try{ localStorage.setItem(\"distro-plot-rigs\", JSON.stringify(savedRigs)); }catch(e){} }\nfunction removeRig(key){\n  savedRigs = savedRigs.filter(function(x){ return x.key!==key; });\n  if(DB) DB.doc(\"rigs/\"+key).delete().catch(function(){});\n  localWrite(); renderSaved();\n}\nfunction renderSaved(){\n  const el = $(\"saved\");\n  if(!savedRigs.length){\n    el.innerHTML = '<span style=\"font-size:12px;color:var(--ink-3)\">No saved rigs yet — save one and it comes back next time you open this.</span>';\n    return;\n  }\n  el.innerHTML = savedRigs.slice().sort(function(a,b){ return b.saved-a.saved; }).map(function(r){\n    return '<span class=\"chip\"><span class=\"load-b\" data-load=\"'+esc(r.key)+'\" role=\"button\" tabindex=\"0\">'+esc(r.name)+\n      '</span><button data-del=\"'+esc(r.key)+'\" aria-label=\"Delete '+esc(r.name)+'\">✕</button></span>';\n  }).join(\"\");\n}\ndocument.addEventListener(\"click\", function(e){\n  const l = e.target.closest(\"[data-load]\"); : the four ported tools were written independently\n   as standalone artifacts and share 22 top-level function names between them\n   — render, compute, save, esc, uid, exportCSV, snapshot, applySnapshot and\n   more. Merged into one global scope they would clobber each other. A\n   same-origin srcdoc frame gives each its own window, so they port unmodified\n   and keep working exactly as they were verified.\n\n   Frames have no capabilities of their own, so the shim hands each tool the\n   Hub's. Same origin, so these are direct calls into the parent realm — no\n   postMessage, no serialization.                                           */\n(function () {\n  var TOOL   = \"patch\";\n  var LEGACY = true;          // ported tool, or written for the Hub\n  var host   = window.parent;\n\n  /* ── Shared data layer ────────────────────────────────────────────────\n     Every tool written for the Hub uses this. It reaches the real\n     collections — fixtures, gear, shows — with no namespacing, because\n     that shared library is the entire point of the suite.                */\n  window.KTM = host && host.KTM ? host.KTM : null;\n\n  /* ── Legacy namespacing ───────────────────────────────────────────────\n     The four ported tools each save rigs at \"rigs/{key}\". In four separate\n     stores that was fine; in one shared store they overwrite each other.\n     So for those tools only, every path gets namespaced under tools/<tool>/.\n\n     The prefix is TWO segments on purpose. Document paths must have an even\n     number of segments and collections an odd number, so a one-segment\n     prefix would flip every path's parity and throw:\n       rigs      (1, collection) -> tools/distro/rigs      (3, collection)\n       rigs/foo  (2, document)   -> tools/distro/rigs/foo  (4, document)\n\n     New tools are NOT namespaced — they read and write the shared schema\n     directly, which is why this is gated on LEGACY rather than applied to\n     everything.
