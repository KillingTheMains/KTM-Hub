ft:1px solid var(--line)}\n.seg button.on{background:var(--sel);color:var(--ink);font-weight:600}\n.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:7px 13px;\n  font-size:12.5px;font-weight:600;cursor:pointer}\n.btn:hover{filter:brightness(1.08)}\n.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}\n.btn.ghost:hover{background:var(--surface-2);color:var(--ink);filter:none}\n.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}\n.btn.danger:hover{background:var(--crit-soft);filter:none}\n.btn.sm{padding:4px 9px;font-size:11.5px}\n.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}\ninput[type=text],input[type=number],select{background:var(--surface-2);border:1px solid var(--line);\n  border-radius:7px;padding:6px 9px}\ninput:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}\n\nmain{flex:1;overflow-y:auto;padding:16px 18px 70px}\n.wrap{max-width:1280px;margin:0 auto}\n.cols{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}\nh3{font-family:\"Archivo\",sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;\n  text-transform:uppercase;color:var(--accent);margin:20px 0 8px}\nh4{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 8px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:14px}\n.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.stat .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}\n.stat .v{font-family:\"Archivo\",sans-serif;font-size:21px;font-weight:700;line-height:1.15;margin-top:1px}\n.stat .v small{font-size:10.5px;font-weight:500;color:var(--ink-3)}\n.stat.flag{border-color:var(--warn);background:var(--warn-soft)}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;\n  box-shadow:var(--shadow);margin-bottom:12px}\n.note{border-radius:10px;padding:11px 14px;font-size:12.5px;border:1px solid var(--line);\n  background:var(--surface);margin-bottom:13px}\n.note.warn{background:var(--warn-soft);border-color:transparent}\n.note.crit{background:var(--crit-soft);border-color:transparent}\n.muted{color:var(--ink-3)}\n.chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}\n.chip.ok{background:var(--accent-soft);color:var(--accent)}\n.chip.warn{background:var(--warn-soft);color:var(--warn)}\n.chip.crit{background:var(--crit-soft);color:var(--crit)}\n.chip.dim{background:var(--sunken);color:var(--ink-3)}\n.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}\n.empty .big{font-family:\"Archivo\",sans-serif;font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}\n.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}\ntable{border-collapse:collapse;width:100%;font-size:12.5px}\nth{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);\n  font-weight:700;padding:7px 9px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}\ntd{padding:5px 9px;border-bottom:1px solid var(--line)}\ntbody tr:last-child td{border-bottom:0}\ntbody tr:hover{background:var(--surface-2)}\ntd.num,th.num{text-align:right;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-variant-numeric:tabular-nums}\n\n/* rack list */\n.racktab{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;\n  border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--ink-2);font-size:13px}\n.racktab:hover{background:var(--surface-2);color:var(--ink)}\n.racktab.on{background:var(--sel);color:var(--ink);font-weight:600;border-color:var(--line)}\n.racktab .sq{width:10px;height:10px;border-radius:3px;flex:0 0 auto}\n.racktab .n{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:500}\n\n/* the elevation */\n.elev{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;\n  box-shadow:var(--shadow)}\n.elevhead{display:flex;align-items:baseline;gap:11px;margin-bottom:10px;flex-wrap:wrap}\n.elevhead b{font-family:\"Archivo\",sans-serif;font-size:15px}\n.elevhead .m{font-size:11.5px;color:var(--ink-3)}\nsvg{display:block;width:100%;height:auto}\n\n/* port editor */\n.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px;margin-top:9px}\n.port{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}\n.port .pn{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;\n  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}\n.pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}\n.pdot.output{background:var(--s3)} .pdot.input{background:var(--s2)}\n.pdot.network{background:var(--s1)} .pdot.power{background:var(--s7)}\n.port input{width:100%;font-size:11.5px;padding:3px 6px;background:var(--surface);margin-bottom:3px}\n.port input:last-child{margin-bottom:0}\n.port.used{border-color:var(--accent)}\n\n/* clickable gaps */\n.slot{cursor:pointer}\n.slot rect{fill:var(--accent);fill-opacity:0;stroke:var(--line-strong);stroke-width:1;\n  stroke-dasharray:3 3;stroke-opacity:0;transition:fill-opacity .12s,stroke-opacity .12s}\n.slot text{fill:var(--ink-3);opacity:0;font-family:\"IBM Plex Sans\",sans-serif;font-weight:600;\n  transition:opacity .12s;pointer-events:none}\n.slot:hover rect{fill-opacity:.12;stroke-opacity:.9}\n.slot:hover text{opacity:.85}\n.dev{cursor:pointer}\n.dev.sel rect{stroke:var(--ink);stroke-width:2}\n.card.sel{outline:2px solid var(--accent);outline-offset:-1px}\n\n/* the picker */\n.scrim{position:fixed;inset:0;background:rgba(10,14,16,.46);display:flex;align-items:flex-start;\n  justify-content:center;padding:6vh 16px;z-index:60}\n.picker{background:var(--surface);border:1px solid var(--line);border-radius:13px;\n  box-shadow:var(--shadow);width:100%;max-width:520px;max-height:82vh;display:flex;\n  flex-direction:column;overflow:hidden}\n.pickhead{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}\n.pickhead b{font-family:\"Archivo\",sans-serif;font-size:15px}\n.pickhead .m{font-size:11.5px;color:var(--ink-3)}\n.pickhead .grow{flex:1}\n.picker>input{margin:0 16px 10px;width:calc(100% - 32px)}\n.picklist{overflow-y:auto;padding:0 10px 6px;flex:1}\n.pickcat{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;\n  color:var(--ink-3);padding:10px 6px 5px;position:sticky;top:0;background:var(--surface)}\n.pickrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;\n  border:0;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--ink);font-size:13px}\n.pickrow:hover{background:var(--sel)}\n.pickrow .nm{flex:1;min-width:0}\n.pickrow .sp{font-size:11px;color:var(--ink-3);font-family:\"IBM Plex Mono\",monospace;white-space:nowrap}\n.pickfoot{border-top:1px solid var(--line);padding:10px 16px 12px}\n\n/* checks + face selector */\n.chks{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}\n.chks .note{margin:0}\n.note.info{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}\n.elevhead .grow{flex:1}\n.facesel button{font-size:11.5px;padding:4px 10px}\n.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--ink-3)}\n.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;\n  vertical-align:-1px;border:1px dashed var(--line-strong);background:repeating-linear-gradient(\n  45deg,var(--line-strong) 0 1.5px,transparent 1.5px 4px)}\n.legend .sw.solid{background:var(--s0);opacity:.42;border-style:dashed}\n.port .pf{margin-left:auto;font-size:8.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}\n\n@media print{\n  .bar,.side{display:none} main{overflow:visible;padding:0}\n  body{overflow:visible;background:#fff}\n  .cols{grid-template-columns:1fr}\n  .elev{box-shadow:none;border:0;padding:0;break-inside:avoid}\n  .ports{display:none}\n}\n@media(max-width:960px){ .cols{grid-template-columns:1fr} }\n</style></head><body>\n<script>\n/* ── KTM tool shim ────────────────────────────────────────────────────────\n   Injected into each tool immediately after <body>, ahead of the tool's code.\n\n   Why tools run in frames: the four ported tools were written independently\n   as standalone artifacts and share 22 top-level function names between them\n   — render, compute, save, esc, uid, exportCSV, snapshot, applySnapshot and\n   more. Merged into one global scope they would clobber each other. A\n   same-origin srcdoc frame gives each its own window, so they port unmodified\n   and keep working exactly as they were verified.\n\n   Frames have no capabilities of their own, so the shim hands each tool the\n   Hub's. Same origin, so these are direct calls into the parent realm — no\n   postMessage, no serialization.                                           */\n(function () {\n  var TOOL   = \"rack\";\n  var LEGACY = false;          // ported tool, or written for the Hub\n  var host   = window.parent;\n\n  /* ── Shared data layer ────────────────────────────────────────────────\n     Every tool written for the Hub uses this. It reaches the real\n     collections — fixtures, gear, shows — with no namespacing, because\n     that shared library is the entire point of the suite.                */\n  window.KTM = host && host.KTM ? host.KTM : null;\n\n  /* ── Legacy namespacing ───────────────────────────────────────────────\n     The four ported tools each save rigs at \"rigs/{key}\". In four separate\n     stores that was fine; in one shared store they overwrite each other.\n     So for those tools only, every path gets namespaced under tools/<tool>/.\n\n     The prefix is TWO segments on purpose. Document paths must have an even\n     number of segments and collections an odd number, so a one-segment\n     prefix would flip every path's parity and throw:\n       rigs      (1, collection) -> tools/distro/rigs      (3, collection)\n       rigs/foo  (2, document)   -> tools/distro/rigs/foo  (4, document)\n\n     New tools are NOT namespaced — they read and write the shared schema\n     directly, which is why this is gated on LEGACY rather than applied to\n     everything.                                                           */\n  function ns(p) { return \"tools/\" + TOOL + \"/\" + p; }\n\n  function wrapDb(db) {\n    return {\n      doc:        function (p) { return db.doc(ns(p)); },\n      collection: function (p) { return db.collection(ns(p)); }\n    };\n  }\n\n  window.claude = {\n    use: function (name) {\n      if (!host || !host.claude || !host.claude.use) return Promise.resolve(null);\n      return Promise.resolve(host.claude.use(name)).then(function (api) {\n        if (!api) return null;\n        return (LEGACY && name === \"db\") ? wrapDb(api) : api;\n      }).catch(function () { return null; });\n    }\n  };\n\n  /* The Hub owns the theme; it calls this on every frame when you toggle. */\n  window.__ktmTheme = function (t) {\n    var r = document.documentElement;\n    if (t) r.setAttribute(\"data-theme\", t); else r.removeAttribute(\"data-theme\");\n  };\n})();\n<\/script>\n\n\n<div class=\"bar\">\n  <h1>Rack&nbsp;Plot</h1>\n  <div class=\"seg\" id=\"tabs\"></div>\n  <div class=\"grow\"></div>\n  <button class=\"btn ghost sm\" id=\"csvbtn\">CSV</button>\n  <button class=\"btn ghost sm\" id=\"printbtn\">Print</button>\n  <button class=\"btn sm\" id=\"savebtn\">Save racks</button>\n</div>\n<main><div class=\"wrap\" id=\"root\"></div></main>\n\n<script>\n/* ═══════════════════════════════════════════════════════════════════════\n   Rack Plot — rack elevations and port-level patching.\n\n   Patch decides which universes exist, Rack decides which physical port\n   carries each one and what leaves that port.\n\n   ── 2026-09-11: the geometry rebuild ─────────────────────────────────\n   The first version modelled a rack as a stack of whole U's, one device\n   per U, one face. Research against the standards and against real\n   touring gear says that is wrong in four ways at once, and every one of\n   them is expensive to retrofit later:\n\n   1. HALF-U IS REAL. NetBox stores u_height as a multiple of 0.5 and the\n      EIA panel formula (h = 1.750n − 0.031 in) has nothing to say about\n      whole numbers. Stored here in HALF-U integers, because floating\n      point in a grid is a bug farm.\n\n   2. HALF-RACK IS THE NORMAL CASE, not the exception. ETC sells the\n      Response Mk2 gateway as \"eight DMX ports in 1U\" — meaning two side\n      by side. LumiNodes, the GigaCore 10t and Enttec's Storm are all\n      half-width. A node rack drawn one-device-per-U is not that rack.\n      NetBox cannot do this; ConnectCAD and D-Tools can. We follow the AV\n      tools. Width is counted in SIXTHS of the face so a half-rack and a\n      third-rack device can share a U without the grid lying.\n\n   3. A RACK HAS TWO FACES. A device that is not full depth leaves the\n      other side of that U free, which is how PDUs and patch fields live\n      behind the gear. Front and rear are separate elevations; a\n      full-depth device blocks both.\n\n   4. DEPTH IS THE BINDING CONSTRAINT IN TOURING, not U count. SKB's 8U\n      24-inch shock rack gives 23.75 in rail to rail inside a 28.5 in\n      case; ProX charges a flat 2.5 in for front and rear lids. A\n      Hippotizer is 24.8 in deep. So the rack references a CASE from\n      gear/rack-cases and the fit check is against that case's rackable\n      depth, not against a generic \"will it hold\".\n\n   Two patterns carried over from Pre-Pro, both scar tissue, both intact:\n\n   * NEVER re-render on an input event. A full render() on blur destroys\n     the DOM and kills keyboard navigation mid-edit. Port fields write to\n     the model and repaint nothing.\n   * RU 1 IS THE BOTTOM, the way a rack is counted in front of a road case.\n\n   Old documents load unchanged: a missing face reads front, a missing\n   col reads 0, a missing rackWidth reads full. Nothing is migrated.\n   ═══════════════════════════════════════════════════════════════════════ */\n\nconst $  = id => document.getElementById(id);\nconst esc = s => String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);\n\nconst COLORS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8','--s0'];\n\n/* ── the two grid units ──────────────────────────────────────────────── */\nconst HU = 2;                                    /* half-U per rack unit  */\nconst WU = 6;                                    /* width units per face  */\nconst WIDTHS = { full:6, half:3, third:2 };\nconst WIDTH_LABEL = { full:'Full 19″', half:'Half rack', third:'Third rack' };\nconst FILL_LIMIT = 0.80;   /* F502-derived: 80 % of rack space used, blanks fill the rest */\n\nconst S = { tab:'build', face:'front', loaded:false, show:null, showName:'',\n            equip:[], cases:[], racks:[], cur:null, dirty:false,\n            place:null, placeQ:'', sel:null };\n\nasync function load(){\n  const K = window.KTM;\n  if(!K){ S.loaded=true; return; }\n  const gear = await K.list('gear');\n  const re = gear.find(g=>g.kind==='rack-equipment');\n  const rp = gear.find(g=>g.kind==='rack-panels');\n  const rc = gear.find(g=>g.kind==='rack-cases');\n  /* Panels are equipment as far as the grid is concerned — a blank takes a U\n     exactly like a switch does, and the 80 % fill rule is only actionable if\n     the thing that fills the rest is in the same picker. */\n  S.equip = ((re && re.items) || []).map(e=>Object.assign({category:'gear'}, e))\n    .concat(((rp && rp.items) || []).map(e=>Object.assign({}, e, {category:e.category||'panel'})));\n  S.cases = (rc && rc.items) || [];\n  S.show = K.activeShow ? K.activeShow() : null;\n  if(S.show){\n    const sh = await K.get(K.P.show(S.show));\n    S.showName = (sh && sh.name) || S.show;\n    S.racks = await K.list(K.P.sub(S.show,'racks'));\n    S.racks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));\n  }\n  S.cur = S.racks[0] ? S.racks[0].id : null;\n  S.loaded = true;\n}\n\nasync function save(){\n  const K=window.KTM;\n  if(!K) return alert('No store available.');\n  if(!S.show) return alert('Pick a show in the Hub first — racks belong to a show.');\n  const b=$('savebtn'); b.disabled=true; b.textContent='Saving…';\n  try{\n    for(const r of S.racks){\n      const {id, ...body} = r;\n      await K.set(K.P.subDoc(S.show,'racks',id), body);\n    }\n    S.dirty=false; b.textContent='Saved';\n    setTimeout(()=>{b.textContent='Save racks';b.disabled=false;},1400);\n  }catch(e){ b.textContent='Save racks'; b.disabled=false; alert('Could not save: '+e.message); }\n}\n\nconst rack = () => S.racks.find(r=>r.id===S.cur);\nconst eq   = id => S.equip.find(e=>e.id===id);\nconst kase = r => S.cases.find(c=>c.id===(r||{}).caseId);\nconst other = f => f==='front' ? 'rear' : 'front';\n\n/* ── accessors that default old documents into the new shape ─────────── */\nconst hOf    = e  => Math.max(1, Math.round((e.ruHeight||1)*HU));      /* half-U tall */\nconst wKeyOf = e  => (e.rackWidth && WIDTHS[e.rackWidth]) ? e.rackWidth : 'full';\nconst wOf    = e  => WIDTHS[wKeyOf(e)];\nconst deepOf = e  => e.fullDepth !== false;   /* absent means full depth — the safe read */\nconst isPanel = e => !!e && (e.category||'gear')!=='gear';\nconst faceOf = it => it.face==='rear' ? 'rear' : 'front';\nconst colOf  = it => Math.max(0, Math.min(WU-1, it.col|0));\nconst h0Of   = it => Math.max(0, Math.round(((it.ru||1)-1)*HU));\nconst ruLabel = it => { const e=eq(it.gearId)||{}, h=hOf(e), b=it.ru||1;\n  return h===1 ? String(b)+'½' : (h/HU===1 ? String(b) : b+'–'+(b+h/HU-1)); };\n\n/* ── occupancy ────────────────────────────────────────────────────────────\n   A cell is one half-U by one sixth of the face, keyed \"h|w\" with h counted\n   up from the floor. A device that is NOT full depth occupies its own face\n   only; a full-depth one occupies the cell on both faces, which is the whole\n   reason the flag exists. */\nfunction occupancy(r, face){\n  const map = {};\n  (r.items||[]).forEach(it=>{\n    const e = eq(it.gearId); if(!e) return;\n    if(faceOf(it)!==face && !deepOf(e)) return;\n    const h0=h0Of(it), hh=hOf(e), c0=colOf(it), ww=wOf(e);\n    for(let h=h0; h<h0+hh; h++) for(let w=c0; w<c0+ww; w++) map[h+'|'+w] = it;\n  });\n  return map;\n}\n\nfunction fits(r, ru, col, e, face, ignoreKey){\n  const hh=hOf(e), ww=wOf(e), h0=Math.round((ru-1)*HU);\n  if(h0<0 || col<0 || col+ww>WU) return false;\n  if(h0+hh > (r.ru||12)*HU) return false;\n  /* A whole-U device mounts on a U boundary. The EIA hole pattern repeats per\n     unit — 0.5 / 0.625 / 0.625 in — so there is nowhere to put the screws half\n     a unit up. Only half-U gear may sit on a half offset. This lives here and\n     not only in firstFit because the add path walks positions directly. */\n  if(hh % HU === 0 && h0 % HU !== 0) return false;\n  const near = occupancy(r, face);\n  /* a full-depth device has to clear the far face as well, where a shallow\n     device may be sitting that the near-face map never showed */\n  const far  = deepOf(e) ? occupancy(r, other(face)) : null;\n  for(let h=h0; h<h0+hh; h++) for(let w=col; w<col+ww; w++){\n    const a=near[h+'|'+w]; if(a && a.key!==ignoreKey) return false;\n    if(far){ const b=far[h+'|'+w]; if(b && b.key!==ignoreKey) return false; }\n  }\n  return true;\n}\n\n/* Lowest slot that takes it: up the rack, then left to right. A whole-U\n   device is kept on a U boundary — half-U offsets are for half-U gear. */\nfunction firstFit(r, e, face){\n  const hh=hOf(e), ww=wOf(e), maxH=(r.ru||12)*HU;\n  for(let h0=0; h0+hh<=maxH; h0++){\n    if(hh % HU === 0 && h0 % HU !== 0) continue;\n    for(let c=0; c+ww<=WU; c+=ww){\n      if(fits(r, h0/HU+1, c, e, face)) return {ru: h0/HU+1, col:c};\n    }\n  }\n  return null;\n}\n\n/* ── fill ──────────────────────────────────────────────────────────────\n   Reported as a fraction of the face's cells rather than as whole U's,\n   because with half-rack gear \"8 of 12 RU\" stopped being true. */\nfunction fill(r, face){\n  const occ=occupancy(r, face), total=(r.ru||12)*HU*WU;\n  const cells=Object.keys(occ).length;\n  return { cells, total, pct: total ? cells/total : 0, ru: cells/(HU*WU) };\n}\n\n/* ── the checks ───────────────────────────────────────────────────────────\n   Every one of these reports; none of them block. Net Plot's rule, and the\n   same reason: a deliberate exception happens, and the tool's job is to make\n   it visible rather than to refuse it. Each check goes quiet when the data\n   it needs is absent, so an unresearched device is never a false alarm. */\n/* Depth precedence: what you measured beats what the catalogue claims, and a\n   shell known only as \"16 RU\" has nothing to claim. One number, typed once,\n   turns the fit check on for a rack whose shell has no model number. */\nfunction depthOf(r){\n  if(r && r.railToRailIn) return {in:r.railToRailIn, from:'measured on this rack'};\n  const c=kase(r);\n  if(c && c.railToRailIn)  return {in:c.railToRailIn, from:esc(c.name)};\n  return null;\n}\n\nfunction checks(r){\n  const out=[], c=kase(r), items=(r.items||[]), d=depthOf(r);\n\n  if(d){\n    items.forEach(it=>{\n      const e=eq(it.gearId); if(!e || !e.depthIn) return;\n      if(e.depthIn > d.in)\n        out.push({k:'crit', t:`<b>${esc(it.label||e.name)} does not fit this rack.</b> `\n          +`${e.depthIn}″ deep against ${d.in}″ rail to rail — ${d.from}.`});\n    });\n  }else{\n    /* Not a nag — a statement of what is not being checked, and how to turn it\n       on. Most shells arrive from a rental vendor as a height and nothing else;\n       and where a maker does publish a depth it is not always comparable —\n       Gator define theirs as front rail to the inside of the rear lid, which is\n       larger than the usable span. Either way: no figure, no check. */\n    const why = c && c.generic ? `${esc(c.name)} is a vendor shell with no published depth`\n              : c && c.depthLabel ? `${esc(c.name)} publishes “${esc(c.depthLabel)}”, which is not a rail-to-rail span`\n              : c ? `${esc(c.name)} publishes no depth figure`\n              : 'no case is set';\n    const deepest = items.map(it=>eq(it.gearId)).filter(e=>e&&e.depthIn)\n                         .sort((a,b)=>b.depthIn-a.depthIn)[0];\n    out.push({k:'info', t:`<b>Depth is not being checked.</b> ${why}. `\n      +`Measure rail to rail once and put it in the Rack panel — that is all it needs.`\n      +(deepest?` The deepest thing in here is ${esc(deepest.name)} at ${deepest.depthIn}″.`:'')});\n  }\n\n  const wt = items.reduce((a,it)=>a+((eq(it.gearId)||{}).weightLb||0),0);\n  const unweighed = items.filter(it=>!((eq(it.gearId)||{}).weightLb)).length;\n  if(c && wt && !unweighed){\n    if(c.payloadMaxLb && wt > c.payloadMaxLb)\n      out.push({k:'crit', t:`<b>Over the case payload.</b> ${wt.toFixed(0)} lb of gear against `\n        +`${c.payloadMaxLb} lb. `+(c.shock?'Shock mounts are rated, not advisory.':'')});\n    else if(c.shock && c.payloadMinLb && wt < c.payloadMinLb)\n      out.push({k:'warn', t:`<b>Under the isolator band.</b> ${wt.toFixed(0)} lb against a `\n        +`${c.payloadMinLb}–${c.payloadMaxLb} lb rating. A shock rack below its band does not `\n        +`isolate — it bottoms out.`});\n  }\n\n  const f=fill(r,'front');\n  if(f.pct > FILL_LIMIT)\n    out.push({k:'warn', t:`<b>Front face is ${Math.round(f.pct*100)} % full.</b> AVIXA F502 `\n      +`practice caps a rack at ${FILL_LIMIT*100} % with blanks filling the rest, for airflow and `\n      +`for the next revision.`});\n\n  /* Only DIRECTIONS can conflict. A convection-cooled device has no direction\n     and fights nothing, so it is excluded rather than counted as a third camp. */\n  const DIRECTED={'front-to-rear':1,'rear-to-front':1,'side-vented':1};\n  const flows={};\n  items.forEach(it=>{ const e=eq(it.gearId);\n    if(e && e.airflow && DIRECTED[e.airflow]) (flows[e.airflow]=flows[e.airflow]||[]).push(it.label||e.name); });\n  if(Object.keys(flows).length>1)\n    out.push({k:'warn', t:`<b>Mixed airflow in one case.</b> `\n      +Object.entries(flows).map(([k,v])=>esc(k)+' — '+v.length+(v.length===1?' device':' devices')).join('; ')\n      +`. One device is eating another's exhaust.`});\n\n  const watts = items.reduce((a,it)=>a+((eq(it.gearId)||{}).powerW||0),0);\n  if(watts) out.push({k:'info', t:`<b>${watts} W maximum draw</b> — ${Math.round(watts*3.412)} BTU/hr, `\n    +`${(watts/120).toFixed(1)} A at 120 V. A 20 A circuit runs continuous to 16 A.`});\n\n  return out;\n}\n\n/* Every universe assigned anywhere, and where. Duplicates are the finding —\n   the same universe on two ports is nearly always a mistake, and nothing\n   else in the suite would catch it. */\nfunction universeIndex(){\n  const idx = {};\n  S.racks.forEach(r=>(r.items||[]).forEach(it=>{\n    Object.entries(it.ports||{}).forEach(([pid,p])=>{\n      const u=(p.universe||'').trim(); if(!u) return;\n      (idx[u]=idx[u]||[]).push({rack:r.name, item:it.label||(eq(it.gearId)||{}).name, port:pid});\n    });\n  }));\n  return idx;\n}\n\nfunction counts(){\n  let items=0, ru=0, usedCells=0, totalCells=0, ports=0, patched=0, halfw=0, rear=0;\n  S.racks.forEach(r=>{\n    ru += (r.ru||12);\n    totalCells += (r.ru||12)*HU*WU;\n    usedCells  += fill(r,'front').cells;\n    (r.items||[]).forEach(it=>{\n      const e=eq(it.gearId); if(!e) return;\n      items++;\n      if(wKeyOf(e)!=='full') halfw++;\n      if(faceOf(it)==='rear') rear++;\n      const out=(e.ports||[]).filter(p=>p.type==='output');\n      ports += out.length;\n      out.forEach(p=>{ const pp=(it.ports||{})[p.id]; if(pp && (pp.universe||pp.label)) patched++; });\n    });\n  });\n  const dupes = Object.values(universeIndex()).filter(a=>a.length>1).length;\n  return {racks:S.racks.length, items, ru, ports, patched, dupes, halfw, rear,\n          used: usedCells/(HU*WU), pct: totalCells ? usedCells/totalCells : 0};\n}\n\n/* ── render ───────────────────────────────────────────────────────────── */\nfunction render(){\n  $('tabs').innerHTML=[['build','Racks'],['patch','Patch sheet']]\n    .map(([k,l])=>`<button data-tab=\"${k}\"${S.tab===k?' class=\"on\"':''}>${l}</button>`).join('');\n  $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});\n\n  const r=$('root');\n  if(!S.loaded){ r.innerHTML='<div class=\"empty\"><div class=\"big\">Loading…</div></div>'; return; }\n  if(!window.KTM){\n    r.innerHTML='<div class=\"note crit\"><b>No shared data layer.</b> Rack Plot reads the rack '\n      +'equipment catalog from the Hub. Open it from inside the KTM Hub rather than on its own.</div>';\n    return;\n  }\n  if(!S.equip.length){\n    r.innerHTML='<div class=\"empty\"><div class=\"big\">Rack equipment catalog is empty</div>'\n      +'<div>Seed <span class=\"mono\">gear/rack-equipment</span> in the Hub first.</div></div>';\n    return;\n  }\n  r.innerHTML = S.tab==='build' ? viewBuild() : viewPatch();\n  S.tab==='build' ? wireBuild() : null;\n}\n\nfunction viewBuild(){\n  const c=counts();\n  let h='';\n  if(!S.show) h+='<div class=\"note warn\"><b>No show selected.</b> You can lay racks out freely, '\n    +'but saving needs a show — pick one at the top of the Hub.</div>';\n\n  h+='<div class=\"stats\">'\n   + st('Racks',c.racks) + st('Devices',c.items)\n   + st('Face used',c.used.toFixed(1)+'<small> / '+c.ru+' RU</small>')\n   + st('Outputs',c.ports) + st('Patched',c.patched)\n   + (c.halfw?st('Part width',c.halfw):'')\n   + (c.rear?st('Rear mounted',c.rear):'')\n   + (c.dupes?st('Duplicate universes',c.dupes,'flag'):'')\n   + '</div>';\n\n  if(c.dupes){\n    const dl=Object.entries(universeIndex()).filter(([,a])=>a.length>1);\n    h+='<div class=\"note warn\"><b>'+c.dupes+' universe'+(c.dupes===1?'':'s')+' assigned to more than '\n     +'one port.</b> '+dl.slice(0,3).map(([u,a])=>esc(u)+' on '+a.length+' ports').join('; ')\n     +(dl.length>3?` and ${dl.length-3} more`:'')\n     +'. Sometimes deliberate for a split, usually not.</div>';\n  }\n\n  h+='<div class=\"cols\"><div class=\"side\">';\n\n  // rack list + add\n  h+='<div class=\"card\"><h4>Racks</h4>'\n   + (S.racks.length\n      ? S.racks.map((r,i)=>`<button class=\"racktab${r.id===S.cur?' on':''}\" data-rk=\"${esc(r.id)}\">`\n         + `<span class=\"sq\" style=\"background:var(${r.color||COLORS[i%COLORS.length]})\"></span>`\n         + `<span>${esc(r.name||'Rack')}</span>`\n         + `<span class=\"n\">${(r.items||[]).length} · ${r.ru||12}RU</span></button>`).join('')\n      : '<div class=\"muted\" style=\"font-size:12px;margin-bottom:8px\">No racks yet.</div>')\n   + '<div style=\"display:flex;gap:6px;margin-top:9px\">'\n   + '<input type=\"text\" id=\"newrack\" placeholder=\"Rack name\" style=\"flex:1;min-width:0\">'\n   + '<input type=\"number\" id=\"newru\" value=\"12\" min=\"1\" max=\"45\" style=\"width:62px\" title=\"RU\">'\n   + '<button class=\"btn sm\" id=\"addrack\">Add</button></div></div>';\n\n  const r=rack();\n  if(r){\n    h+='<div class=\"card\"><h4>Adding gear</h4>'\n     + '<div class=\"muted\" style=\"font-size:12px;line-height:1.55\">'\n     + '<b style=\"color:var(--ink)\">Click any empty space in the rack.</b> It asks what goes '\n     + 'there and offers only what actually fits that slot on that face. Click a device to '\n     + 'jump to its ports.</div></div>'\n\n     + '<div class=\"card\"><h4>Rack</h4>'\n     + `<div style=\"display:flex;gap:6px;margin-bottom:6px\"><input type=\"text\" id=\"rkname\" value=\"${esc(r.name||'')}\" style=\"flex:1;min-width:0\">`\n     + `<input type=\"number\" id=\"rkru\" value=\"${r.ru||12}\" min=\"1\" max=\"45\" style=\"width:62px\"></div>`\n     + '<select id=\"rkcase\" style=\"width:100%;margin-bottom:6px\">'\n     + `<option value=\"\"${!r.caseId?' selected':''}>No case — open frame</option>`\n     + caseOptions(r)\n     + '</select>'\n     + '<div style=\"display:flex;gap:6px;align-items:center;margin-bottom:6px\">'\n     + `<input type=\"number\" id=\"rkdepth\" value=\"${r.railToRailIn||''}\" min=\"4\" max=\"48\" step=\"0.25\" `\n     + `placeholder=\"—\" style=\"width:72px\" title=\"Rail to rail, inches\">`\n     + '<span class=\"muted\" style=\"font-size:11px;line-height:1.35\">Rail-to-rail depth, if you '\n     + 'have measured it. Overrides the case.</span></div>'\n     + caseFacts(r)\n     + '<button class=\"btn danger sm\" id=\"delrack\">Delete rack</button></div>';\n  }\n  h+='</div><div>';\n\n  if(!r){\n    h+='<div class=\"empty\"><div class=\"big\">No rack selected</div>'\n     + '<div>Add one on the left. Equipment comes from the shared catalog, so RU heights, widths '\n     + 'and port maps are the same numbers every tool uses.</div></div>';\n  }else{\n    const chk=checks(r);\n    if(chk.length) h+='<div class=\"chks\">'+chk.map(x=>`<div class=\"note ${x.k}\">${x.t}</div>`).join('')+'</div>';\n\n    const f=fill(r,S.face);\n    h+=`<div class=\"elev\"><div class=\"elevhead\"><b>${esc(r.name||'Rack')}</b>`\n     + `<span class=\"m\">${r.ru||12} RU</span>`\n     + `<span class=\"m\">${(r.items||[]).length} devices</span>`\n     + `<span class=\"m mono\">${f.ru.toFixed(1)} RU of face used · ${Math.round(f.pct*100)} %</span>`\n     + `<span class=\"grow\"></span>`\n     + `<div class=\"seg facesel\">`\n     + `<button data-face=\"front\"${S.face==='front'?' class=\"on\"':''}>Front</button>`\n     + `<button data-face=\"rear\"${S.face==='rear'?' class=\"on\"':''}>Rear</button></div>`\n     + `</div>`\n     + elevationSVG(r, S.face)\n     + `<div class=\"legend\">`\n     + `<span><i class=\"sw\"></i>Hatched — free, but shallow gear only: the ${other(S.face)} face `\n     + `is occupied behind it, so nothing full-depth will fit</span>`\n     + `<span><i class=\"sw solid\"></i>Faded with a dashed edge — a full-depth device mounted on the `\n     + `${other(S.face)} face, seen from behind</span></div>`\n     + '</div>';\n\n    (r.items||[]).slice()\n      .sort((a,b)=> (h0Of(b)-h0Of(a)) || (colOf(a)-colOf(b)))\n      .forEach(it=>{ h+=deviceCard(r,it); });\n  }\n  return h+'</div></div>'+placeModal();\n}\n\n\n/* ── free space, as something you can click ───────────────────────────────\n   The grid is half-U by sixths, which on a 16 RU rack is 192 cells. That is\n   not a click target — a gap is. So empty cells are merged into runs across,\n   then into blocks down, and each block is cut into thirds so a click lands\n   somewhere meaningful: left, middle, right. The chosen device then snaps to\n   its own slot grid inside that block. */\nfunction freeBlocks(r, face){\n  const occ=occupancy(r,face), maxH=(r.ru||12)*HU, out=[];\n  const free=(h,c)=> h>=0 && h<maxH && !occ[h+'|'+c];\n  /* the horizontal free run containing (h,c) */\n  const run=(h,c)=>{ let a=c; while(a>0 && free(h,a-1)) a--;\n                     let b=c; while(b<WU && free(h,b)) b++; return [a,b]; };\n  for(let u=0; u*HU<maxH; u++){\n    for(let c=0; c<WU; c+=2){                 /* thirds: left, middle, right */\n      const lo=u*HU, hi=lo+1;\n      const loFree = free(lo,c) && free(lo,c+1);\n      const hiFree = free(hi,c) && free(hi,c+1);\n      if(loFree && hiFree){                   /* a whole free U — one target */\n        const [a0,b0]=run(lo,c), [a1,b1]=run(hi,c);\n        out.push({h:lo, hh:HU, c0:c, c1:c+2, bc0:Math.max(a0,a1), bc1:Math.min(b0,b1)});\n      }else{                                  /* only half of it — two targets */\n        if(loFree){ const [a,b]=run(lo,c); out.push({h:lo, hh:1, c0:c, c1:c+2, bc0:a, bc1:b}); }\n        if(hiFree){ const [a,b]=run(hi,c); out.push({h:hi, hh:1, c0:c, c1:c+2, bc0:a, bc1:b}); }\n      }\n    }\n  }\n  return out;\n}\n\n/* What could go in the slot you clicked. Runs the real fits() rather than a\n   size comparison, so a full-depth device is excluded when the far face is\n   occupied behind it — the same rule that governs placement. */\nfunction candidatesAt(r, t, face){\n  return S.equip.filter(e=>{\n    const ww=wOf(e);\n    for(let c=t.bc0; c+ww<=t.bc1; c+=ww)\n      if(fits(r, t.h/HU+1, c, e, face)) return true;\n    /* also allow a device whose own slot grid starts before the block */\n    const snap=Math.floor(t.c0/ww)*ww;\n    return snap>=0 && fits(r, t.h/HU+1, snap, e, face);\n  });\n}\nfunction colFor(r, t, e, face){\n  const ww=wOf(e), ru=t.h/HU+1;\n  const snap=Math.floor(t.c0/ww)*ww;\n  if(fits(r, ru, snap, e, face)) return snap;\n  for(let c=t.bc0; c+ww<=t.bc1; c+=ww) if(fits(r, ru, c, e, face)) return c;\n  return null;\n}\n\n/* ── the picker ───────────────────────────────────────────────────────────\n   Opened by clicking a gap, and it only ever offers what actually fits there.\n   Nothing that would not go in is listed, so there is no way to pick a thing\n   and be told no. */\nfunction placeModal(){\n  const t=S.place; if(!t) return '';\n  const r=rack(); if(!r) return '';\n  const face=t.face, ru=t.h/HU+1;\n  const all=candidatesAt(r, t, face);\n  const q=(S.placeQ||'').toLowerCase();\n  const list=q ? all.filter(e=>(e.name+' '+(e.manufacturer||'')+' '+(e.model||'')).toLowerCase().includes(q)) : all;\n\n  const top = Math.floor((t.h+t.hh-1)/HU)+1;\n  const half = t.hh===1 && t.h%HU;\n  const where = `RU ${half ? ru-0.5+'\\u00bd' : ru}${top>ru ? '\\u2013'+top : ''}`\n    + ` \\u00b7 ${face} face \\u00b7 ${Math.round((t.bc1-t.bc0)/WU*100)}% of the width free`;\n\n  const by={};\n  list.forEach(e=>{ const c=e.category||'gear'; (by[c]=by[c]||[]).push(e); });\n\n  return '<div class=\"scrim\" id=\"placescrim\"><div class=\"picker\">'\n   + `<div class=\"pickhead\"><b>What goes here?</b><span class=\"m\">${esc(where)}</span>`\n   + `<span class=\"grow\"></span><button class=\"btn ghost sm\" id=\"placeclose\">Close</button></div>`\n   + `<input type=\"text\" id=\"placeq\" placeholder=\"Search the library…\" value=\"${esc(S.placeQ||'')}\" autofocus>`\n   + (list.length\n      ? '<div class=\"picklist\">' + CAT_ORDER.filter(c=>by[c]).map(c=>\n          `<div class=\"pickcat\">${esc(CAT_LABEL[c]||c)}</div>`\n          + by[c].map(e=>`<button class=\"pickrow\" data-put=\"${esc(e.id)}\">`\n             + `<span class=\"nm\">${esc(e.name)}</span>`\n             + `<span class=\"sp\">${e.ruHeight||1}RU`\n             + (wKeyOf(e)!=='full' ? ' · '+WIDTH_LABEL[wKeyOf(e)] : '')\n             + (e.depthIn ? ' · '+e.depthIn+'″' : '')\n             + (deepOf(e) ? '' : ' · shallow')\n             + `</span></button>`).join('')).join('')\n        + '</div>'\n      : `<div class=\"empty\" style=\"padding:26px\"><div class=\"big\">Nothing fits here</div>`\n        + `<div>${all.length ? 'Nothing matches that search.' : 'This gap is too small for anything in the library.'}</div></div>`)\n   + `<div class=\"pickfoot\"><input type=\"text\" id=\"placelabel\" placeholder=\"Label, e.g. NODE 1 (optional)\">`\n   + `</div></div></div>`;\n}\n\nconst CAT_LABEL = { gear:'Gear', blank:'Blanking panels', vent:'Vent panels', fan:'Fan panels',\n                    shelf:'Shelves', din:'DIN rail panels', connector:'Connector panels',\n                    pdu:'Power', ups:'UPS', panel:'Panels' };\nconst CAT_ORDER = ['gear','connector','pdu','ups','shelf','din','vent','fan','blank','panel'];\n\nfunction eqOptions(sel){\n  const by={};\n  S.equip.forEach(e=>{ const c=e.category||'gear'; (by[c]=by[c]||[]).push(e); });\n  return CAT_ORDER.filter(c=>by[c]).map(c=>\n    `<optgroup label=\"${esc(CAT_LABEL[c]||c)}\">`\n    + by[c].map(e=>`<option value=\"${esc(e.id)}\"${sel&&e.id===sel.id?' selected':''}>`\n       + `${esc(e.name)} · ${e.ruHeight||1}RU`\n       + (wKeyOf(e)!=='full' ? ' · '+WIDTH_LABEL[wKeyOf(e)] : '')\n       + (deepOf(e) ? '' : ' · shallow')\n       + (e.depthIn ? ' · '+e.depthIn+'″' : '')\n       + (e.portCount ? ' · '+e.portCount+' ports' : '')\n       + `</option>`).join('')\n    + '</optgroup>').join('');\n}\n\n/* Slot picker. Offers only the columns a device of this width can start in,\n   so a half-rack device gets left/right and a third gets three — rather than\n   six positions, four of which straddle. */\nfunction slotSelect(r, e){\n  if(!e) return '';\n  const ww=wOf(e);\n  if(ww===WU) return '<input type=\"hidden\" id=\"eqcol\" value=\"0\">';\n  const n=Math.floor(WU/ww), names = n===2 ? ['Left','Right'] : ['Left','Centre','Right'];\n  let s='<select id=\"eqcol\" style=\"flex:1\">';\n  for(let i=0;i<n;i++) s+=`<option value=\"${i*ww}\">${names[i]||('Slot '+(i+1))}</option>`;\n  return s+'</select>';\n}\n\n/* Shells first. A rack shell usually arrives as a height and nothing else, so\n   that is the top of the list; an identified case is the exception, not the\n   default, and its figures are worth having when you do know the model. */\nfunction caseOptions(r){\n  const gen = S.cases.filter(c=>c.generic), rest = S.cases.filter(c=>!c.generic);\n  const opt = c => `<option value=\"${esc(c.id)}\"${r.caseId===c.id?' selected':''}>`\n    + esc(c.name) + (c.railToRailIn?' · '+c.railToRailIn+'″':'') + '</option>';\n  let h = gen.length ? '<optgroup label=\"Rental stock — by height\">'+gen.map(opt).join('')+'</optgroup>' : '';\n  const byBrand={};\n  rest.forEach(c=>{ (byBrand[c.brand||'Other']=byBrand[c.brand||'Other']||[]).push(c); });\n  Object.keys(byBrand).sort().forEach(b=>{\n    h += `<optgroup label=\"${esc(b)}\">` + byBrand[b].map(opt).join('') + '</optgroup>';\n  });\n  return h;\n}\n\nfunction caseFacts(r){\n  const c=kase(r); if(!c) return '';\n  if(c.generic) return '<div class=\"muted\" style=\"font-size:11px;margin-bottom:8px;line-height:1.5\">'\n    + 'Height only — nothing asserted about depth, weight or payload.</div>';\n  const bits=[];\n  if(c.railToRailIn)    bits.push(c.railToRailIn+'″ rail to rail');\n  else if(c.depthLabel) bits.push('depth: '+c.depthLabel);\n  if(c.outsideDepthIn)  bits.push(c.outsideDepthIn+'″ outside');\n  if(c.emptyLb)         bits.push(c.emptyLb+' lb empty');\n  if(c.payloadMaxLb)    bits.push('payload '+(c.payloadMinLb?c.payloadMinLb+'–':'≤ ')+c.payloadMaxLb+' lb');\n  if(!bits.length) return '';\n  return '<div class=\"muted\" style=\"font-size:11px;margin-bottom:8px;line-height:1.5\">'\n    + bits.join(' · ') + (c.status?` <span class=\"chip ${esc(c.status)}\">${esc(c.status)}</span>`:'') + '</div>';\n}\n\n/* Rack elevation for one face. Cage-nut rails, RU numbers up the left,\n   devices as blocks. Drawn bottom-up because that is how a rack is counted,\n   and in half-U rows because half-U devices exist. Geometry is expressed in\n   the viewBox, never in fixed pixels — NetBox's own elevation bugs were all\n   pixel-rounding at fractional unit heights. */\nfunction elevationSVG(r, face){\n  const RU=r.ru||12, UH=22, HH=UH/2, W=560, RAIL=17, PAD=26;\n  const H=RU*UH, IW=W-RAIL*2, X0=PAD+RAIL;\n  const colX = c => X0 + (c/WU)*IW;\n  const near = occupancy(r, face);\n\n  let s=`<svg viewBox=\"0 0 ${W+PAD*2} ${H+PAD*2}\" role=\"img\" `\n   + `aria-label=\"Rack elevation, ${face} face, ${RU} RU\">`\n   + `<defs><pattern id=\"gh\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">`\n   + `<line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"var(--line-strong)\" stroke-width=\"1.6\"/></pattern></defs>`;\n\n  s+=`<rect x=\"${PAD}\" y=\"${PAD}\" width=\"${W}\" height=\"${H}\" fill=\"var(--sunken)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\" rx=\"3\"/>`;\n\n  [PAD, PAD+W-RAIL].forEach(x=>{\n    s+=`<rect x=\"${x}\" y=\"${PAD}\" width=\"${RAIL}\" height=\"${H}\" fill=\"var(--rail)\"/>`;\n    /* Three holes per U at the EIA 0.5 / 0.625 / 0.625 in pitch, not evenly\n       spaced — the wide gap is the boundary between units. */\n    for(let u=0;u<RU;u++){\n      const base=PAD+H-(u*UH);\n      [0.25,0.875,1.5].forEach(o=>{\n        s+=`<rect x=\"${x+RAIL/2-2}\" y=\"${base-(o/1.75)*UH-1.6}\" width=\"4\" height=\"3.2\" rx=\"1\" fill=\"var(--rail-2)\"/>`;\n      });\n    }\n  });\n\n  for(let u=1;u<=RU;u++){\n    const cy=PAD+H-((u-1)*UH)-UH/2;\n    s+=`<text x=\"${PAD-5}\" y=\"${cy+3.4}\" font-size=\"8.5\" fill=\"var(--ink-3)\" text-anchor=\"end\" `\n     + `font-family=\"IBM Plex Mono,monospace\">${u}</text>`;\n    const h0=(u-1)*HU;\n    let empty=true;\n    for(let h=h0;h<h0+HU;h++) for(let w=0;w<WU;w++) if(near[h+'|'+w]) empty=false;\n    if(empty)\n      s+=`<line x1=\"${X0}\" y1=\"${cy+UH/2}\" x2=\"${PAD+W-RAIL}\" y2=\"${cy+UH/2}\" `\n       + `stroke=\"var(--line)\" stroke-width=\"0.5\" stroke-dasharray=\"2 3\"/>`;\n  }\n\n  /* Ghosts first, so a real device always draws over them. A hatched slot is\n     NOT occupied — a shallow device on the far face leaves this one free. What\n     it means is that the far face is spoken for, so only shallow gear can go\n     here: a full-depth device would have to clear both faces and fits() will\n     refuse it. Drawn light, because free-but-constrained is not the same as\n     taken, and a hatch that reads as \"occupied\" would be a lie. */\n  (r.items||[]).forEach(it=>{\n    const e=eq(it.gearId); if(!e) return;\n    if(faceOf(it)===face || deepOf(e)) return;\n    const hh=hOf(e), y=PAD+H-(h0Of(it)+hh)*HH, x=colX(colOf(it)), w=(wOf(e)/WU)*IW;\n    s+=`<g opacity=\"0.34\"><rect x=\"${x+1}\" y=\"${y+1}\" width=\"${w-2}\" height=\"${hh*HH-2}\" rx=\"2.5\" `\n     + `fill=\"url(#gh)\" fill-opacity=\"0.35\" stroke=\"var(--line-strong)\" stroke-width=\"1\" stroke-dasharray=\"3 2\"/>`\n     + `<title>${esc(it.label||e.name)} is on the ${other(face)} face and is shallow — `\n     + `this slot is free, but only for shallow gear</title></g>`;\n  });\n\n  /* Gaps are the primary input: one target per third of each free block. */\n  freeBlocks(r, face).forEach(t=>{\n    const y=PAD+H-(t.h+t.hh)*HH, x=colX(t.c0), w=((t.c1-t.c0)/WU)*IW;\n    s+=`<g class=\"slot\" data-slot=\"${t.h}|${t.hh}|${t.c0}|${t.c1}|${t.bc0}|${t.bc1}\">`\n     + `<rect x=\"${x+1}\" y=\"${y+1}\" width=\"${w-2}\" height=\"${t.hh*HH-2}\" rx=\"2.5\"/>`\n     + `<text x=\"${x+w/2}\" y=\"${y+t.hh*HH/2+4}\" text-anchor=\"middle\" font-size=\"12\">+</text>`\n     + `<title>Add something here</title></g>`;\n  });\n\n  (r.items||[]).forEach((it,i)=>{\n    const e=eq(it.gearId); if(!e) return;\n    if(faceOf(it)!==face && !deepOf(e)) return;\n    const hh=hOf(e), ww=wOf(e);\n    const y=PAD+H-(h0Of(it)+hh)*HH, x=colX(colOf(it)), w=(ww/WU)*IW;\n    const behind = faceOf(it)!==face;            /* full depth, seen from its back */\n    const col=`var(${it.color||COLORS[i%COLORS.length]})`;\n    const outs=(e.ports||[]).filter(p=>p.type==='output');\n    const done=outs.filter(p=>{const pp=(it.ports||{})[p.id]; return pp&&(pp.universe||pp.label);}).length;\n    const tight = hh===1 || ww<=2;\n    const fs = tight ? 8.5 : 10.5;\n    s+=`<g class=\"dev${S.sel===it.key?' sel':''}\" data-dev=\"${esc(it.key)}\">`\n     + `<rect x=\"${x+1}\" y=\"${y+1}\" width=\"${w-2}\" height=\"${hh*HH-2}\" rx=\"2.5\" `\n     + `fill=\"${col}\" fill-opacity=\"${behind?0.42:0.86}\" stroke=\"var(--surface)\" stroke-width=\"1\"`\n     + (behind?' stroke-dasharray=\"4 2\"':'')+`/>`\n     + `<text x=\"${x+8}\" y=\"${y+hh*HH/2+fs/3}\" font-size=\"${fs}\" fill=\"#fff\" `\n     + `font-family=\"IBM Plex Sans,sans-serif\" font-weight=\"600\">${esc(it.label||e.name)}</text>`;\n    /* An unlabelled item falls back to the catalog name on the left, so don't\n       print the same string again on the right. */\n    const rhs = (it.label && it.label !== e.name) ? e.name\n              : (outs.length ? '' : null);\n    if(!tight && rhs !== null)\n      s+=`<text x=\"${x+w-8}\" y=\"${y+hh*HH/2+3.4}\" font-size=\"8.5\" fill=\"#fff\" fill-opacity=\"0.9\" `\n       + `text-anchor=\"end\" font-family=\"IBM Plex Mono,monospace\">${esc(rhs)}`\n       + (outs.length?`  ${done}/${outs.length}`:'')+`</text>`;\n    s+=`<title>${esc(e.name)} · RU ${ruLabel(it)} · ${WIDTH_LABEL[wKeyOf(e)]} · ${faceOf(it)} face`\n     + (deepOf(e)?' · full depth':'')+(e.depthIn?` · ${e.depthIn}″`:'')+`</title></g>`;\n  });\n  return s+'</svg>';\n}\n\n/* Per-device port editor. Inputs write straight to the model and repaint\n   nothing — see the note at the top about why. */\nfunction deviceCard(r,it){\n  const e=eq(it.gearId); if(!e) return '';\n  const outs=(e.ports||[]);\n  const ww=wOf(e), canSlide = ww<WU;\n  const meta=[esc(e.name), 'RU '+ruLabel(it), WIDTH_LABEL[wKeyOf(e)], faceOf(it)+' face'];\n  if(!deepOf(e)) meta.push('shallow');\n  if(e.depthIn) meta.push(e.depthIn+'″ deep');\n  if(e.weightLb) meta.push(e.weightLb+' lb');\n  return `<div class=\"card${S.sel===it.key?' sel':''}\" id=\"card-${esc(it.key)}\">`\n   + `<div style=\"display:flex;align-items:center;gap:9px;margin-bottom:2px;flex-wrap:wrap\">`\n   + `<b style=\"font-family:Archivo,sans-serif;font-size:13.5px\">${esc(it.label||e.name)}</b>`\n   + `<span class=\"muted\" style=\"font-size:11.5px\">${meta.join(' · ')}</span>`\n   + (e.hasIp?`<input type=\"text\" data-ip=\"${esc(it.key)}\" value=\"${esc(it.ip||'')}\" placeholder=\"IP\" `\n      + `class=\"mono\" style=\"width:118px;font-size:11.5px;padding:3px 6px\">`:'')\n   + `<span class=\"grow\"></span>`\n   + `<button class=\"btn ghost sm\" data-fc=\"${esc(it.key)}\" title=\"Flip to the other face\">⇄ ${faceOf(it)==='front'?'rear':'front'}</button>`\n   + (canSlide?`<button class=\"btn ghost sm\" data-sl=\"${esc(it.key)}\" data-d=\"-1\" title=\"Slide left\">◀</button>`\n      + `<button class=\"btn ghost sm\" data-sl=\"${esc(it.key)}\" data-d=\"1\" title=\"Slide right\">▶</button>`:'')\n   + `<button class=\"btn ghost sm\" data-mv=\"${esc(it.key)}\" data-d=\"1\" title=\"Up a half U\">▲</button>`\n   + `<button class=\"btn ghost sm\" data-mv=\"${esc(it.key)}\" data-d=\"-1\" title=\"Down a half U\">▼</button>`\n   + `<button class=\"btn danger sm\" data-rm=\"${esc(it.key)}\">Remove</button></div>`\n   + `<div class=\"ports\">`\n   + outs.map(p=>{\n      const pp=(it.ports||{})[p.id]||{};\n      const used=!!(pp.universe||pp.label);\n      return `<div class=\"port${used?' used':''}\">`\n       + `<div class=\"pn\"><span class=\"pdot ${esc(p.type||'output')}\"></span>${esc(p.name||p.id)}`\n       + (p.face?`<span class=\"pf\">${esc(p.face)}</span>`:'')+`</div>`\n       + (p.type==='output'||p.type==='input'\n          ? `<input type=\"text\" data-pu=\"${esc(it.key)}|${esc(p.id)}\" value=\"${esc(pp.universe||'')}\" placeholder=\"Universe\" class=\"mono\">` : '')\n       + `<input type=\"text\" data-pl=\"${esc(it.key)}|${esc(p.id)}\" value=\"${esc(pp.label||'')}\" placeholder=\"Goes to…\">`\n       + `</div>`;\n     }).join('')\n   + `</div></div>`;\n}\n\nfunction wireBuild(){\n  const ar=$('addrack');\n  if(ar) ar.onclick=()=>{\n    const nm=($('newrack').value||'').trim()||('Rack '+(S.racks.length+1));\n    const ru=Math.max(1,Math.min(45,parseInt($('newru').value||'12',10)||12));\n    const id='rack-'+uid();\n    S.racks.push({id, name:nm, ru, caseId:null, color:COLORS[S.racks.length%COLORS.length], items:[]});\n    S.cur=id; S.dirty=true; render();\n  };\n  document.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.rk;render();});\n  document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{S.face=b.dataset.face;render();});\n\n  /* ── click a gap ─────────────────────────────────────────────────────── */\n  document.querySelectorAll('[data-slot]').forEach(g=>g.onclick=()=>{\n    const [h,hh,c0,c1,bc0,bc1]=g.dataset.slot.split('|').map(Number);\n    S.place={h,hh,c0,c1,bc0,bc1,face:S.face}; S.placeQ=''; render();\n    const q=$('placeq'); if(q) q.focus();\n  });\n\n  /* ── click a device: jump to its ports ───────────────────────────────── */\n  document.querySelectorAll('[data-dev]').forEach(g=>g.onclick=()=>{\n    S.sel = S.sel===g.dataset.dev ? null : g.dataset.dev;\n    render();\n    const c=$('card-'+S.sel);\n    if(c) c.scrollIntoView({block:'nearest', behavior:'smooth'});\n  });\n\n  /* ── the picker ──────────────────────────────────────────────────────── */\n  const close=()=>{ S.place=null; S.placeQ=''; render(); };\n  const pc=$('placeclose'); if(pc) pc.onclick=close;\n  const ps=$('placescrim'); if(ps) ps.onclick=ev=>{ if(ev.target===ps) close(); };\n  const pq=$('placeq'); if(pq){\n    pq.oninput=()=>{ S.placeQ=pq.value; const at=pq.selectionStart; render();\n      const n=$('placeq'); if(n){ n.focus(); n.setSelectionRange(at,at); } };\n    pq.onkeydown=ev=>{ if(ev.key==='Escape') close(); };\n  }\n  document.querySelectorAll('[data-put]').forEach(b=>b.onclick=()=>{\n    const r=rack(), t=S.place; if(!r||!t) return;\n    const e=eq(b.dataset.put); if(!e) return;\n    const col=colFor(r, t, e, t.face);\n    if(col===null){ alert('That no longer fits here.'); return; }\n    const label=(($('placelabel')||{}).value||'').trim()||null;\n    const key='i-'+uid();\n    r.items=r.items||[];\n    r.items.push({key, gearId:e.id, ru:t.h/HU+1, col, face:t.face, label,\n                  color:COLORS[r.items.length%COLORS.length], ip:null, ports:{}});\n    S.place=null; S.placeQ=''; S.sel=key; S.dirty=true; render();\n  });\n\n  const rn=$('rkname'); if(rn) rn.onchange=()=>{const r=rack(); if(r){r.name=rn.value;S.dirty=true;render();}};\n  const rc=$('rkcase'); if(rc) rc.onchange=()=>{\n    const r=rack(); if(!r) return;\n    r.caseId = rc.value || null;\n    const c=kase(r);\n    /* A shell's height is the one thing it does know. Adopt it unless that\n       would evict something already mounted. */\n    if(c && c.ru){\n      const tallest=(r.items||[]).reduce((a,it)=>Math.max(a, h0Of(it)+hOf(eq(it.gearId)||{})),0)/HU;\n      if(c.ru >= tallest) r.ru=c.ru;\n    }\n    S.dirty=true; render();\n  };\n  const rd=$('rkdepth'); if(rd) rd.onchange=()=>{\n    const r=rack(); if(!r) return;\n    const v=parseFloat(rd.value);\n    r.railToRailIn = (isFinite(v) && v>0) ? v : null;\n    S.dirty=true; render();\n  };\n  const rr=$('rkru');   if(rr) rr.onchange=()=>{\n    const r=rack(); if(!r) return;\n    const v=Math.max(1,Math.min(45,parseInt(rr.value||'12',10)||12));\n    const tallest=(r.items||[]).reduce((a,it)=>Math.max(a, h0Of(it)+hOf(eq(it.gearId)||{})),0)/HU;\n    if(v<tallest){ alert('Cannot shrink below RU '+Math.ceil(tallest)+' — a device is mounted there.'); rr.value=r.ru; return; }\n    r.ru=v; S.dirty=true; render();\n  };\n  const dr=$('delrack'); if(dr) dr.onclick=()=>{\n    const r=rack(); if(!r) return;\n    if(!confirm('Delete \"'+(r.name||'rack')+'\" and its '+(r.items||[]).length+' devices?')) return;\n    S.racks=S.racks.filter(x=>x.id!==r.id); S.cur=S.racks[0]?S.racks[0].id:null; S.dirty=true; render();\n  };\n\n  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{\n    const r=rack(); r.items=r.items.filter(x=>x.key!==b.dataset.rm); S.dirty=true; render();\n  });\n  /* Vertical moves step a HALF U, so half-rack gear can sit against either\n     half of a unit and whole-U gear still lands on a boundary. */\n  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{\n    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.mv); if(!it) return;\n    const e=eq(it.gearId); if(!e) return;\n    const step = hOf(e)%HU===0 ? 1 : 0.5, d=+b.dataset.d*step;\n    if(fits(r, (it.ru||1)+d, colOf(it), e, faceOf(it), it.key)){ it.ru=(it.ru||1)+d; S.dirty=true; render(); }\n  });\n  document.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{\n    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.sl); if(!it) return;\n    const e=eq(it.gearId); if(!e) return;\n    const c=colOf(it)+(+b.dataset.d)*wOf(e);\n    if(fits(r, it.ru||1, c, e, faceOf(it), it.key)){ it.col=c; S.dirty=true; render(); }\n  });\n  document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{\n    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.fc); if(!it) return;\n    const e=eq(it.gearId); if(!e) return;\n    const f=other(faceOf(it));\n    if(!fits(r, it.ru||1, colOf(it), e, f, it.key)){ alert('That slot is taken on the '+f+' face.'); return; }\n    it.face=f; S.face=f; S.dirty=true; render();\n  });\n\n  /* No re-render on these. Pre-Pro's lesson: a render() on input destroys the\n     DOM mid-edit and kills tab order. Write the model, leave the DOM alone. */\n  document.querySelectorAll('[data-pu],[data-pl]').forEach(inp=>inp.oninput=()=>{\n    const isU=inp.hasAttribute('data-pu');\n    const [k,pid]=(isU?inp.dataset.pu:inp.dataset.pl).split('|');\n    const r=rack(), it=(r.items||[]).find(x=>x.key===k); if(!it) return;\n    it.ports=it.ports||{}; it.ports[pid]=Object.assign({},it.ports[pid],\n      isU?{universe:inp.value}:{label:inp.value});\n    inp.closest('.port').classList.toggle('used',\n      !!((it.ports[pid].universe||'')||(it.ports[pid].label||'')));\n    S.dirty=true;\n  });\n  document.querySelectorAll('[data-ip]').forEach(inp=>inp.oninput=()=>{\n    const r=rack(), it=(r.items||[]).find(x=>x.key===inp.dataset.ip);\n    if(it){ it.ip=inp.value; S.dirty=true; }\n  });\n}\n\n/* ── patch sheet ──────────────────────────────────────────────────────── */\nfunction viewPatch(){\n  const rows=[];\n  S.racks.forEach(r=>(r.items||[]).forEach(it=>{\n    const e=eq(it.gearId); if(!e) return;\n    (e.ports||[]).forEach(p=>{\n      const pp=(it.ports||{})[p.id]||{};\n      if(!pp.universe && !pp.label) return;\n      rows.push({rack:r.name, device:it.label||e.name, model:e.name, ip:it.ip,\n                 ru:ruLabel(it), face:faceOf(it),\n                 port:p.name||p.id, type:p.type, universe:pp.universe||'', dest:pp.label||''});\n    });\n  }));\n  if(!rows.length) return '<div class=\"empty\"><div class=\"big\">Nothing patched yet</div>'\n    +'<div>Assign universes to ports on the Racks tab.</div></div>';\n\n  const idx=universeIndex();\n  let h=`<div class=\"elev\"><div class=\"elevhead\"><b>Patch sheet</b>`\n   + `<span class=\"m\">${esc(S.showName||'no show')}</span>`\n   + `<span class=\"m\">${rows.length} ports</span></div>`;\n  h+='<div class=\"tablewrap\"><table><thead><tr><th>Rack</th><th class=\"num\">RU</th><th>Face</th>'\n   + '<th>Device</th><th>IP</th><th>Port</th><th>Universe</th><th>Goes to</th></tr></thead><tbody>'\n   + rows.map(r=>{\n      const dup=r.universe && (idx[r.universe.trim()]||[]).length>1;\n      return `<tr><td>${esc(r.rack)}</td><td class=\"num\">${esc(r.ru)}</td>`\n       + `<td style=\"font-size:11.5px\">${esc(r.face)}</td><td><b>${esc(r.device)}</b> `\n       + `<span class=\"muted\" style=\"font-size:11px\">${esc(r.model)}</span></td>`\n       + `<td class=\"mono\" style=\"font-size:11px\">${esc(r.ip||'—')}</td>`\n       + `<td class=\"mono\" style=\"font-size:11.5px\">${esc(r.port)}</td>`\n       + `<td class=\"mono\"><b>${esc(r.universe||'—')}</b>`\n       + (dup?' <span class=\"chip warn\">dup</span>':'')+`</td>`\n       + `<td>${esc(r.dest||'—')}</td></tr>`;\n     }).join('')\n   + '</tbody></table></div></div>';\n  return h;\n}\n\nconst st=(k,v,cls)=>`<div class=\"stat${cls?' '+cls:''}\"><div class=\"k\">${esc(k)}</div><div class=\"v\">${v}</div></div>`;\n\nfunction toCSV(){\n  const out=[['Rack','RU','Face','Device','Model','IP','Port','Type','Universe','Goes to']];\n  S.racks.forEach(r=>(r.items||[]).forEach(it=>{\n    const e=eq(it.gearId); if(!e) return;\n    (e.ports||[]).forEach(p=>{\n      const pp=(it.ports||{})[p.id]||{};\n      if(!pp.universe && !pp.label) return;\n      out.push([r.name, ruLabel(it), faceOf(it), it.label||e.name, e.name, it.ip||'',\n                p.name||p.id, p.type||'', pp.universe||'', pp.label||'']);\n    });\n  }));\n  return out.map(r=>r.map(v=>{const s=String(v??'');\n    return /[\",\\n]/.test(s)?'\"'+s.replace( lf:center;margin-right:2px}\n.legend span{padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700}\n\n.grouphead td{background:var(--surface-2);font-size:9px;letter-spacing:.12em;text-transform:uppercase;\n  font-weight:800;color:var(--ink-3);padding:5px 9px}\n.rowbtns{display:flex;gap:3px;justify-content:flex-end}\n.iconbtn{background:none;border:1px solid transparent;border-radius:5px;color:var(--ink-3);\n  font-size:11px;padding:2px 6px;cursor:pointer;font-weight:600}\n.iconbtn:hover{border-color:var(--line);color:var(--ink);background:var(--surface-2)}\n.iconbtn.danger:hover{color:var(--crit);background:var(--crit-soft)}\n</style></head><body>\n<script>\n/* ── KTM tool shim ────────────────────────────────────────────────────────\n   Injected into each tool immediately after <body>, ahead of the tool's code.\n\n   Why tools run in frames: the four ported tools were written independently\n   as standalone artifacts and share 22 top-level function names between them\n   — render, compute, save, esc, uid, exportCSV, snapshot, applySnapshot and\n   more. Merged into one global scope they would clobber each other. A\n   same-origin srcdoc frame gives each its own window, so they port unmodified\n   and keep working exactly as they were verified.\n\n   Frames have no capabilities of their own, so the shim hands each tool the\n   Hub's. Same origin, so these are direct calls into the parent realm — no\n   postMessage, no serialization.                                           */\n(function () {\n  var TOOL   = \"loom\";\n  var LEGACY = false;          // ported tool, or written for the Hub\n  var host   = window.parent;\n\n  /* ── Shared data layer ────────────────────────────────────────────────\n     Every tool written for the Hub uses this. It reaches the real\n     collections — fixtures, gear, shows — with no namespacing, because\n     that shared library is the entire point of the suite.                */\n  window.KTM = host && host.KTM ? host.KTM : null;\n\n  /* ── Legacy namespacing ───────────────────────────────────────────────\n     The four ported tools each save rigs at \"rigs/{key}\". In four separate\n     stores that was fine; in one shared store they overwrite each other.\n     So for those tools only, every path gets namespaced under tools/<tool>/.\n\n     The prefix is TWO segments on purpose. Document paths must have an even\n     number of segments and collections an odd number, so a one-segment\n     prefix would flip every path's parity and throw:\n       rigs      (1, collection) -> tools/distro/rigs      (3, collection)\n       rigs/foo  (2, document)   -> tools/distro/rigs/foo  (4, document)\n\n     New tools are NOT namespaced — they read and write the shared schema\n     directly, which is why this is gated on LEGACY rather than applied to\n     everything.                                                           */\n  function ns(p) { return \"tools/\" + TOOL + \"/\" + p; }\n\n  function wrapDb(db) {\n    return {\n      doc:        function (p) { return db.doc(ns(p)); },\n      collection: function (p) { return db.collection(ns(p)); }\n    };\n  }\n\n  window.claude = {\n    use: function (name) {\n      if (!host || !host.claude || !host.claude.use) return Promise.resolve(null);\n      return Promise.resolve(host.claude.use(name)).then(function (api) {\n        if (!api) return null;\n        return (LEGACY && name === \"db\") ? wrapDb(api) : api;\n      }).catch(function () { return null; });\n    }\n  };\n\n  /* The Hub owns the theme; it calls this on every frame when you toggle. */\n  window.__ktmTheme = function (t) {\n    var r = document.documentElement;\n    if (t) r.setAttribute(\"data-theme\", t); else r.removeAttribute(\"data-theme\");\n  };\n})();\n<\/script>\n\n\n<div class=\"bar\">\n  <h1>Loom&nbsp;Plot</h1>\n  <div class=\"seg\" id=\"tabs\"></div>\n  <div class=\"grow\"></div>\n  <button class=\"btn ghost sm\" id=\"lwbtn\">Lightwright</button>\n  <button class=\"btn ghost sm\" id=\"csvbtn\">CSV</button>\n  <button class=\"btn ghost sm\" id=\"printbtn\">Print</button>\n  <button class=\"btn sm\" id=\"savebtn\">Save cables</button>\n</div>\n<main><div class=\"wrap\" id=\"root\"></div></main>\n\n<script>\n/* ═══════════════════════════════════════════════════════════════════════\n   Loom Plot — the cable and loom list.\n\n   An inventory of real cut cables, not a bill of materials. This is the\n   piece that connects Distro Plot (soca cuts) to Rack Plot (snake\n   break-ins), and nothing else in the suite does it.\n\n   The model is Pre-Pro's Loom Builder, which ran BMW in production, and\n   the field its own documentation omits is the important one:\n\n     parts[]          six segment lengths, in feet\n     partPositions[]  a physical position label per segment\n\n   A 100' socapex run is not one cable. It is a cut from the distro, a\n   trunk run, and four drops on the truss, each with its own length and\n   its own place on the rig. Storing a single total loses the thing the\n   electrician actually needs at load-in.\n\n   Three conventions carried over verbatim, all of them scar tissue:\n\n   1. A SPARE is a \" SP\" label suffix plus PINK, same type as its\n      primary — a label, not a boolean, because crew read labels off\n      physical tape. B1 / B1 SP, MA / MA SP.\n   2. NEVER re-render on an input event. It destroys the DOM and kills\n      keyboard navigation mid-edit. Fields write to the model and repaint\n      nothing but their own dirty class.\n   3. Colours are stored as TOKEN NAMES and resolved to hex at render,\n      from meta/tokens. Pre-Pro's archived BMW import still carries\n      #ef4444 for RED while the live palette's RED is #ff2020, so any\n      record holding a hex silently repaints when re-imported.\n\n   The one thing here that Pre-Pro could not do: the CUT LIST. Every\n   segment rounds UP to the next standard length in gear/cable, and the\n   result aggregates by type × length into exactly the matrix a shop\n   order reads. That is the join to Shop Order, and it is why the\n   segments were worth storing separately in the first place.\n   ═══════════════════════════════════════════════════════════════════════ */\nconst $  = id => document.getElementById(id);\nconst esc = s => String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst num = v => { const n=parseFloat(v); return isFinite(n)?n:0; };\n\nconst SLOTS = 6;\n\n/* Type grouping for the build view. Groups are the electrician's mental\n   buckets, not the catalog's power/data split — a socapex and an Edison\n   are both power but they are never handled the same way. */\nconst GROUPS = [\n  { label:'Multi cable', ids:['socapex','cpc8','cpc4'] },\n  { label:'Data',        ids:['dmx-5pin','dmx-3pin','ethercon','fiber'] },\n  { label:'Power',       ids:['true1-jumper','true1-tail','powercon-blue','edison-uground'] },\n];\nconst GROUP_OTHER = 'Other';\n\n/* Segment hints, per type. These are the questions the six slots answer,\n   and without them the columns are just six blanks. */\nconst HINTS = {\n  socapex:'Pt1 from distro · Pt2 trunk · Pt3–6 on-truss drops',\n  cpc8:   'Pt1 from distro · Pt2 trunk',\n  cpc4:   'Pt1 from distro · Pt2 trunk',\n  'dmx-5pin':'Pt1 from node · Pt2 trunk · Pt3 last leg if looped',\n  ethercon:'Pt1 from switch · Pt2 trunk run',\n  _:'Lengths in feet, one per segment',\n};\n\nconst S = { tab:'cables', loaded:false, show:null, showName:'',\n            types:[], lengths:[5,10,15,25,50,100], colors:{},\n            positions:[], sheets:[], cur:null, dirty:false, q:'' };\n\nfunction groupOf(typeId){\n  const g = GROUPS.find(g=>g.ids.includes(typeId));\n  return g ? g.label : GROUP_OTHER;\n}\nconst type   = id => S.types.find(t=>t.id===id);\nconst hex    = tok => S.colors[tok] || null;\nconst sheet  = () => S.sheets.find(s=>s.id===S.cur);\n\nasync function load(){\n  const K = window.KTM;\n  if(!K){ S.loaded=true; return; }\n  const gear = await K.list('gear');\n  const cab = gear.find(g=>g.kind==='cable');\n  if(cab){ S.types = cab.items||[]; if(cab.lengths) S.lengths = cab.lengths; }\n\n  const meta = await K.list('meta');\n  const tok = meta.find(m=>m.id==='tokens' || m.colors);\n  if(tok && tok.colors) S.colors = tok.colors;\n\n  S.show = K.activeShow ? K.activeShow() : null;\n  if(S.show){\n    const sh = await K.get(K.P.show(S.show));\n    S.showName = (sh && sh.name) || S.show;\n    S.positions = await K.list(K.P.sub(S.show,'positions'));\n    S.sheets = await K.list(K.P.sub(S.show,'looms'));\n  }\n  /* A sheet per position, created on demand rather than up front — an\n     empty show should not cost twenty documents. */\n  S.sheets.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));\n  S.cur = S.sheets[0] ? S.sheets[0].id : null;\n  S.loaded = true;\n}\n\nasync function save(){\n  const K=window.KTM;\n  if(!K) return alert('No store available.');\n  if(!S.show) return alert('Pick a show in the Hub first — cables belong to a show.');\n  const b=$('savebtn'); b.disabled=true; b.textContent='Saving…';\n  try{\n    for(const sh of S.sheets){\n      const {id, ...body} = sh;\n      body.kind = 'cableSheet';\n      await K.set(K.P.subDoc(S.show,'looms',id), body);\n    }\n    S.dirty=false; b.textContent='Saved';\n    document.querySelectorAll('td.tight input.dirty').forEach(i=>i.classList.remove('dirty'));\n    setTimeout(()=>{b.textContent='Save cables';b.disabled=false;},1400);\n  }catch(e){ b.textContent='Save cables'; b.disabled=false; alert('Could not save: '+e.message); }\n}\n\n/* ── the derived numbers ───────────────────────────────────────────────── */\n\n/* Total cut feet for one cable — the sum of its segments, not a single\n   run length. */\nconst cableFeet = c => (c.parts||[]).reduce((a,p)=>a+num(p),0);\n\n/* Round a segment UP to the next standard length. A 22' run is bought as\n   a 25'; there is no such thing as ordering 22 feet of socapex. Anything\n   longer than the largest standard length is reported at its own size and\n   flagged, because that is a custom cut and a phone call. */\nfunction toStock(ft){\n  if(ft<=0) return null;\n  for(const L of S.lengths) if(ft<=L) return {len:L, custom:false};\n  return {len:ft, custom:true};\n}\n\n/* The cut list: type × standard length, counts in the cells. Exactly the\n   matrix a shop order reads, which is the whole point of storing the\n   segments separately. */\nfunction cutList(){\n  const rows = {}; const customs = [];\n  S.sheets.forEach(sh=>(sh.cables||[]).forEach(c=>{\n    (c.parts||[]).forEach((p,i)=>{\n      const ft = num(p); if(!ft) return;\n      const st = toStock(ft); if(!st) return;\n      const key = c.type||'unknown';\n      const r = rows[key] = rows[key] || {};\n      if(st.custom){\n        customs.push({type:key, ft, label:c.label, sheet:sh.name,\n                      pos:(c.partPositions||[])[i]||('Pt'+(i+1))});\n        r.custom = (r.custom||0)+1;\n      } else {\n        r[st.len] = (r[st.len]||0)+1;\n      }\n    });\n  }));\n  return {rows, customs};\n}\n\nfunction loomIndex(){\n  const idx = {};\n  S.sheets.forEach(sh=>(sh.cables||[]).forEach(c=>{\n    const l = (c.loomId||'').trim(); if(!l) return;\n    (idx[l]=idx[l]||[]).push({...c, sheet:sh.name});\n  }));\n  return idx;\n}\n\nfunction counts(){\n  let cables=0, feet=0, unloomed=0, spares=0, noParts=0;\n  S.sheets.forEach(sh=>(sh.cables||[]).forEach(c=>{\n    cables++; feet += cableFeet(c);\n    if(!(c.loomId||'').trim()) unloomed++;\n    if(/\\sSP$/i.test(c.label||'')) spares++;\n    if(!cableFeet(c)) noParts++;\n  }));\n  return {sheets:S.sheets.length, cables, feet, looms:Object.keys(loomIndex()).length,\n          unloomed, spares, noParts};\n}\n\n/* ── render ───────────────────────────────────────────────────────────── */\nconst TABS = [['cables','Cables'],['asm','Assembly'],['looms','Looms'],['cut','Cut list']];\n\nfunction render(){\n  $('tabs').innerHTML = TABS.map(([k,l])=>\n    `<button data-tab=\"${k}\"${S.tab===k?' class=\"on\"':''}>${l}</button>`).join('');\n  $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});\n\n  const r=$('root');\n  if(!S.loaded){ r.innerHTML='<div class=\"empty\"><div class=\"big\">Loading…</div></div>'; return; }\n  if(!window.KTM){\n    r.innerHTML='<div class=\"note crit\"><b>No shared data layer.</b> Loom Plot reads the cable '\n      +'catalogue and colour tokens from the Hub. Open it from inside the KTM Hub rather than on its own.</div>';\n    return;\n  }\n  if(!S.show){\n    r.innerHTML='<div class=\"empty\"><div class=\"big\">No active show</div>'\n      +'<div>Cables belong to a show. Pick one in the Hub, then come back.</div></div>';\n    return;\n  }\n  if(!S.types.length){\n    r.innerHTML='<div class=\"empty\"><div class=\"big\">Cable catalogue is empty</div>'\n      +'<div>Seed <span class=\"mono\">gear/cable</span> in the Hub first.</div></div>';\n    return;\n  }\n  r.innerHTML = S.tab==='cables' ? viewCables()\n              : S.tab==='asm'    ? viewAsm()\n              : S.tab==='looms'  ? viewLooms()\n              :                    viewCut();\n  if(S.tab==='cables') wireCables();\n}\n\nfunction statbar(){\n  const c = counts();\n  const cell = (k,v,sub,flag) => `<div class=\"stat${flag?' flag':''}\"><div class=\"k\">${k}</div>`\n    + `<div class=\"v\">${v}${sub?` <small>${sub}</small>`:''}</div></div>`;\n  return '<div class=\"stats\">'\n    + cell('Cables', c.cables)\n    + cell('Cut feet', c.feet.toLocaleString(), 'ft')\n    + cell('Looms', c.looms)\n    + cell('Unloomed', c.unloomed, '', c.unloomed>0)\n    + cell('Spares', c.spares)\n    + (c.noParts ? cell('No lengths', c.noParts, '', true) : '')\n    + '</div>';\n}\n\nfunction sheetRail(){\n  const rows = S.sheets.map(sh=>{\n    const n = (sh.cables||[]).length;\n    return `<button class=\"sheettab${sh.id===S.cur?' on':''}\" data-sheet=\"${sh.id}\">`\n      + `<span>${esc(sh.name||sh.id)}</span><span class=\"n\">${n}</span></button>`;\n  }).join('');\n  /* Positions without a sheet yet are offered as one click, so the sheet\n     list mirrors the rig rather than being typed a second time. */\n  const used = new Set(S.sheets.map(s=>s.positionId).filter(Boolean));\n  const avail = S.positions.filter(p=>!used.has(p.id));\n  const add = avail.length\n    ? `<h4 style=\"margin-top:14px\">Add from positions</h4>`\n      + avail.map(p=>`<button class=\"sheettab\" data-newpos=\"${p.id}\">`\n        + `<span class=\"muted\">+ ${esc(p.name||p.id)}</span></button>`).join('')\n    : '';\n  return `<div class=\"card\"><h4>Cable sheets</h4>${rows||'<div class=\"muted\" style=\"font-size:12px\">None yet.</div>'}`\n    + add\n    + `<div style=\"margin-top:12px;display:flex;gap:6px\">`\n    + `<button class=\"btn ghost sm\" id=\"newsheet\">+ Sheet</button>`\n    + (S.cur?`<button class=\"btn danger sm\" id=\"delsheet\">Delete</button>`:'')\n    + `</div></div>`;\n}\n\nfunction colorSel(cid, field, val){\n  const toks = Object.keys(S.colors);\n  const opts = ['<option value=\"\">—</option>']\n    .concat(toks.map(t=>`<option value=\"${t}\"${t===val?' selected':''}>${t}</option>`)).join('');\n  const h = hex(val);\n  return `<span class=\"swatch${h?'':' none'}\" style=\"${h?`background:${h}`:''}\" data-sw=\"${cid}-${field}\"></span>`\n    + `<select data-c=\"${cid}\" data-f=\"${field}\" style=\"width:auto;min-width:74px\">${opts}</select>`;\n}\n\nfunction cableRow(c){\n  const t = type(c.type) || {};\n  const feet = cableFeet(c);\n  const spare = /\\sSP$/i.test(c.label||'');\n  return `<tr data-row=\"${c.id}\">\n    <td class=\"tight\" style=\"min-width:110px\"><input data-c=\"${c.id}\" data-f=\"label\" value=\"${esc(c.label||'')}\" placeholder=\"B1\"></td>\n    <td class=\"tight\" style=\"min-width:130px\"><select data-c=\"${c.id}\" data-f=\"type\">`\n      + S.types.map(x=>`<option value=\"${x.id}\"${x.id===c.type?' selected':''}>${esc(x.name)}</option>`).join('')\n      + `</select></td>\n    <td class=\"tight\" style=\"white-space:nowrap\">${colorSel(c.id,'color',c.color||'')}</td>\n    <td class=\"tight\" style=\"white-space:nowrap\">${colorSel(c.id,'secColor',c.secColor||'')}</td>`\n    + Array.from({length:SLOTS},(_,i)=>`<td class=\"tight\" style=\"min-width:58px\">`\n        + `<input data-c=\"${c.id}\" data-f=\"parts.${i}\" value=\"${esc((c.parts||[])[i]||'')}\" `\n        + `placeholder=\"—\" inputmode=\"decimal\" style=\"text-align:right\">`\n        + `<input data-c=\"${c.id}\" data-f=\"partPositions.${i}\" value=\"${esc((c.partPositions||[])[i]||'')}\" `\n        + `placeholder=\"pos\" style=\"font-size:10px;text-align:center;color:var(--ink-3)\"></td>`).join('')\n    + `<td class=\"num mono\" style=\"color:var(--ink-3)\">${feet||''}</td>\n    <td class=\"tight\" style=\"min-width:88px\"><input data-c=\"${c.id}\" data-f=\"loomId\" value=\"${esc(c.loomId||'')}\" placeholder=\"Loom/case\"></td>\n    <td class=\"tight\" style=\"min-width:100px\"><input data-c=\"${c.id}\" data-f=\"notes\" value=\"${esc(c.notes||'')}\" placeholder=\"—\"></td>\n    <td><div class=\"rowbtns\">`\n      + (spare?'':`<button class=\"iconbtn\" data-sp=\"${c.id}\" title=\"Add a spare: same type, &quot; SP&quot; label, pink\">+SP</button>`)\n      + `<button class=\"iconbtn\" data-dup=\"${c.id}\" title=\"Duplicate\">⧉</button>`\n      + `<button class=\"iconbtn danger\" data-del=\"${c.id}\" title=\"Delete\">✕</button>`\n    + `</div></td></tr>`;\n}\n\nfunction viewCables(){\n  const sh = sheet();\n  const body = !sh\n    ? '<div class=\"empty\"><div class=\"big\">No cable sheet selected</div>'\n      + '<div>Add one from a position, or make a free-standing sheet.</div></div>'\n    : (() => {\n        const cables = (sh.cables||[]).filter(c=>!S.q ||\n          [c.label,c.type,c.loomId,c.notes].join(' ').toLowerCase().includes(S.q));\n        /* Grouped by the electrician's buckets, in a fixed order, so the\n           sheet reads the same way every time. */\n        const order = GROUPS.map(g=>g.label).concat([GROUP_OTHER]);\n        const byGroup = {};\n        cables.forEach(c=>(byGroup[groupOf(c.type)] = byGroup[groupOf(c.type)]||[]).push(c));\n        const rows = order.filter(g=>byGroup[g]).map(g=>\n          `<tr class=\"grouphead\"><td colspan=\"${SLOTS+7}\">${g}</td></tr>`\n          + byGroup[g].map(cableRow).join('')).join('');\n        const hint = HINTS[(cables[0]||{}).type] || HINTS._;\n        return `<div class=\"tablewrap\"><table><thead><tr>\n            <th>Label</th><th>Type</th><th>Colour</th><th>2nd</th>`\n          + Array.from({length:SLOTS},(_,i)=>`<th class=\"num\">Pt${i+1}</th>`).join('')\n          + `<th class=\"num\">Feet</th><th>Loom</th><th>Notes</th><th></th></tr></thead>\n            <tbody>${rows || `<tr><td colspan=\"${SLOTS+7}\" class=\"muted\" style=\"padding:16px\">No cables yet.</td></tr>`}</tbody>\n            </table></div>\n            <div class=\"muted\" style=\"font-size:11.5px;margin-top:7px\">${esc(hint)}. Second row of each segment is its position label.</div>`;\n      })();\n  const head = sh ? `<div class=\"card\" style=\"display:flex;gap:9px;align-items:center;flex-wrap:wrap\">\n      <input id=\"sheetname\" value=\"${esc(sh.name||'')}\" style=\"font-weight:600;min-width:180px\">\n      <input id=\"search\" value=\"${esc(S.q)}\" placeholder=\"Filter cables…\" style=\"min-width:150px\">\n      <div class=\"grow\"></div>\n      <button class=\"btn sm\" id=\"addcable\">+ Cable</button></div>` : '';\n  return `<div class=\"cols\"><div class=\"side\">${sheetRail()}</div><div>${statbar()}${head}${body}</div></div>`;\n}\n\n/* Inputs write the model and repaint NOTHING. A render() here destroys the\n   DOM mid-edit and kills tab order — the single hardest-won lesson in the\n   legacy suite, and the reason its rack patching was unusable for entering\n   forty rows in a row. Structural changes (add, delete, duplicate) do\n   re-render, because there the DOM genuinely changed. */\nfunction wireCables(){\n  const sh = sheet();\n  $('root').querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.sheet;render();});\n  $('root').querySelectorAll('[data-newpos]').forEach(b=>b.onclick=()=>{\n    const p = S.positions.find(x=>x.id===b.dataset.newpos);\n    S.sheets.push({id:uid(), name:(p&&p.name)||b.dataset.newpos, positionId:b.dataset.newpos, cables:[]});\n    S.cur = S.sheets[S.sheets.length-1].id; S.dirty=true; render();\n  });\n  const ns=$('newsheet'); if(ns) ns.onclick=()=>{\n    S.sheets.push({id:uid(), name:'New sheet', positionId:'', cables:[]});\n    S.cur = S.sheets[S.sheets.length-1].id; S.dirty=true; render();\n  };\n  const ds=$('delsheet'); if(ds) ds.onclick=()=>{\n    if(!confirm('Delete this cable sheet and its cables?')) return;\n    S.sheets = S.sheets.filter(x=>x.id!==S.cur);\n    S.cur = S.sheets[0]?S.sheets[0].id:null; S.dirty=true; render();\n  };\n  if(!sh) return;\n\n  const sn=$('sheetname'); if(sn) sn.oninput=e=>{ sh.name=e.target.value; S.dirty=true; e.target.classList.add('dirty'); };\n  const sq=$('search'); if(sq) sq.onchange=e=>{ S.q=e.target.value.trim().toLowerCase(); render(); };\n  $('addcable').onclick=()=>{\n    sh.cables = sh.cables||[];\n    sh.cables.push({id:uid(), label:'', type:S.types[0].id, color:'', secColor:'',\n                    parts:[], partPositions:[], loomId:'', notes:''});\n    S.dirty=true; render();\n    const rows=$('root').querySelectorAll('[data-row]');\n    const last=rows[rows.length-1]; if(last){ const i=last.querySelector('input'); if(i){i.focus();i.scrollIntoView({block:'center'});} }\n  };\n\n  const find = id => (sh.cables||[]).find(c=>c.id===id);\n  $('root').querySelectorAll('[data-c][data-f]').forEach(el=>{\n    const c = find(el.dataset.c); if(!c) return;\n    const f = el.dataset.f;\n    const write = v => {\n      if(f.startsWith('parts.') || f.startsWit
