er-edge\n      overlap because coordinate rounding otherwise leaves hairline white\n      seams between them that show up only on the printed sheet.\n\n   Sources are the tools that write into the show tree: Rack Plot, Loom\n   Plot and Net Plot. The four ported tools still save under their own\n   tools/<tool>/ namespace and are NOT read here — pulling case labels\n   from Pull Plot is a job for the day Pull is natively integrated, and\n   asserting it works before then would be a lie in the UI.\n   ═══════════════════════════════════════════════════════════════════════ */\nconst $  = id => document.getElementById(id);\nconst esc = s => String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst MM_PX = 96/25.4;              // CSS pixels per millimetre at 96dpi\n\nconst S = { tab:'build', loaded:false, show:null, showName:'',\n            formats:[], colors:{}, fmt:null, src:'manual',\n            racks:[], looms:[], nets:[], labels:[], dirty:false };\n\nconst fmt = () => S.formats.find(f=>f.id===S.fmt) || S.formats[0];\n\nasync function load(){\n  const K = window.KTM;\n  if(!K){ S.loaded=true; return; }\n  const gear = await K.list('gear');\n  const lf = gear.find(g=>g.kind==='label-format');\n  S.formats = (lf && lf.items) || [];\n  S.fmt = S.formats[0] ? S.formats[0].id : null;\n\n  const meta = await K.list('meta');\n  const tok = meta.find(m=>m.id==='tokens' || m.colors);\n  if(tok && tok.colors) S.colors = tok.colors;\n\n  S.show = K.activeShow ? K.activeShow() : null;\n  if(S.show){\n    const sh = await K.get(K.P.show(S.show));\n    S.showName = (sh && sh.name) || S.show;\n    S.racks = await K.list(K.P.sub(S.show,'racks'));\n    S.looms = await K.list(K.P.sub(S.show,'looms'));\n    S.nets  = await K.list(K.P.sub(S.show,'network'));\n  }\n  S.loaded = true;\n}\n\n/* ── ink ──────────────────────────────────────────────────────────────────\n   The multi-colour rule, carried over intact. A label's readability is a\n   property of the WHOLE label, not of any one band, so the decision is\n   made from the span between the lightest and darkest band present. */\nfunction lum(hex){\n  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'')); if(!m) return 1;\n  const n = parseInt(m[1],16);\n  const f = c => { c/=255; return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };\n  return 0.2126*f(n>>16 & 255) + 0.7152*f(n>>8 & 255) + 0.0722*f(n & 255);\n}\nfunction labelInk(bandHexes){\n  const hs = (bandHexes||[]).filter(Boolean);\n  if(!hs.length) return {ink:'#111', halo:0, haloColor:'#fff'};\n  const ls = hs.map(lum);\n  const lo = Math.min(...ls), hi = Math.max(...ls), span = hi - lo, mean = (lo+hi)/2;\n  const ink = mean > 0.45 ? '#111111' : '#ffffff';\n  /* The wider the span, the more the text has to survive crossing bands\n     it was not chosen for — so the halo grows with the span, and a\n     single-colour label gets none at all. */\n  const halo = span < 0.10 ? 0 : span < 0.30 ? 1 : span < 0.55 ? 2 : 3;\n  return {ink, halo, haloColor: ink === '#111111' ? '#ffffff' : '#000000'};\n}\nfunction haloShadow(ink, halo, haloColor){\n  if(!halo) return 'none';\n  const o=[]; const r=halo;\n  for(let a=0;a<8;a++){ const t=a*Math.PI/4;\n    o.push(`${(Math.cos(t)*r).toFixed(2)}px ${(Math.sin(t)*r).toFixed(2)}px 0 ${haloColor}`); }\n  return o.join(',');\n}\n\n/* ── the font fitter ──────────────────────────────────────────────────────\n   Binary search over real measured width, 32 iterations, × 0.91 for the\n   safety margin. Character-count heuristics fail on the first wide-glyph\n   label, which on this rig means every label that says \"MAIN\".  */\nlet _cv;\nfunction measure(text, px, weight){\n  _cv = _cv || document.createElement('canvas');\n  const c = _cv.getContext('2d');\n  c.font = `${weight||800} ${px}px Archivo, Helvetica, Arial, sans-serif`;\n  return c.measureText(text).width;\n}\nfunction fitFont(text, boxW, boxH, weight){\n  if(!text) return 12;\n  let lo=6, hi=520;\n  for(let i=0;i<32;i++){\n    const mid=(lo+hi)/2;\n    const w=measure(text, mid, weight);\n    /* Height is bounded too — a one-character label would otherwise size\n       to the width and run off the top and bottom of the media. */\n    if(w<=boxW && mid*1.18<=boxH) lo=mid; else hi=mid;\n  }\n  return lo*0.91;\n}\n\n/* ── sources ──────────────────────────────────────────────────────────────\n   Each source turns a tool's saved records into label rows. The colour\n   bands come from what the record already carries — a loom cable knows\n   its own tape colours, so the label does not ask twice. */\nconst SOURCES = [\n  {key:'manual', name:'Manual',      count:()=>0},\n  {key:'rack',   name:'Racks',       count:()=>S.racks.length},\n  {key:'loom',   name:'Loom cables', count:()=>S.looms.reduce((a,s)=>a+((s.cables||[]).length),0)},\n  {key:'case',   name:'Loom cases',  count:()=>Object.keys(loomCases()).length},\n  {key:'net',    name:'Network',     count:()=>S.nets.reduce((a,p)=>a+((p.devices||[]).length),0)},\n];\nfunction loomCases(){\n  const m={};\n  S.looms.forEach(s=>(s.cables||[]).forEach(c=>{\n    const l=(c.loomId||'').trim(); if(!l) return;\n    (m[l]=m[l]||[]).push({...c, sheet:s.name});\n  }));\n  return m;\n}\nconst hexOf = tok => S.colors[tok] || null;\n\nfunction pull(src){\n  const out=[];\n  const mk=(main,sub,bands,note)=>out.push({id:uid(), main, sub, bands:bands.filter(Boolean), note:note||''});\n  if(src==='rack'){\n    S.racks.forEach(r=>mk(r.name||'RACK', S.showName, [], `${(r.items||[]).length} devices`));\n  }\n  if(src==='loom'){\n    S.looms.forEach(s=>(s.cables||[]).forEach(c=>\n      mk(c.label||'—', s.name||'', [hexOf(c.color), hexOf(c.secColor)],\n         (c.parts||[]).filter(p=>String(p||'').trim()).join('+')+\"'\")));\n  }\n  if(src==='case'){\n    const cases = loomCases();\n    Object.entries(cases).forEach(([name,cables])=>{\n      /* One band per distinct tape colour in the case, in first-seen\n         order — which is what makes a case label readable across a dock\n         at twenty feet. */\n      const seen=[];\n      cables.forEach(c=>[c.color,c.secColor].forEach(t=>{\n        const h=hexOf(t); if(h && !seen.includes(h)) seen.push(h); }));\n      mk(name, S.showName, seen.slice(0,6), `${cables.length} cables`);\n    });\n  }\n  if(src==='net'){\n    S.nets.forEach(p=>(p.devices||[]).forEach(d=>\n      mk(d.name||d.key, d.ip||p.name||'', [], p.name||'')));\n  }\n  return out;\n}\n\n/* ── one label ────────────────────────────────────────────────────────────\n   Rendered at true media proportions and scaled, so the preview and the\n   print are the same object at two sizes rather than two drawings that\n   have to be kept in agreement. */\nfunction labelHTML(l, wPx, hPx, scale){\n  const bands = (l.bands||[]).filter(Boolean);\n  const {ink, halo, haloColor} = labelInk(bands);\n  const W = wPx*scale, H = hPx*scale;\n  const pad = Math.max(3, W*0.035);\n  const boxW = W - pad*2;\n  const hasSub = !!(l.sub||'').trim();\n  const mainH = hasSub ? H*0.60 : H*0.80;\n  const mainPx = fitFont(l.main||'', boxW, mainH, 800);\n  const subPx  = hasSub ? Math.min(fitFont(l.sub, boxW, H*0.24, 600), mainPx*0.42) : 0;\n\n  /* The 0.15mm seam overlap: each band reaches 0.15mm past its own inner\n     edge so rounding cannot leave a hairline of white between two bands. */\n  const ov = 0.15*MM_PX*scale;\n  const bandDivs = bands.length\n    ? `<div class=\"bands\">` + bands.map((b,i)=>\n        `<div class=\"band\" style=\"background:${b};margin-top:${i?-ov:0}px;`\n        + `padding-bottom:${i<bands.length-1?ov:0}px\"></div>`).join('') + `</div>`\n    : '';\n  return `<div class=\"lbl\" style=\"width:${W}px;height:${H}px\">${bandDivs}\n    <div class=\"txt\" style=\"color:${ink};text-shadow:${haloShadow(ink,halo,haloColor)}\">\n      <div style=\"font-size:${mainPx}px\">${esc(l.main||'')}</div>\n      ${hasSub?`<div class=\"sub\" style=\"font-size:${subPx}px;margin-top:${H*0.03}px\">${esc(l.sub)}</div>`:''}\n    </div></div>`;\n}\n\n/* ── pagination ───────────────────────────────────────────────────────── */\nfunction pages(){\n  const f = fmt(); if(!f) return [];\n  const per = f.kind==='thermal' ? 1 : (f.cols||1)*(f.rows||1);\n  const out=[];\n  for(let i=0;i<S.labels.length;i+=per) out.push(S.labels.slice(i,i+per));\n  return out;\n}\nfunction sheetHTML(page, scale){\n  const f = fmt();\n  if(f.kind==='thermal'){\n    const W=f.wPx*scale, H=f.hPx*scale, p=(f.padPx||0)*scale;\n    return `<div class=\"sheet\" style=\"width:${W}px;height:${H}px;padding:${p}px\">`\n      + labelHTML(page[0], f.wPx-(f.padPx||0)*2, f.hPx-(f.padPx||0)*2, scale) + '</div>';\n  }\n  /* Letter, in millimetres, positioned absolutely — the same geometry the\n     legacy builder printed from, so a sheet that lined up there lines up\n     here. */\n  const PW=215.9, PH=279.4;\n  const mt=f.marginTopMm ?? 12.7, ms=f.marginSideMm ?? ((PW-(f.cols*f.wMm)-((f.cols-1)*(f.gapMm||0)))/2);\n  const cells = page.map((l,i)=>{\n    const c=i%f.cols, r=Math.floor(i/f.cols);\n    const x=ms + c*(f.wMm+(f.gapMm||0)), y=mt + r*(f.hMm+(f.gapMm||0));\n    return `<div style=\"position:absolute;left:${x*MM_PX*scale}px;top:${y*MM_PX*scale}px\">`\n      + labelHTML(l, f.wMm*MM_PX, f.hMm*MM_PX, scale)\n      + `</div><div class=\"cutline\" style=\"left:${x*MM_PX*scale}px;top:${y*MM_PX*scale}px;`\n      + `width:${f.wMm*MM_PX*scale}px;height:${f.hMm*MM_PX*scale}px\"></div>`;\n  }).join('');\n  return `<div class=\"sheet sheetgrid\" style=\"width:${PW*MM_PX*scale}px;height:${PH*MM_PX*scale}px\">${cells}</div>`;\n}\n\n/* ── render ───────────────────────────────────────────────────────────── */\nconst TABS=[['build','Labels'],['sheet','Print preview']];\nfunction render(){\n  $('tabs').innerHTML = TABS.map(([k,l])=>\n    `<button data-tab=\"${k}\"${S.tab===k?' class=\"on\"':''}>${l}</button>`).join('');\n  $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});\n\n  const r=$('root');\n  if(!S.loaded){ r.innerHTML='<div class=\"empty\"><div class=\"big\">Loading…</div></div>'; return; }\n  if(!window.KTM){\n    r.innerHTML='<div class=\"note crit\"><b>No shared data layer.</b> Label Plot reads media geometry '\n      +'from the Hub. Open it from inside the KTM Hub rather than on its own.</div>'; return; }\n  if(!S.formats.length){\n    r.innerHTML='<div class=\"empty\"><div class=\"big\">No label media</div>'\n      +'<div>Seed <span class=\"mono\">gear/label-formats</span> in the Hub first.</div></div>'; return; }\n\n  const n = pages().length;\n  $('pagecount').textContent = S.labels.length\n    ? `${S.labels.length} label${S.labels.length===1?'':'s'} · ${n} page${n===1?'':'s'}` : '';\n  r.innerHTML = S.tab==='build' ? viewBuild() : viewSheet();\n  wire();\n}\n\nfunction rail(){\n  const f = fmt();\n  const src = SOURCES.map(s=>{\n    const n = s.count();\n    return `<button class=\"srctab${S.src===s.key?' on':''}\" data-src=\"${s.key}\">`\n      + `<span>${esc(s.name)}</span>${s.key!=='manual'?`<span class=\"n\">${n}</span>`:''}</button>`;\n  }).join('');\n  const fmts = S.formats.map(x=>{\n    const dim = x.kind==='thermal' ? `${(x.wPx/x.dpi).toFixed(0)}×${(x.hPx/x.dpi).toFixed(0)} in · 1 per page`\n      : `${(x.wMm/25.4).toFixed(x.wMm/25.4%1?1:0)}×${(x.hMm/25.4).toFixed(x.hMm/25.4%1?1:0)} in · ${x.cols*x.rows} per sheet`;\n    return `<button class=\"fmtbtn${S.fmt===x.id?' on':''}\" data-fmt=\"${x.id}\">`\n      + `${esc(x.name)}<small>${esc(dim)}</small></button>`;\n  }).join('');\n  return `<div class=\"card\"><h4>Media</h4><div class=\"fmt\">${fmts}</div></div>\n    <div class=\"card\"><h4>Pull from</h4>${src}\n      <button class=\"btn ghost sm\" id=\"pullbtn\" style=\"margin-top:10px;width:100%\"\n        ${S.src==='manual'?'disabled':''}>Load ${S.src==='manual'?'—':esc((SOURCES.find(s=>s.key===S.src)||{}).name)}</button>\n      <div class=\"muted\" style=\"font-size:11px;margin-top:7px\">Loading replaces the list. Edit freely\n        afterwards — labels are not saved back to the source.</div></div>`;\n}\n\nfunction bandPicker(l, i){\n  const toks = Object.keys(S.colors);\n  const cur = (l.bands||[])[i] || '';\n  return `<div class=\"bandpick\" data-bp=\"${l.id}-${i}\">`\n    + `<button data-band=\"${l.id}|${i}|\" title=\"none\" style=\"background:transparent\"></button>`\n    + toks.map(t=>`<button data-band=\"${l.id}|${i}|${S.colors[t]}\" title=\"${t}\"\n        style=\"background:${S.colors[t]}\"${cur===S.colors[t]?' class=\"on\"':''}></button>`).join('')\n    + '</div>';\n}\n\nfunction viewBuild(){\n  const f = fmt();\n  const rows = S.labels.map((l,idx)=>{\n    const bands=(l.bands||[]);\n    const swatches = bands.length\n      ? bands.map(b=>`<span class=\"swatch\" style=\"display:inline-block;width:13px;height:13px;\n          border-radius:3px;border:1px solid var(--line-strong);background:${b};vertical-align:-2px\"></span>`).join(' ')\n      : '<span class=\"muted\" style=\"font-size:11px\">none</span>';\n    return `<tr class=\"lblrow\">\n      <td class=\"muted mono\" style=\"width:26px\">${idx+1}</td>\n      <td class=\"tight\" style=\"min-width:130px\"><input data-l=\"${l.id}\" data-f=\"main\" value=\"${esc(l.main||'')}\" placeholder=\"MAIN\"></td>\n      <td class=\"tight\" style=\"min-width:120px\"><input data-l=\"${l.id}\" data-f=\"sub\" value=\"${esc(l.sub||'')}\" placeholder=\"sub-line\"></td>\n      <td style=\"white-space:nowrap\">${swatches}\n        <button class=\"iconbtn\" data-addband=\"${l.id}\">+</button>\n        ${bands.length?`<button class=\"iconbtn\" data-popband=\"${l.id}\">−</button>`:''}</td>\n      <td>${bands.map((_,i)=>bandPicker(l,i)).join('<div style=\"height:3px\"></div>')}</td>\n      <td><div class=\"rowbtns\">\n        <button class=\"iconbtn\" data-dup=\"${l.id}\">⧉</button>\n        <button class=\"iconbtn danger\" data-del=\"${l.id}\">✕</button></div></td></tr>`;\n  }).join('');\n\n  const previewOne = S.labels[0]\n    ? `<div class=\"card\"><h4>Preview — first label</h4>\n        <div style=\"display:flex;justify-content:center;padding:8px 0\">`\n      + (f.kind==='thermal'\n          ? labelHTML(S.labels[0], f.wPx-(f.padPx||0)*2, f.hPx-(f.padPx||0)*2, 0.55)\n          : labelHTML(S.labels[0], f.wMm*MM_PX, f.hMm*MM_PX, 1.05))\n      + `</div><div class=\"muted\" style=\"font-size:11px;text-align:center\">\n          Text is fitted by measurement, not by character count. Ink and halo come from the span\n          between the lightest and darkest band.</div></div>`\n    : '';\n\n  return `<div class=\"cols\"><div class=\"side\">${rail()}</div><div>\n    <div class=\"card\" style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n      <b>${esc(f.name)}</b>\n      <span class=\"muted\" style=\"font-size:12px\">${esc(f.note||'')}</span>\n      <div class=\"grow\"></div>\n      <button class=\"btn ghost sm\" id=\"clearbtn\">Clear</button>\n      <button class=\"btn sm\" id=\"addbtn\">+ Label</button></div>\n    ${previewOne}\n    <div class=\"tablewrap\"><table><thead><tr>\n      <th></th><th>Main</th><th>Sub</th><th>Bands</th><th>Colours</th><th></th>\n      </tr></thead><tbody>${rows||'<tr><td colspan=\"6\" class=\"muted\" style=\"padding:16px\">No labels yet — pull from a tool or add one.</td></tr>'}</tbody></table></div>\n    </div></div>`;\n}\n\nfunction viewSheet(){\n  const f = fmt();\n  const pgs = pages();\n  if(!pgs.length) return `<div class=\"cols\"><div class=\"side\">${rail()}</div><div>`\n    + '<div class=\"empty\"><div class=\"big\">Nothing to print</div>'\n    + '<div>Add labels on the Labels tab.</div></div></div></div>';\n  /* Preview scale is the legacy 0.551 for thermal, and a fit-to-column\n     scale for sheets. Print is always 1:1 — the preview scale never\n     reaches the printed page. */\n  const scale = f.kind==='thermal' ? (f.previewScale||0.551) : 0.62;\n  return `<div class=\"cols\"><div class=\"side\">${rail()}</div><div>\n    <div class=\"note noprint\">${pgs.length} page${pgs.length===1?'':'s'} of\n      <b>${esc(f.name)}</b>. Dashed lines mark the media edges and do not print.\n      Print at <b>100% scale, no fit-to-page</b> — a scaled sheet will not line up with the die cut.</div>\n    ${pgs.map(p=>sheetHTML(p, scale)).join('')}\n    </div></div>`;\n}\n\n/* ── wiring ───────────────────────────────────────────────────────────── */\nfunction wire(){\n  $('root').querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;render();});\n  $('root').querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{S.src=b.dataset.src;render();});\n  const pb=$('pullbtn'); if(pb) pb.onclick=()=>{\n    const got = pull(S.src);\n    if(!got.length) return alert('Nothing to pull — that tool has no saved records for this show yet.');\n    S.labels = got; S.tab='build'; render();\n  };\n  const ab=$('addbtn'); if(ab) ab.onclick=()=>{\n    S.labels.push({id:uid(), main:'', sub:'', bands:[]}); render();\n    const ins=$('root').querySelectorAll('[data-f=\"main\"]');\n    const last=ins[ins.length-1]; if(last){ last.focus(); last.scrollIntoView({block:'center'}); }\n  };\n  const cb=$('clearbtn'); if(cb) cb.onclick=()=>{ if(confirm('Clear every label?')){ S.labels=[]; render(); } };\n\n  const find = id => S.labels.find(l=>l.id===id);\n  /* Text writes the model and repaints nothing. The preview is one label\n     behind until a structural change, which is the right trade — a live\n     repaint on every keystroke would rebuild the table and eat the\n     cursor, and this is a tool for typing forty labels in a row. */\n  $('root').querySelectorAll('[data-l][data-f]').forEach(el=>{\n    const l=find(el.dataset.l); if(!l) return;\n    el.oninput = e => { l[el.dataset.f]=e.target.value; e.target.classList.add('dirty'); };\n  });\n  $('root').querySelectorAll('[data-addband]').forEach(b=>b.onclick=()=>{\n    const l=find(b.dataset.addband); if(!l) return;\n    l.bands=(l.bands||[]).concat(['#ff2020']); render();\n  });\n  $('root').querySelectorAll('[data-popband]').forEach(b=>b.onclick=()=>{\n    const l=find(b.dataset.popband); if(!l) return;\n    l.bands=(l.bands||[]).slice(0,-1); render();\n  });\n  $('root').querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{\n    const [id,i,hex]=b.dataset.band.split('|');\n    const l=find(id); if(!l) return;\n    l.bands=(l.bands||[]).slice();\n    if(hex) l.bands[+i]=hex; else l.bands.splice(+i,1);\n    render();\n  });\n  $('root').querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{\n    const l=find(b.dataset.dup); if(!l) return;\n    S.labels.splice(S.labels.indexOf(l)+1, 0, {...l, id:uid(), bands:[...(l.bands||[])]});\n    render();\n  });\n  $('root').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{\n    S.labels=S.labels.filter(l=>l.id!==b.dataset.del); render();\n  });\n}\n\n/* ── export ───────────────────────────────────────────────────────────── */\nconst csvCell=v=>{const s=String(v??''); return /[\",\\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s;};\nfunction toCSV(){\n  const rows=[['#','Main','Sub','Bands','Note']];\n  S.labels.forEach((l,i)=>rows.push([i+1, l.main||'', l.sub||'', (l.bands||[]).join(' '), l.note||'']));\n  return rows.map(r=>r.map(csvCell).join(',')).join('\\n');\n}\n$('csvbtn').onclick = async () => {\n  const name=String(S.showName||'labels').replace(/[^\\w.-]+/g,'-')+'-labels.csv', csv=toCSV();\n  try{ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:name,data:csv}); return; } }catch(e){}\n  try{ await navigator.clipboard.writeText(csv); alert('CSV copied to the clipboard.'); }catch(e){}\n};\n$('printbtn').onclick = () => {\n  /* Print always comes off the sheet view — printing from the editor\n     would put the table on paper, which is the one thing nobody wants. */\n  if(S.tab!=='sheet'){ S.tab='sheet'; render(); }\n  setTimeout(()=>window.print(), 180);\n};\n\n(async()=>{ render(); await load(); render(); })();\n<\/script>\n</body></html>\n", "order": "<!doctype html><html><head><meta charset=\"utf8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Shop Order</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n<style>\n:root{\n  --ground:#E3E5E0; --surface:#F8F8F6; --surface-2:#EBEDE8; --sunken:#DDDFD9;\n  --line:#C8CBC3; --line-strong:#A6AAA0;\n  --ink:#15181B; --ink-2:#4C5257; --ink-3:#5C636A;\n  --accent:#1C7566; --accent-soft:#D3E5E0; --on-accent:#FFFFFF;\n  --warn:#A56A12; --warn-soft:#F0E2C6;\n  --crit:#A93A28; --crit-soft:#F2D9D3;\n  --s1:#2A5CA0; --s2:#D0611E; --s3:#1E8F7A; --s4:#A0662A; --s5:#8B4FBF;\n  --s6:#7F8C1E; --s7:#C43A5E; --s8:#2F8FBF; --s0:#71787F;\n  --shadow:0 1px 2px rgba(20,25,30,.10), 0 6px 18px -10px rgba(20,25,30,.22);\n  --sel:#D3E5E0;\n}\n@media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;\n  --line:#2B3136; --line-strong:#404850;\n  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;\n  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;\n  --warn:#D9A341; --warn-soft:#382C13; --crit:#E2705F; --crit-soft:#3A1E19;\n  --s1:#4F86DA; --s2:#D9743C; --s3:#2FA88E; --s4:#B98546; --s5:#A47ADF;\n  --s6:#889A2E; --s7:#D95C7E; --s8:#38A2C8; --s0:#6E777F;\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);\n  --sel:#173630;\n}}\n:root[data-theme=\"dark\"]{\n  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;\n  --line:#2B3136; --line-strong:#404850;\n  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;\n  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;\n  --warn:#D9A341; --warn-soft:#382C13; --crit:#E2705F; --crit-soft:#3A1E19;\n  --s1:#4F86DA; --s2:#D9743C; --s3:#2FA88E; --s4:#B98546; --s5:#A47ADF;\n  --s6:#889A2E; --s7:#D95C7E; --s8:#38A2C8; --s0:#6E777F;\n  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);\n  --sel:#173630;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;\n  font-family:\"IBM Plex Sans\",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;\n  line-height:1.45;display:flex;flex-direction:column}\nbutton,input,select,textarea{font:inherit;color:var(--ink)}\noption{color:var(--ink);background:var(--surface)}\ntable,.card,.note,.stat,.sheet{color:var(--ink)}\n.mono{font-family:\"IBM Plex Mono\",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}\n\n.bar{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:9px 15px;background:var(--surface);\n  border-bottom:1px solid var(--line);flex-wrap:wrap}\n.bar h1{font-family:\"Archivo\",sans-serif;font-size:15px;font-weight:700;margin:0;letter-spacing:.03em;white-space:nowrap}\n.grow{flex:1}\n.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}\n.seg button+button{border-left:1px solid var(--line)}\n.seg button.on{background:var(--sel);color:var(--ink);font-weight:600}\n.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:7px 13px;\n  font-size:12.5px;font-weight:600;cursor:pointer}\n.btn:hover{filter:brightness(1.08)}\n.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}\n.btn.ghost:hover{background:var(--surface-2);color:var(--ink);filter:none}\n.btn.sm{padding:4px 9px;font-size:11.5px}\n.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}\ninput[type=text],input[type=number],input[type=date],select{background:var(--surface-2);\n  border:1px solid var(--line);border-radius:7px;padding:6px 9px}\ninput:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}\n\nmain{flex:1;overflow-y:auto;padding:18px 20px 70px}\n.wrap{max-width:1240px;margin:0 auto}\n.cols{display:grid;grid-template-columns:1fr 268px;gap:18px;align-items:start}\nh3{font-family:\"Archivo\",sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;\n  text-transform:uppercase;color:var(--accent);margin:22px 0 8px}\n.sub{color:var(--ink-3);font-size:12.5px;margin:0 0 14px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-bottom:16px}\n.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.stat .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}\n.stat .v{font-family:\"Archivo\",sans-serif;font-size:21px;font-weight:700;line-height:1.15;margin-top:1px}\n.stat .v small{font-size:10.5px;font-weight:500;color:var(--ink-3)}\n.stat.flag{border-color:var(--warn);background:var(--warn-soft)}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;\n  box-shadow:var(--shadow)}\n.note{border-radius:10px;padding:11px 14px;font-size:12.5px;border:1px solid var(--line);\n  background:var(--surface);margin-bottom:14px}\n.note.warn{background:var(--warn-soft);border-color:transparent}\n.note.crit{background:var(--crit-soft);border-color:transparent}\n.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}\ntable{border-collapse:collapse;width:100%;font-size:12.5px}\nth{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);\n  font-weight:700;padding:7px 9px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}\ntd{padding:5px 9px;border-bottom:1px solid var(--line)}\ntbody tr:last-child td{border-bottom:0}\ntbody tr:hover{background:var(--surface-2)}\ntd.num,th.num{text-align:right;font-family:\"IBM Plex Mono\",ui-monospace,monospace;font-variant-numeric:tabular-nums}\n.muted{color:var(--ink-3)}\n.chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}\n.chip.ok{background:var(--accent-soft);color:var(--accent)}\n.chip.warn{background:var(--warn-soft);color:var(--warn)}\n.chip.crit{background:var(--crit-soft);color:var(--crit)}\n.chip.dim{background:var(--sunken);color:var(--ink-3)}\n.q{width:52px;text-align:right;padding:3px 5px}\n.empty{text-align:center;padding:42px 20px;color:var(--ink-3)}\n.empty .big{font-family:\"Archivo\",sans-serif;font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}\n\n/* layout rail — section order, visibility, titles */\n.rail h4{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);\n  font-weight:700;margin:0 0 8px}\n.secrow{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);\n  border-radius:8px;padding:5px 7px;margin-bottom:5px}\n.secrow input[type=text]{flex:1;min-width:0;background:none;border:0;padding:2px 3px;font-size:12px}\n.secrow input[type=text]:focus{outline:1px solid var(--accent);border-radius:4px}\n.secrow button{background:none;border:0;cursor:pointer;color:var(--ink-3);padding:1px 4px;font-size:12px}\n.secrow button:hover{color:var(--ink)}\n.secrow.off{opacity:.45}\n\n/* the printed sheet */\n.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;\n  box-shadow:var(--shadow)}\n.sheethead{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;\n  border-bottom:2px solid var(--accent);padding-bottom:11px;margin-bottom:6px}\n.sheethead h2{font-family:\"Archivo\",sans-serif;font-size:19px;margin:0}\n.sheethead .m{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.7}\n@media print{\n  .bar,.rail{display:none} main{overflow:visible;padding:0}\n  body{overflow:visible;background:#fff}\n  .cols{grid-template-columns:1fr}\n  .sheet{box-shadow:none;border:0;padding:0}\n  table{font-size:10px} th,td{padding:3px 5px}\n  h3{page-break-after:avoid} tr{page-break-inside:avoid}\n}\n@media(max-width:900px){ .cols{grid-template-columns:1fr} }\n</style></head><body>\n<script>\n/* ── KTM tool shim ────────────────────────────────────────────────────────\n   Injected into each tool immediately after <body>, ahead of the tool's code.\n\n   Why tools run in frames: the four ported tools were written independently\n   as standalone artifacts and share 22 top-level function names between them\n   — render, compute, save, esc, uid, exportCSV, snapshot, applySnapshot and\n   more. Merged into one global scope they would clobber each other. A\n   same-origin srcdoc frame gives each its own window, so they port unmodified\n   and keep working exactly as they were verified.\n\n   Frames have no capabilities of their own, so the shim hands each tool the\n   Hub's. Same origin, so these are direct calls into the parent realm — no\n   postMessage, no serialization.                                           */\n(function () {\n  var TOOL   = \"order\";\n  var LEGACY = false;          // ported tool, or written for the Hub\n  var host   = window.parent;\n\n  /* ── Shared data layer ────────────────────────────────────────────────\n     Every tool written for the Hub uses this. It reaches the real\n     collections — fixtures, gear, shows — with no namespacing, because\n     that shared library is the entire point of the suite.                */\n  window.KTM = host && host.KTM ? host.KTM : null;\n\n  /* ── Legacy namespacing ───────────────────────────────────────────────\n     The four ported tools each save rigs at \"rigs/{key}\". In four separate\n     stores that was fine; in one shared store they overwrite each other.\n     So for those tools only, every path gets namespaced under tools/<tool>/.\n\n     The prefix is TWO segments on purpose. Document paths must have an even\n     number of segments and collections an odd number, so a one-segment\n     prefix would flip every path's parity and throw:\n       rigs      (1, collection) -> tools/distro/rigs      (3, collection)\n       rigs/foo  (2, document)   -> tools/distro/rigs/foo  (4, document)\n\n     New tools are NOT namespaced — they read and write the shared schema\n     directly, which is why this is gated on LEGACY rather than applied to\n     everything.                                                           */\n  function ns(p) { return \"tools/\" + TOOL + \"/\" + p; }\n\n  function wrapDb(db) {\n    return {\n      doc:        function (p) { return db.doc(ns(p)); },\n      collection: function (p) { return db.collection(ns(p)); }\n    };\n  }\n\n  window.claude = {\n    use: function (name) {\n      if (!host || !host.claude || !host.claude.use) return Promise.resolve(null);\n      return Promise.resolve(host.claude.use(name)).then(function (api) {\n        if (!api) return null;\n        return (LEGACY && name === \"db\") ? wrapDb(api) : api;\n      }).catch(function () { return null; });\n    }\n  };\n\n  /* The Hub owns the theme; it calls this on every frame when you toggle. */\n  window.__ktmTheme = function (t) {\n    var r = document.documentElement;\n    if (t) r.setAttribute(\"data-theme\", t); else r.removeAttribute(\"data-theme\");\n  };\n})();\n<\/script>\n\n\n<div class=\"bar\">\n  <h1>Shop&nbsp;Order</h1>\n  <div class=\"seg\" id=\"tabs\"></div>\n  <div class=\"grow\"></div>\n  <label class=\"muted\" style=\"font-size:11.5px\">Vendor\n    <select id=\"vendorsel\" style=\"margin-left:5px\"></select></label>\n  <button class=\"btn ghost sm\" id=\"csvbtn\">CSV</button>\n  <button class=\"btn ghost sm\" id=\"printbtn\">Print</button>\n  <button class=\"btn sm\" id=\"savebtn\">Save order</button>\n</div>\n<main><div class=\"wrap\" id=\"root\"></div></main>\n\n<script>\n/* ═══════════════════════════════════════════════════════════════════════\n   Shop Order — what the production electrician actually sends the vendor.\n\n   Three ideas here are lifted from a colleague's tool, deliberately:\n     1. Section layout is configurable — reorder, retitle, hide. One order,\n        several audiences (the shop, the crew, the PM) without re-authoring.\n     2. Cable is a LENGTH MATRIX, type down the side and length across the\n        top. That is how a shop order reads and how a truck packs.\n     3. Adapters are a first-class section. Not fixtures, not cable, and the\n        thing that ruins a load-in when it is missing.\n\n   What this adds that his does not: the two-fer count is DERIVED. The\n   library knows which fixtures have a power pass-thru and which do not, so\n   the order can say how many two-fers the rig needs instead of leaving it\n   to memory. That is the whole reason the powerOut research was worth doing.\n   ═══════════════════════════════════════════════════════════════════════ */\n\nconst $  = id => document.getElementById(id);\nconst esc = s => String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmt = v => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString(undefined,{maximumFractionDigits:0});\nconst n1  = v => Math.round(v*10)/10;\n\nconst S = {\n  tab:'build', loaded:false, show:null, showName:'',\n  vendors:[], vendorId:null,\n  fixtures:[], cable:null, adapters:null, hardware:null, layout:null,\n  order:{ fixtures:{}, cable:{}, adapters:{}, hardware:{}, control:{}, notes:'',\n          dates:{loadIn:'',loadOut:''}, rev:'A' },\n  q:'', dirty:false\n};\n\n/* ── load ─────────────────────────────────────────────────────────────── */\nasync function load(){\n  const K = window.KTM;\n  if (!K){ S.loaded = true; return; }\n  const [fx, gear, vendors] = await Promise.all([\n    K.list('fixtures'), K.list('gear'), K.list('vendors')\n  ]);\n  S.fixtures = fx.sort((a,b)=>((a.manufacturer||'')+' '+(a.name||''))\n                        .localeCompare((b.manufacturer||'')+' '+(b.name||'')));\n  S.cable    = gear.find(g=>g.kind==='cable');\n  S.adapters = gear.find(g=>g.kind==='adapter');\n  S.hardware = gear.find(g=>g.kind==='hardware');\n  S.vendors  = vendors.filter(v=>v.active!==false)\n                      .sort((a,b)=>String(a.name).localeCompare(String(b.name)));\n  S.vendorId = S.vendorId || (S.vendors[0] && S.vendors[0].id) || null;\n\n  const lay = await K.get('meta/orderLayout');\n  S.layout = JSON.parse(JSON.stringify((lay && lay.sections) || []));\n\n  S.show = K.activeShow ? K.activeShow() : null;\n  if (S.show){\n    const sh = await K.get(K.P.show(S.show));\n    S.showName = (sh && sh.name) || S.show;\n    const saved = await K.get(K.P.subDoc(S.show,'orders','current'));\n    if (saved){\n      S.order = Object.assign(S.order, saved.order || {});\n      if (saved.layout) S.layout = saved.layout;\n      if (saved.vendorId) S.vendorId = saved.vendorId;\n    }\n  }\n  S.loaded = true;\n}\n\nasync function save(){\n  const K = window.KTM;\n  if (!K) return alert('No store available.');\n  if (!S.show) return alert('Pick a show in the Hub first — an order belongs to a show.');\n  const b = $('savebtn'); b.disabled = true; b.textContent = 'Saving…';\n  try{\n    await K.set(K.P.subDoc(S.show,'orders','current'), {\n      vendorId:S.vendorId, order:S.order, layout:S.layout,\n      totals:totals(), generatedAt:new Date().toISOString()\n    });\n    S.dirty=false; b.textContent='Saved';\n    setTimeout(()=>{b.textContent='Save order';b.disabled=false;},1400);\n  }catch(e){ b.textContent='Save order'; b.disabled=false; alert('Could not save: '+e.message); }\n}\n\n/* ── derived quantities ───────────────────────────────────────────────────\n   The order knows things the person ordering should not have to remember. */\n\n/* A fixture with no power pass-thru cannot be daisy-chained: every unit past\n   the first on a circuit needs a two-fer. A fixture WITH a pass-thru needs\n   none. `maxLinked` refines it further where the manufacturer publishes it. */\nfunction twoferNeed(){\n  let need = 0; const why = [];\n  Object.entries(S.order.fixtures).forEach(([fid, row]) => {\n    const f = S.fixtures.find(x=>x.id===fid); if (!f) return;\n    const qty = (row.active||0) + (row.spare||0); if (!qty) return;\n    const po = f.powerOut || {};\n    if (po.present === false){\n      // no chaining at all — pair them up, one two-fer per pair\n      const t = Math.floor(qty/2);\n      if (t){ need += t; why.push(`${f.name}: ${qty} with no pass-thru → ${t}`); }\n    } else if (po.present === null || po.present === undefined){\n      why.push(`${f.name}: pass-thru unknown — not counted`);\n    }\n  });\n  return { need, why };\n}\n\n/* Circuits, from draw and the published per-voltage link limits. Deliberately\n   coarse: this is an ORDER, not Distro Plot. It exists so the cable count is\n   not invented from nothing. */\nfunction circuitNeed(volts){\n  let ckt = 0;\n  Object.entries(S.order.fixtures).forEach(([fid,row])=>{\n    const f = S.fixtures.find(x=>x.id===fid); if(!f) return;\n    const qty=(row.active||0)+(row.spare||0); if(!qty) return;\n    const po=f.powerOut||{};\n    let per = 1;\n    if (po.present && Array.isArray(po.maxLinked) && po.maxLinked.length){\n      const m = po.maxLinked.filter(p=>p[0]<=volts).sort((a,b)=>b[0]-a[0])[0]\n             || po.maxLinked[0];\n      per = m ? m[1] : 1;\n    }\n    ckt += Math.ceil(qty/per);\n  });\n  return ckt;\n}\n\nfunction totals(){\n  let lines=0, watts=0, lb=0, ch=0, units=0, unknownPower=0;\n  Object.entries(S.order.fixtures).forEach(([fid,row])=>{\n    const f=S.fixtures.find(x=>x.id===fid); if(!f) return;\n    const qty=(row.active||0)+(row.spare||0); if(!qty) return;\n    lines++; units+=qty;\n    const p=f.power||{};\n    if (p.value!=null) watts += p.value*qty; else unknownPower += qty;\n    if (f.weight && f.weight.value!=null) lb += f.weight.value*qty;\n    const mode=row.mode, fps=(f.dmx&&f.dmx.footprints)||[];\n    const hit=fps.find(m=>m[0]===mode);\n    ch += ((hit&&hit[1]) || (f.dmx&&f.dmx.default) || 0) * (row.active||0);\n  });\n  ['cable','adapters','hardware'].forEach(k=>{\n    Object.values(S.order[k]).forEach(v=>{\n      if (k==='cable'){ const t=Object.values(v||{}).reduce((a,b)=>a+(+b||0),0); if(t) lines++; }\n      else if (+v) lines++;\n    });\n  });\n  return { lines, units, kW:n1(watts/1000), lb:Math.round(lb), ch, unknownPower };\n}\n\nconst cableTotal = id => Object.values(S.order.cable[id]||{}).reduce((a,b)=>a+(+b||0),0);\n\n/* ── render ───────────────────────────────────────────────────────────── */\nfunction render(){\n  $('tabs').innerHTML = [['build','Build'],['sheet','Shop order']]\n    .map(([k,l])=>`<button data-tab=\"${k}\"${S.tab===k?' class=\"on\"':''}>${l}</button>`).join('');\n  $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});\n\n  const vs=$('vendorsel');\n  vs.innerHTML = S.vendors.length\n    ? S.vendors.map(v=>`<option value=\"${esc(v.id)}\"${v.id===S.vendorId?' selected':''}>${esc(v.name)}</option>`).join('')\n    : '<option>No vendors</option>';\n  vs.disabled = !S.vendors.length;\n  vs.onchange = ()=>{ S.vendorId=vs.value; S.dirty=true; render(); };\n\n  const r=$('root');\n  if(!S.loaded){ r.innerHTML='<div class=\"empty\"><div class=\"big\">Loading…</div></div>'; return; }\n  if(!window.KTM){\n    r.innerHTML='<div class=\"note crit\"><b>No shared data layer.</b> Shop Order reads the fixture '\n      +'library and the cable, adapter and hardware catalogs from the Hub. Open it from inside the '\n      +'KTM Hub rather than on its own.</div>'; return;\n  }\n  r.innerHTML = S.tab==='build' ? viewBuild() : viewSheet();\n  S.tab==='build' ? wireBuild() : wireSheet();\n}\n\nfunction viewBuild(){\n  const t=totals(), tf=twoferNeed();\n  let h='';\n  if(!S.show) h+='<div class=\"note warn\"><b>No show selected.</b> You can build freely, but saving '\n    +'an order needs a show — pick one at the top of the Hub.</div>';\n\n  h+='<div class=\"stats\">'\n   + st('Line items',fmt(t.lines))\n   + st('Units',fmt(t.units))\n   + st('Fixture draw',t.kW+'<small> kW</small>', t.unknownPower?'flag':'')\n   + st('Est. weight',fmt(t.lb)+'<small> lb</small>')\n   + st('DMX channels',fmt(t.ch))\n   + st('Two-fers needed',fmt(tf.need), tf.need?'flag':'')\n   + '</div>';\n\n  if(t.unknownPower)\n    h+=`<div class=\"note warn\"><b>${t.unknownPower} unit${t.unknownPower===1?'':'s'} with no `\n      +'published draw</b> are excluded from the kW total rather than guessed at. The library '\n      +'marks those <span class=\"chip dim\">missing</span>.</div>';\n\n  h+='<div class=\"cols\"><div>';\n\n  // ── fixtures ─────────────────────────────────────────────────────────\n  h+='<h3>Fixtures</h3>'\n   + '<div class=\"bar\" style=\"background:none;border:0;padding:0 0 9px;gap:8px\">'\n   + `<input type=\"text\" id=\"q\" placeholder=\"Search the fixture library…\" value=\"${esc(S.q)}\" style=\"width:250px\">`\n   + '<span class=\"muted\" style=\"font-size:11.5px\">Only rows with a quantity land on the order</span></div>';\n\n  const rows=S.fixtures.filter(f=>{\n    if(!S.q) return (S.order.fixtures[f.id]&&((S.order.fixtures[f.id].active||0)+(S.order.fixtures[f.id].spare||0)))||S.q==='';\n    const q=S.q.toLowerCase();\n    return ((f.manufacturer||'')+' '+(f.name||'')+' '+(f.aliases||[]).join(' ')).toLowerCase().includes(q);\n  });\n\n  h+='<div class=\"tablewrap\"><table><thead><tr><th>Fixture</th><th>Mode</th>'\n   + '<th>Power in</th><th>Chain</th><th class=\"num\">Active</th><th class=\"num\">Spare</th>'\n   + '<th>Hang</th></tr></thead><tbody>'\n   + rows.map(f=>{\n      const row=S.order.fixtures[f.id]||{};\n      const on=(row.active||0)+(row.spare||0);\n      const fps=(f.dmx&&f.dmx.footprints)||[];\n      const po=f.powerOut||{}, pin=f.powerIn||{};\n      const chain = po.present===true\n        ? `<span class=\"chip ok\">chains${(po.maxLinked&&po.maxLinked.length)?' '+po.maxLinked.map(p=>p[1]+'@'+p[0]).join('/'):''}</span>`\n        : po.present===false ? '<span class=\"chip crit\">two-fer</span>'\n        : '<span class=\"chip dim\">?</span>';\n      return `<tr${on?' style=\"background:var(--sel)\"':''}>`\n       + `<td><b>${esc(f.name)}</b> <span class=\"muted\" style=\"font-size:11px\">${esc(f.manufacturer||'')}</span>`\n       + (f.power&&f.power.value!=null?` <span class=\"muted mono\" style=\"font-size:10.5px\">${f.power.value}${esc(f.power.unit||'')}</span>`:'')\n       + '</td>'\n       + `<td><select data-mode=\"${esc(f.id)}\" style=\"max-width:150px;font-size:11.5px;padding:3px 5px\">`\n       + '<option value=\"\">default</option>'\n       + fps.map(m=>`<option value=\"${esc(m[0])}\"${row.mode===m[0]?' selected':''}>${esc(m[0])} · ${m[1]}ch</option>`).join('')\n       + '</select></td>'\n       + `<td class=\"mono\" style=\"font-size:10.5px\">${esc((pin.connector||'—').slice(0,26))}</td>`\n       + `<td>${chain}</td>`\n       + `<td class=\"num\"><input type=\"number\" min=\"0\" class=\"q mono\" data-fx=\"${esc(f.id)}\" data-k=\"active\" value=\"${row.active||0}\"></td>`\n       + `<td class=\"num\"><input type=\"number\" min=\"0\" class=\"q mono\" data-fx=\"${esc(f.id)}\" data-k=\"spare\" value=\"${row.spare||0}\"></td>`\n       + `<td><select data-hang=\"${esc(f.id)}\" style=\"max-width:130px;font-size:11.5px;padding:3px 5px\">`\n       + '<option value=\"\">—</option>'\n       + ((S.hardware&&S.hardware.items)||[]).map(hw=>`<option value=\"${esc(hw.id)}\"${row.hang===hw.id?' selected':''}>${esc(hw.name)}</option>`).join('')\n       + '</select></td></tr>';\n     }).join('')\n   + '</tbody></table></div>';\n\n  // ── cable matrix ─────────────────────────────────────────────────────\n  const L=(S.cable&&S.cable.lengths)||[5,10,15,25,50,100];\n  h+='<h3>Power / data cable</h3>'\n   + '<div class=\"tablewrap\"><table><thead><tr><th>Type</th>'\n   + L.map(l=>`<th class=\"num\">${l}′</th>`).join('')\n   + '<th class=\"num\">Total</th></tr></thead><tbody>'\n   + ((S.cable&&S.cable.items)||[]).map(c=>{\n      const tot=cableTotal(c.id);\n      return `<tr${tot?' style=\"background:var(--sel)\"':''}><td><b>${esc(c.name)}</b>`\n       + `<br><span class=\"muted mono\" style=\"font-size:10px\">${esc(c.connector||'')}</span></td>`\n       + L.map(l=>`<td class=\"num\"><input type=\"number\" min=\"0\" class=\"q mono\" data-cb=\"${esc(c.id)}\" data-len=\"${l}\" value=\"${(S.order.cable[c.id]&&S.order.cable[c.id][l])||0}\"></td>`).join('')\n       + `<td class=\"num\"><b>${tot||'—'}</b></td></tr>`;\n     }).join('')\n   + '</tbody></table></div>';\n\n  // ── adapters, with the derived two-fer prompt ────────────────────────\n  h+='<h3>Adapters</h3>';\n  if(tf.need)\n    h+=`<div class=\"note warn\"><b>The rig needs about ${tf.need} two-fer${tf.need===1?'':'s'}.</b> `\n      +'Derived from the library: '+esc(tf.why.slice(0,4).join('; '))\n      +(tf.why.length>4?` and ${tf.why.length-4} more`:'')\n      +'. One per pair of unchainable fixtures — adjust for how the circuits actually land.</div>';\n  h+=grid(S.adapters,'adapters');\n\n  h+='<h3>Rigging hardware</h3>'+grid(S.hardware,'hardware');\n  h+='</div>';\n\n  // ── layout rail ──────────────────────────────────────────────────────\n  h+='<div class=\"rail\"><div class=\"card\"><h4>Order layout</h4>'\n   + S.layout.map((s,i)=>`<div class=\"secrow${s.visible?'':' off'}\">`\n      + `<button data-up=\"${i}\" title=\"Move up\"${i===0?' disabled':''}>↑</button>`\n      + `<button data-down=\"${i}\" title=\"Move down\"${i===S.layout.length-1?' disabled':''}>↓</button>`\n      + `<input type=\"text\" data-title=\"${i}\" value=\"${esc(s.title)}\">`\n      + `<button data-vis=\"${i}\" title=\"Show or hide\">${s.visible?'👁':'🚫'}</button></div>`).join('')\n   + '<div class=\"muted\" style=\"font-size:11px;margin-top:9px\">Reorder, retitle or hide a section. '\n   + 'Saved with the order, so one build serves the shop, the crew and the PM without re-authoring.'\n   + '</div></div>'\n   + `<div class=\"card\" style=\"margin-top:11px\"><h4>Order</h4>`\n   + `<div style=\"display:flex;flex-direction:column;gap:7px\">`\n   + `<label class=\"muted\" style=\"font-size:11px\">Load in<input type=\"date\" id=\"din\" value=\"${esc(S.order.dates.loadIn||'')}\" style=\"width:100%;margin-top:2px\"></label>`\n   + `<label class=\"muted\" style=\"font-size:11px\">Load out<input type=\"date\" id=\"dout\" value=\"${esc(S.order.dates.loadOut||'')}\" style=\"width:100%;margin-top:2px\"></label>`\n   + `<label class=\"muted\" style=\"font-size:11px\">Revision<input type=\"text\" id=\"drev\" value=\"${esc(S.order.rev||'A')}\" style=\"width:100%;margin-top:2px\"></label>`\n   + `</div></div></div></div>`;\n  return h;\n}\n\nfunction grid(cat, key){\n  if(!cat||!cat.items) return '<div class=\"muted\" style=\"font-size:12px\">Catalog not seeded.</div>';\n  return '<div class=\"tablewrap\"><table><thead><tr><th>Item</th><th>Note</th>'\n   + '<th class=\"num\" style=\"width:76px\">Qty</th></tr></thead><tbody>'\n   + cat.items.map(it=>{\n      const v=S.order[key][it.id]||0;\n      return `<tr${v?' style=\"background:var(--sel)\"':''}><td><b>${esc(it.name)}</b></td>`\n       + `<td class=\"muted\" style=\"font-size:11.5px\">${esc(it.note||'')}</td>`\n       + `<td class=\"num\"><input type=\"number\" min=\"0\" class=\"q mono\" data-cat=\"${key}\" data-id=\"${esc(it.id)}\" value=\"${v}\"></td></tr>`;\n     }).join('')\n   + '</tbody></table></div>';\n}\n\nfunction wireBuild(){\n  const q=$('q');\n  if(q) q.oninput=()=>{S.q=q.value; const r=$('root'); r.innerHTML=viewBuild(); wireBuild();\n    const n=$('q'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} };\n\n  document.querySelectorAll('[data-fx]').forEach(i=>i.onchange=()=>{\n    const id=i.dataset.fx, k=i.dataset.k, v=Math.max(0,parseInt(i.value||'0',10)||0);\n    S.order.fixtures[id]=Object.assign({},S.order.fixtures[id],{[k]:v});\n    S.dirty=true; repaint();\n  });\n  document.querySelectorAll('[data-mode]').forEach(s=>s.onchange=()=>{\n    const id=s.dataset.mode;\n    S.order.fixtures[id]=Object.assign({},S.order.fixtures[id],{mode:s.value||null});\n    S.dirty=true; repaint();\n  });\n  document.querySelectorAll('[data-hang]').forEach(s=>s.onchange=()=>{\n    const id=s.dataset.hang;\n    S.order.fixtures[id]=Object.assign({},S.order.fixtures[id],{hang:s.value||null});\n    S.dirty=true;\n  });\n  document.querySelectorAll('[data-cb]').forEach(i=>i.onchange=()=>{\n    const id=i.dataset.cb, l=i.dataset.len, v=Math.max(0,parseInt(i.value||'0',10)||0);\n    S.order.cable[id]=Object.assign({},S.order.cable[id],{[l]:v});\n    S.dirty=true; repaint();\n  });\n  document.querySelectorAll('[data-cat]').forEach(i=>i.onchange=()=>{\n    const v=Math.max(0,parseInt(i.value||'0',10)||0);\n    S.order[i.dataset.cat][i.dataset.id]=v; S.dirty=true; repaint();\n  });\n\n  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));\n  document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));\n  document.querySelectorAll('[data-vis]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.vis; S.layout[i].visible=!S.layout[i].visible; S.dirty=true; repaint();\n  });\n  document.querySelectorAll('[data-title]').forEach(inp=>inp.onchange=()=>{\n    S.layout[+inp.dataset.title].title=inp.value; S.dirty=true;\n  });\n  ['din','dout','drev'].forEach(id=>{ const e=$(id); if(e) e.onchange=()=>{\n    if(id==='din') S.order.dates.loadIn=e.value;\n    if(id==='dout') S.order.dates.loadOut=e.value;\n    if(id==='drev') S.order.rev=e.value;\n    S.dirty=true; }; });\n}\nfunction move(i,d){ const j=i+d; if(j<0||j>=S.layout.length) return;\n  const a=S.layout; [a[i],a[j]]=[a[j],a[i]]; S.dirty=true; repaint(); }\nfunction repaint(){ const r=$('root'); r.innerHTML=viewBuild(); wireBuild(); }\n\n/* ── the sheet ────────────────────────────────────────────────────────── */\nfunction viewSheet(){\n  const t=totals(), tf=twoferNeed();\n  const vendor=S.vendors.find(v=>v.id===S.vendorId);\n  const L=(S.cable&&S.cable.lengths)||[5,10,15,25,50,100];\n\n  const body = {\n    fixtures: ()=>{\n      const rows=Object.entries(S.order.fixtures)\n        .map(([fid,r])=>[S.fixtures.find(f=>f.id===fid),r])\n        .filter(([f,r])=>f&&((r.active||0)+(r.spare||0)));\n      if(!rows.length) return null;\n      return '<div class=\"tablewrap\"><table><thead><tr><th>Fixture</th>'\n       + '<th class=\"num\">Active</th><th class=\"num\">Spare</th><th>Hang</th><th>Plug</th>'\n       + '<th>Mode</th><th class=\"num\">Ch</th></tr></thead><tbody>'\n       + rows.map(([f,r])=>{\n          const fps=(f.dmx&&f.dmx.footprints)||[];\n          const hit=fps.find(m=>m[0]===r.mode);\n          const hw=((S.hardware&&S.hardware.items)||[]).find(h=>h.id===r.hang);\n          return `<tr><td>${esc(f.manufacturer||'')} ${esc(f.name)}</td>`\n           + `<td class=\"num\">${r.active||0}</td><td class=\"num\">${r.spare||'—'}</td>`\n           + `<td>${esc(hw?hw.name:'—')}</td>`\n           + `<td class=\"mono\" style=\"font-size:10.5px\">${esc(shortConn((f.powerIn||{}).connector))}</td>`\n           + `<td>${esc(r.mode||'default')}</td>`\n           + `<td class=\"num\">${(hit&&hit[1])||(f.dmx&&f.dmx.default)||'—'}</td></tr>`;\n         }).join('')+'</tbody></table></div>';\n    },\n    cable: ()=>{\n      const rows=((S.cable&&S.cable.items)||[]).filter(c=>cableTotal(c.id));\n      if(!rows.length) return null;\n      return '<div class=\"tablewrap\"><table><thead><tr><th>Type</th>'\n       + L.map(l=>`<th class=\"num\">${l}′</th>`).join('')+'<th class=\"num\">Total</th></tr></thead><tbody>'\n       + rows.map(c=>`<tr><td>${esc(c.name)}</td>`\n          + L.map(l=>`<td class=\"num\">${(S.order.cable[c.id]&&S.order.cable[c.id][l])||'—'}</td>`).join('')\n          + `<td class=\"num\"><b>${cableTotal(c.id)}</b></td></tr>`).join('')\n       + '</tbody></table></div>';\n    },\n    adapters: ()=>listSec(S.adapters,'adapters'),\n    hardware: ()=>listSec(S.hardware,'hardware'),\n    control:  ()=>null,\n    truss:    ()=>null,\n    totals: ()=>'<div class=\"tablewrap\"><table><tbody>'\n      + row('Total line items',fmt(t.lines))\n      + row('Fixture units',fmt(t.units))\n      + row('Fixture draw',t.kW+' kW'+(t.unknownPower?`  (${t.unknownPower} units unpublished, excluded)`:''))\n      + row('Estimated weight',fmt(t.lb)+' lb')\n      + row('DMX channels',fmt(t.ch))\n      + row('Two-fers (derived)',fmt(tf.need))\n      + '</tbody></table></div>'\n  };\n\n  let h='<div class=\"sheet\"><div class=\"sheethead\"><div>'\n   + `<h2>${esc(vendor?vendor.name:'Shop Order')}</h2>`\n   + `<div class=\"muted\" style=\"font-size:12px\">Shop Order — ${esc(S.showName||'no show')}</div></div>`\n   + '<div class=\"m\">'\n   + (S.order.dates.loadIn?`Load In: ${esc(S.order.dates.loadIn)}<br>`:'')\n   + (S.order.dates.loadOut?`Load Out: ${esc(S.order.dates.loadOut)}<br>`:'')\n   + `Generated: ${new Date().toISOString().slice(0,10)} · Rev ${esc(S.order.rev||'A')}`\n   + '</div></div>';\n\n  let any=false;\n  S.layout.filter(s=>s.visible).forEach(s=>{\n    const made = body[s.key] && body[s.key]();\n    if(!made) return;\n    any=true;\n    h += `<h3>${esc(s.title)}</h3>` + made;\n  });\n  if(!any) h+='<div class=\"empty\"><div class=\"big\">Nothing on the order yet</div>'\n    +'<div>Add quantities on the Build tab.</div></div>';\n  return h+'</div>';\n}\nconst row=(k,v)=>`<tr><td>${esc(k)}</td><td class=\"num\">${v}</td></tr>`;\nfunction listSec(cat,key){\n  const rows=((cat&&cat.items)||[]).filter(i=>S.order[key][i.id]);\n  if(!rows.length) return null;\n  return '<div class=\"tablewrap\"><table><thead><tr><th>Item</th><th class=\"num\">Qty</th>'\n   + '<th>Note</th></tr></thead><tbody>'\n   + rows.map(i=>`<tr><td>${esc(i.name)}</td><td class=\"num\">${S.order[key][i.id]}</td>`\n      + `<td class=\"muted\" style=\"font-size:11.5px\">${esc(i.note||'')}</td></tr>`).join('')\n   + '</tbody></table></div>';\n}\nfunction wireSheet(){}\n/* Connector strings carry a lot of caveat text in the library. The order needs\n   the family, not the footnote. */\nfunction shortConn(c){\n  if(!c) return '—';\n  const m=c.match(/powerCON TRUE1 TOP|powerCON TRUE1|powerCON A-type[^,(]*|Seetronic[^,(]*|Edison[^,(]*|REAN[^,(]*/i);\n  return (m?m[0]:c).trim().slice(0,28);\n}\nconst st=(k,v,cls)=>`<div class=\"stat${cls?' '+cls:''}\"><div class=\"k\">${esc(k)}</div><div class=\"v\">${v}</div></div>`;\n\n/* ── exports ──────────────────────────────────────────────────────────── */\nfunction toCSV(){\n  const out=[['Section','Item','Detail','Qty','Note']];\n  const vendor=S.vendors.find(v=>v.id===S.vendorId);\n  Object.entries(S.order.fixtures).forEach(([fid,r])=>{\n    const f=S.fixtures.find(x=>x.id===fid); if(!f) return;\n    const q=(r.active||0)+(r.spare||0); if(!q) return;\n    out.push(['Fixtures',`${f.manufacturer||''} ${f.name}`,\n      (r.mode||'default'),q,`active ${r.active||0}, spare ${r.spare||0}`]);\n  });\n  ((S.cable&&S.cable.items)||[]).forEach(c=>{\n    Object.entries(S.order.cable[c.id]||{}).forEach(([l,v])=>{\n      if(+v) out.push(['Cable',c.name,l+\"'\",v,c.connector||'']);\n    });\n  });\n  [['Adapters',S.adapters,'adapters'],['Hardware',S.hardware,'hardware']].forEach(([sec,cat,key])=>{\n    ((cat&&cat.items)||[]).forEach(i=>{ if(S.order[key][i.id])\n      out.push([sec,i.name,'',S.order[key][i.id],i.note||'']); });\n  });\n  return out.map(r=>r.map(v=>{const s=String(v??'');\n    return /[\",\\n]/.test(s)?'\"'+s.replace(/\"/g,'\"\"')+'\"':s;}).join(',')).join('\\n');\n}\nasync function downloadCSV(){\n  const csv=toCSV();\n  const vendor=S.vendors.find(v=>v.id===S.vendorId);\n  const name=((S.showName||'order')+'-'+(vendor?vendor.shortCode:'shop')+'-shop-order.csv')\n    .replace(/[^\\w.-]+/g,'-');\n  try{ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:name,data:csv}); return; } }catch(e){}\n  try{ await navigator.clipboard.writeText(csv); alert('CSV copied to the clipboard.'); }\n  catch(e){ alert('Could not export: '+e.message); }\n}\n\n$('csvbtn').onclick=downloadCSV;\n$('printbtn').onclick=()=>{ if(S.tab!=='sheet'){S.tab='sheet';render();} setTimeout(()=>window.print(),140); };\n$('savebtn').onclick=save;\n\n(async()=>{ render(); await load(); render(); })();\n<\/script>\n</body></html>\n"};
/* ═════════════════════════════════════════════════════════════════════
   KTM — shared data layer. Every tool in the suite goes through this.
   1. Path builders live here so segment parity is right, once.
   2. Reads hit the localStorage cache first; the UI never blocks and
      still opens when the store is unreachable.
   3. One writer per collection (OWNERS). Not enforced by the store —
      last-writer-wins, no transactions — so it is enforced by convention.
   ═════════════════════════════════════════════════════════════════════ */
const KTM = (() => {
  let db = null, booted = false, bootErr = null;

  const OWNERS = {
    fixtures:'hub', gear:'hub', meta:'hub', shows:'hub', positions:'hub', derived:'hub',
    power:'distro', patch:'patch', racks:'rack', looms:'loom',
    network:'net', cases:'pull', trucks:'truck', orders:'order'
  };

  const LS = 'ktm:';
  const cacheGet = k => { try{ const v=localStorage.getItem(LS+k); return v?JSON.parse(v):null; }catch{ return null; } };
  const cacheSet = (k,v) => { try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch{} };
  const cacheDel = k => { try{ localStorage.removeItem(LS+k); }catch{} };

  async function boot(){
    if (booted) return db;
    booted = true;
    try { db = await claude.use('db'); }
    catch(e){ db = null; bootErr = e && e.message; }
    return db;
  }

  // Global docs are 2 segments; show subdocs are 4. Collections are odd.
  const P = {
    fixture:  id => 'fixtures/'+id,
    gear:     id => 'gear/'+id,
    meta:     id => 'meta/'+id,
    show:     sid => 'shows/'+sid,
    sub:     (sid,c) => 'shows/'+sid+'/'+c,
    subDoc:  (sid,c,id) => 'shows/'+sid+'/'+c+'/'+id
  };

  async function list(collPath){
    const d = await boot();
    if (!d) return cacheGet(collPath) || [];
    try{
      const snap = await d.collection(collPath).get();
      const rows = snap.docs.map(x => ({ id:x.id, ...x.data() }));
      cacheSet(collPath, rows);
      return rows;
    }catch(e){ return cacheGet(collPath) || []; }
  }

  async function get(docPath){
    const d = await boot();
    if (!d) return cacheGet(docPath);
    try{
      const s = await d.doc(docPath).get();
      if (!s.exists) return null;
      const row = { id:s.id, ...s.data() };
      cacheSet(docPath, row);
      return row;
    }catch(e){ return cacheGet(docPath); }
  }

  async function set(docPath, body){
    const d = await boot();
    if (!d) throw new Error('No store available — changes cannot be saved.');
    const clean = Object.assign({}, body);
    delete clean.id;                       // the id lives in the path, never the body
    clean.updatedAt = new Date().toISOString();
    await d.doc(docPath).set(clean);
    cacheSet(docPath, Object.assign({ id: docPath.split('/').pop() }, clean));
    return clean;
  }

  async function del(docPath){
    const d = await boot();
    if (!d) throw new Error('No store available.');
    await d.doc(docPath).delete();
    cacheDel(docPath);
  }

  const activeShow = () => cacheGet('activeShow');
  const setActive  = sid => cacheSet('activeShow', sid);

  return { boot, P, list, get, set, del, activeShow, setActive, OWNERS,
           cacheGet, cacheSet, get db(){ return db; }, get bootErr(){ return bootErr; } };
})();

/* ── Publish the data layer to the frames ─────────────────────────────────
   `const KTM` at the top level of a classic script is NOT a property of
   window — it lives in the script's own scope. Every tool frame reads
   `window.parent.KTM` through its shim, so without this line all ten tools
   get null and the six native ones render "No shared data layer" instead of
   their UI. The four ported tools appeared to work only because they reach
   the store through the shim's wrapped `claude.use('db')` and never touch
   KTM at all, which is precisely why this went unnoticed.

   Frames capture this once, at frame-script time. That is safe because this
   assignment runs while the Hub's own script is parsed, and no frame is
   mounted until a tool is clicked. */
window.KTM = KTM;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtDate = d => { if(!d) return '—'; try{ return new Date(d).toLocaleDateString(undefined,
  {year:'numeric',month:'short',day:'numeric'}); }catch{ return d; } };

// A fixture attribute's provenance status. "observed" is our fourth state:
// asserted by the shipped tools, no source attached yet. Never treat as verified.
const provStatus = a => (a && a.status) ? a.status : 'observed';
const STATUS_LABEL = { verified:'Verified', interpreted:'Interpreted',
                       conflicting:'Conflict', observed:'Unverified' };

function toast(msg, kind){
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;'
    + 'background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);'
    + 'border-radius:9px;padding:10px 16px;font-size:13px;max-width:min(560px,90vw);'
    + (kind==='bad' ? 'color:var(--crit);' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}

/* ═════════════════════════════════════════════════════════════════════
   Boot
   ═════════════════════════════════════════════════════════════════════ */
(function initTheme(){
  const saved = KTM.cacheGet('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();

$('themebtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  KTM.cacheSet('theme', next);
  applyThemeAll();
};

async function refresh(){
  const [shows, fixtures, gear] = await Promise.all([
    KTM.list('shows'), KTM.list('fixtures'), KTM.list('gear')
  ]);
  S.shows = shows.sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
  S.fixtures = fixtures.sort((a,b)=>
    (a.manufacturer+' '+a.name).localeCompare(b.manufacturer+' '+b.name));
  S.gear = gear.sort((a,b)=> String(a.id||'').localeCompare(String(b.id||'')));
  const act = KTM.activeShow();
  S.activeShow = S.shows.find(x => x.id === act) || S.shows[0] || null;
  if (S.activeShow) KTM.setActive(S.activeShow.id);
  S.loading = false;
}

async function start(){
  render();
  const db = await KTM.boot();
  const pill = $('dbpill'), txt = $('dbtxt');
  if (db){ pill.className = 'pill ok'; txt.textContent = 'store live'; }
  else   { pill.className = 'pill bad'; txt.textContent = 'store offline'; }
  await refresh();
  render();
}

   Render

function render(){ renderRail(); renderShowSel(); renderMain(); renderModal(); }

function renderRail(){
  const sections = [
    ['shows','Shows','var(--accent)'],
    ['library','Fixture library','var(--s1)'],
    ['gear','Gear library','var(--s4)'],
    ['store','Store','var(--s0)']
  ];
  $('rail').innerHTML =
    '<div class="railgrp"><h4>Hub</h4>' +
    sections.map(([k,label,c]) =>
      '<button class="navitem'+(S.section===k?' on':'')+'" data-sec="'+k+'">'
      + '<span class="sq" style="background:'+c+'"></span>'
      + '<span class="lbl">'+label+'</span></button>').join('')
    + '</div>'
    + '<div class="railgrp"><h4>Tools</h4>' +
    TOOLS.map(t => {
      const ready = t.status === 'ready';
      return '<button class="navitem'+(ready?'':' soon')+(S.section==='tool:'+t.key?' on':'')+'"'
      + (ready ? ' data-tool="'+t.key+'"' : '')
      + ' title="'+esc(t.blurb)+'">'
      + '<span class="sq" style="background:'+t.color+'"></span>'
      + '<span class="lbl">'+esc(t.name)+'</span>'
      + '<span class="tag">'+(ready?'':'soon')+'</span></button>';
    }).join('')
    + '</div>';
  $('rail').querySelectorAll('[data-sec]').forEach(b =>
    b.onclick = () => { S.section = b.dataset.sec; render(); });
  $('rail').querySelectorAll('[data-tool]').forEach(b =>
    b.onclick = () => { S.section = 'tool:' + b.dataset.tool; render(); });
}

function renderShowSel(){
  const sel = $('showsel');
  if (!S.shows.length){
    sel.innerHTML = '<option>No shows yet</option>';
    sel.disabled = true; return;
  }
  sel.disabled = false;
  sel.innerHTML = S.shows.map(s =>
    '<option value="'+esc(s.id)+'"'+(S.activeShow && s.id===S.activeShow.id?' selected':'')+'>'
    + esc(s.name) + (s.venue ? ' · '+esc(s.venue) : '') + '</option>').join('');
  sel.onchange = () => {
    KTM.setActive(sel.value);
    S.activeShow = S.shows.find(x=>x.id===sel.value) || null;
    render();
  };
}

function renderMain(){
  const m = $('main'), pane = $('pane');
  if (S.section.startsWith('tool:')){
    pane.classList.add('toolmode');
    mountTool(S.section.slice(5));
    return;
  }
  pane.classList.remove('toolmode');
  document.querySelectorAll('#frames iframe').forEach(f => f.classList.remove('on'));
  if (S.loading){ m.innerHTML = '<div class="empty"><div class="big">Loading…</div></div>'; return; }
  if (S.section === 'shows')   return void (m.innerHTML = viewShows(), wireShows());
  if (S.section === 'library') return void (m.innerHTML = viewLibrary(), wireLibrary());
  if (S.section === 'gear')    return void (m.innerHTML = viewGear(), wireGear());
  if (S.section === 'store')   return void (m.innerHTML = viewStore(), wireStore());
}

/* ── Shows ─────────────────────────────────────────────────────────── */
function viewShows(){
  const a = S.activeShow;
  let h = '<h1>Shows</h1><p class="sub">A show is the unit every tool works inside. '
        + 'Switching the show at the top switches it for the whole suite.</p>';

  if (!KTM.db) h += '<div class="note crit"><b>The store is not reachable in this view.</b> '
    + 'You can read whatever was cached here, but nothing will save. '
    + 'Reload; if it persists the artifact may not have been granted database access.</div>';

  h += '<div class="row" style="margin-bottom:16px"><button class="btn" id="newshow">New show</button></div>';

  if (!S.shows.length){
    h += '<div class="empty"><div class="big">No shows yet</div>'
       + '<div>Create one to give the suite something to hang data off.</div></div>';
    return h;
  }

  if (a){
    h += '<div class="stats">'
      + stat('Positions', a.stat_positions ?? '—')
      + stat('Fixtures', a.stat_fixtures ?? '—')
      + stat('Load in', fmtDate(a.loadIn))
      + stat('Load out', fmtDate(a.loadOut))
      + '</div>';
  }

  h += '<h3>All shows</h3><div class="tablewrap"><table><thead><tr>'
     + '<th>Show</th><th>Client</th><th>Venue</th><th>Load in</th><th>Updated</th><th></th>'
     + '</tr></thead><tbody>'
     + S.shows.map(s =>
        '<tr'+(a && s.id===a.id?' style="background:var(--sel)"':'')+'>'
        + '<td><b>'+esc(s.name)+'</b><br><span class="muted mono" style="font-size:11px">'+esc(s.id)+'</span></td>'
        + '<td>'+esc(s.client||'—')+'</td><td>'+esc(s.venue||'—')+'</td>'
        + '<td class="mono">'+fmtDate(s.loadIn)+'</td>'
        + '<td class="mono muted" style="font-size:11.5px">'+fmtDate(s.updatedAt)+'</td>'
        + '<td style="white-space:nowrap;text-align:right">'
        + '<button class="btn ghost sm" data-edit="'+esc(s.id)+'">Edit</button> '
        + '<button class="btn danger sm" data-delshow="'+esc(s.id)+'">Delete</button></td></tr>').join('')
     + '</tbody></table></div>';
  return h;
}

function wireShows(){
  const nb = $('newshow'); if (nb) nb.onclick = () => { S.modal = {type:'show', data:{}}; render(); };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    S.modal = {type:'show', data: Object.assign({}, S.shows.find(x=>x.id===b.dataset.edit))};
    render();
  });
  document.querySelectorAll('[data-delshow]').forEach(b => b.onclick = async () => {
    const s = S.shows.find(x=>x.id===b.dataset.delshow);
    if (!confirm('Delete "'+s.name+'"?\n\nThe show record goes away. Data nested under it '
      + '(positions, racks, trucks…) is NOT deleted by this — nested documents survive a parent '
      + 'delete in this store, by design.')) return;
    try { await KTM.del(KTM.P.show(s.id)); toast('Deleted "'+s.name+'"'); await refresh(); render(); }
    catch(e){ toast(e.message, 'bad'); }
  });
}

/* ── Fixture library ───────────────────────────────────────────────── */
function viewLibrary(){
  const rows = S.fixtures.filter(f => {
    if (S.libStatus !== 'all'){
      const st = [provStatus(f.power), provStatus(f.weight)];
      if (S.libStatus === 'unverified' && !st.includes('observed') && !st.includes('interpreted')) return false;
      if (S.libStatus === 'verified' && st.some(x => x !== 'verified')) return false;
    }
    if (!S.libQuery) return true;
    const q = S.libQuery.toLowerCase();
    return ((f.manufacturer||'')+' '+(f.name||'')+' '+(f.aliases||[]).join(' ')+' '
      +((f.powerIn&&f.powerIn.connector)||'')).toLowerCase().includes(q);
  });

  const total = S.fixtures.length;
  const verified = S.fixtures.filter(f => provStatus(f.power)==='verified').length;

  let h = '<h1>Fixture library</h1><p class="sub">Canonical across every tool. '
        + 'One fixture, one record, one set of numbers.</p>';

  h += '<div class="note warn"><b>Provenance is the blocking task.</b> These records were '
     + 'extracted from what the four shipped tools currently assert — they agree with each other, '
     + 'but no figure has a source attached. Nine of Distro Plot’s first-pass wattages were wrong, '
     + 'and both traps were labelling traps: LED-engine wattage read as fixture draw, lamp wattage '
     + 'read as fixture draw. Nothing here is <b>verified</b> until a manufacturer PDF says so and '
     + 'the record carries what that source <i>calls</i> the number.</div>';

  const thruYes = S.fixtures.filter(f => f.powerOut && f.powerOut.present === true).length;
  const thruNo  = S.fixtures.filter(f => f.powerOut && f.powerOut.present === false).length;
  const thruUnk = total - thruYes - thruNo;
  h += '<div class="stats">'
     + stat('Fixtures', total)
     + stat('Draw verified', verified + '<small> / '+total+'</small>')
     + stat('Daisy-chains', thruYes)
     + stat('Needs a two-fer', thruNo)
     + (thruUnk ? stat('Pass-thru unknown', thruUnk) : '')
     + '</div>';

  h += '<div class="filters">'
     + '<input type="text" id="libq" placeholder="Search make, model, alias…" value="'+esc(S.libQuery)+'">'
     + '<div class="seg">'
     + ['all','unverified','verified'].map(k =>
        '<button data-st="'+k+'"'+(S.libStatus===k?' class="on"':'')+'>'
        + (k==='all'?'All':k==='unverified'?'Needs source':'Verified')+'</button>').join('')
     + '</div><div class="grow"></div>'
     + '<button class="btn ghost sm" id="addfix">Add fixture</button></div>';

  if (!rows.length){
    h += '<div class="empty"><div class="big">'
       + (total ? 'Nothing matches' : 'Library is empty')+'</div><div>'
       + (total ? 'Try a different search.' : 'Seed it from the session, or add a fixture by hand.')
       + '</div></div>';
    return h;
  }

  h += '<div class="tablewrap"><table><thead><tr>'
     + '<th>Fixture</th><th style="text-align:right">Draw</th><th>Source</th>'
     + '<th>Power in</th><th>Pass-thru</th>'
     + '<th style="text-align:right">Weight</th><th style="text-align:right">Default ch</th>'
     + '<th>Case</th><th></th></tr></thead><tbody>'
     + rows.map(f => {
        const ps = provStatus(f.power), ws = provStatus(f.weight);
        const modes = (f.dmx && f.dmx.footprints) || [];
        const pw = f.power || {}, pin = f.powerIn || {}, po = f.powerOut || {};
        return '<tr>'
        + '<td><b>'+esc(f.name)+'</b><br><span class="muted" style="font-size:11.5px">'
          + esc(f.manufacturer||'')+' · '+esc(f.category||'')+'</span></td>'
        + '<td class="num">'+(pw.value!=null ? pw.value+' <span class="muted" style="font-size:10px">'
          +esc(pw.unit||'')+'</span>' : '<span class="muted">—</span>')+'</td>'
        + '<td><span class="chip '+ps+'">'+STATUS_LABEL[ps]+'</span></td>'
        + '<td>'+connCell(pin)+'</td>'
        + '<td>'+thruCell(po)+'</td>'
        + '<td class="num">'+(f.weight && f.weight.value!=null ? f.weight.value+' lb' : '—')
          + (ws!=='verified' && f.weight && f.weight.value!=null
             ? ' <span class="chip '+ws+'" style="font-size:9px">'+STATUS_LABEL[ws][0]+'</span>' : '')+'</td>'
        + '<td class="num">'+((f.dmx && f.dmx.default) || '—')
          + (modes.length>1 ? ' <span class="muted" style="font-size:10px">+'+(modes.length-1)+'</span>':'')+'</td>'
        + '<td class="muted" style="font-size:11.5px">'
          + (f.case ? esc(f.case.family||'—')+(f.case.perCase?' · '+f.case.perCase+'/case':'') : '—')+'</td>'
        + '<td style="text-align:right"><button class="btn ghost sm" data-fix="'+esc(f.id)+'">Open</button></td>'
        + '</tr>';
       }).join('')
     + '</tbody></table></div>';
  return h;
}

/* The connector is what the electrician has to physically have in the truck,
   so it is shown in full rather than truncated to a family name. */
function connCell(pin){
  if (!pin || !pin.connector)
    return '<span class="muted" style="font-size:11.5px">not published</span>';
  const st = provStatus(pin);
  return '<span class="mono" style="font-size:11px">' + esc(pin.connector) + '</span>'
    + (st !== 'verified' ? ' <span class="chip '+st+'" style="font-size:9px">'
       + STATUS_LABEL[st][0] + '</span>' : '');
}

/* Pass-thru decides whether a fixture daisy-chains or needs its own home run
   or a two-fer. A confirmed NO is as useful as a yes, so it is stated plainly
   rather than left blank. */
function thruCell(po){
  if (!po || po.present === null || po.present === undefined)
    return '<span class="chip observed">unknown</span>';
  const st = provStatus(po);
  if (po.present === false)
    return '<span class="chip conflicting">no · two-fer</span>'
      + (st !== 'verified' ? ' <span class="chip '+st+'" style="font-size:9px">'+STATUS_LABEL[st][0]+'</span>' : '');
  const ml = (po.maxLinked || []).map(([v,n]) => n+' @ '+v+'V').join(', ');
  return '<span class="chip verified">yes</span>'
    + (ml ? ' <span class="muted mono" style="font-size:10px">'+esc(ml)+'</span>' : '');
}

function viewGear(){
  let h = '<h1>Gear library</h1><p class="sub">Everything that is not a fixture — cases, truss '
        + 'products, rack equipment, trailer pack footprints. Shared the same way.</p>';

  if (!S.gear.length){
    h += '<div class="empty"><div class="big">Not seeded yet</div>'
       + '<div>The catalogs live here: cases with real weights and dimensions, truss products '
       + 'with weight per foot, rack equipment with port maps, and trailer pack footprints.</div></div>';
    return h;
  }

  const cats = S.gear.slice().sort((a,b) => String(a.id).localeCompare(String(b.id)));
  const cur  = cats.find(c => c.id === S.gearCat) || cats[0];
  const items = (cur.items || []).filter(it => {
    if (!S.gearQuery) return true;
    return JSON.stringify(it).toLowerCase().includes(S.gearQuery.toLowerCase());
  });

  h += '<div class="filters">'
     + '<div class="seg">' + cats.map(c =>
        '<button data-gcat="'+esc(c.id)+'"'+(c.id===cur.id?' class="on"':'')+'>'
        + esc(c.name || c.id) + ' <span class="muted">'+((c.items||[]).length)+'</span>'
        + '</button>').join('') + '</div>'
     + '<input type="text" id="gearq" placeholder="Search this catalog…" value="'+esc(S.gearQuery)+'">'
     + '</div>';

  if (cur.note)
    h += '<div class="note"><b>'+esc(cur.name)+'.</b> '+esc(cur.note)
       + '<div class="muted mono" style="font-size:11px;margin-top:6px">'+esc(cur.source||'')+'</div></div>';

  // Columns follow the catalog. Each kind is a different kind of fact.
  const COLS = {
    'case':           [['Case','name'],['Type','caseType'],['W','wIn','n'],['L','lIn','n'],
                       ['H','hIn','n'],['Weight lb','weightLb','n'],['Cube ft³','cubeFt','n']],
    'truss':          [['Product','name'],['Manufacturer','manufacturer'],['Profile','profile'],
                       ['Sections (ft)','sections'],['lb / ft','weightPerFt','n']],
    'rack-equipment': [['Device','name'],['Manufacturer','manufacturer'],['RU','ruHeight','n'],
                       ['Width','rackWidth'],['Depth in','depthIn','n'],['Weight lb','weightLb','n'],
                       ['W','powerW','n'],['Ports','portCount','n'],['Source','status','s']],
    'rack-cases':     [['Shell','name'],['RU','ru','n'],['Rail to rail in','railToRailIn','n'],
                       ['Empty lb','emptyLb','n'],['Payload lb','payloadBand','n'],
                       ['Shock','shock','b'],['Source','status','s']],
    'rack-panels':    [['Panel','name'],['Category','category'],['RU','ruHeight','n'],
                       ['Width','rackWidth'],['Depth in','depthIn','n'],['Weight lb','weightLb','n'],
                       ['Source','status','s']],
    'pack-item':      [['Item','name'],['Category','cat'],['W ft','wFt','n'],['D ft','hFt','n']]
  };
  const cols = COLS[cur.kind] || [['Name','name']];

  const cell = (it, c) => {
    let v = it[c[1]];
    /* Payload is a band, not a number — and its floor is the half nobody else
       publishes, so it must not be flattened to a ceiling. */
    if (c[1] === 'payloadBand')
      v = it.payloadMaxLb ? (it.payloadMinLb ? it.payloadMinLb+'–'+it.payloadMaxLb : '≤ '+it.payloadMaxLb) : null;
    if (c[2] === 'b') return '<td>'+(v === true ? 'yes' : v === false ? 'no' : '—')+'</td>';
    if (c[2] === 's'){
      const st = v || 'observed';
      return '<td><span class="chip '+esc(st)+'">'+esc(STATUS_LABEL[st] || st)+'</span></td>';
    }
    if (Array.isArray(v)) v = v.join(' · ');
    if (v === null || v === undefined || v === '') v = '—';
    return '<td'+(c[2]==='n'?' class="num"':'')+'>'+esc(v)+'</td>';
  };

  h += '<div class="tablewrap"><table><thead><tr>'
     + cols.map(c => '<th'+(c[2]==='n'?' style="text-align:right"':'')+'>'+esc(c[0])+'</th>').join('')
     + '</tr></thead><tbody>'
     + (items.length
        ? items.map(it => '<tr>' + cols.map(c => cell(it, c)).join('') + '</tr>').join('')
        : '<tr><td colspan="'+cols.length+'" class="muted" style="text-align:center;padding:26px">'
          + 'Nothing matches</td></tr>')
     + '</tbody></table></div>';

  if (cur.kind === 'case'){
    const withCube = (cur.items||[]).filter(i => typeof i.cubeFt === 'number');
    const lb = (cur.items||[]).reduce((a,i) => a + (Number(i.weightLb)||0), 0);
    h += '<h3>Catalog totals</h3><div class="stats">'
       + stat('Case types', (cur.items||[]).length)
       + stat('With dimensions', withCube.length)
       + stat('Mean weight', Math.round(lb / Math.max(1,(cur.items||[]).length)) + '<small> lb</small>')
       + '</div>';
  }
  return h;
}
