<!doctype html><html><head><meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rack Plot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E3E5E0; --surface:#F8F8F6; --surface-2:#EBEDE8; --sunken:#DDDFD9;
  --line:#C8CBC3; --line-strong:#A6AAA0;
  --ink:#15181B; --ink-2:#4C5257; --ink-3:#5C636A;
  --accent:#1C7566; --accent-soft:#D3E5E0; --on-accent:#FFFFFF;
  --warn:#A56A12; --warn-soft:#F0E2C6;
  --crit:#A93A28; --crit-soft:#F2D9D3;
  --s1:#2A5CA0; --s2:#D0611E; --s3:#1E8F7A; --s4:#A0662A; --s5:#8B4FBF;
  --s6:#7F8C1E; --s7:#C43A5E; --s8:#2F8FBF; --s0:#71787F;
  --shadow:0 1px 2px rgba(20,25,30,.10), 0 6px 18px -10px rgba(20,25,30,.22);
  --sel:#D3E5E0;
  --rail:#B9BDB5; --rail-2:#A2A79E;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;
  --line:#2B3136; --line-strong:#404850;
  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;
  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;
  --warn:#D9A341; --warn-soft:#382C13; --crit:#E2705F; --crit-soft:#3A1E19;
  --s1:#4F86DA; --s2:#D9743C; --s3:#2FA88E; --s4:#B98546; --s5:#A47ADF;
  --s6:#889A2E; --s7:#D95C7E; --s8:#38A2C8; --s0:#6E777F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);
  --sel:#173630; --rail:#343B41; --rail-2:#454E56;
}}
:root[data-theme="dark"]{
  --ground:#0E1113; --surface:#171B1E; --surface-2:#1F2427; --sunken:#121618;
  --line:#2B3136; --line-strong:#404850;
  --ink:#E7EAE7; --ink-2:#AAB2B7; --ink-3:#8A939B;
  --accent:#45BFA7; --accent-soft:#173630; --on-accent:#08110F;
  --warn:#D9A341; --warn-soft:#382C13; --crit:#E2705F; --crit-soft:#3A1E19;
  --s1:#4F86DA; --s2:#D9743C; --s3:#2FA88E; --s4:#B98546; --s5:#A47ADF;
  --s6:#889A2E; --s7:#D95C7E; --s8:#38A2C8; --s0:#6E777F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.8);
  --sel:#173630; --rail:#343B41; --rail-2:#454E56;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;
  line-height:1.45;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:var(--ink)}
option{color:var(--ink);background:var(--surface)}
table,.card,.note,.stat{color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 15px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-family:"Archivo",sans-serif;font-size:15px;font-weight:700;margin:0;letter-spacing:.03em;white-space:nowrap}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sel);color:var(--ink);font-weight:600}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:7px 13px;
  font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);filter:none}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}
.btn.danger:hover{background:var(--crit-soft);filter:none}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
input[type=text],input[type=number],select{background:var(--surface-2);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}

main{flex:1;overflow-y:auto;padding:16px 18px 70px}
.wrap{max-width:1280px;margin:0 auto}
.cols{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
h3{font-family:"Archivo",sans-serif;font-size:12px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--accent);margin:20px 0 8px}
h4{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stat .v{font-family:"Archivo",sans-serif;font-size:21px;font-weight:700;line-height:1.15;margin-top:1px}
.stat .v small{font-size:10.5px;font-weight:500;color:var(--ink-3)}
.stat.flag{border-color:var(--warn);background:var(--warn-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  box-shadow:var(--shadow);margin-bottom:12px}
.note{border-radius:10px;padding:11px 14px;font-size:12.5px;border:1px solid var(--line);
  background:var(--surface);margin-bottom:13px}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.crit{background:var(--crit-soft);border-color:transparent}
.muted{color:var(--ink-3)}
.chip{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.dim{background:var(--sunken);color:var(--ink-3)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty .big{font-family:"Archivo",sans-serif;font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:7px 9px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 9px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* rack list */
.racktab{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;
  border:1px solid transparent;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--ink-2);font-size:13px}
.racktab:hover{background:var(--surface-2);color:var(--ink)}
.racktab.on{background:var(--sel);color:var(--ink);font-weight:600;border-color:var(--line)}
.racktab .sq{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.racktab .n{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:500}

/* the elevation */
.elev{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  box-shadow:var(--shadow)}
.elevhead{display:flex;align-items:baseline;gap:11px;margin-bottom:10px;flex-wrap:wrap}
.elevhead b{font-family:"Archivo",sans-serif;font-size:15px}
.elevhead .m{font-size:11.5px;color:var(--ink-3)}
svg{display:block;width:100%;height:auto}

/* port editor */
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px;margin-top:9px}
.port{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.port .pn{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.pdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.pdot.output{background:var(--s3)} .pdot.input{background:var(--s2)}
.pdot.network{background:var(--s1)} .pdot.power{background:var(--s7)}
.port input{width:100%;font-size:11.5px;padding:3px 6px;background:var(--surface);margin-bottom:3px}
.port input:last-child{margin-bottom:0}
.port.used{border-color:var(--accent)}

/* clickable gaps */
.slot{cursor:pointer}
.slot rect{fill:var(--accent);fill-opacity:0;stroke:var(--line-strong);stroke-width:1;
  stroke-dasharray:3 3;stroke-opacity:0;transition:fill-opacity .12s,stroke-opacity .12s}
.slot text{fill:var(--ink-3);opacity:0;font-family:"IBM Plex Sans",sans-serif;font-weight:600;
  transition:opacity .12s;pointer-events:none}
.slot:hover rect{fill-opacity:.12;stroke-opacity:.9}
.slot:hover text{opacity:.85}
.dev{cursor:pointer}
.dev.sel rect{stroke:var(--ink);stroke-width:2}
.card.sel{outline:2px solid var(--accent);outline-offset:-1px}

/* the picker */
.scrim{position:fixed;inset:0;background:rgba(10,14,16,.46);display:flex;align-items:flex-start;
  justify-content:center;padding:6vh 16px;z-index:60}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);width:100%;max-width:520px;max-height:82vh;display:flex;
  flex-direction:column;overflow:hidden}
.pickhead{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.pickhead b{font-family:"Archivo",sans-serif;font-size:15px}
.pickhead .m{font-size:11.5px;color:var(--ink-3)}
.pickhead .grow{flex:1}
.picker>input{margin:0 16px 10px;width:calc(100% - 32px)}
.picklist{overflow-y:auto;padding:0 10px 6px;flex:1}
.pickcat{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 6px 5px;position:sticky;top:0;background:var(--surface)}
.pickrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;
  border:0;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--ink);font-size:13px}
.pickrow:hover{background:var(--sel)}
.pickrow .nm{flex:1;min-width:0}
.pickrow .sp{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.pickfoot{border-top:1px solid var(--line);padding:10px 16px 12px}

/* checks + face selector */
.chks{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.chks .note{margin:0}
.note.info{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.elevhead .grow{flex:1}
.facesel button{font-size:11.5px;padding:4px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--ink-3)}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;
  vertical-align:-1px;border:1px dashed var(--line-strong);background:repeating-linear-gradient(
  45deg,var(--line-strong) 0 1.5px,transparent 1.5px 4px)}
.legend .sw.solid{background:var(--s0);opacity:.42;border-style:dashed}
.port .pf{margin-left:auto;font-size:8.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.linkbtn{padding:1px 6px;font-size:10px;margin-left:auto;line-height:1.4}
.linkbadge{font-size:10px;color:var(--ink-3);margin-top:3px}
.linkbadge.cross{color:var(--accent);font-weight:600}
.linkpop{position:absolute;z-index:40;top:100%;left:0;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow);padding:8px;width:230px;margin-top:4px}
.linkpop select{width:100%;margin-bottom:6px;font-size:11.5px}

@media print{
  .bar,.side{display:none} main{overflow:visible;padding:0}
  body{overflow:visible;background:#fff}
  .cols{grid-template-columns:1fr}
  .elev{box-shadow:none;border:0;padding:0;break-inside:avoid}
  .ports{display:none}
}
@media(max-width:960px){ .cols{grid-template-columns:1fr} }
</style></head><body>

<div class="bar">
  <h1>Rack&nbsp;Plot</h1>
  <div class="seg" id="tabs"></div>
  <div class="grow"></div>
  <button class="btn ghost sm" id="csvbtn">CSV</button>
  <button class="btn ghost sm" id="printbtn">Print</button>
  <button class="btn sm" id="savebtn">Save racks</button>
</div>
<main><div class="wrap" id="root"></div></main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Rack Plot — rack elevations and port-level patching.

   Patch decides which universes exist, Rack decides which physical port
   carries each one and what leaves that port.

   ── 2026-09-11: the geometry rebuild ─────────────────────────────────
   The first version modelled a rack as a stack of whole U's, one device
   per U, one face. Research against the standards and against real
   touring gear says that is wrong in four ways at once, and every one of
   them is expensive to retrofit later:

   1. HALF-U IS REAL. NetBox stores u_height as a multiple of 0.5 and the
      EIA panel formula (h = 1.750n − 0.031 in) has nothing to say about
      whole numbers. Stored here in HALF-U integers, because floating
      point in a grid is a bug farm.

   2. HALF-RACK IS THE NORMAL CASE, not the exception. ETC sells the
      Response Mk2 gateway as "eight DMX ports in 1U" — meaning two side
      by side. LumiNodes, the GigaCore 10t and Enttec's Storm are all
      half-width. A node rack drawn one-device-per-U is not that rack.
      NetBox cannot do this; ConnectCAD and D-Tools can. We follow the AV
      tools. Width is counted in SIXTHS of the face so a half-rack and a
      third-rack device can share a U without the grid lying.

   3. A RACK HAS TWO FACES. A device that is not full depth leaves the
      other side of that U free, which is how PDUs and patch fields live
      behind the gear. Front and rear are separate elevations; a
      full-depth device blocks both.

   4. DEPTH IS THE BINDING CONSTRAINT IN TOURING, not U count. SKB's 8U
      24-inch shock rack gives 23.75 in rail to rail inside a 28.5 in
      case; ProX charges a flat 2.5 in for front and rear lids. A
      Hippotizer is 24.8 in deep. So the rack references a CASE from
      gear/rack-cases and the fit check is against that case's rackable
      depth, not against a generic "will it hold".

   Two patterns carried over from Pre-Pro, both scar tissue, both intact:

   * NEVER re-render on an input event. A full render() on blur destroys
     the DOM and kills keyboard navigation mid-edit. Port fields write to
     the model and repaint nothing.
   * RU 1 IS THE BOTTOM, the way a rack is counted in front of a road case.

   Old documents load unchanged: a missing face reads front, a missing
   col reads 0, a missing rackWidth reads full. Nothing is migrated.
   ═══════════════════════════════════════════════════════════════════════ */

const $  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const COLORS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8','--s0'];

/* ── the two grid units ──────────────────────────────────────────────── */
const HU = 2;                                    /* half-U per rack unit  */
const WU = 6;                                    /* width units per face  */
const WIDTHS = { full:6, half:3, third:2 };
const WIDTH_LABEL = { full:'Full 19″', half:'Half rack', third:'Third rack' };
const FILL_LIMIT = 0.80;   /* F502-derived: 80 % of rack space used, blanks fill the rest */

const S = { tab:'build', face:'front', loaded:false, show:null, showName:'',
            equip:[], cases:[], racks:[], looms:[], cur:null, dirty:false,
            place:null, placeQ:'', sel:null, linkPop:null, sparePop:null, staleLinks:0,
            patch:null };

async function load(){
  const K = window.KTM;
  if(!K){ S.loaded=true; return; }
  const gear = await K.list('gear');
  const re = gear.find(g=>g.kind==='rack-equipment');
  const rp = gear.find(g=>g.kind==='rack-panels');
  const rc = gear.find(g=>g.kind==='rack-cases');
  /* Panels are equipment as far as the grid is concerned — a blank takes a U
     exactly like a switch does, and the 80 % fill rule is only actionable if
     the thing that fills the rest is in the same picker. */
  S.equip = ((re && re.items) || []).map(e=>Object.assign({category:'gear'}, e))
    .concat(((rp && rp.items) || []).map(e=>Object.assign({}, e, {category:e.category||'panel'})));
  S.cases = (rc && rc.items) || [];
  S.show = K.activeShow ? K.activeShow() : null;
  if(S.show){
    const sh = await K.get(K.P.show(S.show));
    S.showName = (sh && sh.name) || S.show;
    S.racks = await K.list(K.P.sub(S.show,'racks'));
    S.racks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
    S.looms = await K.list(K.P.sub(S.show,'looms'));
    /* Read-only: Rack Plot never writes the patch. Missing or unreadable
       degrades silently to null — the panel and datalist just go quiet. */
    try{ S.patch = await K.get(K.P.subDoc(S.show,'patch','plan')) || null; }
    catch(e){ S.patch = null; }
  }
  S.cur = S.racks[0] ? S.racks[0].id : null;
  S.staleLinks = pruneStaleLinks();
  S.loaded = true;
}

/* ── port links ───────────────────────────────────────────────────────────
   A port entry can carry an optional `link` to another physical port —
   another rack's gear port, or a break-in line on a loom cable. Loom-side
   links are one-way: Rack Plot reads looms, never writes them. */
function lineCount(cable){
  const c=cable||{}, b=c.breakout;
  if(b==='CPC4') return 4;
  if(b==='CPC8') return 8;
  if(b==='SOCA') return 6;
  const t=String(c.type||'');
  if(/CPC8/i.test(t)) return 8;
  if(/CPC4/i.test(t)) return 4;
  return 0;
}
function allCables(){
  const out=[];
  (S.looms||[]).forEach(sh=>(sh.cables||[]).forEach(c=>{
    if(lineCount(c)>0) out.push({sheetId:sh.id, sheetName:sh.name||sh.id, cable:c});
  }));
  return out;
}
function findRackItemPort(rackId,itemKey,portId){
  const r=S.racks.find(x=>x.id===rackId); if(!r) return null;
  const it=(r.items||[]).find(x=>x.key===itemKey); if(!it) return null;
  const e=eq(it.gearId); if(!e) return null;
  const p=(e.ports||[]).find(x=>x.id===portId); if(!p) return null;
  return {rack:r, item:it, port:p};
}
function lineClaimedBy(sheetId,cableId,line,exRackId,exItemKey,exPortId){
  for(const rr of S.racks) for(const ii of (rr.items||[])) for(const pid in (ii.ports||{})){
    if(rr.id===exRackId && ii.key===exItemKey && pid===exPortId) continue;
    const l=(ii.ports[pid]||{}).link;
    if(l && l.kind==='loom' && l.sheetId===sheetId && l.cableId===cableId && l.line===line) return true;
  }
  return false;
}
function linkText(link){
  if(!link) return '';
  if(link.kind==='rack'){
    const t=findRackItemPort(link.rackId, link.itemKey, link.portId);
    if(!t) return '→ (missing)';
    return `→ ${t.rack.name||'Rack'} · ${t.item.label||(eq(t.item.gearId)||{}).name||''} · ${t.port.name||t.port.id}`;
  }
  if(link.kind==='loom'){
    const sh=(S.looms||[]).find(s=>s.id===link.sheetId);
    const c=sh && (sh.cables||[]).find(x=>x.id===link.cableId);
    if(!c) return '→ (missing)';
    return `→ ${c.label||c.id}-${link.line} · ${sh.name||sh.id}`;
  }
  return '';
}
/* Drop links whose target no longer exists. Runs once on load; nothing is
   saved until the user saves. */
function pruneStaleLinks(){
  let n=0;
  S.racks.forEach(r=>(r.items||[]).forEach(it=>{
    Object.keys(it.ports||{}).forEach(pid=>{
      const link=(it.ports[pid]||{}).link; if(!link) return;
      let ok=false;
      if(link.kind==='rack') ok=!!findRackItemPort(link.rackId, link.itemKey, link.portId);
      else if(link.kind==='loom'){
        const sh=(S.looms||[]).find(s=>s.id===link.sheetId);
        const c=sh && (sh.cables||[]).find(x=>x.id===link.cableId);
        ok = !!(c && link.line>=1 && link.line<=lineCount(c));
      }
      if(!ok){ delete it.ports[pid].link; n++; }
    });
  }));
  return n;
}

/* ── splitter propagation ─────────────────────────────────────────────────
   Pure: apply the "blank or unchanged" rule to every OUTPUT port of an item
   given the input port that was just typed on. Never touches inputs. */
function propagate(item, gearPorts, inputPortId, oldVal, newVal){
  const outs=(gearPorts||[]).filter(p=>p.type==='output');
  outs.forEach(p=>{
    item.ports=item.ports||{};
    const cur=(item.ports[p.id]||{}).universe||'';
    if(cur===''||cur===oldVal) item.ports[p.id]=Object.assign({}, item.ports[p.id], {universe:newVal});
  });
}

/* ── copy universes to spare ──────────────────────────────────────────────
   Target resolution: a same-gear item in this rack named "<label> SP" /
   "-SP" / " SPARE" / "(SP)"; else the only other same-gear item in this
   rack; else the caller must prompt across all racks. */
function findSpareTarget(r, it){
  const label=(it.label||(eq(it.gearId)||{}).name||'').toUpperCase();
  const suffixes=[' SP','-SP',' SPARE','(SP)'];
  const sameRack=(r.items||[]).filter(x=>x.key!==it.key && x.gearId===it.gearId);
  const bySuffix=sameRack.find(x=>{
    const xl=(x.label||'').toUpperCase();
    return suffixes.some(sfx=>xl===label+sfx);
  });
  if(bySuffix) return {kind:'item', item:bySuffix, rack:r};
  if(sameRack.length===1) return {kind:'item', item:sameRack[0], rack:r};
  const all=[];
  S.racks.forEach(rr=>(rr.items||[]).forEach(ii=>{
    if(ii.gearId===it.gearId && !(rr.id===r.id && ii.key===it.key)) all.push({item:ii, rack:rr});
  }));
  if(!all.length) return {kind:'none'};
  return {kind:'choose', options:all};
}
/* Copy universe + label port-by-port by port id; never the link. */
function copyToSpare(it, target){
  const e=eq(it.gearId); if(!e) return;
  (e.ports||[]).forEach(p=>{
    const src=(it.ports||{})[p.id]||{};
    target.ports=target.ports||{};
    const cur=target.ports[p.id]||{};
    target.ports[p.id]=Object.assign({}, cur.link?{link:cur.link}:{}, {universe:src.universe||'', label:src.label||''});
  });
  S.dirty=true;
}
/* Applies the copy and, if the target is on the rack currently on screen,
   patches its DOM inputs directly instead of triggering a render(). */
function doCopy(it, targetItem, targetRack){
  copyToSpare(it, targetItem);
  if(targetRack.id!==S.cur) return;
  const e=eq(it.gearId); if(!e) return;
  (e.ports||[]).forEach(p=>{
    const tp=(targetItem.ports||{})[p.id]||{};
    const pu=document.querySelector('[data-pu="'+CSS.escape(targetItem.key+'|'+p.id)+'"]');
    if(pu) pu.value=tp.universe||'';
    const pl=document.querySelector('[data-pl="'+CSS.escape(targetItem.key+'|'+p.id)+'"]');
    if(pl) pl.value=tp.label||'';
    const portDiv=(pu&&pu.closest('.port'))||(pl&&pl.closest('.port'));
    if(portDiv) portDiv.classList.toggle('used', !!(tp.universe||tp.label||tp.link));
  });
}

async function save(){
  const K=window.KTM;
  if(!K) return alert('No store available.');
  if(!S.show) return alert('Pick a show in the Hub first — racks belong to a show.');
  const b=$('savebtn'); b.disabled=true; b.textContent='Saving…';
  try{
    for(const r of S.racks){
      const {id, ...body} = r;
      await K.set(K.P.subDoc(S.show,'racks',id), body);
    }

}

const rack = () => S.racks.find(r=>r.id===S.cur);
const eq   = id => S.equip.find(e=>e.id===id);
const kase = r => S.cases.find(c=>c.id===(r||{}).caseId);
const other = f => f==='front' ? 'rear' : 'front';

/* ── accessors that default old documents into the new shape ─────────── */
const hOf    = e  => Math.max(1, Math.round((e.ruHeight||1)*HU));      /* half-U tall */
const wKeyOf = e  => (e.rackWidth && WIDTHS[e.rackWidth]) ? e.rackWidth : 'full';
const wOf    = e  => WIDTHS[wKeyOf(e)];
const deepOf = e  => e.fullDepth !== false;   /* absent means full depth — the safe read */
const isPanel = e => !!e && (e.category||'gear')!=='gear';
const faceOf = it => it.face==='rear' ? 'rear' : 'front';
const colOf  = it => Math.max(0, Math.min(WU-1, it.col|0));
const h0Of   = it => Math.max(0, Math.round(((it.ru||1)-1)*HU));
const ruLabel = it => { const e=eq(it.gearId)||{}, h=hOf(e), b=it.ru||1;
  return h===1 ? String(b)+'½' : (h/HU===1 ? String(b) : b+'–'+(b+h/HU-1)); };

/* ── occupancy ────────────────────────────────────────────────────────────
   A cell is one half-U by one sixth of the face, keyed "h|w" with h counted
   up from the floor. A device that is NOT full depth occupies its own face
   only; a full-depth one occupies the cell on both faces, which is the whole
   reason the flag exists. */
function occupancy(r, face){
  const map = {};
  (r.items||[]).forEach(it=>{
    const e = eq(it.gearId); if(!e) return;
    if(faceOf(it)!==face && !deepOf(e)) return;
    const h0=h0Of(it), hh=hOf(e), c0=colOf(it), ww=wOf(e);
    for(let h=h0; h<h0+hh; h++) for(let w=c0; w<c0+ww; w++) map[h+'|'+w] = it;
  });
  return map;
}

function fits(r, ru, col, e, face, ignoreKey){
  const hh=hOf(e), ww=wOf(e), h0=Math.round((ru-1)*HU);
  if(h0<0 || col<0 || col+ww>WU) return false;
  if(h0+hh > (r.ru||12)*HU) return false;
  /* A whole-U device mounts on a U boundary. The EIA hole pattern repeats per
     unit — 0.5 / 0.625 / 0.625 in — so there is nowhere to put the screws half
     a unit up. Only half-U gear may sit on a half offset. This lives here and
     not only in firstFit because the add path walks positions directly. */
  if(hh % HU === 0 && h0 % HU !== 0) return false;
  const near = occupancy(r, face);
  /* a full-depth device has to clear the far face as well, where a shallow
     device may be sitting that the near-face map never showed */
  const far  = deepOf(e) ? occupancy(r, other(face)) : null;
  for(let h=h0; h<h0+hh; h++) for(let w=col; w<col+ww; w++){
    const a=near[h+'|'+w]; if(a && a.key!==ignoreKey) return false;
    if(far){ const b=far[h+'|'+w]; if(b && b.key!==ignoreKey) return false; }
  }
  return true;
}

/* Lowest slot that takes it: up the rack, then left to right. A whole-U
   device is kept on a U boundary — half-U offsets are for half-U gear. */
function firstFit(r, e, face){
  const hh=hOf(e), ww=wOf(e), maxH=(r.ru||12)*HU;
  for(let h0=0; h0+hh<=maxH; h0++){
    if(hh % HU === 0 && h0 % HU !== 0) continue;
    for(let c=0; c+ww<=WU; c+=ww){
      if(fits(r, h0/HU+1, c, e, face)) return {ru: h0/HU+1, col:c};
    }
  }
  return null;
}

/* ── fill ──────────────────────────────────────────────────────────────
   Reported as a fraction of the face's cells rather than as whole U's,
   because with half-rack gear "8 of 12 RU" stopped being true. */
function fill(r, face){
  const occ=occupancy(r, face), total=(r.ru||12)*HU*WU;
  const cells=Object.keys(occ).length;
  return { cells, total, pct: total ? cells/total : 0, ru: cells/(HU*WU) };
}

/* ── the checks ───────────────────────────────────────────────────────────
   Every one of these reports; none of them block. Net Plot's rule, and the
   same reason: a deliberate exception happens, and the tool's job is to make
   it visible rather than to refuse it. Each check goes quiet when the data
   it needs is absent, so an unresearched device is never a false alarm. */
/* Depth precedence: what you measured beats what the catalogue claims, and a
   shell known only as "16 RU" has nothing to claim. One number, typed once,
   turns the fit check on for a rack whose shell has no model number. */
function depthOf(r){
  if(r && r.railToRailIn) return {in:r.railToRailIn, from:'measured on this rack'};
  const c=kase(r);
  if(c && c.railToRailIn)  return {in:c.railToRailIn, from:esc(c.name)};
  return null;
}

function checks(r){
  const out=[], c=kase(r), items=(r.items||[]), d=depthOf(r);

  if(d){
    items.forEach(it=>{
      const e=eq(it.gearId); if(!e || !e.depthIn) return;
      if(e.depthIn > d.in)
        out.push({k:'crit', t:`<b>${esc(it.label||e.name)} does not fit this rack.</b> `
          +`${e.depthIn}″ deep against ${d.in}″ rail to rail — ${d.from}.`});
    });
  }else{
    /* Not a nag — a statement of what is not being checked, and how to turn it
       on. Most shells arrive from a rental vendor as a height and nothing else;
       and where a maker does publish a depth it is not always comparable —
       Gator define theirs as front rail to the inside of the rear lid, which is
       larger than the usable span. Either way: no figure, no check. */
    const why = c && c.generic ? `${esc(c.name)} is a vendor shell with no published depth`
              : c && c.depthLabel ? `${esc(c.name)} publishes “${esc(c.depthLabel)}”, which is not a rail-to-rail span`
              : c ? `${esc(c.name)} publishes no depth figure`
              : 'no case is set';
    const deepest = items.map(it=>eq(it.gearId)).filter(e=>e&&e.depthIn)
                         .sort((a,b)=>b.depthIn-a.depthIn)[0];
    out.push({k:'info', t:`<b>Depth is not being checked.</b> ${why}. `
      +`Measure rail to rail once and put it in the Rack panel — that is all it needs.`
      +(deepest?` The deepest thing in here is ${esc(deepest.name)} at ${deepest.depthIn}″.`:'')});
  }

  const wt = items.reduce((a,it)=>a+((eq(it.gearId)||{}).weightLb||0),0);
  const unweighed = items.filter(it=>!((eq(it.gearId)||{}).weightLb)).length;
  if(c && wt && !unweighed){
    if(c.payloadMaxLb && wt > c.payloadMaxLb)
      out.push({k:'crit', t:`<b>Over the case payload.</b> ${wt.toFixed(0)} lb of gear against `
        +`${c.payloadMaxLb} lb. `+(c.shock?'Shock mounts are rated, not advisory.':'')});
    else if(c.shock && c.payloadMinLb && wt < c.payloadMinLb)
      out.push({k:'warn', t:`<b>Under the isolator band.</b> ${wt.toFixed(0)} lb against a `
        +`${c.payloadMinLb}–${c.payloadMaxLb} lb rating. A shock rack below its band does not `
        +`isolate — it bottoms out.`});
  }

  const f=fill(r,'front');
  if(f.pct > FILL_LIMIT)
    out.push({k:'warn', t:`<b>Front face is ${Math.round(f.pct*100)} % full.</b> AVIXA F502 `
      +`practice caps a rack at ${FILL_LIMIT*100} % with blanks filling the rest, for airflow and `
      +`for the next revision.`});

  /* Only DIRECTIONS can conflict. A convection-cooled device has no direction
     and fights nothing, so it is excluded rather than counted as a third camp. */
  const DIRECTED={'front-to-rear':1,'rear-to-front':1,'side-vented':1};
  const flows={};
  items.forEach(it=>{ const e=eq(it.gearId);
    if(e && e.airflow && DIRECTED[e.airflow]) (flows[e.airflow]=flows[e.airflow]||[]).push(it.label||e.name); });
  if(Object.keys(flows).length>1)
    out.push({k:'warn', t:`<b>Mixed airflow in one case.</b> `
      +Object.entries(flows).map(([k,v])=>esc(k)+' — '+v.length+(v.length===1?' device':' devices')).join('; ')
      +`. One device is eating another's exhaust.`});

  const watts = items.reduce((a,it)=>a+((eq(it.gearId)||{}).powerW||0),0);
  if(watts) out.push({k:'info', t:`<b>${watts} W maximum draw</b> — ${Math.round(watts*3.412)} BTU/hr, `
    +`${(watts/120).toFixed(1)} A at 120 V. A 20 A circuit runs continuous to 16 A.`});

  return out;
}

/* Every universe assigned anywhere, and where. Duplicates are the finding —
   the same universe on two ports is nearly always a mistake, and nothing
   else in the suite would catch it. */
function universeIndex(){
  const idx = {};
  S.racks.forEach(r=>(r.items||[]).forEach(it=>{
    Object.entries(it.ports||{}).forEach(([pid,p])=>{
      const u=(p.universe||'').trim(); if(!u) return;
      (idx[u]=idx[u]||[]).push({rack:r.name, item:it.label||(eq(it.gearId)||{}).name, port:pid});
    });
  }));
  return idx;
}

/* ── the patch, read only ─────────────────────────────────────────────────
   Rack Plot never writes shows/{show}/patch/plan; it only reads it, to offer
   universe numbers and to flag drift between the two documents. */
function patchUniverses(){ return (S.patch && S.patch.universes) || []; }
function rackUniverseSet(){
  const set=new Set();
  S.racks.forEach(r=>(r.items||[]).forEach(it=>{
    Object.values(it.ports||{}).forEach(p=>{
      const u=(p.universe||'').trim(); if(u) set.add(u);
    });
  }));
  return set;
}
function univDatalist(){
  const opts=patchUniverses().map(u=>
    `<option value="${esc(u.num)}">${esc(u.posName||'')} · ${esc(u.used!=null?u.used:'')} ch</option>`).join('');
  return `<datalist id="univlist">${opts}</datalist>`;
}
/* "From the patch": universes the plan calls for that no rack port carries
   yet, and universes on rack ports that the plan never mentioned — both
   findings, not errors, same tone as the duplicate-universe flag. */
function fromPatchPanel(){
  let inner;
  if(!S.patch){
    inner='<div class="note">No patch saved for this show yet.</div>';
  }else{
    const puns=patchUniverses(), onRack=rackUniverseSet();
    const missing=puns.filter(u=>!onRack.has(String(u.num).trim()));
    const planSet=new Set(puns.map(u=>String(u.num).trim()));
    const extraSet=new Set();
    S.racks.forEach(r=>(r.items||[]).forEach(it=>{
      Object.values(it.ports||{}).forEach(p=>{
        const u=(p.universe||'').trim(); if(!u) return;
        if(!planSet.has(u)) extraSet.add(u);
      });
    }));
    const bits=[];
    if(missing.length) bits.push(missing.length+' from the plan not yet on a rack port: '
      +missing.map(u=>esc(u.num)+' · '+esc(u.posName||'')).join(', '));
    else if(puns.length) bits.push('every patched universe is on a rack port');
    if(extraSet.size) bits.push(extraSet.size+' hand-typed universe'+(extraSet.size===1?'':'s')+' not in the plan');
    inner='<div class="note warn">'+(bits.length?bits.join(' · '):'Nothing to flag.')+'</div>';
  }
  return '<div class="card"><h4>From the patch</h4>'+inner+'</div>';
}

function counts(){
  let items=0, ru=0, usedCells=0, totalCells=0, ports=0, patched=0, halfw=0, rear=0;
  S.racks.forEach(r=>{
    ru += (r.ru||12);
    totalCells += (r.ru||12)*HU*WU;
    usedCells  += fill(r,'front').cells;
    (r.items||[]).forEach(it=>{
      const e=eq(it.gearId); if(!e) return;
      items++;
      if(wKeyOf(e)!=='full') halfw++;
      if(faceOf(it)==='rear') rear++;
      const out=(e.ports||[]).filter(p=>p.type==='output');
      ports += out.length;
      out.forEach(p=>{ const pp=(it.ports||{})[p.id]; if(pp && (pp.universe||pp.label)) patched++; });
    });
  });
  const dupes = Object.values(universeIndex()).filter(a=>a.length>1).length;
  return {racks:S.racks.length, items, ru, ports, patched, dupes, halfw, rear,
          used: usedCells/(HU*WU), pct: totalCells ? usedCells/totalCells : 0};
}

/* ── render ───────────────────────────────────────────────────────────── */
function render(){
  $('tabs').innerHTML=[['build','Racks'],['patch','Patch sheet']]
    .map(([k,l])=>`<button data-tab="${k}"${S.tab===k?' class="on"':''}>${l}</button>`).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});

  const r=$('root');
  if(!S.loaded){ r.innerHTML='<div class="empty"><div class="big">Loading…</div></div>'; return; }
  if(!window.KTM){
    r.innerHTML='<div class="note crit"><b>No shared data layer.</b> Rack Plot reads the rack '
      +'equipment catalog from the Hub. Open it from inside the KTM Hub rather than on its own.</div>';
    return;
  }
  if(!S.equip.length){
    r.innerHTML='<div class="empty"><div class="big">Rack equipment catalog is empty</div>'
      +'<div>Seed <span class="mono">gear/rack-equipment</span> in the Hub first.</div></div>';
    return;
  }
  r.innerHTML = S.tab==='build' ? viewBuild() : viewPatch();
  S.tab==='build' ? wireBuild() : null;
}

         + `<span>${esc(r.name||'Rack')}</span>`

      : '<div class="muted" style="font-size:12px;margin-bottom:8px">No racks yet.</div>')

   + '<button class="btn sm" id="addrack">Add</button></div></div>';

  const r=rack();
  if(r){
    h+='<div class="card"><h4>Adding gear</h4>'
     + '<div class="muted" style="font-size:12px;line-height:1.55">'
     + '<b style="color:var(--ink)">Click any empty space in the rack.</b> It asks what goes '
     + 'there and offers only what actually fits that slot on that face. Click a device to '
     + 'jump to its ports.</div></div>'

     + '<div class="card"><h4>Rack</h4>'
     + `<div style="display:flex;gap:6px;margin-bottom:6px"><input type="text" id="rkname" value="${esc(r.name||'')}" style="flex:1;min-width:0">`
     + `<input type="number" id="rkru" value="${r.ru||12}" min="1" max="45" style="width:62px"></div>`
     + '<select id="rkcase" style="width:100%;margin-bottom:6px">'

     + `placeholder="—" style="width:72px" title="Rail to rail, inches">`

     + `</div>`

     + `<span><i class="sw"></i>Hatched — free, but shallow gear only: the ${other(S.face)} face `

  return h+'</div></div>'+placeModal()+sparePopModal()+univDatalist();
}

function sparePopModal(){
  const sp=S.sparePop; if(!sp) return '';
  return '<div class="scrim" id="sparescrim"><div class="picker" style="max-width:380px">'
   + '<div class="pickhead"><b>Copy universes to which item?</b><span class="grow"></span>'
   + '<button class="btn ghost sm" id="sparecancel">Close</button></div>'
   + '<div style="padding:0 16px 16px">'
   + '<select id="sparesel" style="width:100%">'
   + sp.options.map((o,i)=>`<option value="${i}">`
      + `${esc(o.item.label||(eq(o.item.gearId)||{}).name||o.item.key)} — ${esc(o.rack.name||o.rack.id)}</option>`).join('')
   + '</select>'
   + '<div style="margin-top:10px"><button class="btn sm" id="sparego">Copy</button></div>'
   + '</div></div></div>';
}


/* ── free space, as something you can click ───────────────────────────────
   The grid is half-U by sixths, which on a 16 RU rack is 192 cells. That is
   not a click target — a gap is. So empty cells are merged into runs across,
   then into blocks down, and each block is cut into thirds so a click lands
   somewhere meaningful: left, middle, right. The chosen device then snaps to
   its own slot grid inside that block. */
function freeBlocks(r, face){
  const occ=occupancy(r,face), maxH=(r.ru||12)*HU, out=[];
  const free=(h,c)=> h>=0 && h<maxH && !occ[h+'|'+c];
  /* the horizontal free run containing (h,c) */
  const run=(h,c)=>{ let a=c; while(a>0 && free(h,a-1)) a--;
                     let b=c; while(b<WU && free(h,b)) b++; return [a,b]; };
  for(let u=0; u*HU<maxH; u++){
    for(let c=0; c<WU; c+=2){                 /* thirds: left, middle, right */
      const lo=u*HU, hi=lo+1;
      const loFree = free(lo,c) && free(lo,c+1);
      const hiFree = free(hi,c) && free(hi,c+1);
      if(loFree && hiFree){                   /* a whole free U — one target */
        const [a0,b0]=run(lo,c), [a1,b1]=run(hi,c);
        out.push({h:lo, hh:HU, c0:c, c1:c+2, bc0:Math.max(a0,a1), bc1:Math.min(b0,b1)});
      }else{                                  /* only half of it — two targets */
        if(loFree){ const [a,b]=run(lo,c); out.push({h:lo, hh:1, c0:c, c1:c+2, bc0:a, bc1:b}); }
        if(hiFree){ const [a,b]=run(hi,c); out.push({h:hi, hh:1, c0:c, c1:c+2, bc0:a, bc1:b}); }
      }
    }
  }
  return out;
}

/* What could go in the slot you clicked. Runs the real fits() rather than a
   size comparison, so a full-depth device is excluded when the far face is
   occupied behind it — the same rule that governs placement. */
function candidatesAt(r, t, face){
  return S.equip.filter(e=>{
    const ww=wOf(e);
    for(let c=t.bc0; c+ww<=t.bc1; c+=ww)
      if(fits(r, t.h/HU+1, c, e, face)) return true;
    /* also allow a device whose own slot grid starts before the block */
    const snap=Math.floor(t.c0/ww)*ww;
    return snap>=0 && fits(r, t.h/HU+1, snap, e, face);
  });
}
function colFor(r, t, e, face){
  const ww=wOf(e), ru=t.h/HU+1;
  const snap=Math.floor(t.c0/ww)*ww;
  if(fits(r, ru, snap, e, face)) return snap;
  for(let c=t.bc0; c+ww<=t.bc1; c+=ww) if(fits(r, ru, c, e, face)) return c;
  return null;
}

/* ── the picker ───────────────────────────────────────────────────────────
   Opened by clicking a gap, and it only ever offers what actually fits there.
   Nothing that would not go in is listed, so there is no way to pick a thing
   and be told no. */
function placeModal(){
  const t=S.place; if(!t) return '';
  const r=rack(); if(!r) return '';
  const face=t.face, ru=t.h/HU+1;
  const all=candidatesAt(r, t, face);
  const q=(S.placeQ||'').toLowerCase();
  const list=q ? all.filter(e=>(e.name+' '+(e.manufacturer||'')+' '+(e.model||'')).toLowerCase().includes(q)) : all;

  const top = Math.floor((t.h+t.hh-1)/HU)+1;
  const half = t.hh===1 && t.h%HU;
  const where = `RU ${half ? ru-0.5+'\u00bd' : ru}${top>ru ? '\u2013'+top : ''}`
    + ` \u00b7 ${face} face \u00b7 ${Math.round((t.bc1-t.bc0)/WU*100)}% of the width free`;

  const by={};
  list.forEach(e=>{ const c=e.category||'gear'; (by[c]=by[c]||[]).push(e); });

  return '<div class="scrim" id="placescrim"><div class="picker">'
   + `<div class="pickhead"><b>What goes here?</b><span class="m">${esc(where)}</span>`
   + `<span class="grow"></span><button class="btn ghost sm" id="placeclose">Close</button></div>`
   + `<input type="text" id="placeq" placeholder="Search the library…" value="${esc(S.placeQ||'')}" autofocus>`
   + (list.length
      ? '<div class="picklist">' + CAT_ORDER.filter(c=>by[c]).map(c=>
          `<div class="pickcat">${esc(CAT_LABEL[c]||c)}</div>`
          + by[c].map(e=>`<button class="pickrow" data-put="${esc(e.id)}">`
             + `<span class="nm">${esc(e.name)}</span>`
             + `<span class="sp">${e.ruHeight||1}RU`
             + (wKeyOf(e)!=='full' ? ' · '+WIDTH_LABEL[wKeyOf(e)] : '')
             + (e.depthIn ? ' · '+e.depthIn+'″' : '')
             + (deepOf(e) ? '' : ' · shallow')
             + `</span></button>`).join('')).join('')
        + '</div>'
      : `<div class="empty" style="padding:26px"><div class="big">Nothing fits here</div>`
        + `<div>${all.length ? 'Nothing matches that search.' : 'This gap is too small for anything in the library.'}</div></div>`)
   + `<div class="pickfoot"><input type="text" id="placelabel" placeholder="Label, e.g. NODE 1 (optional)">`
   + `</div></div></div>`;
}

const CAT_LABEL = { gear:'Gear', blank:'Blanking panels', vent:'Vent panels', fan:'Fan panels',
                    shelf:'Shelves', din:'DIN rail panels', connector:'Connector panels',
                    pdu:'Power', ups:'UPS', panel:'Panels' };
const CAT_ORDER = ['gear','connector','pdu','ups','shelf','din','vent','fan','blank','panel'];

function eqOptions(sel){
  const by={};
  S.equip.forEach(e=>{ const c=e.category||'gear'; (by[c]=by[c]||[]).push(e); });
  return CAT_ORDER.filter(c=>by[c]).map(c=>
    `<optgroup label="${esc(CAT_LABEL[c]||c)}">`
    + by[c].map(e=>`<option value="${esc(e.id)}"${sel&&e.id===sel.id?' selected':''}>`
       + `${esc(e.name)} · ${e.ruHeight||1}RU`
       + (wKeyOf(e)!=='full' ? ' · '+WIDTH_LABEL[wKeyOf(e)] : '')
       + (deepOf(e) ? '' : ' · shallow')
       + (e.depthIn ? ' · '+e.depthIn+'″' : '')
       + (e.portCount ? ' · '+e.portCount+' ports' : '')
       + `</option>`).join('')
    + '</optgroup>').join('');
}

/* Slot picker. Offers only the columns a device of this width can start in,
   so a half-rack device gets left/right and a third gets three — rather than
   six positions, four of which straddle. */
function slotSelect(r, e){
  if(!e) return '';
  const ww=wOf(e);
  if(ww===WU) return '<input type="hidden" id="eqcol" value="0">';
  const n=Math.floor(WU/ww), names = n===2 ? ['Left','Right'] : ['Left','Centre','Right'];
  let s='<select id="eqcol" style="flex:1">';
  for(let i=0;i<n;i++) s+=`<option value="${i*ww}">${names[i]||('Slot '+(i+1))}</option>`;
  return s+'</select>';
}

/* Shells first. A rack shell usually arrives as a height and nothing else, so
   that is the top of the list; an identified case is the exception, not the
   default, and its figures are worth having when you do know the model. */
function caseOptions(r){
  const gen = S.cases.filter(c=>c.generic), rest = S.cases.filter(c=>!c.generic);
  const opt = c => `<option value="${esc(c.id)}"${r.caseId===c.id?' selected':''}>`
    + esc(c.name) + (c.railToRailIn?' · '+c.railToRailIn+'″':'') + '</option>';
  let h = gen.length ? '<optgroup label="Rental stock — by height">'+gen.map(opt).join('')+'</optgroup>' : '';
  const byBrand={};
  rest.forEach(c=>{ (byBrand[c.brand||'Other']=byBrand[c.brand||'Other']||[]).push(c); });
  Object.keys(byBrand).sort().forEach(b=>{
    h += `<optgroup label="${esc(b)}">` + byBrand[b].map(opt).join('') + '</optgroup>';
  });
  return h;
}

function caseFacts(r){
  const c=kase(r); if(!c) return '';
  if(c.generic) return '<div class="muted" style="font-size:11px;margin-bottom:8px;line-height:1.5">'
    + 'Height only — nothing asserted about depth, weight or payload.</div>';
  const bits=[];
  if(c.railToRailIn)    bits.push(c.railToRailIn+'″ rail to rail');
  else if(c.depthLabel) bits.push('depth: '+c.depthLabel);
  if(c.outsideDepthIn)  bits.push(c.outsideDepthIn+'″ outside');
  if(c.emptyLb)         bits.push(c.emptyLb+' lb empty');
  if(c.payloadMaxLb)    bits.push('payload '+(c.payloadMinLb?c.payloadMinLb+'–':'≤ ')+c.payloadMaxLb+' lb');
  if(!bits.length) return '';
  return '<div class="muted" style="font-size:11px;margin-bottom:8px;line-height:1.5">'
    + bits.join(' · ') + (c.status?` <span class="chip ${esc(c.status)}">${esc(c.status)}</span>`:'') + '</div>';
}

/* Rack elevation for one face. Cage-nut rails, RU numbers up the left,
   devices as blocks. Drawn bottom-up because that is how a rack is counted,
   and in half-U rows because half-U devices exist. Geometry is expressed in
   the viewBox, never in fixed pixels — NetBox's own elevation bugs were all
   pixel-rounding at fractional unit heights. */
function elevationSVG(r, face){
  const RU=r.ru||12, UH=22, HH=UH/2, W=560, RAIL=17, PAD=26;
  const H=RU*UH, IW=W-RAIL*2, X0=PAD+RAIL;
  const colX = c => X0 + (c/WU)*IW;
  const near = occupancy(r, face);

  let s=`<svg viewBox="0 0 ${W+PAD*2} ${H+PAD*2}" role="img" `
   + `aria-label="Rack elevation, ${face} face, ${RU} RU">`
   + `<defs><pattern id="gh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`
   + `<line x1="0" y1="0" x2="0" y2="6" stroke="var(--line-strong)" stroke-width="1.6"/></pattern></defs>`;

  s+=`<rect x="${PAD}" y="${PAD}" width="${W}" height="${H}" fill="var(--sunken)" stroke="var(--line-strong)" stroke-width="1.5" rx="3"/>`;

  [PAD, PAD+W-RAIL].forEach(x=>{
    s+=`<rect x="${x}" y="${PAD}" width="${RAIL}" height="${H}" fill="var(--rail)"/>`;
    /* Three holes per U at the EIA 0.5 / 0.625 / 0.625 in pitch, not evenly
       spaced — the wide gap is the boundary between units. */
    for(let u=0;u<RU;u++){
      const base=PAD+H-(u*UH);
      [0.25,0.875,1.5].forEach(o=>{
        s+=`<rect x="${x+RAIL/2-2}" y="${base-(o/1.75)*UH-1.6}" width="4" height="3.2" rx="1" fill="var(--rail-2)"/>`;
      });
    }
  });

  for(let u=1;u<=RU;u++){
    const cy=PAD+H-((u-1)*UH)-UH/2;
    s+=`<text x="${PAD-5}" y="${cy+3.4}" font-size="8.5" fill="var(--ink-3)" text-anchor="end" `
     + `font-family="IBM Plex Mono,monospace">${u}</text>`;
    const h0=(u-1)*HU;
    let empty=true;
    for(let h=h0;h<h0+HU;h++) for(let w=0;w<WU;w++) if(near[h+'|'+w]) empty=false;
    if(empty)
      s+=`<line x1="${X0}" y1="${cy+UH/2}" x2="${PAD+W-RAIL}" y2="${cy+UH/2}" `
       + `stroke="var(--line)" stroke-width="0.5" stroke-dasharray="2 3"/>`;
  }

  /* Ghosts first, so a real device always draws over them. A hatched slot is
     NOT occupied — a shallow device on the far face leaves this one free. What
     it means is that the far face is spoken for, so only shallow gear can go
     here: a full-depth device would have to clear both faces and fits() will
     refuse it. Drawn light, because free-but-constrained is not the same as
     taken, and a hatch that reads as "occupied" would be a lie. */
  (r.items||[]).forEach(it=>{
    const e=eq(it.gearId); if(!e) return;
    if(faceOf(it)===face || deepOf(e)) return;
    const hh=hOf(e), y=PAD+H-(h0Of(it)+hh)*HH, x=colX(colOf(it)), w=(wOf(e)/WU)*IW;
    s+=`<g opacity="0.34"><rect x="${x+1}" y="${y+1}" width="${w-2}" height="${hh*HH-2}" rx="2.5" `
     + `fill="url(#gh)" fill-opacity="0.35" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 2"/>`
     + `<title>${esc(it.label||e.name)} is on the ${other(face)} face and is shallow — `
     + `this slot is free, but only for shallow gear</title></g>`;
  });

  /* Gaps are the primary input: one target per third of each free block. */
  freeBlocks(r, face).forEach(t=>{
    const y=PAD+H-(t.h+t.hh)*HH, x=colX(t.c0), w=((t.c1-t.c0)/WU)*IW;
    s+=`<g class="slot" data-slot="${t.h}|${t.hh}|${t.c0}|${t.c1}|${t.bc0}|${t.bc1}">`
     + `<rect x="${x+1}" y="${y+1}" width="${w-2}" height="${t.hh*HH-2}" rx="2.5"/>`
     + `<text x="${x+w/2}" y="${y+t.hh*HH/2+4}" text-anchor="middle" font-size="12">+</text>`
     + `<title>Add something here</title></g>`;
  });

  (r.items||[]).forEach((it,i)=>{
    const e=eq(it.gearId); if(!e) return;
    if(faceOf(it)!==face && !deepOf(e)) return;
    const hh=hOf(e), ww=wOf(e);
    const y=PAD+H-(h0Of(it)+hh)*HH, x=colX(colOf(it)), w=(ww/WU)*IW;
    const behind = faceOf(it)!==face;            /* full depth, seen from its back */
    const col=`var(${it.color||COLORS[i%COLORS.length]})`;
    const outs=(e.ports||[]).filter(p=>p.type==='output');
    const done=outs.filter(p=>{const pp=(it.ports||{})[p.id]; return pp&&(pp.universe||pp.label);}).length;
    const tight = hh===1 || ww<=2;
    const fs = tight ? 8.5 : 10.5;
    s+=`<g class="dev${S.sel===it.key?' sel':''}" data-dev="${esc(it.key)}">`
     + `<rect x="${x+1}" y="${y+1}" width="${w-2}" height="${hh*HH-2}" rx="2.5" `
     + `fill="${col}" fill-opacity="${behind?0.42:0.86}" stroke="var(--surface)" stroke-width="1"`
     + (behind?' stroke-dasharray="4 2"':'')+`/>`
     + `<text x="${x+8}" y="${y+hh*HH/2+fs/3}" font-size="${fs}" fill="#fff" `
     + `font-family="IBM Plex Sans,sans-serif" font-weight="600">${esc(it.label||e.name)}</text>`;
    /* An unlabelled item falls back to the catalog name on the left, so don't
       print the same string again on the right. */
    const rhs = (it.label && it.label !== e.name) ? e.name
              : (outs.length ? '' : null);
    if(!tight && rhs !== null)
      s+=`<text x="${x+w-8}" y="${y+hh*HH/2+3.4}" font-size="8.5" fill="#fff" fill-opacity="0.9" `
       + `text-anchor="end" font-family="IBM Plex Mono,monospace">${esc(rhs)}`
       + (outs.length?`  ${done}/${outs.length}`:'')+`</text>`;
    s+=`<title>${esc(e.name)} · RU ${ruLabel(it)} · ${WIDTH_LABEL[wKeyOf(e)]} · ${faceOf(it)} face`
     + (deepOf(e)?' · full depth':'')+(e.depthIn?` · ${e.depthIn}″`:'')+`</title></g>`;
  });
  return s+'</svg>';
}

/* Per-device port editor. Inputs write straight to the model and repaint
   nothing — see the note at the top about why. */
function deviceCard(r,it){
  const e=eq(it.gearId); if(!e) return '';
  const outs=(e.ports||[]);
  const ww=wOf(e), canSlide = ww<WU;
  const meta=[esc(e.name), 'RU '+ruLabel(it), WIDTH_LABEL[wKeyOf(e)], faceOf(it)+' face'];
  if(!deepOf(e)) meta.push('shallow');
  if(e.depthIn) meta.push(e.depthIn+'″ deep');
  if(e.weightLb) meta.push(e.weightLb+' lb');
  return `<div class="card${S.sel===it.key?' sel':''}" id="card-${esc(it.key)}">`
   + `<div style="display:flex;align-items:center;gap:9px;margin-bottom:2px;flex-wrap:wrap">`
   + `<b style="font-family:Archivo,sans-serif;font-size:13.5px">${esc(it.label||e.name)}</b>`
   + `<span class="muted" style="font-size:11.5px">${meta.join(' · ')}</span>`
   + (e.hasIp?`<input type="text" data-ip="${esc(it.key)}" value="${esc(it.ip||'')}" placeholder="IP" `
      + `class="mono" style="width:118px;font-size:11.5px;padding:3px 6px">`:'')
   + `<span class="grow"></span>`
   + `<button class="btn ghost sm" data-fc="${esc(it.key)}" title="Flip to the other face">⇄ ${faceOf(it)==='front'?'rear':'front'}</button>`
   + (canSlide?`<button class="btn ghost sm" data-sl="${esc(it.key)}" data-d="-1" title="Slide left">◀</button>`
      + `<button class="btn ghost sm" data-sl="${esc(it.key)}" data-d="1" title="Slide right">▶</button>`:'')
   + `<button class="btn ghost sm" data-mv="${esc(it.key)}" data-d="1" title="Up a half U">▲</button>`
   + `<button class="btn ghost sm" data-mv="${esc(it.key)}" data-d="-1" title="Down a half U">▼</button>`
   + `<button class="btn ghost sm" data-cpspare="${esc(it.key)}" title="Copy universes and labels to a spare">Copy → spare</button>`
   + `<button class="btn danger sm" data-rm="${esc(it.key)}">Remove</button></div>`
   + `<div class="ports">`
   + outs.map(p=>{
      const pp=(it.ports||{})[p.id]||{};
      const used=!!(pp.universe||pp.label||pp.link);
      const popOpen = S.linkPop && S.linkPop.itemKey===it.key && S.linkPop.portId===p.id;
      const cross = pp.link && pp.link.kind==='rack' && pp.link.rackId!==r.id;
      return `<div class="port${used?' used':''}" style="position:relative">`
       + `<div class="pn"><span class="pdot ${esc(p.type||'output')}"></span>${esc(p.name||p.id)}`
       + (p.face?`<span class="pf">${esc(p.face)}</span>`:'')
       + `<button type="button" class="btn ghost sm linkbtn" data-lk="${esc(it.key)}|${esc(p.id)}" title="Link this port">⇄</button>`
       + `</div>`
       + (p.type==='output'||p.type==='input'
          ? `<input type="text" data-pu="${esc(it.key)}|${esc(p.id)}" data-prev="${esc(pp.universe||'')}" value="${esc(pp.universe||'')}" placeholder="Universe" list="univlist" class="mono">` : '')
       + `<input type="text" data-pl="${esc(it.key)}|${esc(p.id)}" value="${esc(pp.label||'')}" placeholder="Goes to…">`
       + (pp.link ? `<div class="linkbadge${cross?' cross':''}">${esc(linkText(pp.link))}</div>` : '')
       + (popOpen ? linkPopover(r,it,p) : '')
       + `</div>`;
     }).join('')
   + `</div></div>`;
}

/* Fills in the first available choice for whichever selects are still
   unset (or point at something no longer valid) so a single-option select —
   which never fires change — still has a live target by the time Set is
   read. Called on open, on kind toggle, and after every cascade reset. */
function seedLinkPop(r,it){
  const lp=S.linkPop; if(!lp) return;
  if(lp.kind==='rack'){
    if(!lp.rackId || !S.racks.some(x=>x.id===lp.rackId)) lp.rackId=(S.racks[0]||{}).id||null;
    const tr=S.racks.find(x=>x.id===lp.rackId);
    const titems=((tr&&tr.items)||[]).filter(x=>!(tr && tr.id===r.id && x.key===it.key));
    if(!lp.itemKey2 || !titems.some(x=>x.key===lp.itemKey2)) lp.itemKey2=titems[0]?titems[0].key:null;
    const ti=titems.find(x=>x.key===lp.itemKey2);
    const te=ti && eq(ti.gearId);
    const tports=(te&&te.ports)||[];
    if(!lp.portId2 || !tports.some(x=>x.id===lp.portId2)) lp.portId2=tports[0]?tports[0].id:null;
  }else{
    const cabs=allCables();
    if(!lp.sheetId || !lp.cableId || !cabs.some(cc=>cc.sheetId===lp.sheetId && cc.cable.id===lp.cableId)){
      const first=cabs[0];
      lp.sheetId=first?first.sheetId:null; lp.cableId=first?first.cable.id:null; lp.line=null;
    }
    const sel=cabs.find(cc=>cc.sheetId===lp.sheetId && cc.cable.id===lp.cableId);
    const n=sel?lineCount(sel.cable):0;
    if(!lp.line || lp.line<1 || lp.line>n) lp.line = n>=1 ? 1 : null;
  }
}

/* Compact popover for setting/clearing a port link — a positioned div, not a
   full modal re-render. */
function linkPopover(r,it,p){
  const lp=S.linkPop;
  let h='<div class="linkpop" onclick="event.stopPropagation()">';
  h+='<div class="seg" style="margin-bottom:6px">'
   + `<button type="button" data-lkkind="rack"${lp.kind==='rack'?' class="on"':''}>Rack port</button>`
   + `<button type="button" data-lkkind="loom"${lp.kind==='loom'?' class="on"':''}>Loom line</button></div>`;
  if(lp.kind==='rack'){
    const racks=S.racks;
    h+='<select id="lkrack">'+racks.map(rr=>`<option value="${esc(rr.id)}"${lp.rackId===rr.id?' selected':''}>${esc(rr.name||rr.id)}</option>`).join('')+'</select>';
    const tr=racks.find(x=>x.id===lp.rackId)||racks[0];
    const titems=((tr&&tr.items)||[]).filter(x=>!(tr.id===r.id && x.key===it.key));
    h+='<select id="lkitem">'+titems.map(ti=>{
      const te=eq(ti.gearId)||{};
      return `<option value="${esc(ti.key)}"${lp.itemKey2===ti.key?' selected':''}>${esc(ti.label||te.name||ti.key)}</option>`;
    }).join('')+'</select>';
    const ti=titems.find(x=>x.key===lp.itemKey2)||titems[0];
    const te=ti && eq(ti.gearId);
    const tports=(te&&te.ports)||[];
    h+='<select id="lkport">'+tports.map(tp=>{
      const already = ti && (ti.ports||{})[tp.id] && (ti.ports[tp.id]||{}).link;
      return `<option value="${esc(tp.id)}"${lp.portId2===tp.id?' selected':''}>${esc(tp.name||tp.id)}${already?' (linked)':''}</option>`;
    }).join('')+'</select>';
  }else{
    const cabs=allCables();
    h+='<select id="lkcable">'+cabs.map(cc=>{
      const val=cc.sheetId+'|'+cc.cable.id, sel=(lp.sheetId+'|'+lp.cableId)===val;
      return `<option value="${esc(val)}"${sel?' selected':''}>${esc(cc.cable.label||cc.cable.id)} · ${esc(cc.sheetName)}</option>`;
    }).join('')+'</select>';
    const sel=cabs.find(cc=>cc.sheetId===lp.sheetId && cc.cable.id===lp.cableId)||cabs[0];
    const n=sel?lineCount(sel.cable):0;
    let opts='';
    for(let i=1;i<=n;i++){
      const claimed = sel && lineClaimedBy(sel.sheetId, sel.cable.id, i, r.id, it.key, p.id);
      opts+=`<option value="${i}"${lp.line===i?' selected':''}>${i}${claimed?' (linked)':''}</option>`;
    }
    h+=`<select id="lkline">${opts}</select>`;
  }
  h+='<div style="display:flex;gap:6px;margin-top:6px">'
   + '<button type="button" class="btn sm" id="lkset">Set</button>'
   + '<button type="button" class="btn ghost sm" id="lkclear">Clear</button>'
   + '<button type="button" class="btn ghost sm" id="lkcancel">Cancel</button></div></div>';
  return h;
}

function wireBuild(){
  const ar=$('addrack');
  if(ar) ar.onclick=()=>{
    const nm=($('newrack').value||'').trim()||('Rack '+(S.racks.length+1));
    const ru=Math.max(1,Math.min(45,parseInt($('newru').value||'12',10)||12));
    const id='rack-'+uid();
    S.racks.push({id, name:nm, ru, caseId:null, color:COLORS[S.racks.length%COLORS.length], items:[]});
    S.cur=id; S.dirty=true; render();
  };
  document.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.rk;render();});
  document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{S.face=b.dataset.face;render();});

  /* ── click a gap ─────────────────────────────────────────────────────── */
  document.querySelectorAll('[data-slot]').forEach(g=>g.onclick=()=>{
    const [h,hh,c0,c1,bc0,bc1]=g.dataset.slot.split('|').map(Number);
    S.place={h,hh,c0,c1,bc0,bc1,face:S.face}; S.placeQ=''; render();
    const q=$('placeq'); if(q) q.focus();
  });

  /* ── click a device: jump to its ports ───────────────────────────────── */
  document.querySelectorAll('[data-dev]').forEach(g=>g.onclick=()=>{
    S.sel = S.sel===g.dataset.dev ? null : g.dataset.dev;
    render();
    const c=$('card-'+S.sel);
    if(c) c.scrollIntoView({block:'nearest', behavior:'smooth'});
  });

  /* ── the picker ──────────────────────────────────────────────────────── */
  const close=()=>{ S.place=null; S.placeQ=''; render(); };
  const pc=$('placeclose'); if(pc) pc.onclick=close;
  const ps=$('placescrim'); if(ps) ps.onclick=ev=>{ if(ev.target===ps) close(); };
  const pq=$('placeq'); if(pq){
    pq.oninput=()=>{ S.placeQ=pq.value; const at=pq.selectionStart; render();
      const n=$('placeq'); if(n){ n.focus(); n.setSelectionRange(at,at); } };
    pq.onkeydown=ev=>{ if(ev.key==='Escape') close(); };
  }
  document.querySelectorAll('[data-put]').forEach(b=>b.onclick=()=>{
    const r=rack(), t=S.place; if(!r||!t) return;
    const e=eq(b.dataset.put); if(!e) return;
    const col=colFor(r, t, e, t.face);
    if(col===null){ alert('That no longer fits here.'); return; }
    const label=(($('placelabel')||{}).value||'').trim()||null;
    const key='i-'+uid();
    r.items=r.items||[];
    r.items.push({key, gearId:e.id, ru:t.h/HU+1, col, face:t.face, label,
                  color:COLORS[r.items.length%COLORS.length], ip:null, ports:{}});
    S.place=null; S.placeQ=''; S.sel=key; S.dirty=true; render();
  });

  const rn=$('rkname'); if(rn) rn.onchange=()=>{const r=rack(); if(r){r.name=rn.value;S.dirty=true;render();}};
  const rc=$('rkcase'); if(rc) rc.onchange=()=>{
    const r=rack(); if(!r) return;
    r.caseId = rc.value || null;
    const c=kase(r);
    /* A shell's height is the one thing it does know. Adopt it unless that
       would evict something already mounted. */
    if(c && c.ru){
      const tallest=(r.items||[]).reduce((a,it)=>Math.max(a, h0Of(it)+hOf(eq(it.gearId)||{})),0)/HU;
      if(c.ru >= tallest) r.ru=c.ru;
    }
    S.dirty=true; render();
  };
  const rd=$('rkdepth'); if(rd) rd.onchange=()=>{
    const r=rack(); if(!r) return;
    const v=parseFloat(rd.value);
    r.railToRailIn = (isFinite(v) && v>0) ? v : null;
    S.dirty=true; render();
  };
  const rr=$('rkru');   if(rr) rr.onchange=()=>{
    const r=rack(); if(!r) return;
    const v=Math.max(1,Math.min(45,parseInt(rr.value||'12',10)||12));
    const tallest=(r.items||[]).reduce((a,it)=>Math.max(a, h0Of(it)+hOf(eq(it.gearId)||{})),0)/HU;
    if(v<tallest){ alert('Cannot shrink below RU '+Math.ceil(tallest)+' — a device is mounted there.'); rr.value=r.ru; return; }
    r.ru=v; S.dirty=true; render();
  };
  const dr=$('delrack'); if(dr) dr.onclick=()=>{
    const r=rack(); if(!r) return;
    if(!confirm('Delete "'+(r.name||'rack')+'" and its '+(r.items||[]).length+' devices?')) return;
    S.racks=S.racks.filter(x=>x.id!==r.id); S.cur=S.racks[0]?S.racks[0].id:null; S.dirty=true; render();
  };

  /* ── port links: open/close, kind toggle, selects, set/clear ─────────── */
  document.querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{
    const [k,pid]=b.dataset.lk.split('|');
    if(S.linkPop && S.linkPop.itemKey===k && S.linkPop.portId===pid){ S.linkPop=null; render(); return; }
    const r=rack(), it=(r.items||[]).find(x=>x.key===k); if(!it) return;
    const existing=((it.ports||{})[pid]||{}).link;
    if(existing && existing.kind==='rack')
      S.linkPop={itemKey:k,portId:pid,kind:'rack',rackId:existing.rackId,itemKey2:existing.itemKey,portId2:existing.portId};
    else if(existing && existing.kind==='loom')
      S.linkPop={itemKey:k,portId:pid,kind:'loom',sheetId:existing.sheetId,cableId:existing.cableId,line:existing.line};
    else
      S.linkPop={itemKey:k,portId:pid,kind:'rack',rackId:r.id,itemKey2:null,portId2:null};
    seedLinkPop(r,it); render();
  });
  document.querySelectorAll('[data-lkkind]').forEach(b=>b.onclick=()=>{
    if(!S.linkPop) return;
    const r=rack(), it=(r.items||[]).find(x=>x.key===S.linkPop.itemKey); if(!it) return;
    S.linkPop.kind=b.dataset.lkkind; seedLinkPop(r,it); render();
  });
  const lkrack=$('lkrack'); if(lkrack) lkrack.onchange=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===S.linkPop.itemKey); if(!it) return;
    S.linkPop.rackId=lkrack.value; S.linkPop.itemKey2=null; S.linkPop.portId2=null; seedLinkPop(r,it); render();
  };
  const lkitem=$('lkitem'); if(lkitem) lkitem.onchange=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===S.linkPop.itemKey); if(!it) return;
    S.linkPop.itemKey2=lkitem.value; S.linkPop.portId2=null; seedLinkPop(r,it); render();
  };
  const lkport=$('lkport'); if(lkport) lkport.onchange=()=>{ S.linkPop.portId2=lkport.value; };
  const lkcable=$('lkcable'); if(lkcable) lkcable.onchange=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===S.linkPop.itemKey); if(!it) return;
    const [sid,cid]=lkcable.value.split('|'); S.linkPop.sheetId=sid; S.linkPop.cableId=cid; S.linkPop.line=null;
    seedLinkPop(r,it); render();
  };
  const lkline=$('lkline'); if(lkline) lkline.onchange=()=>{ S.linkPop.line=parseInt(lkline.value,10); };
  const lkcancel=$('lkcancel'); if(lkcancel) lkcancel.onclick=()=>{ S.linkPop=null; render(); };
  const lkclear=$('lkclear'); if(lkclear) lkclear.onclick=()=>{
    const lp=S.linkPop, r=rack(), it=(r.items||[]).find(x=>x.key===lp.itemKey);
    const pp=it && (it.ports||{})[lp.portId];
    const link=pp && pp.link;
    if(link && link.kind==='rack'){
      const tr=S.racks.find(x=>x.id===link.rackId), ti=tr&&(tr.items||[]).find(x=>x.key===link.itemKey);
      if(ti && ti.ports && ti.ports[link.portId]) delete ti.ports[link.portId].link;
    }
    if(pp) delete pp.link;
    S.dirty=true; S.linkPop=null; render();
  };
  const lkset=$('lkset'); if(lkset) lkset.onclick=()=>{
    const lp=S.linkPop, r=rack(), it=(r.items||[]).find(x=>x.key===lp.itemKey); if(!it) return;
    /* Read the live selects, not the cached popover state — a select with a
       single option never fires change, so the cached value can still be
       null even though something is visibly chosen. */
    let rackId2, itemKey2, portId2, sheetId2, cableId2, line2;
    if(lp.kind==='rack'){
      const elR=$('lkrack'), elI=$('lkitem'), elP=$('lkport');
      rackId2 = (elR && elR.value) || lp.rackId;
      itemKey2 = (elI && elI.value) || lp.itemKey2;
      portId2 = (elP && elP.value) || lp.portId2;
      if(!rackId2||!itemKey2||!portId2){ alert('Choose a rack, item and port.'); return; }
    }else{
      const elC=$('lkcable'), elL=$('lkline');
      if(elC && elC.value){ const parts=elC.value.split('|'); sheetId2=parts[0]; cableId2=parts[1]; }
      else { sheetId2=lp.sheetId; cableId2=lp.cableId; }
      line2 = parseInt((elL && elL.value) || lp.line, 10);
      if(!sheetId2||!cableId2||!line2){ alert('Choose a cable and line.'); return; }
    }
    /* Validated — now it is safe to unwind the old reciprocal. */
    it.ports=it.ports||{}; it.ports[lp.portId]=it.ports[lp.portId]||{};
    const oldLink=it.ports[lp.portId].link;
    if(oldLink && oldLink.kind==='rack'){
      const otr=S.racks.find(x=>x.id===oldLink.rackId), oti=otr&&(otr.items||[]).find(x=>x.key===oldLink.itemKey);
      if(oti && oti.ports && oti.ports[oldLink.portId]) delete oti.ports[oldLink.portId].link;
    }
    if(lp.kind==='rack'){
      it.ports[lp.portId].link={kind:'rack', rackId:rackId2, itemKey:itemKey2, portId:portId2};
      const tr=S.racks.find(x=>x.id===rackId2), ti=tr&&(tr.items||[]).find(x=>x.key===itemKey2);
      if(ti){
        ti.ports=ti.ports||{};
        /* The target port may already belong to a different pair — clear
           that partner's link too, or this write leaves it one-way. */
        const prev=(ti.ports[portId2]||{}).link;
        if(prev && prev.kind==='rack'){
          const ptr=S.racks.find(x=>x.id===prev.rackId), pti=ptr&&(ptr.items||[]).find(x=>x.key===prev.itemKey);
          if(pti && pti.ports && pti.ports[prev.portId]) delete pti.ports[prev.portId].link;
        }
        ti.ports[portId2]=Object.assign({}, ti.ports[portId2],
          {link:{kind:'rack', rackId:r.id, itemKey:it.key, portId:lp.portId}});
      }
    }else{
      it.ports[lp.portId].link={kind:'loom', sheetId:sheetId2, cableId:cableId2, line:line2};
    }
    S.dirty=true; S.linkPop=null; render();
  };

  /* ── copy universes to spare ───────────────────────────────────────────
     Direct hit: update only the affected DOM inputs, no render(). A choice
     among several candidates opens a small picker instead. */
  document.querySelectorAll('[data-cpspare]').forEach(b=>b.onclick=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.cpspare); if(!it) return;
    const res=findSpareTarget(r, it);
    if(res.kind==='none'){ alert('No other item with the same gear was found.'); return; }
    if(res.kind==='choose'){ S.sparePop={itemKey:it.key, rackId:r.id, options:res.options}; render(); return; }
    doCopy(it, res.item, res.rack);
  });
  const spc=$('sparecancel'); if(spc) spc.onclick=()=>{ S.sparePop=null; render(); };
  const sps=$('sparescrim'); if(sps) sps.onclick=ev=>{ if(ev.target===sps){ S.sparePop=null; render(); } };
  const spg=$('sparego'); if(spg) spg.onclick=()=>{
    const sp=S.sparePop, sel=$('sparesel'), opt=sp.options[parseInt(sel.value,10)];
    const r=S.racks.find(x=>x.id===sp.rackId), it=r && (r.items||[]).find(x=>x.key===sp.itemKey);
    if(it && opt) doCopy(it, opt.item, opt.rack);
    S.sparePop=null; render();
  };

  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const r=rack(); r.items=r.items.filter(x=>x.key!==b.dataset.rm); S.dirty=true; render();
  });
  /* Vertical moves step a HALF U, so half-rack gear can sit against either
     half of a unit and whole-U gear still lands on a boundary. */
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.mv); if(!it) return;
    const e=eq(it.gearId); if(!e) return;
    const step = hOf(e)%HU===0 ? 1 : 0.5, d=+b.dataset.d*step;
    if(fits(r, (it.ru||1)+d, colOf(it), e, faceOf(it), it.key)){ it.ru=(it.ru||1)+d; S.dirty=true; render(); }
  });
  document.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.sl); if(!it) return;
    const e=eq(it.gearId); if(!e) return;
    const c=colOf(it)+(+b.dataset.d)*wOf(e);
    if(fits(r, it.ru||1, c, e, faceOf(it), it.key)){ it.col=c; S.dirty=true; render(); }
  });
  document.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===b.dataset.fc); if(!it) return;
    const e=eq(it.gearId); if(!e) return;
    const f=other(faceOf(it));
    if(!fits(r, it.ru||1, colOf(it), e, f, it.key)){ alert('That slot is taken on the '+f+' face.'); return; }
    it.face=f; S.face=f; S.dirty=true; render();
  });

  /* No re-render on these. Pre-Pro's lesson: a render() on input destroys the
     DOM mid-edit and kills tab order. Write the model, leave the DOM alone. */
  document.querySelectorAll('[data-pu],[data-pl]').forEach(inp=>inp.oninput=()=>{
    const isU=inp.hasAttribute('data-pu');
    const [k,pid]=(isU?inp.dataset.pu:inp.dataset.pl).split('|');
    const r=rack(), it=(r.items||[]).find(x=>x.key===k); if(!it) return;
    const oldVal = isU ? (inp.dataset.prev||'') : null;
    it.ports=it.ports||{}; it.ports[pid]=Object.assign({},it.ports[pid],
      isU?{universe:inp.value}:{label:inp.value});
    inp.closest('.port').classList.toggle('used',
      !!((it.ports[pid].universe||'')||(it.ports[pid].label||'')||(it.ports[pid].link)));
    S.dirty=true;
    /* Splitter propagation: typing on an INPUT port whose item has 2+ OUTPUT
       ports pushes the value onto any output that is blank or unchanged.
       DOM only — no repaint, same rule as the rest of this block. */
    if(isU){
      const e=eq(it.gearId), gp=(e&&e.ports)||[];
      const portDef=gp.find(p=>p.id===pid);
      const outs=gp.filter(p=>p.type==='output');
      if(portDef && portDef.type==='input' && outs.length>=2){
        propagate(it, gp, pid, oldVal, inp.value);
        outs.forEach(p=>{
          const el=document.querySelector('[data-pu="'+CSS.escape(k+'|'+p.id)+'"]');
          if(el){ el.value=(it.ports[p.id]||{}).universe||''; el.dataset.prev=el.value;
            el.closest('.port').classList.toggle('used', !!(el.value||(it.ports[p.id]||{}).label||(it.ports[p.id]||{}).link)); }
        });
      }
      inp.dataset.prev = inp.value;
    }
  });
  document.querySelectorAll('[data-ip]').forEach(inp=>inp.oninput=()=>{
    const r=rack(), it=(r.items||[]).find(x=>x.key===inp.dataset.ip);
    if(it){ it.ip=inp.value; S.dirty=true; }
  });
}

/* ── patch sheet ──────────────────────────────────────────────────────── */
function viewPatch(){
  const rows=[];
  S.racks.forEach(r=>(r.items||[]).forEach(it=>{
    const e=eq(it.gearId); if(!e) return;
    (e.ports||[]).forEach(p=>{
      const pp=(it.ports||{})[p.id]||{};
      if(!pp.universe && !pp.label && !pp.link) return;
      rows.push({rack:r.name, device:it.label||e.name, model:e.name, ip:it.ip,
                 ru:ruLabel(it), face:faceOf(it),
                 port:p.name||p.id, type:p.type, universe:pp.universe||'', dest:pp.label||'', link:pp.link||null});
    });
  }));
  const panel=fromPatchPanel();
  if(!rows.length) return panel+'<div class="empty"><div class="big">Nothing patched yet</div>'
    +'<div>Assign universes to ports on the Racks tab.</div></div>';

  const idx=universeIndex();
  let h=panel+`<div class="elev"><div class="elevhead"><b>Patch sheet</b>`
   + `<span class="m">${esc(S.showName||'no show')}</span>`
   + `<span class="m">${rows.length} ports</span></div>`;
  h+='<div class="tablewrap"><table><thead><tr><th>Rack</th><th class="num">RU</th><th>Face</th>'
   + '<th>Device</th><th>IP</th><th>Port</th><th>Universe</th><th>Goes to</th><th>Link</th></tr></thead><tbody>'
   + rows.map(r=>{
      const dup=r.universe && (idx[r.universe.trim()]||[]).length>1;
      return `<tr><td>${esc(r.rack)}</td><td class="num">${esc(r.ru)}</td>`
       + `<td style="font-size:11.5px">${esc(r.face)}</td><td><b>${esc(r.device)}</b> `
       + `<span class="muted" style="font-size:11px">${esc(r.model)}</span></td>`
       + `<td class="mono" style="font-size:11px">${esc(r.ip||'—')}</td>`
       + `<td class="mono" style="font-size:11.5px">${esc(r.port)}</td>`
       + `<td class="mono"><b>${esc(r.universe||'—')}</b>`
       + (dup?' <span class="chip warn">dup</span>':'')+`</td>`
       + `<td>${esc(r.dest||'—')}</td>`
       + `<td style="font-size:11.5px">${esc(linkText(r.link))}</td></tr>`;
     }).join('')
   + '</tbody></table></div></div>';
  return h;
}

const st=(k,v,cls)=>`<div class="stat${cls?' '+cls:''}"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`;

function toCSV(){
  const out=[['Rack','RU','Face','Device','Model','IP','Port','Type','Universe','Goes to','Link']];
  S.racks.forEach(r=>(r.items||[]).forEach(it=>{
    const e=eq(it.gearId); if(!e) return;
    (e.ports||[]).forEach(p=>{
      const pp=(it.ports||{})[p.id]||{};
      if(!pp.universe && !pp.label && !pp.link) return;
      out.push([r.name, ruLabel(it), faceOf(it), it.label||e.name, e.name, it.ip||'',
                p.name||p.id, p.type||'', pp.universe||'', pp.label||'', linkText(pp.link)]);
    });
  }));
  return out.map(r=>r.map(v=>{const s=String(v??'');
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
}
async function downloadCSV(){
  const csv=toCSV(), name=((S.showName||'racks')+'-patch-sheet.csv').replace(/[^\w.-]+/g,'-');
  try{ const dl=await claude.use('downloads'); if(dl){ await dl.save({filename:name,data:csv}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(csv); alert('CSV copied to the clipboard.'); }
  catch(e){ alert('Could not export: '+e.message); }
}

$('csvbtn').onclick=downloadCSV;
$('printbtn').onclick=()=>{ setTimeout(()=>window.print(),120); };
$('savebtn').onclick=save;
